body:
  text: 欽定四庫全書皇清開國方略卷二十四太宗文皇帝崇徳二年丁丑三月至十二月崇徳二年三月甲辰朝鮮國臣洪翼漢等伏誅先是朝鮮國王李倧屢上書乞降太宗諭令縳送首謀敗盟三四臣當正國法以儆後人李倧奏言首倡浮議之臺諌洪翼漢當大軍到境時用為平壤庶尹督令即日前進或為前軍所獲或從間道赴任俱未可知今将附和之宏文館校理尹集修撰呉逹濟送詣軍前以俟處分嗣復遣官解送洪翼漢至盛京至是斬洪翼漢尹集吳逹濟於市以正其倡議袒明敗盟搆兵之罪戊午停葢州城工葢州守将李思忠奏言臣奉命管理葢州其城垣俱係舊築現在土墻不堅者八十三丈破裂者三十丈未破裂而不堅者五十三丈前據工部咨稱已盡調丁夫赴遼陽各城脩築葢州城工可令滿漢䝉古餘丁自燒灰甎脩砌查葢州地處邊陲軍士偵緝逃亡脩浚墻濠巡守魚塩二塲夜復登城巡視防守靡寧餘丁僅堪耕種若令燒甎供役恐失農業臣等仰懇皇上恩准先将破裂處拆毁暫用土築並請寛限三年俟各城蕆工再集丁夫造甎脩砌庶城垣可以永固而耕種不致失時得㫖暫停今年工作餘照議脩築夏四月辛夘諭羣臣貸粟貧民及時播種太宗諭曰今嵗告饑凡積粟之家宜與各牛录内困乏者賣則取值借則取息如此有無相通則民氣自裕若私自理藏以致朽爛非我國之人也至貧民無力耕種坐使土地荒蕪食何由賴該管章京宜時加體察令有力者助之丁酉添設八旗議政大臣太宗命貝子尼堪洛託博洛等與議國政毎旗各設議政大臣三員以鞏阿岱圖賴錫翰貝勒巴雅喇之子鞏阿岱之弟譚布巴哈阿喇善阿爾海達哈塔勞薩布賽諄退巴布賴漢岱阿爾津拜武拜雅賴揚善鄂羅塞臣哈寧阿英固爾岱郎球額駙多爾濟薩木什喀超哈爾錫翰牛录章京巴希之子沙爾琥逹徳爾徳赫等充之先是大貝勒代善三貝勒莽古爾泰之次有議政十貝勒八大臣又有佐管十六大臣及調遣十六大臣至是始添設八旗議政大臣各三員是日御翔鳳樓集親王郡王貝勒貝子管旗大臣都察院承政及新設議政大臣諭之曰向來議政大臣或出征或在家有事諮商人員甚少偶遇各處差遣則朕之左右及王貝勒之前竟無議事之人矣議政雖云乏人而朕不欲輕令干預者以卑微之人㕘議國家大政勢必隨事唯諾取悦其主其貽誤國計民生者不小國家安用此謟諛之軰為也今特加選擇以爾等為賢置于議政之列爾等殫心為國匡輔其主當以民生休戚為念務使困窮之人有懐得以上逹新附之人撫養母致失所朕時㘦軫念者惟有此耳爾等凡有應奏之事不可越職遽奏如某事應施行某事應入告當先與管旗大臣公議然後奏聞無知之輩往往以進言者謂之讒人夫善則曰善惡則曰惡何所忌諱而不言若植黨營私傾害善人指以為惡乃所謂䜛否則明知其人之惡而不以告是欺其主也聖經云欲齊其家先修其身脩身齊家而後國治爾等若謹好惡之施審接物之道御下以義交友以信如此則身脩矣孝其親敬其長恩恵及其子孫親戚如此則家齊矣身脩家齊而國有不治者乎太公曰閒居静處而誹時俗非吾民也朕觀䝉古察哈爾林丹汗不道至于亡國未聞其臣有直言其主所行不道者嗣後朕或有失徳爾等即當面諍試思以諌諍之故而斥責者為誰降革者為誰亦何憚而不為倘諌而不聴則非爾等之咎也若既不能諌而徒退咎其主上之失議其國事之非豈人臣靖共之誼乎或更有将各旗妄分彼此知本旗有悖亂之人隠匿不言及他人言之反加庇䕶者尤朕心所深惡也八旗皆朝廷之人但懾服姦宄撫恤困窮使各安統轄又何彼此之可分耶嗣今有将新分之呼爾哈瓦爾喀人使之逃亡凍餓致牛录缺額者朕即以不能養育之王貝勒下食口糧人户補足其數王貝勒等聚財積榖牧養牲畜豈僅為一身圖富足要皆為子孫計耳不知子孫果賢縱無所遺彼寧不能自立子孫若不肖雖有所遺豈能常守徒長驕矜且為他人積聚耳夫積榖所以備荒而養窮人也財帛牲畜所以為國而賞有功之人也不可奢亦不可過吝朕所以令爾等撫養窮民及新附之人者葢古人所云賞一人則勸者衆罰一人則懼者衆國家䝉天眷佑諸國俱已削平獨明國尚在賞罰顧可不明乎又諭諸王貝勒曰昔金熈宗及金主亮變易祖宗衣冠儀度循漢人之俗服漢人衣冠盡忘本國言語迨至世宗始復舊制凡言語衣服及騎射之事時諭子孫勤加服習如王孫原王即章宗判大興府遇漢人訟事以漢語訊之有女直人訟事則以女直語訊之世宗以其未忘女直之言甚為嘉許此本國衣冠言語之不可輕變也我國家以勤習騎射為業今若不時親弓矢惟耽逸樂則田獵行陣之事必致疎曠武備何由而得飭乎爾等訓練士卒勤習武事凡出師行獵許服便服餘俱遵照國初定制仍服朝服朕所以諄諄訓諭者非為一時計也正欲爾等識之于心轉相告誡使世世子孫遵守母變棄祖宗之制耳朕意如此爾等宜各陳所見睿親王多爾衮等皆跪奏曰皇上諄切誡諭臣等更復何言惟銘刻在心竭力奉行而已閏四月癸夘宴朝鮮國王子李􅓭李淏先是四月己夘睿親王多爾衮擕朝鮮國王二子及其大臣子至渾河岸太宗遣都察院承政阿什逹爾漢户部承政英固爾岱刑部承政郎球及諸大臣率毎旗侍衛十員出城十里許迎之設宴宴之至是太宗御崇政殿諸王貝勒文武羣臣左右排列召李􅓭李淏入殿内賜宴命坐于右側安平貝勒杜度之下有䝉古貢獸名齊赫特其形似騾有野駝其形似駝併黒狐皮俱令觀之命通事傳諭曰此獸乃黄河外夏國所產或千百成羣此黒狐皮乃東海濵使犬部所産毎年來貢因逺方罕見之物故令爾等觀之李淏奏曰此等異獸但于史冊聞之今始得目睹皇上聖徳如天薄海内外珍竒之物何所不集臣等以㣲賤之軀荷䝉恩禮優隆並得賜觀異物何幸如之宴畢李􅓭等率陪臣謝恩而退壬子武英郡王阿濟格自皮島凱旋先是征朝鮮師還日太宗命貝子碩託恭順王孔有徳懐順王耿仲明智順王尚可喜率每牛录甲士四人及三王下全軍舁紅衣礮十六位并朝鮮戰船五十往取明皮島復遣前鋒将領蘓爾徳傳諭睿親王多爾衮等曰管旗大臣葉臣阿山令其往助貝子碩託與漢軍大臣石廷柱及孔有徳等㑹集一處定議往攻皮島日期及我國戰船與朝鮮戰船約㑹何處從何處乗船于何月日進攻又朝鮮戰船果足𣲖往之數否兵若干領兵者何官查核明確令蘓爾徳來奏至其島若易攻則攻之否則奏明候朕諭到攻之我軍船首湏用遮牌前攻江華島之船曽帶來否其船式可用即依式製造三月丁未復命武英郡王阿濟格率兵千人往助征皮島軍四月辛巳武英郡王阿濟格奏報攻克皮島疏云臣等仰仗皇上天威遵奉指授方畧于四月初八日遣八旗甲喇章京領䕶軍以大臣薩木什喀督之續遣歩軍章京領歩兵以大臣阿山葉臣督之乗我國所造小船攻皮島西北隅八旗騎軍章京領騎兵四邊城章京領全軍四百人及漢軍孔有徳等兵朝鮮兵各乗巨艦令兵部承政徹爾格統領前進並令領漢軍大臣石廷柱户部承政瑪福塔從皮島北隅督戰時乗小船兵先進遂克其島斬其守島總兵沈世奎越五日復奏報擊敗明兵一萬七千有竒斬殺甚衆并籍所獲水手三百五十六名婦女㓜稚三千一百十六口駝馬牛騾等六百四十有竒大船七十二隻紅衣法熕西洋礮共十位及蟒素縀銀兩布疋器皿細數以聞是月己亥朔武英郡王阿濟格又遣内秘書院學士占巴奏言在皮島得米六百一十六石大小礮六十七位尋命将所獲米糧即令朝鮮船隻運至義州𣲖每牛录下殷實之家有朝鮮馬騾者各出六頭運送東京賑饑至是太宗以武英郡王阿濟格與貝子碩託等自皮島率師還命睿親王多爾衮饒餘貝勒阿巴泰率諸大臣出城十里許迎于渾河岸次日癸亥太宗御崇政殿武英郡王阿濟格率凱旋貝子大臣捧表跪進宣諭畢行三跪九叩禮阿濟格碩託扎哈納阿山葉臣薩木什哈等以次進見冄行一叩禮抱上膝見復行三叩禮而退六月辛亥叙錫特庫等追勦喀木尼堪部逃人葉雷功先是天聰十年太宗命阿賴逹爾漢率外藩䝉古諸貝勒兵往追茂明安部下逃人至使鹿部喀木尼堪地方招服葉雷舍爾特庫巴古柰土古柰等及其從役家口來獻俱賜冠服櫜鍵等物有差葉雷等旋往盗科爾沁部占巴拉天聰八年秋七月與其弟塞爾固楞率兵來朝部下馬八百匹及秉圖王即洪果爾部下馬四十五匹而逃是時秉圖王及伊勒都齊貝勒即槺果爾伊爾登即布木巴哈坦巴圖魯即顧穆二人皆郭爾羅斯部長等所屬有四五家散處及出外採捕約五十人皆被殺秉圖王部下十七人追及之逃人還擊殺三人又奪馬十七匹而去經興京守将扈什塔奏聞命甲喇章京錫特庫執信牌往寧古塔㑹同守将武巴海率寧古塔兵追之又遣正黄旗牛录章京噶爾糾執信牌率卦勒察兵沿烏拉地方追緝又遣䝉古衙門撥什庫博羅執信牌往科爾沁部令土謝圖親王巴逹哩卓哩克圖親王武克善發兵躡追兼令防失牲畜錫特庫等率二十二人躡逃人踪跡自多爾博庫地方行至烏拉駐防邉城武巴海率四十五人來㑹時科爾沁部土謝圖親王下鄂爾多木卓哩克圖親王下託和泰奉命率兵二百往尼喀善城駐防聞信即簡甲士四十人往追占巴拉之弟塞爾固楞貝勒亦率所部兵横截追之鄂爾多木追之博木博果爾地行月餘會遇武巴海錫特庫同行途次見天鵝三鄂爾多木射中其一帶箭而飛逐取忽不見乃見逃人營中遺火遂星夜馳往至温多地方圍之諭降不從因攻殺九十四人生擒八十七人獲馬五十六匹問葉雷安在答云葉雷殺鹿為食擕妻子遁去矣錫特庫武巴海即率兵前進葉雷聞知乃殺其妻子遁入山中我兵追至與葉雷縱矢交射忽有白狐躍起觸葉雷弓而馳因射殺葉雷有葉雷兄弟率四十人携妻子欲歸我國途遇葉雷留之亦被殺五月癸未奏聞錫特庫等凡七閱月始還太宗命管旗大臣出城五里迎宴之至是叙逺追逃人功擢武巴海錫特庫噶爾糾世職加賜衣服馬匹奴僕荘田賜鄂爾多木號卓哩克圖庫魯克逹爾漢子孫世襲其隨征士卒並賞銀兩衣服有差甲寅諭諸大臣勤脩國政太宗諭曰昔太公云天生四時地生萬物天下有民聖人牧之故春道生萬物榮夏道長萬物成秋道歛萬物盈冬道藏萬物静盈則藏藏則復起莫知所終莫知所始莫進而爭莫退而遜守國如此則與天地同光朕承皇考創業垂統嗣位以來統一䝉古收服朝鮮自今以後宜思所以宣布法紀脩明典常當國運茂隆之時若不立綱陳紀次第振興後人将何所法守嘗觀前代勤脩國政法制精詳者其祚必永怠棄國政苟且偷安者其勢必危葢治國之道如築室然基址堅而庀材固世世子孫可以乆居其或旦夕成功不乆即壊此必然之勢也國家若果勤脩政事何由致敗否則傾危立至矣嗣後爾等皆宜殫竭忠誠劻勷左右朕惟欲整飭庶務使子孫永守勿替耳丙辰以平朝鮮功祭告太廟先二日太宗夜夢至興京見太祖乗飛騎行禮親王代善追挽太祖之騎不及太宗遂至明國宫中明皇帝於袱内出一絲縧繐上飾以珊瑚意欲相授太宗默思明主欲贈珎寳何所不有受此奚為轉顧其人又非明皇帝乃金代神像其人出書一冊曰是爾先代金國史書太宗受而讀之文字不能盡辨欲持以示文臣夢忽覺次日清晨召諸王貝勒及内院諸臣語之諸臣奏曰先是皇上夢入朝鮮王宫内将朝鮮王舉之而起未㡬果臣服朝鮮今将告捷于太廟故夢見太祖至入明宫見明主及金人授以金史是天意将以明國圗籙授皇上也至是以朝鮮既平又乘勝克皮島親詣太廟行祭告禮並遣官祭告福陵甲子賜恭順王孔有徳等銀幣仍誡諭之以恭順王孔有徳懐順王耿仲明智順王尚可喜協同武英郡王阿濟格攻克皮島各賜銀六百兩及彩縀蟒衣布疋等物並查明部下陣亡各官賜卹其家太宗諭有徳等曰朝廷用人以髙爵厚禄使之安富尊榮者欲其襄賛治理有禆國家也朕于爾三王既以殊恩㧞擢情同子弟封以王爵寵眷有加爾等宜感恩圖報恪守典常乃不思竭忠盡誠輔助國政反縱所屬将士悖違法度恣意妄行朕甚不悦爾等有統率之任知他人有違法者尚應責之乃身先作慝朕復何賴焉古語云爭小利者不受大益爾等何不勉圖大益而顧貪小利也嗣後務整肅戎行以佐成大業實嘉賴之尋有智順王尚可喜家人於刑部首告其主云皮島之役王私匿其所得金帛人口牲畜太宗曰諸物豈王自得必散于衆兵耳彼新人不知故來首告此案刑部不必審訊以原告發還智順王秋七月己巳叙平定皮島功先是兵部奏言征明皮島時陣亡四十人骸骨莫能辨識今就所收者合塟于通逺堡太宗命禮部㕘政圖爾賽賫楮帛羊酒為文以祭之至是叙功擢鰲拜凖塔薩木什喀阿山葉臣麻克圖鍾金多爾津等世職有差並贈陣亡炳圖世職以其弟畢禮克圖襲瑚什世職以其子瑚雅禄襲辛未遣武拜等往歸化城先是遣丹岱等往土默特貿易嗣又命阿爾津為帥偕鄂謨克圖譚拜譚台柱孟庫魯喇嘛尼堪翁阿岱彰屯等率商人百餘及八家官員擕貨往歸化城貿易至是遣前鋒将領武拜努山瑚宻色鄂碩沙爾琥逹蘓爾徳阿爾布尼喀扎海率䕶軍校八員䕶軍百名往歸化城諭之曰爾等此去可于特墨圖地方駐劄前丹岱等往土默特貿易如其未至特墨圖地方爾等與之相遇可即往察希爾圖地方探視若不相遇且于特墨圖地方屯駐候丹岱等及後去之阿爾津等事畢乃還倘伊等未能即還則與之約定歸期不必相候如十日内可還則候之同歸恐明人中路要截宜加意備禦也後武拜等於八月庚申出張家口與岱丹等合遇明哨卒十六人斬十五人生擒一人獲馬十九匹而還乙未分立漢軍二旗辛巳太宗諭諸漢官曰朕将爾等與舊臣一體撫育或更優于舊臣今舊臣中有如爾等之獲免徭役者乎若以功論諸舊臣隨朕各處征伐身經百戰攻城則克遇敵則勝用能大造我國家以有今日也爾漢官有乗時歸命者有窮蹙投誠者有陣獲㤙養者在爾等何嘗披堅執鋭親冒矢石効死力戰乎昔年爾諸臣中有與明國暗通潜謀叛亡者事泄被誅骨肉離散又諸臣管轄爾等强取財物苦無容身之地自朕嗣位以來爾等有先與明交通者朕原其罪而赦之其無故誅求者復行禁止另立旗分予以矜全出爾等于塗炭之中愛養有加朕之待爾等可謂至矣乃不思訓練士卒効力疆塲見滿洲官兵之致死力戰者視同陌路若無與已事者爾等平日以空言欺飾謂勿虐小民勿侵降國勿刼貨財為國家分憂効力當行仁講義以此陳奏者頗多及行師時反身先倡率徇縱士卒攘奪財物則爾等之空言欺飾朕已洞燭之矣前牛录章京張成徳曽獲敵船二隻俘三十八人爾等即不能奮勇爭戰但能如張成徳之俘獲猶為有益若此時不自省悟力圖報効國家安用此虛縻富貴之人哉至是分漢軍為兩旗以石廷柱為左翼管旗大臣馬光逺為右翼管旗大臣照滿洲例編壮丁為牛录八月癸丑御演武塲觀外藩使臣較射是日辰刻太宗率親王郡王貝勒貝子等出懐逺門至演武塲御黄幄外藩貢使朝賀畢命喀爾喀瑪哈撒嘛諦車臣汗下使臣土謝圖汗下使臣俱于本月奉表來貢駝馬等物較射次選毎旗善射者各十人分為左右兩翼令之角勝負者罰牛羊諸王貝勒貝子等親率較射三次右翼中多得牛二羊二十又令左右各出力士角觝右翼負還所得左翼牛一羊二于是令左翼諸王貝勒等負者俱立宴并宴外藩朝貢使臣申時還宫九月己巳禁止蒙古部人訐告强奪前遣都察院承政阿什逹爾漢䝉古衙門承政塞稜尼堪等往科爾沁巴林扎嚕特喀喇沁土默特阿嚕諸部㑹集諸王貝勒等頒布赦詔清理刑獄太宗以敕書諭阿什逹爾漢曰朕聞扎嚕特部内齊等虐害所兼管之塞稜綽博恵等縱部下人潜行訐告塞稜綽博恵之有一二牲畜者誣而取之彼等既屬同居又相統轄其有無財貨彼此悉知若皆被誣訐强奪所有人将何以為生且令彼兼管者本欲其爱養之而反虐使之乎若果如此擾害若軰之牲畜既盡朕必仍取害人者之牲畜與之前曽以此誡諭内齊等業經認過復諉其咎于兄弟朕固不之信也爾等可留扎嚕特數日詳審從前告訐奪取牲畜之人如實則已否則即以所罰牲畜給還本主並嚴切申禁嗣後毋得少有侵害爾等此行以此為第一要務其詳慎議之丙戌諭給各牛录下煢獨者妻室太宗諭親王郡王貝勒管旗大臣等曰朕聞駐防開城博爾恵牛录下有兄弟二人皆無妻室現在各處俘獲婦女甚多如此煢獨可矜之人該管大臣章京等不以奏聞朕何由知嗣後務查明各牛录下無妻室者給以妻室善加撫養國家䝉天眷佑歸附者衆若不能撫卹困窮其何以勸來者可将朕意徧諭各官冬十月丙午厄魯特部遣使入貢厄魯特部頋實車臣綽爾濟遣其頭目庫魯克來貢馬匹白狐皮獺喜獸羢毯等物顧實車臣綽爾濟初未入貢聞太宗徳威逺播于丙子年遣使因路逺至是始至是日黒龍江巴爾逹齊率五十七人朝貢又精格里河琿春屯内扈育布禄初末入貢至是亦來朝貢貂皮俱令禮部迎宴之賜扈育布禄及其從人蟒縀朝衣冠帶櫜鞬弓矢鞍轡等物有差庚申封李倧仍為朝鮮國王朝鮮義州總兵林慶業領兵隨征皮島有功至盛京朝見宴之将遣還内院諸臣撰擬宣諭朝鮮敕書進呈太宗覧畢曰爾等撰文當順理措詞毋得過為誇大朕素不樂聞誇大之言彼明國之主自比于天輕視他人葢身無徳義徒自矜張甚無謂也嗣後撰擬切宜詳慎毋蹈浮誇于五月丁亥令林慶業賫敕諭及銀幣馬匹歸賜國王李倧至是復命户部承政英固爾岱瑪福塔率從官通事賫玉紐金印誥命并黒狐套一領製帽黒狐皮一張貂皮百張鋄金雕鞍良馬一匹往賜李倧仍為朝鮮國王十二月癸亥征瓦爾喀諸將奏捷先是正月癸亥太宗于朝鮮軍營遣外藩科爾沁扎嚕特敖漢奈曼諸部兵出朝鮮咸鏡道往征瓦爾喀命䝉古衙門承政尼堪甲喇章京吉思哈牛录章京葉克舒率每旗甲士十人𨗳之以行道出㑹寧擊敗朝鮮平壤巡撫兵二千人餘兵悉降五月十九日至烏拉地方遣還䝉古十六旗兵七月己巳復命喀凱塔克珠來虎舒書翁愛尼噶禮克布圖輝山恩古里雅薩諳巴巴爾噶遜綏赫徳珠瑪喇綽貝塔哈布海塞䝉格哈什屯雅布喀棟果爾滿都祜占楚喀音逹禮等率兵一千二百分為四路往征瓦爾喀兩黄旗一路率阿庫里尼滿地壯丁一百名穆掄分逹哩壮丁四十名烏爾固辰地南濟蘭牛录下喀克篤哩兄弟等壮丁三十名共一百七十名以圖必善分逹哩瑪哈逹為嚮導兩紅旗一路率綏芬壮丁七十名雅蘭壮丁四十名呼葉壮丁二十名烏爾吉壮丁七十名共二百名以圖球恰塔齊什訥為嚮導兩藍旗一路率額赫庫掄壮丁六十名厄勒以東塞木克勒以西壮丁五十名共一百十名以愛韜多爾周常濟里濟布椘為嚮導兩白旗一路率諾囉阿萬壮丁三百名以雅爾布佛得宻封濟逹蘓布特赫為嚮𨗳至是諸将遣六人奏㨗言兩黄旗舒書塔克珠率甲士六十人入烏爾固辰獲塞約愛塔哈佛珠武克星額塔克圖男子三十名家口八十馬七十有三兩紅旗恩古里克布圖率甲士六十人入綏芬獲剛球畢爾哈木巴爾珠男子二十八人家口六十五兩白旗哈什屯滿都祜于所入汎地獲吉木善伊訥肯索畢伯得根哈里瑚阿爾珠克木訥畢爾珠男子一百三十人家口三百三十馬八十有三並獲貂狐猞猁猻水獺等皮張甚多于次年四月師還賜新獲瓦爾喀男婦㓜稚等衣服居室器用牲畜等物并賞喀凱等從征兵丁銀兩有差戊午丹岱等擊敗明兵于清河武英郡王阿濟格于牛荘遣丹岱薩蘓喀譚拜拜賽率䕶軍四十人騎兵四十人往白土塲捉生遇明兵七百于清河突入擊敗之獲馬二十有二纛二是月赫葉氏十人及托科羅氏默爾哲勒氏巴雅喇氏三姓遣二十二人貢貂皮等物皇清開國方略卷二十四
