body:
  text: 欽定四庫全書皇清開國方略巻八太祖髙皇帝天命八年癸亥九年甲子十年乙丑十一年丙寅天命八年春正月戊戌朂夫臣持公理事集八旗大臣諭之曰朕于八和碩貝勒設大臣八人輔之以觀察其心誰則遇事不分人已視為一體誰則䕶己之非不自引咎而形于辭色八大臣當共持公論知其非即直言責之如不受即以聞于朕凡國事何以成何以敗宜深為籌畫人之才堪任事者即舉用之才不勝任者即劾罷之行軍之事何以得何以失謀之詳審戰須何器攻須何具悉豫行修治自總兵以下各官孰有功孰有罪核實論奏俾衆知所勸懲朕惟期所生之子孫所用之臣僚經理國事各得其宜則此心泰然而愉快矣是月喀爾喀部台吉拉巴什希布索諾木達頼塔布囊莽果鄂博和各率所屬及他處䝉古凡五百户来歸授官職有差賜貂裘猞猁猻裘金銀布帛田畝房舍僮僕牛馬及器用等物先是扎嚕特部貝勒巴克為我國陣擒見四年七月其子鄂齊爾桑來質乃釋巴克歸事在七年正月至是巴克來朝太祖嘉其誠遂釋鄂齊爾桑與之俱還夏五月乙未勞征克扎嚕特軍先是我國使臣祜類自扎嚕特部台吉達雅處齎回馬牛羊並所乘之馬及衣服器械諸物為扎嚕特部貝勒昂安忠嫩珠徹特扣肯等以兵要于路盡刼之去祜類還奏曰喀爾喀衆貝勒俱負盟矣惟洪巴圖魯貝勒杜稜謂臣曰我子孫俱有二心我雖訓之不能制然我身必不負盟也未幾昻安復以兵要我國使臣錫喇納碩囉輝二人于路奪其所齎馬牛其往扎嚕特部貝勒色本處使臣伊沙穆之馬牛羊亦為所奪事並在五年于是太祖命台吉阿巴泰徳格類齋桑古岳託統兵三千往征之四月庚辰乘夜疾行翼旦過羅地渡遼河前鋒總兵達音布率精鋭五十人先至額爾格勒地知為昻安所屬遂略地而前馳百餘里乃與叅將雅希禪侍衛博爾晉進攻昻安所居昻安擕妻子及二十餘人引牛車將遁雅希禪博爾晉率三十餘騎下馬達音布率十餘騎勒馬立昻安避下馬之兵直衝達音布達音布拒戰方彎弓發矢昻安部下一人乘發矢時以小槍迎刺達音布中其口遂堕馬而死雅希禪博爾晉督兵衝擊斬昻安及其子與從者盡獲其妻孥人户畜産又執貝勒忠嫩子桑圖之妻子而還五月乙未駕出城勞凱旋軍行四十里遇于古城堡南岡樹旗八鳴角拜天畢御帳殿出征台吉大臣朝見設宴饗之翼日以俘獲人口牲畜先賜出征將士其餘分給在國諸臣有差是日雨太祖諭曰蒙古之人猶此雲然雲合則致雨蒙古部落合則成兵其散猶雲收而雨止也俟其散時我當躡而取之耳時桑圗因妻子軍民俱被擒上書稱太祖為普天共主之英明皇帝言臣自來無罪故父在日罪誠有之今大兵下臨僅孤身得脱妻子俱被俘獲乞陛下鑒察垂憐太祖遣使告以妻子俱無恙桑圖遂來朝命還其妻子與之俱歸六月甲戍撫慰新附䝉古諸部長先是太祖御八角殿集公主郡主等訓之曰朕仰體天心勸善懲惡雖貝勒大臣有罪亦執法以治之爾等婦女苟犯吾法詎可廢法徇縱朕擇賢而有功之人以汝等妻之豈令受制汝等汝等當敬謹柔順苟陵侮其夫恣意驕縱惡莫大焉法不容貸譬如萬物皆依日光以遂其生汝等亦依朕之光以安其生可也又諭諸貝勒曰喀爾喀部貝勒原各主部落不受他國約束今之來歸見六年十一月七年二月八年正月榮而更圖其榮逸而更圖其逸也烏嚕特部貝勒因蒙古國主殘暴慕我而來歸也見七年二月此等歸附貝勒當與我國貝勒一體視之即有罪勿論死俾還故土可也至是諭歸附蒙古諸部貝勒曰爾等居我國立家業結婚姻有娶我諸女者勿以諸女為畏朕因爾等逺來歸附憐恤爾等俾各遂室家之樂豈令受制于婦女乎朕嘗聞察哈爾汗以女妻侍從大臣每陵侮其夫虐害服役之人若諸女中有如彼者爾等勿徒嗟怨必告于朕罪至死則誅之罪不至死則廢之更以他女妻焉奏聞而不加懲治咎在于朕不奏聞則咎在爾等凡有艱苦之情毋隠諱各以直告丁亥朂羣臣勤職集貝勒大臣及百官諭曰凡有官者不可自曠乃職玩忽宴安今我國中漢人䝉古雜處其或逃或叛為盜賊為奸宄者宜嚴察之爾等果能殫心竭力各勤職業復嚴察所屬使人不敢為惡國治矣朕心安矣乃見任用爾等之有益否則匪類乘間迭起國由此亂朕亦豈能使爾等長享禄養耶天命九年春正月辛酉巴約特部衆來歸初巴約特部台吉恩格徳爾先蒙古諸部長來朝見乙巳年太祖以弟貝勒舒爾哈齊女妻之事在天命二年至是偕郡主來朝請移部衆留居東京太祖嘉其誠與之盟賜以制誥惟叛逆不赦其他過犯俱免罪命貝勒等統兵移其部下人户來歸駕出城設宴章義站在瀋陽城西南東京城北即金朝之章義縣賜恩格徳爾及其弟莽果勒岱雕鞍良馬貂裘各一恩格徳爾子囊努克們都達哈莽果勒岱子滿珠什哩猞猁猻裘各一既入城賜田宅金銀貂皮猞猁猻皮縀疋器用及耕作之具又以平定堡人民給之平定堡在遼河東見六年三月二月庚子遣使與科爾沁部長㑹盟初我國與科爾沁通使往來者數年至是太祖使人往約與堅和好其部長奥巴遣使齎書來報稱太祖如青天之上太陽當空衆光盡斂威震列國臣民懾服普天共主之聖明皇帝言嫩江水濱科爾沁貝勒等俱欽服帝命欲修好如約但懼察哈爾及喀爾喀知之興兵侵擾望陛下籌及太祖遣巴克什庫爾禪希福往㑹盟刑白馬烏牛置酒及骨血土各一器焚香誓曰滿洲科爾沁二國憤察哈爾侮慢故締結盟好昭告天地今後若為察哈爾所誘惑私與之和天地降以災殃如此血如此骨如此土俾墜厥命既盟之後始終不渝則天地佑之永其年子孫昌熾誓畢庫爾禪希福偕科爾沁使者來我貝勒等亦刑牛馬祭天地對使者如前誓書而焚之夏四月甲申朔奉移列祖陵寢于遼陽時于東京城東北之楊魯山營建陵寢命族弟鐸弼旺善貝和齊往呼蘭哈達之赫圗阿拉以太牢祭告祖陵奉移梓宫太祖率諸貝勒大臣出城迎二十里外至皇華亭悉俯伏道左俟靈輿過乃起奉安山陵太祖跪奠以酒告曰我征明復祖父讐已得遼陽廣寧祗移寢園安于所得之地惟我祖我父仰達天地永垂佑焉五月甲寅朔擊敗明兵于輝發地明將毛文龍令逰擊三員引兵侵我國所屬之輝發地沿鴨緑江越長白山而至我守將蘇爾棟安擊敗之追逐三日盡殱其衆秋八月壬辰勦殪明兵于鎮江島中時毛文龍遣兵渡朝鮮義州城西鴨緑江入島中屯田太祖命大臣楞額哩武善引兵一千襲之途中獲間諜訊知明兵晝則渡江入島收穫夜則收兵復渡江宿義州江岸楞額哩乘夜進兵潛伏山僻處平旦度明兵已渡江率兵疾馳明偵者未及聲礟舉烽燧楞額哩已渡鎮江支流突至其島明將士大驚悉棄戈奔潰楞額哩等于陸地追逐斬五百餘級餘皆爭舟墮水溺死乃盡焚其島中積聚而還是月總兵官額駙何和哩卒初何和哩與費英東額亦都安費揚古扈爾漢佐太祖成帝業稱五大臣自天命五年後相繼卒五年費英東六年額亦都七年安費揚古八年扈爾漢太祖聞何和哩卒哭之慟諭侍臣曰朕所與並肩友好諸大臣何不遺一人以送朕之終耶天命十年春正月癸亥克明旅順口城時明兵萬人航海至旅順口葺城駐守太祖命三貝勒莽古爾泰統兵六千攻旅順口城克之盡殱明兵毁其城乃還是月朝鮮國韓潤因其父韓明璉為朝鮮將所殺同明璉姪韓義遁走來降太祖以潤為逰擊義為備禦給以妻室田宅衣服器用三月辛未遷都瀋陽集貝勒大臣議遷都皆奏曰邇者築城東京宫室既建而民之廬舍尚未完繕今復遷移又興大役恐頻勞我國太祖諭曰瀋陽形勝之地西征明由都爾弼渡遼河路直且近北征䝉古二三日可至南征朝鮮可由清河路以進且於渾河蘇克素䕶河之上流伐木順流下以之治宫室供炊爨不可勝用也時而出獵山近多獸河中水族亦可捕取朕籌之熟矣汝等寧不計及耶庚午駕自東京啟行夜駐虎皮驛辛未至瀋陽是日征東海瓦爾喀部之喀爾達富喀納塔裕等擕降附之衆三百三十人以歸夏四月庚寅勞征克瓦爾喀軍初太祖命族弟旺善大臣達珠瑚徹爾格統兵一千五百人征東海瓦爾喀部俘獲甚衆四月己夘駕出城迎之翼日至必音地行獵凡四日㑹於穆瑚覺羅地刲牛八祭纛畢旺善達珠瑚徹爾格率軍士朝謁太祖問曰爾等所向俱利耶旺善對曰仗皇上洪福所至皆利因叩首太祖與三臣行抱見禮以獵獲獸百餘及所擕酒二百甕饗從征士卒及降附户口還至瀋陽城北岡復以牛羊四十酒四百甕分列四百筵大宴勞之既入城又賜從征士卒銀各五兩庚子勗諸貝勒善視卑幼是日設大宴諸貝勒咸集太祖訓之曰語云其為人也孝弟而好犯上作亂者未之有也吾世世子孫當孝於親悌於長其在禮法之地勿失恭敬之儀至於燕閒之時長者宜和洽其子弟俾藹然相接翕如歡聚昔我滿洲原與漢人䝉古國别俗殊今共處一城如同室然惟和洽乃各得所焉母遇卑幼過嚴使無暇豫時則長愛其少以誠意出之少敬其長以誠意將之咸非虚假矣六月癸夘擊敗明兵於耀州明將毛文龍遣兵三百夜入耀州城南之蕎麥衝薄官屯寨将踰牆我寨兵未及堵禦有青嘉努納岱邁圖三人之妻倚車轅於牆以為梯青嘉努妻持利刃率二婦登梯奮擊三百人皆驚墜牆走守耀州城總兵官揚古利率兵追及盡殱之太祖召三婦奨賚金帛牛馬賜青嘉努納岱二人妻備禦職邁圖妻千總職尋命備禦屯布嚕章佳城貝勒寳實長子康嘉之子阿爾岱茂海光實等率兵屯耀州修葺其城工未竣明寧逺城山海關兩路兵自天妃宫渡遼河夜半來攻守城諸將擊敗之追至河干明兵人馬溺死者甚衆獲馬七百甲胄器械無算屯布嚕等還奏捷駕出城十里迎勞刲牛八祭纛以所獲馬分賚破敵諸將有差各賜銀牌一餘馬給散衆軍秋八月丁丑朔勞征克卦勒察軍初太祖遣大臣雅䕶喀穆達尼率兵征東海卦勒察部俘獲二千人至是凱旋駕出城宴勞之乙酉撃敗明兵於海州海州所屬甘泉舖之南有張屯寨漢人謀叛潜通明將毛文龍文龍遣兵三百乗夜侵寨寨中守兵與戰斬四人敵敗走海州守將齋薩武爾坤聞礮聲率兵追之斬一百七十人癸巳戒臣民嗜酒因臣民有嗜酒者頒諭曰爾等曾聞嗜酒之人得何物習何藝有所禆益乎愚者因之喪身賢者因之敗徳朕屢聞之矣酒雖為五榖所造然飢而飲之弗能飽也若餺飥若炊黍均可充飢何不食之而嗜飲酒耶縱飲無節流於汚下或顛仆道路遺失衣冠或毁敗器具消落家業或墜馬傷手足折頸項或為鬼魅所魘或與人鬭爭以刃傷人而抵罪無論在朝在家每由飲酒被譴於君上失歡於父母兄弟且至夫飲酒取憎於婦婦飲酒見惡於夫下及僮僕亦不能堪而去之嗜此奚為昔賢云忠言逆耳利於行毒藥苦口利於病蓋悦耳之言無補於事恱口之酒有害其身可弗戒哉冬十月己夘勞征克呼爾哈軍初太祖遣第三子阿拜第六子塔拜第九子巴布泰率兵一千由北路征東海呼爾哈部侍衛博爾晉備禦偉齊扎努塞紐克衷諾通貴尼堪率兵二千由南路征東海呼爾哈部博爾晉等招降五百户先還駕至渾河御行幄出征諸將率招來頭目朝見賜宴而還至是阿拜等俘獲一千五百人以歸駕復出城宴勞之十一月乙夘發兵援科爾沁初察哈爾車臣汗卒孫林丹汗立盡奪其叔祖岱青貝勒所屬錫納明安部衆岱青率六子扎勒布塞稜公格錫達答噶爾瑪武爾占奔附科爾沁貝勒奥巴奥巴遣扎勒布塞稜來謁太祖賜以蟒衣四鋄金帶二甲十二刀二猞猁猻裘二貂皮百青䑕皮千海豹皮二及銀器縀匹遣還未幾奥巴遣使齎書來告曰昔者刑馬牛㰱血盟誓凡被兵必互相救援見九年二月今偵知察哈爾林丹汗欲於次月望乘河冰未結草未枯時來攻我去年冬皇帝聞其搆兵即遣伊沙穆馳告我請俟偵實後求助今敵兵將至乞命練習火器者千人助我喀爾喀衆貝勒惟洪巴圗魯急刈其禾欲與我合巴林亦可為我所恃若齋賽巴哈達爾漢皆欲附察哈爾加兵於我彼果連兵來宜乘虚襲其後惟仗睿算焉大祖覽其書遣使者四習火器者八人齎書報之曰各國皆天所命以衆暴寡天豈容之但當堅守城郭并力撃退彼若損傷兵衆其國且危即無甚損傷知汝難取亦不敢再來侵汝矣昔圖們扎薩克圖汗林丹汗之曽祖曽侵輝發國輝發兵五百帶甲僅五十人與之戰不勝而退自後不復敢侵豈非明驗耶凡兩軍野戰譬如投骨之戲或俯或仰勝負難必兵寡而欲出城野戰者其人必怯圖便於走耳惟據城守禦俟彼力攻不克而退然後乗其疲敝而鼓勇追擊斯能制勝焉爾科爾沁諸貝勒先曽與察哈爾和好後察哈爾復數侵掠汝非爾國先與搆釁也今彼以兵脅爾必曰肯與和好然後退兵夫彼既蓄意侵害即與和好彼遂已乎慎勿為彼所惑爾固守城郭我自來援兵之多寡我能籌之爾可無憂也至是奥巴遣使五人來告林丹汗舉兵來侵其勢已迫乙夘太祖親率諸貝勒大臣至開原北關閲兵選精騎五千命三貝勒莽古爾泰四貝勒及台吉阿巴泰阿濟格碩託濟爾哈朗貝勒舒爾哈齊第六子薩哈璘大貝勒代善第三子等統之而往進至農安塔地林丹汗圍奥巴所居之格勒珠爾根城已數日攻之不克聞我國援兵至倉皇夜遁遺駝馬無算圍遂解諸貝勒乃振旅還天命十一年春正月庚午克明覺華島是月乙酉諭諸貝勒曰觀古今載籍國雖大而氣數將終則君臣庸暗紀綱倒置至於滅亡國雖小而運祚方興則禎祥洊臻民物蕃盛寖以昌熾今明災異叠見其君臣不務修省終必致天之罰矣縱國大兵强豈足恃乎時為明天啓六年戊午太祖率諸貝勒統兵征明庚申次東昌堡辛酉渡遼河軍分左右翼排列曠野南至海岸北越廣寧大路前鋒至西平堡獲明諜者訊之知明右屯衛兵千人大凌河兵五百錦州城兵三千此外人民隨地散處大軍兼程而進將至右屯衛在錦州城東南七十里其城守參將周守廉已率軍民遁明舟運之糧積貯海岸太祖留將八人率步卒四萬移其糧於右屯衛大軍前進明錦州城守逰擊蕭升中軍張賢都司吕忠松山叅將左輔中軍毛鳯翼及大凌河小凌河杏山連山塔山七城守將聞我軍至皆焚其廬舍糧儲而遁丁夘大軍至寧逺越城五里横截山海關大路駐營縱所俘者入寧逺城告曰我以兵二十萬來攻此城破之必矣爾衆官若降即封以高爵寜逺道袁崇煥答曰汗何故遽爾加兵耶錦寧二城乃汗所棄之地我脩治之義當死守豈有降理且稱來兵二十萬虚也料不過十三萬我亦豈以為少耶太祖遂命軍中治攻具戊辰軍士薄城下奮力攻擊時天寒土凍鑿城已穿而不墮崇煥與總兵滿桂叅將祖大夀嬰城固守火器礮石齊下力拒不退我軍失利翼日再攻仍不克計攻城二日傷我逰撃二人備禦二人兵五百太祖不懌累日諭諸貝勒曰朕自二十五嵗征伐以來戰無不勝攻無不克何獨寜逺一城不能下耶是時山海關以外明兵所需糧草俱由舟運積聚海中覺華島在寧逺城南六十里太祖命大臣武訥格率八旗䝉古更益滿洲兵八百往征覺華島見明防守糧儲叅將姚撫民胡一寧金冠逰擊季善吴玉張國青統兵四萬營於冰上鑿冰十五里為壕衛以車楯我軍從未鑿處進撃敗其兵盡殱之又二營列於島上遂衝入亦盡殱之焚其船二千餘及糧草千餘堆乃還夏五月丙午征巴林部凱旋初喀爾喀衆貝勒與我國盟誓征明則并力同征議和則相約同和見四年十一月後衆貝勒背盟私與明和殺我國斥堠軍獻首於明受其重賞又屢刦我國使者財貨牲畜四月丙子太祖率大貝勒代善等統軍征之丁丑出十方寺邊渡遼河駐營命諸貝勒率精騎疾馳太祖親統軍繼之己夘分兵八路並進四貝勒及二貝勒阿敏台吉阿濟格碩託先至巴林部貝勒囊努克寨囊努克引從者數人棄寨走我諸貝勒追及之囊努克且戰且走四貝勒突前引滿射囊努克中矢墜馬死大軍繼至取環近屯寨収其畜産辛巳命大貝勒二貝勒四貝勒台吉濟爾哈朗阿濟格岳託碩託薩哈璘率兵萬人征鍚喇穆掄諭以馬力乏即還命三貝勒莽古爾泰及八旗諸將統兵二千繼進前行諸貝勒未至其地以馬力乏而返三貝勒乘夜行與諸貝勒路相左遂至錫喇穆掄獲畜産無算乃還與大軍㑹太祖旋師至瑚琿河駐營五月壬寅朔刲牛八祭纛癸夘以所獲牲畜分賜將士有差是日巴林部貝勒古爾布什所屬塔布囊拉班及其弟得勒格爾率百户來降丙午太祖聞鞍山驛有警夜還瀋陽命諸貝勒率兵趨鞍山至中途聞敵已遁乃還癸丑撃敗明兵於薩爾滸先是明將毛文龍遣兵侵鞍山驛我守將巴布泰率兵擊敗之斬級千餘擒逰擊李良美至是文龍又遣兵侵薩爾滸乗夜攻城之南門城中矢礮齊下明兵稍郤我總兵官巴篤禮從山而下大呼直前遂擊敵潰遁復率兵追斬二百餘人戊寅宴賚科爾沁來朝部長科爾沁貝勒奥巴來朝太祖命諸貝勒出迎遇於開原中固城宴之至范河郊奥巴亦宰牛羊欵諸貝勒諸貝勒再設宴答之太祖出城迎十里許御帳殿奥巴率從者列帳前偕其弟和爾和岱拜斯噶爾向前叩首奥巴復趨前再拜行抱見禮次及和爾和岱拜斯噶爾各行禮獻紫貂皮紫貂裘及駝馬跪奏曰我國所有之物悉為察哈爾喀爾喀掠去無堪進獻者太祖曰彼二部落原為貪得而來掠爾所有不待言也今爾無恙得與我相㑹足矣遂大宴之賜雕鞍馬匹有頂帽蟒衣金帶奥巴曰今䝉賜太重恐他日仍當取還故且喜且訝未敢深信也太祖曰此㣲物耳何足為意嗣後常有賚予或係隨便持賜其物未必盡佳若見諸貝勒中衣服器具之佳者即向索取當不爾靳也命同入城每日筵宴優禮之奥巴令和爾和岱拜斯噶爾問諸貝勒曰皇帝曾許妻我女果爾我當以禮娶也諸貝勒以其言奏太祖乃以台吉圗倫貝勒舒爾哈齊第三子女妻之大宴成禮越十餘日刑白馬烏牛祭告天地與奥巴盟曰我本順天安命之人因明國與察哈爾及喀爾喀陵侮太甚難於隠忍乃昭告於天天遂佑之科爾沁部奥巴為察哈爾喀爾喀連兵侵掠積怨憤亦䝉天佑來與我同謀國事彼此俱受困阨之人蓋天俾相合也既盟後子孫有渝盟者天降災危惟克守盟好天自永為眷顧焉奥巴誓曰我科爾沁諸貝勒未嘗搆釁於察哈爾喀爾喀乃欲求安好而不可得自扎薩克圖汗以來侵掠無已時我達賚台吉無辜被殺後齋賽又以兵來殺我六貝勒我等因與彼絶交彼又合兵而來欲殺掠賴皇帝助兵我得免於難以故來此訂盟若渝盟負恩與察哈爾喀爾喀私和天降之罰俾罹災害惟永守盟好天亦永為眷顧焉時盟於渾河岸對天焚香獻牲太祖率奥巴行三跪九叩首禮以誓書宣於衆焚之戊寅張筵宴諭曰為惡者天譴之其國衰敗為善者天佑之其國熾昌總之主宰在天察哈爾侵掠科爾沁離散其兄弟及屬下人貝勒奥巴獨力拒敵賴天佑之俾免於難來歸附我朕今賜號土謝圖汗以仰承天意焉並賜其兄圖美號岱達爾漢弟布達齊號扎薩克圖杜稜和爾和岱號青卓哩克圖各賜鎧甲蟒衣銀器雕鞍緞疋皆叩謝而退及奥巴辭歸太祖率貝勒大臣送至蒲河之南岡六月乙未勗諸貝勒毋習逸樂諭曰昔我寧古塔貝勒及棟鄂完顔哈達葉赫烏拉輝發䝉古諸國俱溺於貨財輕忠直尚貪邪兄弟之間相争相害以致敗亡朕有鑒於此豫定規制令爾八家即分主八旗之八和碩貝勒遇應得之物毋私取悉均分之若屬下之人有以婦女及良馬進者厚償其直凡行間所獲亦毋藏匿必分給於衆尚公忠而輕財貨朕屢以訓示慎勿忘之至兄弟中或有過即當直諌惟能極力規諌弗為含容乃可同心共事古語云貌言華也直言實也甘言疾也苦言藥也又云諌於未形者上也諌於既形者下也知而不諌非忠臣也凡事勿謂其小而無害由小而大以致敗國者多矣自古聖君賢相皆由困而亨舜發畎畝傅説版築膠鬲魚鹽百里奚飯牛蓋君相之任大任也天將降大任於是人必先苦心志使之徧慮事物而内不得安勞筋骨餓體膚使之備閱艱辛而外不得逸由是而為相必能通達國事由是而為君必能洞悉民隠天鑒我國之民困甚誕降朕躬俾厯艱難推己之心以安兆庶朕艱苦撫集之國恐爾諸貝勒忘其所由習於逸樂致國人即於顛危故諄諄告誡昔金世宗謂太子曰治國者當以賞示信以罰示威俾商賈積貨農夫積粟爾諸貝勒能守是言以承我基業朕懐始泰然矣遂書此訓詞賜諸貝勒秋七月己亥勗羣臣公正察屬諭曰朕承天意悉秉至公有功者必賞雖讐不念有罪者必懲雖親罔恤以是為是以非為非故䝉天眷佑遼東之地盡畀於我今爾諸臣倘不以公正為心忠邪莫辨法紀廢弛則天賜朕躬福祚將自爾等虧損之矣一國之衆八旗分𨽻每旗之下五甲喇分𨽻每甲喇之下五牛录分𨽻各於所屬之人詳加曉諭遞相稽察有惡必懲則盜賊奸宄何自而生哉夫惟已不正乃不能察人耳已既正矣復何所畏忌而不察舉乎今滿漢一家若屯戌更畨之兵及離隊伍獨行之兵掠取新附漢人牲畜衣服蠧國孰甚不嚴懲之管旗大臣以下各官俱有罪焉且爾諸臣嘗有誓言惟君所賜予及所應得者則受之至民間財物雖分金尺帛必不妄取則孰賢孰否可即以是區别何互相隠蔽為他人所訐發而自取罪戾乎臣等謹按明臣袁崇煥傳載天啟四年五月明將毛文龍遣將沿鴨緑江越長白山侵大清國東偏為守將擊敗衆盡殱所稱東偏即輝發地也八月遣兵從義州城西渡江入島中屯田為守將所覺潜師襲擊斬五百餘級島中糧悉被焚五年六月遣兵襲耀州之官屯寨敗歸六年五月遣兵襲鞍山驛喪其卒千餘越數日又遣兵襲薩爾滸河攻城南為守將所却所載先後年月與實錄悉合盖崇煥初受事即以文龍擁衆糜餉欲誅之而是時廷議方以其所居東江形勢足以牽制我朝而文龍亦自恃其癸亥年詐取鎮江之功每有奏報輒多殺降人難民以冒功觀熊廷弼海州不宜輕舉之奏及貽書朝士云文龍鎮江之捷自為竒功乃實竒禍盖深斥其激怒我朝致四衛軍民誅戮殆盡因以灰東山之心寒朝鮮之膽奪河西之氣不可謂見之不早也至寧逺之役史稱崇煥集將士刺血誓守令閩卒羅立發西洋巨礮傷我城外軍明日再攻復被却圍遂解比分兵覺華島崇煥方完城力竭不能救也時我太祖髙皇帝以攻城兩日不克意不懌乃潜師至覺華島襲擊之而數萬軍民及舟車糧草掃蕩殆盡六師所移轉敗為功捷于影響於此益見神謀淵黙制勝出竒並非在廷諸臣所能窺測萬一乃知黄道周所云不須一戰而拱手以送者不獨廣寧為然也初議遷都瀋陽時貝勒大臣咸謂大役頻興恐勞我國而聖心規畫形勢計出萬全遂定都盛京創興社稷宗廟之制伏惟肇造經營視前古創業帝王難逾百倍而思艱圖易一歸本于承天命凛天鑒與二典三謨之㫖相為表裏丕基既建用垂訓億萬載子孫臣庶俾世世法守真天生聖人邁古今而立極者矣皇清開國方略巻八
