body:
  text: 欽定四庫全書皇清開國方略卷十四太宗文皇帝天聰五年辛未正月至九月天聰五年春正月壬午鑄紅衣大炮成先是我國未備火器造炮自此始鐫曰天佑助威大將軍天聰五年孟春吉旦造督造官總兵官額駙佟養性監造官遊擊丁啓明備禦祝世廕鑄匠王天相竇守位鐵匠劉計平敕諭佟養性曰凡漢人軍民一切事務付爾總理各官悉聽爾節制勿徇情面分别賢否以聞益當殫厥忠忱簡善絀惡恤兵撫民毋私庇親戚故舊陵轢疏逺仇讐昔亷頗藺相如一將一相以爭班位幾成嫌釁幸相如重視國事不念私讐是以令名垂于千祀願爾效之又諭諸漢官曰凡軍民一切事務悉令額駙佟養性總理爾衆官不得違其節制如有勢豪嫉妬藐視不遵者非僅藐視養性是輕國體而玩法令也必罹禍譴爾等勿效之務各恪遵法紀先公後私為國效力則令名亦共揚于後世矣是月己亥太宗幸文館入巴克什庫爾禪直房問所修何書對曰記注上所行事太宗曰此史臣之事朕不宜觀乃取巴克什達海所譯武經觀之內有云昔良將之用兵有饋簞醪者使投諸河與士卒同流而飲夫一簞之醪不能味一河之水而三軍之士思為致死者以滋味之及己也因諭曰古來為將帥者必體恤士卒乃我國額駙固三泰與敵交鋒士卒有戰死者嘗以繩繫其足曳歸主將之輕蔑士卒若此何以得其死力乎後一月固三泰坐不諳機務不能鈐束士卒罷太祖弟總管鑲藍旗任以八子芬古代之貝勒舒爾哈齊第二月庚申嚴飭守邊軍令舊定軍律凡瞭見邊外敵兵即舉熢燧敵兵抵邊約百人者懸一席鳴一炮二三百人者懸二席鳴二炮五百人者懸三席鳴三炮千人者懸五席鳴五炮萬餘人則懸七席炮不絶聲絡繹來報至是命守邊諸臣嚴察逃人毋許臺軍容隱凡逃止四五人者令管墩臺官率兵追之即申報各將領如隱匿不報鞭一百逃至二三十人者沿途傳報若乘馬走者所逃出地方臺軍舉燧勿絶惟沿邊墩臺不必舉燧其沿路傳報臺軍俱令舉燧絡繹速傳仍登記所報時刻遲誤者鞭一百若兩臺相距遼逺滿漢臺軍務速行傳報諭副將石廷柱曰烽臺事務因未行嚴飭故數年以來一切傳報稽遲須曉諭守臺滿漢人等毋得怠玩凡火藥藥線旗席俱宜全備先鈔録軍律頒發各臺軍晝夜記誦遲誤者按律懲治諸將如或玩視一體坐罪弗貸是月命納穆泰布爾吉二人俱于四年五月論永平退歸罪革職往明境捉生攻拔一臺擒六人復過十三山站見二哨騎設伏擒之比還遇我國逃人斬六人執九人而歸三月乙亥朔令貝勒大臣盡言直諫時大貝勒代善三貝勒莽古爾泰之次有議政十貝勒阿巴泰德格類濟爾哈朗阿濟格多爾衮嶽託多鐸杜度薩哈璘豪格八大臣楞額哩達爾漢和碩圖色勒喀克篤哩伊爾登葉臣固三泰太宗作書三函分與之一與大貝勒三貝勒書曰兩兄與衆定䇿推戴眇躬數年以來無日不兢兢業業期于上繼前業下協民情頃聞國人或有怨言必刑獄不得其平歟賞功有所偏私歟或耽于佚樂黷于財貨歟其咎在豫豫弗自知賴旁觀者明告之夫此大業非豫眇躬所自致乃皇考艱難締造以留貽者當祗承罔墜則皇考神靈欣慰上天亦加眷佑倘有隕越則皇考神靈怨恫上天亦加譴責矣古人有言同舟共濟濟則均享其福不濟則均受其害我兩兄勿以責任在豫而面從豫有過宜即直言若不見納方可棄豫而不言今相率緘默非豫不樂聞已過也國家政令有當更改者即議更改務期至當俾臣民遵守焉大貝勒代善奏言臣等推戴皇上嗣登大位以繼業皇考艱難締造之鴻皇上英明神武逺邇徯應臣等原欲將順其美匡救其失竭一得之愚但恐所言無關重輕徒形卑陋今讀諭旨嗣後自當恪遵凡有所見直言無隱夫刑罰不中民有怨言皆由讞獄不得其人宜選擇更易之三貝勒莽古爾泰奏言臣等讞獄每據三次供詞覆加詳閲以斷是非未有明知而敢枉斷者惟恐事久天地從怠生臣當與審事各官共矢之公聽斷不公者受譴一與議政十貝勒諭曰我皇考神靈天縱撫服諸國以貽後人諸弟姪推戴朕躬嗣登君位數年于兹未聞一言規朕之過豈以朕為不可與言者乎此後凡有所見即宜直言朕之過愆以及百姓之疾苦一一指陳無有所隱貝勒阿巴泰奏言國人之怨苦惟患不知未有見善上諭自而不以為善見惡而不以為惡者臣無他能謹識今以往凡事誓從公斷貝勒德格類奏言皇上即位以來恭敬兄長友愛子弟贍養窮黎生殺明允未見有所闕失惟讞獄諸臣未能明罰敕法雖奉訓諭罕能恪遵宜另選賢良任職則公平審決可期政簡刑清貝勒濟爾哈朗奏言皇上即位以來國人咸慶安樂近因讞獄滋怨臣等當洗心省改至隱匿匪類實由諸貝勒為之如屬下人舉發其人仍不離屬下誰復敢于首告嗣後宜將首告之人斷出别旗則匪類無所容隱矣貝勒阿聖慮焦濟格奏言臣愚魯無能致煩勵職業貝勒多爾衮勞自今以往願痛改前非勉皇上諭奏言陳闕失臣實未有所見一切國事不敢謂與令指己無涉亦不敢聊且塞貴輕遽敷陳貝勒嶽託癸言恭承諭詢即位以來豈無一失臣伏思微疪小過難必盡無古語云器圓則水圓器方則水方惟擢用敢諫之士則羣臣爭趨正直任正直之臣以讞獄則國人自弗嗟怨如欲使國家豐裕則當除祭禱之糜費禁九衣七帽之奢華如欲屏息邪佞則當以訐告本旗官長之人斷𨽻别旗此當今之實政也貝勒多鐸奏言臣未預理刑其中公私不得而知但觀法司諸臣實心任事秉公執法者少當令明習法律遵守往昔成規貝勒杜度奏言宜簡任賢良使勸導諸貝勒于事理之是非斟酌悉當應對詳明庶有成效貝勒薩哈璘奏言圖治之道在于用人誠能灼知邪正則人皆爭務名節後身家而勤政務故聽獄不必多人以忠直而明決者任之必無偏枉至行軍之際如遇上親征諸事可悉稟選一賢能者為之主帥一切機務皆上裁若别有遣發宜聽總理仍限自某官以下有千軍令者許以軍法從事則犯法者少矣明國雖怯于戰鬬而防禦甚固由將吏得便宜從事故也我國八旗分𨽻或慮獨厚一旗衆心不悅然統御得人必利澤均溥譬之器中貯水水滿而溢其旁浸潤及物非有所私一旗之大臣忠則别旗之大臣不得不忠夫忠臣皇上察者鬼神且不懼何懼于人其言無所忌諱惟而千而用之信任獨専將羣臣共效其忠教化成皇上所萬人悅矣貝勒豪格奏言願改過自新竭忠為國諭誠為至當自今以往臣遇有征伐不辭勞瘁以圖報稱又一書與八大臣諭曰爾等由衆人中擢居要職與諸貝勒共議國政原欲爾等規諫朕及諸貝勒過失于國計民生有所禆益今聞國人以讞獄不平滋怨是政治有闕失也朕未能親接國人而遍詢之惟藉爾等入告乃逡巡緘默若恐言未必從且因之獲咎試思前此以諫諍之故而罷斥者為誰譴責者為誰若朕之虛懷聽納爾等固共見矣况上天垂佑正在此時不及時敷奏見之施行朕將奚賴焉宜各以公忠體國之心旦夕不忘匡救凡朕躬及政治闕失其悉心陳論焉是日固三泰罷任楞額哩達爾漢和碩圖邑勒喀克篤哩伊爾登葉皇上所臣各有奏皆言敢安心緘默實因無所見聞嗣後行果有過失豈當殫竭忠誠知無不言至于小民怨望良亦有之使無偏枉怨何由致今惟省躬自誓秉公聽斷丁亥賚演習鎗炮軍士時新舊漢軍重編隊伍分列兩翼驗放鳥鎗火炮太宗親臨閲視以鑄造精良操演􅈺熟頒賜帑銀奬勵之甲午勞征克瓦爾喀軍先是命大臣蒙阿圖率官八員兵三百人往征瓦爾喀諭之曰爾等行軍宜嚴紀律毋妄殺毋劫掠歸附之衆皆編為民户攜還其所産貂皮及一切諸物毋得纎毫私取若克建功績自加升賞五年二月甲戍蒙阿圖自寧古塔遣人奏報俘降男子千二百十九名婦女千二百八十四口幼丁六百三名獲人參貂狐猞猁猻等皮及牛馬甚多三月甲午駕出城十里外拜天畢御行幄凱旋主帥蒙阿圖遙拜一次近前復拜行抱見禮副帥武巴海行禮同諭奬蒙阿圖武巴海善于用兵出征勞苦設大宴特撤御膳賜之是月誅叛逃副將劉興祚之弟劉興賢初劉興祚叛逃興賢與兄興治弟興亮相繼逃去天聰四年正月大軍圍明永平陳斬興祚于山海關擒興賢以還興治收集我國逃人殺明副將陳繼新等遂據南海皮島兼并諸小島後數遣人來乞降太宗命釋興賢與其母及興祚興亮等妻子械繫止令人看守加厚贍養又遣人送興治妻至皮島未幾興治興亮詭詐煽惑島中漢人與在島滿洲鬬滿洲人力戰殺興治興亮挈男婦三百八十餘人乘船至朝鮮國登岸朝鮮國麒麟寨人執鳥鎗阻截欲執送明國有十五人得脫來告時我國使臣英固太宗遣爾岱等在朝鮮是護送三百八十餘人至瀋陽興人諭之收撫于太宗命治興亮之妻孥在島中者為島中漢人所殺奴誅興賢及興祚興治興亮之子沒其婦女為特諭原宥其母諸子不孝非母之罪仍加恩贍養餘年夏四月丙午撤征察哈爾兵先是太宗欲征察哈爾調蒙古諸部長各率兵來會親統師至三窪地命貝勒濟爾哈朗嶽託分率左右翼先行越二日科爾沁部土謝圖汗奧巴至奏言宜俟秣馬肥壯然後大舉方克有濟太宗遂遣十六人追還貝勒等傳諭曰土謝圖額駙以蒙古兵未能俱集且馬匹疲瘦諄諄勸阻所言良是爾等可即班師今秋征明至來春再征察哈爾召蒙古諸貝勒頒示行軍弭盜律令設宴甫畢御幄旁忽飛至一雄雉太宗坐而發矢中之墮蒙古諸貝勒皆以為瑞云五月辛丑遣朝鮮使人歸國先是正月朝鮮國王李倧遣使臣朴蘭英李必章來貢春季方物太宗令悉卻之仍以鞍馬貂皮銀兩賞使臣及通事從人又以人參賜國王李倧大臣英固爾岱覺羅龍什等齎至館舍朴蘭英辭曰既不納敝國貢物何敢受貴國所遺英固爾岱曰不納爾國貢物者以爾國背盟滅額故也朴蘭英曰爾以我國貢物為減貴國所遺不亦滅乎英固爾岱曰若兩國和好交相餽送則爾言宜然爾國無故助明以兵侵我天不爾佑致喪爾師爾蘭英與各官皆被擒及我島我國聲罪致討爾國王棄其城郭人民竄入海國復從寬大盡還所得城池土地並前陳獲各官及爾蘭英皆縱之歸豈爾之力能生還能自逃歸耶恩故來爾等以保全性命給還疆土之蘭英乃自咎失言納貢奈何作彼此較量語耶朴太宗留于是英固爾岱龍什等奏請朴蘭英之子及李必章弗遣命侍臣阿珠祜棟納密率十六人偕朴蘭英往與李倧書曰來獻禮物漸減我固不以貨幣為重爾恭敬漸衰得毋謂明強我弱乎明與我交戰事其踰久者今姑勿論即如己巳年我統大軍入明取其城池招撫安定後因二貝勒阿敏不樂成功擅自撤兵而退爾國人之在燕京者皆知之是時明人曽有敢抵拒我軍者否有不震懾我軍威者否二貝勒出邊時隨行軍士失道被殺約計壯弱凡二百人明人復將剃髮降我之漢人割取其首冒稱滿洲以斬獲三千一百五十八級誑主冒功既誑其主又何難誑爾國耶王或聽其欺誑之言以為明強我弱將俟我兵入明之後侵我疆圉乎我亦計及于此豈不量力籌畫而行耶昔我征爾國時明與蒙古及爾國三路拒敵我猶整暇自若今察哈爾逺避於黃河上流矣去年秋元太祖弟哈薩爾後裔舉所部來歸喀喇沁汗率所部及明沿邊駐牧三衛人亦皆降服矣爾若助明侵我我不必自勞兵力但調遣蒙古十萬人直趨爾國爾惟有遁逃海島而已昔爾朝鮮在金時降而復叛者再元時降而復叛者五六叛則征征則降爾之長技徒苦國人未見其利也今猶不改故轍能避禍而趨利乎我已誓諸天地斷不先自渝盟豈惟與爾舊好之邦即明與我夙為仇敵尚圖輯睦以享太平但中無介紹故至此耳王勿聽偏向明國諸臣之言二心視我明與我國之事不待久逺自有天定去嵗爾涑川守臣李萬來安州謀殺我使臣欲入城者三次有安州守臣諫曰何為出此短計王不知而我輩妄行幸而得利則善萬一失利則嬰孺亦不能保首領矣力阻之始還此事王實不知乃伊等私欲加害謂兩國和好若毁紛亂之際知誰為主故發此端耳我既聞斯言不忍默默也至是李倧遣使臣魏廷采再貢方物隨阿珠祜棟納密至太宗命侍臣滿達爾漢棟納密㩦朴蘭英之子及李必章同往復與李倧書曰我兩國和好以來之事已悉前書兹不復贅去年劉興治兄弟欲率島衆歸我若爾不濟以糧彼將何所恃以稽留此與向者助兵于明何異又監市官英固爾岱遣人覘爾容留明人登岸虛實爾竟以龍川鐵山之地給之耕種我往覘之人因生擒四人而還爾前云我地歸我我自守之豈有容明人登岸之理我因爾此言遂以所得土地人民盡歸于爾旋即班師而爾乃盡背前言耶今我將遣兵往征南海諸島爾當以船助我若不與船當還我所得義州鐵山之地以便駐兵拒守爾既尊明人為父濟之以糧我與爾有恩亦可以糧助我贍養我戍兵此次出師一以招撫無依之島民一以察爾國之真偽我軍尚未諳舟楫爾國人操舟之善更勝于明宜與堅大戰船每船各撥給善操舟之人則前釁可釋爾助明人奚啻百次已皆瀝血輸誠矣今秪助我一次亦不可不輸誠也滿達爾漢棟納密齎書至朝鮮都城賔館三日以李倧弗接見告守館者曰我等至此已久爾王不可得見我等歸矣遂佩弓矢以行李倧遣近侍勸之回延入見謂曰明國猶我父也撫我二百餘年今征我父之國豈可相助以船于是滿達爾漢棟納密遂還六月癸亥定功臣爵職世襲例凡他國貝勒當本國無事時傾心向化率衆來歸者子孫世襲罔替有身迫禍患不得已而來歸者陳亡準襲五次病故準襲三次凡將士臨陳率先功多及攻克城池功大者各照原爵職世襲罔替惟有罪另行酌定凡告發叛逆及亂國大罪者量授爵職準襲六次凡自他國孑身來歸當本國無事時者陳亡準襲四次病故準襲二次迫于禍患而來歸者陳亡準襲二次病故準襲一次凡無職之人值危急時率先戰死或首先登城死者量授以職準襲二次凡擒獲姦細授職者陳亡準襲一次病故不準襲是月丁未太宗與大貝勒代善觀漁于遼河之上遊至撫順界而還見二人縱馬入民田食禾令各貫一耳以徇先是命諸將分路捉生邦素蘇爾德布延錫特庫托克推錫蘭達賚誇祜率兵百人庫巴克泰托濟率蒙古十二人留哈率漢軍二十人先後入明境各有俘獲庫巴克泰托濟擊敗敵兵五十人獲馬十三甲胄六弓矢櫜鞬七即以賜之布泰綽圖韜津至錦州俘四十人還白布赫率蒙古四十人入明境至海濵攜所俘獲過十三山站遇明兵百餘人擊敗之尋有明總兵祖大夀自錦州遣兵千餘追及邀戰我兵陳沒者十一人至是往略寧逺沿邊之蒙古軍獲馬牛騾驢四百六十有竒而還命分賞往略將士秋七月甲戌征明海島師還先是五月庚子甜水站守臣來蓀伊爾登于岫巖地追躡明兵獲船二皆沉之擒四人來獻太宗命楞額哩為右翼主帥喀克篤哩為左翼主帥率騎兵千五百人步兵四千五百人征明海島諭之曰爾等所率之兵當加意約束勿縱劫掠朝鮮為交好之國秋毫不可犯其島中漢人先令副將石國柱髙鴻中遊擊佟三李思忠等前往招降如不降則向朝鮮索船攻取倘朝鮮不與我船可令阿珠祜瑪福塔往諭六月戊辰楞額哩喀克篤哩遣人奏言阿珠祜瑪福塔往朝鮮借船朝鮮堅不付與路獲明人訊之據稱黃總兵即黃龍率兵五千于五月五日已自內地據島中矣我軍于海濵獲小船副將察哈喇率兩紅旗兵駐守明兵登岸來犯備禦穆什屯及二卒陳亡我兵奮勇逆擊敗之沉其小船三明兵欲遁不得船溺水死者過半我兩路兵于二十六日起行而還甲戌師還瀋陽命以所俘獲分給陳亡被創將士有差是月戊寅海州耀州守將伊勒慎富岱貝琿列列琿尼雅漢額宜穆塔爾巴希等聞明兵渡海來犯合擊之娘娘宫渡口獲其船四生擒五人明兵被傷溺水死者甚衆庚辰始設六部集貝勒大臣議定官制設立六部以貝勒多爾衮管吏部事圖爾格為承政滿珠什哩為蒙古承政李延庚為漢承政索尼為啓心即以貝勒德格類管户部事英固爾岱覺羅薩璧翰為承政巴思翰為蒙古承政吳守進為漢承政布丹為啓心即以貝勒薩哈璘管禮部事巴篤禮吉遜為承政布彥岱為蒙古承政金玉和為漢承政祁充格為啓心郎以貝勒嶽託管兵部事納穆泰葉克舒為承政蘇納為蒙古承政金礪為漢承政穆成額為啓心即以貝勒濟爾哈朗管刑部事徹爾格索海為承政多爾濟為蒙古承政髙鴻中孟喬芳為漢承政額爾格圖為啓心即以貝勒阿巴泰管工部事蒙阿圖康喀賚為承政囊努克為蒙古承政祝世廕為漢承政苖碩琿為滿洲啓心即羅繡錦馬鳴珮為漢啓心郎各部承政之下皆設參政八員惟工部滿洲八員又漢二員蒙古二員六部辦事筆帖式各酌量事務繁簡補授凡文臣賜號巴克什者許仍舊稱其餘並令改稱筆帖式諭曰聼訟務持其平讞獄貴得其實爾諸臣審理訟獄于兩造所陳當速集見證鞫問庶有實據若遲緩取供聼彼潛相囑託支飾避罪則審斷安得公平自今以後不先取見證口供致事有寃抑者即按事之大小坐罪審事官又諭曰朝廷黜陟以昭勸懲而人才所宜矜惜向日官員獲罪槩行削職似覺未當嗣後各官有功者或宜序遷或宜超擢量功定議有罪者或宜削職或宜降級亦量罪處分又諭曰國家立法不遺貴戚斟酌罰鍰以示懲警凡諸貝勒審事枉斷人死罪者罰銀六百兩枉斷人杖贖等罪及不奉諭旨私遣人與外國交易或怠忽職業或擅取民間財物馬匹或將本旗女子不行報部短價收納在家者均罰銀二百兩辛巳朂羣臣忠直集貝勒大臣諭曰朕嗣位以來所用皇考時舊臣其行事朕所熟悉近見新進少年諸臣每至朕前言動舉止専事修飾未足慿也宜勤慎職業各殫忠誠又諭曰爾諸貝勒大臣見朕有過即當直諌無有所諱人孰能無過如議論國事時誇詡鷹犬旁及戲言豈非過乎過貴能改諱之奚為爾等當反求已過以規朕之過則善矣庚寅定出征軍制集貝勒大臣定議嗣後出征每旗總管大臣各一舊稱固山額真佐管大臣各二舊稱兩翼梅勒額真每一行營仍以一大臣領之舊稱甲喇額真其隨營紅衣炮大將軍炮及挽車牛騾皆令總兵官佟養性管理是月諾囉路呼爾哈部薩達蘭伊扣扎濟喇瓦爾禪四頭目來朝貢貂狐猞猁猻水獺皮又有頭目額克星格㩦家來歸先是黑龍江有伊扎納薩克提伽期納鄂哩喀康柱五頭目來朝事在六月至是江濵呼爾哈部托思科羌圖禮恰克謨察球四頭目來朝俱貢貂狐猞猁猻等皮八月戊申圍明大凌河城先是寧逺人張士粹來歸又有兩人自錦州來歸俱言明人築城大凌河諸貝勒大臣因奏言明人若果築城我兵即當速往如彼畏我不戰而退我即進兵錦州圍困其城太宗命大臣納穆泰圖爾格率兵千人征大凌河俘獲甚衆奏言築城事虛張士粹等三人皆姦細遂誅之事在五月尋命備禦葉努率十六人往覘還奏城未興築惟于四隅造臺事在六月既而葉努復同備禦錫特庫喀木齊哈往大凌河捉生獲二人以還言明總兵祖大夀與副將何可剛等率山海關外八城兵及夫役興築大凌河城欲即竣工晝夜催督甚力太宗諭貝勒大臣曰蓋聞古來用兵征伐有道者昌無道者廢上天應感之理昭然不爽故自恃其力而恣行殺奪未有不敗克盡其道而力行仁義未有不興天運循環但易其君不易其民若天意所與則敵國之民即我民也今日天心所向豈能豫知朕惟欲體仁行義制敵養民而已爾等當申明法紀教誡士卒咸令恪守凛遵遂頒諭蒙古諸部貝勒各率兵來會以貝勒杜度薩哈璘豪格留守都城七月己亥太宗詣堂子行禮親統大軍西發庚子渡遼河集諸將諭曰瀋陽遼東之地久蒙天賜今不事征討坐視明國開拓疆土修建城郭繕治甲兵使得完備我豈能安處耶朕是以不惜財帛及通市朝鮮所得貨物盡與蒙古易其馬匹興師征討此行倘荷天佑克奏膚功凡俘獲之人勿離散其父子夫婦勿掠取其衣服當加意拊循以副朕戡亂寧人之意朕今不自暇逸躬率大軍前往或彼被困而來降或天垂佑而致勝則休兵解甲定有其時自征明國以來攻城野戰所向必克彼明國屢戰屢敗勢同枯朽而我常有懼心者以彼雖不長于騎射而戰陳時曉習法律故也昔金伐宋遇宋將宗澤十三戰金兵皆敗後有宋將率兵欲戰城守將沮之曰當此六月酷暑揮扇納涼尚不能堪豈能擐甲而戰乎衆兵聞之皆無鬬志其城竟為金所得由一言之失也為將帥者必體恤士卒乃使士卒樂為所用又必嚴切誡諭使勿陷于罪戾我軍統計雖衆若各就所屬遞相誡諭不難遍及要在申明法令撫馭得宜則人人競奮建立功名豈不美乎八月壬寅朔大軍次舊遼陽河蒙古貝勒等各率兵來會大宴之諭曰朕仰承天眷爾諸貝勒遵約會師法令不可岐異此次征明倘蒙天佑得入其地惟拒敵者則戮之慎毋擅殺良民俘獲之人勿離其父子夫婦勿掠取其衣服違者奪其所獲仍依定例鞭責管兵將領各曉諭士卒毋擅離部伍悉遵軍令癸卯分軍兩路進征諭貝勒德格類嶽託阿濟格曰爾等率兵二萬由義州進發屯于錦州大凌河之間朕統軍由白土場趨廣寧大道約初六日會于大凌河丁未辰刻兩路軍俱至大凌河見城牆已完雉堞完其半獲一人于城南訊之言築城已半月有總兵祖大夀及副將八員參將遊擊約二十員馬兵七千步兵七千工役三千商賈二千在焉遂于是夜進薄其城戊申集諸貝勒大臣諭以各固守汛地勿縱敵出遁命楞額哩率正黃旗兵圍北面之西額駙達爾漢率鑲黃旗兵圍北面之東貝勒阿巴泰率護軍在後䇿應覺羅色勒率正藍旗兵圍正南面貝勒莽古爾泰德格類率護軍在後䇿應宗室芬古率鑲藍旗兵圍南面之西貝勒濟爾哈朗率護軍在後䇿應武訥格率左翼蒙古兵圍南面之東喀克篤哩率正白旗兵圍東面之北貝勒多鐸率護軍在後䇿應伊爾登率鑲白旗兵圍東面之南貝勒多爾衮率護軍在後䇿應額駙和碩圖率正紅旗兵圍西面之北大貝勒代善率護軍在後䇿應卾本岱率右翼蒙古兵圍正西面葉臣率鑲紅旗兵圍西面之南貝勒嶽託率護軍在後䇿應蒙古貝勒明安等各率所部兵于空隙處列營額駙佟養性率所部兵載紅衣炮當錦州大道而營又諭曰攻城恐士卒被傷不若掘壕築牆以困之彼兵若出我則與戰外援若來我則迎擊于是諸貝勒大臣分赴汛地環城四面掘壕深廣各丈許壕外築牆髙丈許牆上加以垜口離牆五丈餘地又四周掘壕廣五尺深七尺五寸壕上鋪秫稓覆以土營外亦掘壕深廣各五尺許駕臨城南山岡閲視有敵騎百餘出城逐我採樵者命侍衛率護軍擊之擒其都司王延祚己酉武訥格擒一人得杏山守將與祖大夀書以聞內有宜棄城攜軍士走避杏山或單騎前來等語庚戍明騎兵百餘出城參將布延圖談拜率兵追斬三十餘人獲馬二十四辛亥明步騎兵約五百出城額駙達爾漢率八十人擊敗之追至城壕而還復有出城刈禾者布延圖率兵四十人擊之斬三十人貝勒莽古爾泰德格類屬下護軍斬十八人貝勒濟爾哈朗屬下護軍斬十五人總兵官馬光逺招降城南一臺內百總一男子五十婦女四口遊擊范文程招降城西一臺內生員一男子七十二婦女十七口命各付光逺文程贍養之壬子諭總兵官麻登雲黑雲龍曰朕陳獲爾等見三年十二月加以贍養每念安得恢闢疆土令爾等管理民社以收養人之效登雲奏曰臣等以應誅之身蒙恩寬宥優加贍養無由圖報惟願長驅前進仰荷天佑以成大業太宗曰山海關以內明兵之強弱朕所素悉其善射精兵盡在此城他處無有也登雲奏曰此城內精兵猶槍之有鋒鋒挫柄存亦復何濟是日繫書于矢射入城中諭諸蒙古曰我滿洲與爾蒙古原係一國明則異國也爾等為異國效死甚無謂豫甚惜之爾等得毋慮我誘降復殺耶豫豈惟不殺蒙古即明人為我仇敵因拒戰而殺者有之若來降則無不恩養豫惟善養人故人皆附爾輩豈不熟聞如謂豫言不信人可欺天可欺乎癸丑命宗室鞏阿岱篤義貝勒巴雅喇第三子大臣揚善蘇達拉駐壕邊遇敵人過壕乃接戰圖賴南楚哈克薩哈駐兩黃旗之間見敵人逐我樵採者乃邀擊之諸將甫至汛地明兵出城誘戰圖賴即往擊額駙達爾漢率鑲黃旗兵繼進四面軍士見之亦各進戰兩藍旗兵徑抵城壕舍騎步戰逼明兵入壕明兵墮壕死者百餘人我兵獲馬三十壕岸敵兵與城上敵兵炮矢齊發兩藍旗兵乃退圖賴被創副將穆克坦屯布嚕備禦多貝侍衛果哩及士卒十人沒于陳方接戰時貝勒多爾衮亦率護軍衝入太宗諭責圖賴為敵所誘冒昧輕進以貝勒多爾衮屬員武拜凖塔弗勸阻命宗室錫翰篤義貝勒巴雅喇第五子大臣阿什達爾漢傳諭切責曰定例遇敵時諸貝勒坐鎮軍中令諸將率兵擊之今貝勒輕自進戰爾等何不阻止倘有疏失爾等死不足蔽辜矣諭諸臣曰用兵進止有節不可輕舉此城已被圍敵兵如狐處穴中更將安往朕之將士乃上天所授皇考所遺實欲善用之今用之非其地如穆克坦等遽致傷亡豈不可惜是日總兵官佟養性以紅衣炮攻城西南隅一臺穿其雉堞擊斃一人臺兵驚懼遂降我軍列車楯于臺下以炮攻城之南面壞其雉堞四敵樓二又攻毁城東一臺臺兵乘夜遁我兵追及盡殱之當攻臺時我督攻參將朱三中炮殁甲寅太宗登城西之山岡周覽形勢是日有大凌河岸一臺降臺內兵三十五婦人幼小三十三牛驢三十五乙卯太宗聞佟養性部下兵中炮折足命醫往治以不能療回奏太宗惻然諭養性及諸臣曰若此者爾等當親視醫療早奏于朕爾等亦聞古良將之待其士卒乎于行兵之處有遺簞醪者慮不能遍飲遂投醪于河使士卒共飲其流三軍遂無不效死又吳起為將一卒生疽起親為吮之後其卒感激戰死古良將類皆如此士卒有病則慰問有傷則調治豈可忽視諸丙辰正紅旗樵採兵遇明臺軍出遇害者十人失駝十馬三十五大貝勒代善貝勒濟爾哈朗多鐸等率兵三千往圍其臺發紅衣炮擊之焚近臺房屋百餘獲駝七馬二十七諸貝勒還營留兵守之及夜臺軍突出備禦留哈擊敗之斬九人生擒一人言臺上死于炮者三十人又獲駝一馬十七牛十三驢十五是日城北山岡一臺降內有兵五十五人己未命備禦穆成額葉努率八人往瀋陽傳諭留守諸臣曰大凌河城圍之已久仰藉天眷指日可拔軍中須備用火藥萬斤除留守正員之外其以私事家居者可遣令送來甲子頒賚軍士以所獲牛驢辛未祖大夀遣兵出城奪我軍已得之臺甫樹梯和碩圖葉臣芬古色勒武訥格鄂本岱圖爾格明安各率兵出營偕敖漢奈曼部蒙古兵齊進夾攻大敗之明兵奔入城追擊至城壕乃止尋命參將談布率兵一百五十人邀擊出城樵採者斬三人生擒二人九月戊戌大破明錦州援兵先是師薄大凌河之次日即命大臣阿山勞薩圖嚕什率兵二百往錦州松山一路偵敵擒明兵十一人來又設伏路旁獲七人牛螺十餘越數日明兵二千自松山赴援阿山勞薩圖嚕什率兵擊敗之斬百餘人獲其三纛又命貝勒阿濟格碩託偕每旗領纛大臣率兵一千往松山遮擊明援兵太宗親往指示立營瞭哨之地而還越三日明錦州副將二參將遊擊十率兵六千來攻阿濟格營時大霧人覿面不相識我軍列陳以待忽有青氣自天衝入敵營霧開如門頃之即霽阿濟格碩託率兵進擊大敗之追殺至錦州城生擒遊擊一獲甲胄二百十九馬二百有六旗纛十五太宗往勞其軍阿濟格碩託出營里許迎駕具筵以獻太宗親酌金巵各一飲之次飲蒙古諸貝勒又召阿山勞薩圖嚕什飲之九月己卯諭阿濟格碩託曰敵兵自錦州來者若偵視無多勿輕往迎擊恐其誘我墮彼計中也如敵兵大至則遣人來報朕當親臨調度如敵欲逼我軍結營可令厮卒豫備裝載為旋軍之狀以觀其動靜彼若退則聽之如乘夜來劫我營可令厮卒避于僻地選精兵禦戰如敵營結定則移此處大炮擊之每值夜深人靜時尤當勤于瞭望審察敵情庚辰諭阿山勞薩圖嚕什曰邇來捉生者懦怯慮遇徑敵僅獲樵採豎卒詢以敵軍情形俱未能述夫明國徑兵盡困此城他處援兵無足為慮爾等選精騎遣往自可得曉事之人述彼情形也癸未偵知明山海關總兵宋偉遵化總兵吳襄寧逺巡撫邱禾嘉率關外馬步兵悉入錦州城太宗以阿濟格碩託軍中兵寡命總兵官額駙揚古利率八旗護軍之半往益之丁亥太宗度明兵將自錦州來援命貝勒多鐸率護軍二百行營兵一千五百佟養性率所部兵五百攜車楯往擊親率禁軍二百緣山前行見錦州城南塵起命圖嚕什勞薩率兵二百往覘頃之明兵七千逐圖嚕什等至小凌河岸太宗見之遂擐甲渡河直衝敵陳敵兵七千悉潰遁追擊至錦州城敵墮壕死者甚衆方接戰時多鐸墜馬馬逸入敵陳有扎福塔者以其馬乘之乃還營及阿濟格所部兵俱至敵復出步兵列車楯大炮于城壕外以騎兵隨其後距我軍里許太宗督兵擊敗之斬副將一生擒把總一乃收軍拜天以兵留付阿濟格而還至中途凡被創士卒命以酒遍勞之大貝勒代善率諸貝勒出營三里外迎駕下拜稱賀曰上以寡擊衆荷天庥全勝臣等不勝欣忭駕至大凌河西山岡代善酌酒跪獻太宗答禮飲之告以臨陳爭先力戰諸將代善並酌酒慰勞之乙未明太僕寺卿監軍道張春與總兵吳襄等率副將參將遊擊都司守備等官百餘員馬步兵四萬餘來援祖大夀過小凌河駐營掘壕列車楯鎗炮我哨兵馳告太宗欲更畨迎擊分軍為二親率其半先往諭諸將曰敵壁壘嚴整不冝輕戰致傷我衆且俟彼起營前進乘隙擊之遂引軍還戊戍明兵四更起營趨大凌河距城十五里太宗與大貝勒代善三貝勒莽古爾泰及諸貝勒率兵約二萬往擊至則見敵馬步兵合營四面列大小炮及鳥鎗我行營兵推戰車近敵營護軍及蒙古兵鱗次列陳敵堅峙不動太宗率兩翼騎兵直衝敵營發矢射敵敵乃接戰火器齊發鉛子如雹其聲震天我騎兵縱橫馳突飛矢如雨敵不能當敗卻我左翼兵避敵鎗炮踵右翼兵而進敵營未盡破仍復拒戰我總兵官佟養性奉命率所部兵屯于敵營東發大炮火箭攻之時有黑雲起風從西來敵乘風縱火勢甚熾將逼我軍天忽雨反風敵營燬其兵焚死者甚衆總兵吳襄副將桑阿爾齋先奔我右翼兵衝入張春營敵衆皆潰遁截殺大半追奔三十餘里太宗豫遣精鋭設伏扼敵歸路我軍初破敵營先殺其步兵後復四向追擊其騎兵間有脫者遇我伏兵發悉殱之陳斬副將張吉甫滿庫王之敬生擒張春及副將張洪謨楊華徴薛大湖參將薑新遊擊黃澤千總薑桂等共三十三員其總兵宋偉副將祖大樂趙國志劉應國張邦才于永夀金國臣參將祖邦林于應選穆祿海三代遊擊祖寬竇勳等俱遁盡獲其駝馬車牛甲胄器械太宗率諸貝勒及領兵大臣以大捷拜天行三跪九叩首禮時涼風驟起大雨滂沱戍刻大軍還營天乃霽後三日太宗遣武拜蘇達喇等率兵二百五十往錦州松山一路捉生殺八人擒九人來獻訊之具言吳襄金國臣桑阿爾齋偕百人遁去其督師之閣臣孫承宗及王姓兩太監從錦州退入山海關矣皇清開國方略卷十四
