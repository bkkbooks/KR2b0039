body:
  text: 欽定四庫全書皇清開國方略巻四太祖髙皇帝壬子年至乙卯年壬子年冬十月駐兵烏拉河邊先是烏拉貝勒布占泰遣使修好見戊申年既而背盟侵我國所屬窩集部之呼爾哈路者再復欲娶我國所聘葉赫貝勒布齋女又以鳴鏑射所娶我國公主太祖聞之怒秋九月癸丑親統師征之庚申太祖張黄葢鳴鉦鼔沿烏拉河而行布占泰率兵迎戰至河濵見我兵甲胄鮮明士馬精强軍勢甚盛烏拉兵人人惴恐無鬭志太祖遂沿河岸而下克其臨河五城又取金州城駐營其城在布占泰所居大城河岸之西距城西門二里許冬十月辛酉朔太祖以太牢告天祭纛遂出營見東方有青白二氣指烏拉城北我軍屯其地三日布占泰晝則率兵出城相持河岸夜則入城休息諸貝勒請渡河擊之太祖曰毋作此浮面取水議也當為探源之論耳譬伐大木豈能遽摧必以斧斤斵而小之然後可折今以勢均力敵之大國欲一舉而取之能盡如吾願乎我且削其所屬外城獨留所居大城外城盡下則無僕何以為主無民何以為君乎遂命毁其六城並焚其廬舍糗糧移駐于富勒哈河渡口布占泰令武巴海乘舟來立而呼曰上乘怒興兵至此今上怒已息乞留一言而歸使人來告者三布占泰親率其臣六人乘舟止河中跽而乞曰烏拉國即父皇之國也幸勿盡焚糗糧叩首哀籲不已太祖擐甲乘馬率貝勒大臣出衆軍前立馬河中水及馬腹諭責布占泰曰我昔擒汝于陣貸汝死贍養汝俾主烏拉國以三女妻汝許汝盟誓者七汝藐忽天地屢背誓言再侵吾所屬呼爾哈路欲奪吾所聘葉赫女又以鳴鏑射吾女吾以女歸汝異國義當尊為國妃何得陵暴至此我愛新覺羅由上天降生事事順天命循天理數世以來逺近欽服從不被辱于人汝即不知百世以前事豈十世以來之事亦不知耶若我女有過汝宜告我無故被辱他國且不受況我國乎古人云寧損其骨無損其名我非樂有此舉乃汝負恩悖亂是以聲罪致討耳布占泰對曰此必有人離間俾吾父子不睦其語皆譌傳也布占泰之臣拉布泰從旁率爾進言曰上既因此而怒何不遣使來問太祖責拉布泰曰我部下豈少汝輩人耶尚謂辱吾女為誣奪吾所聘女為妄言乎凡事未實則須問既實矣又何問焉此河無不氷之日吾兵無不再來之理汝口雖利能齒吾刃乎布占泰大懼止拉布泰勿言布占泰弟喀爾喀瑪請曰乞上寛宥賜一言而行太祖曰汝果無此事以汝子及大臣子為質始鑒汝誠不然吾不信也遂回營駐烏拉國五日還兵至烏拉河邊伊瑪呼山岡以木為城留兵千人守之十二月有白氣起自烏拉國經上宫殿之南直抵呼蘭哈達癸丑年春正月平烏拉國先是太祖以布占泰悔罪求和當守約弗渝既薄烏拉城仍班師至是太祖聞布占泰以其子綽啓鼐及十七臣之子送葉赫為質娶我國所聘女又幽寘所娶我國兩公主遂復親統師征之布占泰期以正月丙申送其子質葉赫而我兵先一日至攻取烏拉遜扎塔城督兵進克郭多鄂謨二城翼日布占泰率兵三萬越富勒哈城列營我貝勒大臣皆欲戰太祖止之曰征伐大國豈能使之遽無孑遺乎仍以前言申諭之貝勒代善阿敏大臣費英東額亦都安費揚古何和哩扈爾漢及衆貝勒皆奮然曰我士飽馬騰利在速戰所慮者布占泰不出耳今彼兵既出平原廣野可一鼓擒也舍此不戰厲兵秣馬將何為耶倘布占泰竟娶葉赫女辱何如之後雖征討夫復何及太祖曰我仰荷天眷自㓜用兵以來雖遇勁敵無不單騎突陣斬將搴旗今日之役我何難率爾等身先搏戰但恐諸貝勒大臣或致一二被傷實深惜之故欲計出萬全非有所懼而故緩也爾衆志既孚即可決戰因命取鎧胄被之貝勒大臣及諸將聞上言皆踴躍傳令軍士盡甲太祖遂定䇿諭軍士曰倘䝉天眷佑破敵衆即乘勢奪門克其城毋使復入于是我軍前進布占泰率兵三萬由富勒哈城而來令軍士步行列陣以待兩軍距百步許我兵亦下馬步戰矢交發如雨呼聲動天太祖奮然挺身而入諸貝勒大臣率軍士鼔勇縱擊大敗烏拉兵十損其六七餘皆棄兵甲逃竄遂乘勢奪門太祖登城西門樓城上悉樹我軍旗幟布占泰率敗兵不滿百人急還城下見我軍旗幟大驚而奔復遇貝勒代善率精兵邀擊之布占泰勢不能敵遂遁又損兵過半餘皆潰走布占泰僅以身免投葉赫國而去我軍獲馬匹甲胄器械無算盡收撫其所屬城邑駐軍十日大賚有功將士烏拉敗兵來歸者悉還其妻子僕從編户萬家其餘俘獲分給衆軍乃班師烏拉之先以呼倫為國號姓納喇與哈達國同以納齊布禄為始祖納齊布禄四傳都爾機都爾機生子二長克什納都督次古對珠延古對珠延生泰蘭泰蘭生布延布延收服附近諸部築城于烏拉河岸洪尼地國號烏拉自稱為貝勒生子二長布罕次博克多即丁未年貝勒代善陣斬烏拉統兵貝勒布延卒子布罕繼之布罕卒子滿泰繼之滿泰事見前丙申年至滿泰弟布占泰國乃亡夏四月令貝勒大臣直言政事得失諭曰為國之道存心貴乎公謀事貴乎慎立法布令貴乎嚴若心不能公棄良謀慢法令有害于國奚能致治予一人智慮有限所言所行安能盡當如未當汝等勿面從各出所見直言毋諱秋九月征葉赫降烏蘇城先是太祖遣使諭葉赫貝勒錦台什布揚古曰昔我陣擒布占泰赦其死而贍養之又妻以三女輒敢以恩為讐是以問罪往征削平其國今投汝汝其執之以獻使者凡三往錦台什布揚古不從秋九月辛酉太祖率兵四萬征之有逃卒至葉赫洩軍期葉赫遂盡收散處居民其烏蘇城以痘疫未收我兵圍之太祖諭城中人曰降則贍養之不降則進攻城中人曰大國之兵如林之衆如泉之湧甲胄光芒耀如冰雪豈我等所能禦苟撫我我曷為不降其城長三坦瑚什木二人遂開門降匍匐謁見太祖酌金巵飲之各賜冠服葉赫所屬璋城吉當阿城雅哈城赫爾蘇城和敦城喀布齊賚城鄂吉岱城及屯寨凡十九處盡焚其廬舍糧儲收烏蘇城降衆三百户而還錦台什布揚古使人愬于明曰哈達輝發烏拉三國滿洲已盡取之今復侵我葉赫其意即欲侵明取遼東以建國都使開原鐡嶺為牧馬之場矣明乃遣使來言曰自今以後當與葉赫修好罷兵若不從我言而侵之勢將及我矣遂遣遊擊馬時楠周大岐率練習火器者千人為葉赫守衛東西二城太祖聞之欲致書于明遂躬詣撫順所城庚辰卯刻行至古哷城之野日之兩旁有青赤二色祥光對照如門太祖見之率衆拜踰刻始散翼日至撫順所明遊擊李永芳出迎三里外導入教場太祖以書與之書曰昔葉赫哈達烏拉輝發科爾沁錫伯卦勒察珠舍哩訥殷九姓之國于癸巳嵗合兵侵我我是以興師禦之天厭其辜我師大㨗斬葉赫貝勒布齋生擒烏拉貝勒布占泰仍遣之歸國逮丁酉嵗刑馬㰱血以盟通婚媾無忘舊好詎意葉赫渝棄前盟將己字之女悔而不與至布占泰吾所恩育者也反以徳為讐故伐之而殱其兵取其國布占泰逃奔葉赫葉赫留之不吾與此吾所以征討葉赫也吾與明國何嫌何怨欲相侵耶太祖既與書永芳遂還甲寅年夏四月明遣使來明遣備禦蕭伯芝來偽稱大臣乘八人輿作威勢强令以禮接述書中古來興廢之故語多不遜太祖曰虚言恐喝何以禮為時太祖遇明之使臣其言善以婉言應之言不善以正言折之竟不視其書遣之還冬十一月征雅蘭錫琳二路先是窩集部之雅蘭路人掠我所屬之綏芬路長圖楞我師征之有俘獲見庚戍年至是太祖遣兵五百征窩集部之雅蘭錫琳二路收降二百户俘千人而還乙卯年夏四月拒明使臣索田明廣寧總兵張承蔭巡邊于邊外數處侵我疆土立石碑為界遣通事董國廕來告曰汝所居界外地皆屬我今立碑其地其柴河三岔撫安三路之田汝勿刈穫其收汝邊民還汝國太祖諭曰吾累世田廬一旦令吾棄之是爾欲棄盟好故為斯言耳昔賢云海水不溢帝心不移今既助葉赫又令吾境内之民所種禾黍勿刈穫而遷將帝心已移耶帝之言自不可違但不願太平與我交惡吾小國受小害汝大國得毋受大害乎吾國之民無多不難于遷汝大國能盡藏其衆乎若搆兵起釁非獨吾國患也汝自恃國大兵衆輒欲陵我詎知大可以小小可以大皆由天意汝國欲每城屯兵一萬亦勢有不能若止屯兵一千則城中兵民適足為吾俘耳董國䕃曰此言太過矣遂去太祖因諭羣臣曰人無論貴賤大小皆當公正存心徒恃其智力肆行侵奪縱有所獲豈能永享所謂公正者推己之心以及于人視為一體之謂也其令聞上達天亦佑之無往不善安有凶咎哉故無事之國不可喜事興師若喜事興師必有天譴彼不務修徳恣意侵奪是行暴也因其暴而伐之天必佑矣六月令國人屯田曠土初葉赫國欲以我國所聘布揚古之妹適䝉古喀爾喀部貝勒巴哈達爾漢之子莽古勒岱我國諸貝勒大臣聞之皆憤怒請曰葉赫女既為上所聘又將以適䝉古無禮莫甚焉我等既聞其事安能坐視耶宜乗其許而未行急發兵往攻其城而取之太祖諭曰征討國之大事若以負婚之故怒而興師則未可也葢此女之生釁所由起實非偶然哈達輝發烏拉三國皆因此女興兵搆怨相繼滅亡是此女召釁亡國已有明驗今明又助葉赫不以此女與我而與䝉古天殆欲亡葉赫以激怒我而啓大釁也若奮力征之縱得此女徒致不祥即歸他人亦必不永年吾知此女流禍已盡死期將至矣諸貝勒大臣仍欲興師堅請太祖曰使吾因此發怒興師征討汝等猶當諫止吾早已洞徹事機釋然于中置諸度外汝等何反堅請不已耶吾無憾汝等何憾焉吾斷不以汝等言勞師動衆也尋葉赫以此女嫁䝉古未一年果亡諸貝勒大臣又請曰此女年已三十有三受我國之聘垂二十年因明國遣兵衛助葉赫葉赫錦台什布揚古恃其勢遂與䝉古今往征明國宜也太祖亦不允諭曰明以兵越境而衛葉赫天鑒不逺我姑待之葢葉赫與我滿洲自為二國明既稱為君臨各國即為天下共主自應辨别是非審量而後助之乃恃勢横行抗天意反以兵衛天譴之葉赫試聴彼助之汝等又何急焉使我今日仗義伐明天必佑之天佑我可以克敵但我國儲積未充縱得其人民必有以養之恐我國之民反致損耗惟及是時撫輯吾國固疆圉修邊備重農積榖為先務耳仍不發兵諭各牛录下出十人牛四頭于曠土屯田積貯倉廪復設官十六員筆帖式八員㑹計出入冬十一月征克額赫庫掄窩集部東額赫庫掄人寄語我國之人曰人謂爾國驍勇可來與我等決一戰太祖遣兵二千至固納喀庫掄招之不服遂布陣鳴螺越壕三層毁其柵攻克其城陣斬八百人俘獲萬人收撫其居民編户口五百乃班師先是十月丁未太祖出獵駐蹕穆竒翼日卯刻有紅緑祥光二道夾日又有藍白光一道掩映日上其狀如門太祖率衆拜踰刻始散及是月出獵雪初霽太祖恐草上浮雪霑濡擷衣而行侍衛布揚古及雅喀穆從見而私語曰上何所不有而惜一衣耶太祖聞之笑曰吾豈為無衣而惜之吾常以衣賜汝等與其被雪霑濡何如鮮潔為愈躬行節儉微物必惜汝等正當效法耳令羣臣舉賢才舊不繫日亦未别書十二月後條同諭曰君天所立也臣君所任也國務殷繁必得賢才衆多量能授職天下全才無幾一人之身有所知即有所不知有所能即有所不能故勇能攻戰者宜令治軍才優經濟者宜令理國博通典故者宜諮得失嫻習儀文者宜襄典禮若兹賢才當隨地旁求俾列庶位又諭曰嘗聞古訓心貴正大予思心之所貴誠莫貴乎正大也卿等薦人勿曰我何為舍親而舉疎也當不論家世不拘門第先舉其心術正大者夫一才一藝之士亦國家所需若其人堪輔弼大業急宜顯陟之定八旗軍制先是分編牛录每三百人設一牛录額真見辛丑年後改稱牛录章京即今佐領尋復定五牛录設一甲喇額真後改稱甲喇章京即今參領五甲喇設一固山額真即今都統每固山額真設左右兩梅勒額真後改稱梅勒章京即今副都統初祇有四旗創制年月無攷旗以純色為别曰黄曰白曰紅曰藍至是増設四旗參用其色鑲之幅之黄白藍者紅縁幅之紅者白縁共為八旗行軍時地廣則八旗分八路而進地狹則八旗合一路而行隊伍禁攙越軍士禁喧囂當兵刃相接時被堅甲執長矛大刀者為前鋒被輕甲善射者從後衝擊俾精兵立他處勿下馬相機接應焉臣等謹案明臣黄道周博物典彚有云建州毎嵗貢蜜兼開蜜市自癸丑後不貢相傳煉蜜為糗糧邊臣未敢入告甲寅年四月巡撫都御史郭光復新􅊩任潛使遼陽材官蕭子玉偽稱都督銜命問故子玉盛具儀仗至建州境揚言天使儼臨而不郊迎將以無禮致詰頃之建州主屬櫜鞬迎道左供具甚豐腆子玉大喜相與盡歡徐問不貢市之由建州主從容對曰本部之蜜猶中原五穀也五榖有不登之年將誰是詰耶本部五年來花疎蜂少是以不供俟春枝花滿釀熟蜂衙當復貢市如初此𤨏事耳何煩廑念厚贈子玉並轡而出將别建州主從馬上拍子玉肩笑曰汝是遼陽無藉蕭子玉也安得假稱都督來我郊境我非不能殺汝顧不忍貽大國之辱耳為我致意巡撫後毋再作詐事子玉狼狽西奔巡撫聞之閉門累日葢邊疆之事每貽笑于人安得不啟輕侮之心哉此黄道周所記甲寅年四月之事其稱建州主即謂我太祖髙皇帝臣等恭誦實録前此書明遣使者屢矣均不著其名惟甲寅年四月特書明遣備禦蕭伯芝來偽稱大臣乘八人輿作威勢强令以禮接述書中古來興廢之故語多不遜上曰虚言恐喝何以禮為時上遇明之使臣其言善以婉言應之言不善以正言折之竟不視其書遣之還此實録之文與黄道周所記互有詳畧葢因所見所聞所傳聞各異辭耳道周之云材官蕭子玉實録作備禦蕭伯芝或以一人而兼此二名或兩人異名而輾轉混冒皆無足重輕其云偽稱都督銜命問故盛具儀仗揚言天使儼臨將以無禮致詰則與實録所書之偽稱大臣乘八人輿作威勢强令以禮接適相證合而髙皇帝早知其偽為使命仍以鄰邦使臣待之躬親欵宴温語從容及遣還而後諭斥其無藉戒以非不能殺汝後毋再作詐事益足徴智無不照仁無不容婉言正言咸俾明人心服越一載而明總兵張承廕又遣通事董國廕來索柴河三岔撫安三路之田侵界立碑我貝勒大臣皆欲興師征明髙皇帝諭以吾早洞徹事機釋然于中又諭以天鑒不逺我姑俟之仰見聖明坐照先幾料敵而明人恃力搆兵公為欺詐轉致自貽伊戚道周追咎邊疆之事曰貽笑曰啓侮幾于太息流涕者矣皇清開國方略巻四
