body:
  text: 欽定四庫全書皇清開國方略卷十六太宗文皇帝天聰六年壬申四月至十二月天聰六年夏四月戊辰朔征察哈爾先是五年十一月聞察哈爾林丹汗侵掠阿嚕部長達賚楚琥爾元天祖弟哈薩爾裔後為阿嚕科爾沁部長太宗遣貝勒薩哈璘豪格率兵四百徃援親統師二千繼之行四日薩哈璘豪格遣人奏林丹汗率衆侵達賚楚琥爾駐牧地至錫喇穆掄河北岸大掠塞稜阿巴海營而去尋有四人驅馬三十七自察哈爾營逃至言林丹汗已逺去命大臣圖嚕什勞薩率兵百躡踪過興安嶺乃還獲駝五甲二十五馬一百七十即賜邊外蒙古之隨征者遂班師六年三月丁巳傳諭各䝉古部長率兵㑹諭出征諸將曰朕以察哈爾汗不道親率大軍征討必紀律嚴明方能克敵制勝爾等當嚴諭所屬軍士一出國門悉凛軍法整肅而行若有喧嘩及擅離大纛者治罪弗貸駐營時採薪取水務結隊偕行有失火者論死凡軍器自馬絆以上俱書各人標識馬須印烙並𦂳繫字牌啟行日若與纛逺離為守城門及守關門人所執者貫耳以徇命大臣阿山覺羅布爾吉率兵六百暫駐邊界防逋逃以貝勒阿巴泰杜度額駙揚古利佟養性留守瀋陽四月戊辰朔駕出撫近門謁堂子遂西發己巳次遼河值河水泛漲太宗與諸貝勒乘舟以渡繼渡輜重人馬渉水而過兩晝夜始竟辛未駐營都爾弼地喀喇沁土黙特部長各率兵來㑹癸酉駐營喀喇和碩召集大凌河歸降諸將宴之丙子駐營鍚喇穆掄河岸喀喇齊哩克部阿喇納諾木齊元太祖弟諤濟因之裔即翁牛特部近族伊蘇特部噶爾瑪伊勒登來朝見天聰四年十一月扎嚕特部内齊汗來朝見三年四月色本瑪尼二人從征明有功並見三年十一月喀巴海見二年九月巴雅爾圖見三年五月桑阿爾齋見二年十二月桑圖岱青二人並見三年十月尚嘉布内齊汗子桑噶爾色本子敖漢部班第天聰元年七月來歸部長塞臣卓哩克圖之子奈曼部衮楚克巴圖魯見三年五月等各率兵來㑹己卯駐營昭烏達科爾沁部奥巴見五年四月布達齊見三年四月哈坦巴圖魯見天命十一年十月洪果爾武克善二人並見天聰三年十月阿嚕部遜杜稜元太祖弟諤濟因之裔後封翁牛特部郡王棟岱青遜杜稜之弟本巴楚琥爾棟岱青之弟達賚楚琥爾之子穆彰後封阿嚕科爾沁部貝勒巴林部色特爾見三年十月及北邊䝉古諸部長各率兵來㑹以次朝見大宴之賜鞍馬甲胄服物有差辛巳駐營博囉額爾吉命圖嚕什勞薩率兵五百前行癸未集蒙古部長諭之曰朕以察哈爾汗不道整旅徂征先期諭爾等率兵來㑹今爾等所率兵多寡不齊遲速亦異惟土謝圖額駙奥巴率來軍士甚多又不惜馬匹散給部衆疾馳來㑹足見秉心誠慤憂樂相同朕甚嘉之扎嚕特諸貝勒亦屬實心効力巴林部色特爾既託命於我自應身先士卒竭力戎行且同類之喀爾喀諸貝勒有為察哈爾所俘戮者離其夫婦者取其部曲秪存孑身者朕從大公起見興師來此正色特爾奮志雪讐之日豈可吝惜馬匹怠緩不前阿嚕諸貝勒為察哈爾所逐奔投我國朕屢令移駐近地乃不遵朕言仍於逺處牧放復為察哈爾所掠誑稱侵奪我國之物以獻于明屬國為人所襲朕猶有憾阿嚕諸貝勒躬罹其害當思仗朕力以復讐乃竟不散給爾馬不多發爾兵僅以一旅之師勉强應命何耶又諭曰蒙天眷佑纉承丕基國中人民財物皆我所有然曾見我奪人一美女一良馬乎曾令有才具人離其主而從我乎果有其事朕豈不畏天耶朕本畏天之念而行無强取于爾等之事此無俟朕言爾等當亦知之朕惟恐八旗諸貝勒或奪汝等良馬美物不體朕意若聨姻締好彼此相饋各出所願則可不願則勿與倘有恃威强索者爾等當奏聞衆皆叩首受命復大宴之乙酉駐營哈納崖以圖嚕什勞薩所獲蒙古流散男女二百餘留於喀喇穆掄河地己丑大軍過興安嶺次達勒鄂謨之公固哩河達勒鄂謨延袤約八十里東西三河環流灌注水鹵不可飲東距瀋陽一千三百五十里命阿山率將八兵三百徃助圖嚕什勞薩軍五月甲子駐軍歸化城城為元裔土黙特部長阿爾坦所築明隆慶時封阿爾坦為順義王名其城曰歸化再傳格根汗又再傳鄂木布楚琥爾苦察哈爾林丹汗侵擾同喀喇沁諸朝部長通款我見天聰三年六月尋率衆朝貢先是大軍過興安嶺之後一日次都哷河有察哈爾部下人逃至訊之言有二人馳六騎徃報滿洲大兵無數前來四月乙酉駐營哈納崖之夕鑲黄旗下舊䝉古二人竊良馬六匹逃去察哈爾汗聞之大懼謀奔庫赫得爾蘇地離逹勒鄂謨約一月程凡部衆家業有兩牛以上者盡令棄本土隨之西奔太宗諭貝勒大臣曰察哈爾知我整旅而來必不敢攖我軍鋒追愈急則彼遁愈逺我馬疲糧竭不如且赴歸化城暫駐因調前行之阿山圖嚕什勞薩等還與大軍㑹越二日圖嚕什遣人送所獲察哈爾部一人至言察哈爾部衆在喀喇莽鼐之左界于是定議進征頒軍令曰凡我軍所至有拒戰敗走為我追擒者殺之不拒戰者俘之勿殺若擅殺不拒戰之人掠其衣服牲牧者治罪即以其所得之物賞給首告之人寺廟中如有自外竄匿者可徃緝捕并察驗僧衆數目具報不許屯住其中違者治罪毁壊寺廟取其器皿財物及潛入人家滛婦女者並處死弗貸五月戊戍朔命阿山圖嚕什勞薩武拜率兵三百捉生備禦留哈同布哈塔布囊率壯士十六人偵敵癸卯大軍至呼喇祜諭貝勒大臣曰䝉天眷佑我軍已至敵境今當深入遇敵人弗拒戰者勿殺可俘以獻追敵勿至昏暮日未落即止凡降人擇為首者二三人令原招降主將率之而行其餘令各領家口隨行若離散人夫婦滛亂人婦女者處死察哈爾部長奔逃所遺家業牲牧財物主將撥人守之察明收貯凡所俘獲務與衆均分又諭隨征䝉古各部曰凡遇敵臨陣非奉朕㫖毋得輕進有㫖令進毋得退縮違者罰奪部衆軍士違者處死妻子為奴如敵人乘夜刦營可堅壁以禦勿諠譁勿離汛地如潛襲敵境勿舉火以致敵覺夫萬里行師人倦馬疲倘為敵覺無所獲而歸殊可憾也不俟令而舉火者治罪將領及部長並罰馬甲辰駐營扎喇布拉克命勞薩率兵百先大軍三十里行越五日㑹大軍于庫託地奏言遇察哈爾哨兵四人于喀喇莽鼐追至益圖地斬一人見前有數十人圍困留哈因率七人大呼衝擊敵俱敗走自後一無所見度彼大隊人馬逃去已久追之無及太宗召集諸貝勒大臣諭曰察哈爾不能禦我軍逃去已逺追之無益今我暫旋師以俟再舉乎抑收其遺棄部衆即入明境乎貝勒大臣等奏此來已近明境宜勿旋師於是命大臣䝉阿圖率各旗官一兵百還瀋陽傳諭曰額駙達爾漢屬下人逃入敵境即四月乙酉自哈納崖竊馬逃者泄漏軍機致察哈爾覺而逺遁追之不及因旋師取其遺棄部衆直入明境所有餘存糧餉可移貯遼河岸掘壕加意防䕶貝勒阿巴泰額駙揚古利防禦之兵可撤回守城前者令喀喇沁人于法庫山耕種若耕種未畢當督之勤力仍慎守毋忽庚戌大軍向珠爾格圖進發路旁有二黄羊並行太宗發一矢貫之丙辰左右兩翼分道行獵黄羊徧野太宗連發矢每矢貫二計射五十有八隨征者或射或殺共計數萬時軍中糧匱脯而食之皆飽腹㑹天氣炎熱其地無水士卒渇甚多仆于路夜至和爾果地乃得泉有次日至者以一黄羊易水一碗而飲先至兵留憩二日仍有未至者命各備禦遣人持水徃迎之庚申大軍次穆嚕哈喇克沁命貝勒阿濟格率左翼兵及科爾沁巴林扎嚕特喀喇沁土黙特阿嚕諸部兵萬人征明大同宣府邊外貝勒濟爾哈朗岳託徳格類薩哈璘多爾衮多鐸豪格率右翼兵二萬征歸化城黄河一帶大臣徹爾格察哈喇率兵五百徃黄河備船圖嚕什勞薩前行捉生太宗與大貝勒代善三貝勒莽古爾泰統軍繼進于是兩翼兵齊入隘口西至黄河穆納漢山東至宣府自歸化城南及明國邊境所在居民逃匿者悉俘之降順者編為户口甲子太宗駐營歸化城乙丑歸化城諸喇嘛朝見賜宴遣之傳諭兩翼領兵諸貝勒曰爾等可選精騎調赴黄河一帶以助兵力若俘獲者多可攜則攜之不能盡攜則任諸將酌行凡諸貝勒所俘獲者酌分馬力疲羸之兵防守仍深入敵境然後旋師朕駐歸化城以待六月甲戌自歸化城移師征明大軍駐歸化城之後二日徃略黄河一帶諸將奏報察哈爾蒙古前已渡河遁不料我軍即至復渡河而歸為我俘獲以千計又科爾沁從征部長遣人奏報近明界察哈爾部人盡逃入沙河堡六月丁卯朔太宗遣大臣揚善率兵六十偕所獲察哈爾通事一人徃索之與沙河堡各官書曰我北征察哈爾窮追四十一日擒其哨卒訊之云已星夜遁去我欲收其部衆因還兵克歸化城暫駐營以待我進勦黄河軍近聞察哈爾所遺人户財物為沙河堡容留此係我未經收盡者當一一還我且此蒙古舊屬格根汗察哈爾取之則為所有我取之即為我所有以我所有而爾等取之不可也且我邊外之事爾等何得干預此事諒非爾主所知乃爾等邊臣所為爾等豈不知遼東官員干預我邊外葉赫之事自取禍患爾若不還與遼東官員何異耶我此來原欲修兩國之好故徧諭爾守邊各官也沙河堡各官得書知兵至大驚凡逃入堡中蒙古男女三百二十餘牲隻一千四百餘并紬縀布帛六千四百餘疋盡以歸出辛未牓示歸化城格根汗廟諭誡擅毁廟宇及擅取器物者決不輕貸是曰諸路將領各籍所俘獲以奏命以金銀紬縀分給各貝勒又每貝勒分給牛十羊百凡人口各按甲士均分其從察哈爾克什克騰部來歸及喀喇沁與新附呼爾哈等所俘獲者聼其自取總兵官麻登雲及大凌河降將祖可法至遊擊等各按品級以人口牛羊厚賞之甲戍太宗統師趨明邊境行三曰命大臣蘓達喇圖頼率兵二百偕蒙古通事二人復與沙河堡各官書曰始我意在議和屢與遼東各官言之乃不聽吾言反厚待與我宿有怨隙之察哈爾我是以逐去此處察哈爾爾等昨得我書即將逃入䝉古獻出甚善今我將徃大同陽和宣府一帶議和道經爾地不可無一言相慰故遣人以書相告沙河堡各官得書遣十七人齎牛羊縀疋并茶酒來獻賜為首三人牛各一其十四人羊各一遣還又命巴克什庫爾禪覺羅龍什進得勝堡愛巴禮喀木圖進張家口與大同陽和宣府各官書曰我之興兵非欲取中原得天下也因遼東官員不行正直之道貪黷貨賄罔顧是非助邊外葉赫遣兵戍守専意結怨無故欺陵遂成七恨我曽屢致書爾主遼東官員與我為難壅不上聞竟無報書我之所以興兵者欲爾主察詢其故是以攻取撫順時得爾國商賈人等俱縱之令齎書轉奏爾主恐其不能徑逹又令其付與爾各省官員亦無囘音數年以來我師所向屢破城池意謂爾主必加察問知我興師之故則和議成而戰争息且上天以生民為心若黷戰不已民死鋒鏑豈能仰合天心乎我今開誠相告惟願兩國和好戢兵息戰兆庶敉寧財貨豐足互相市易各安耕獵以樂太平前者兵入邊境屢有攻取書詞徃復其中疾怨之言有兩相輕慢者此兵家之常不足道也爾國豈無才俊勿以古昔毁盟棄好及互相欺罔之事為鑒因而致疑于我幸速為裁斷以成此舉實兩國之福我將駐此十日以待囘音勿再遲延也庚辰駐營大同邊外庫爾禪等自得勝堡來明千總一員率十五人隨至以牛及縀疋食物獻命郤之賜千總牛一令齎與得勝堡參將守備等書曰議和之事我至誠相告爾等果實心愛民不效遼東各官搆怨于我則宜速成此事若遷延時日故意推諉不力成和議是自樂戰爭我亦無如之何矣至書中稱謂尊卑且勿論和事既成自當遜爾大國爾等亦當視我居察哈爾之上也越一日得勝堡叅將遣通事官一千總一偕二十七人齎牛羊縀疋食物來獻賜通事官牛一餘各羊一遣還戊子貝勒阿濟格奏言臣等兵至宣府彼處官兵驚懼將犒賞察哈爾汗所餘縀疋及虎豹狐獺等皮在張家口者悉獻出庚寅太宗統師駐宣府邊外列三十餘營聨絡四十里環營四面鑿塹深廣各一丈癸巳明宣府廵撫沈姓總兵董姓遣通事官二守備二偕十一人齎牛羊食物來獻太宗御黄幄領兵諸貝勒大臣左右列侍明守備通事官叩見次從人遥叩命守備等坐左側宴之賜守備各馬一通事官各牛一從人各羊一是日我軍大市于張家口科爾沁部隨征兵三人潛入明邊取其牛驘太宗以兩國既和好貿易三人違令盗取令執赴明界上斬其為首者以示明人為從二人各鞭一百貫耳甲午明宣府廵撫沈姓總兵董姓遣使來請盟命大臣阿什達爾漢等莅之其都司等官四員刑白馬烏牛誓告天地焚盟書以黄金五十兩白金五百兩蟒縀五百疋布千疋獻命啓心即祈充格率八人送之還秋七月庚申凱旋瀋陽先是六月乙未以所得明張家口沙河堡財帛五之一賜土謝圖額駙奥巴其餘酌分行間諸將所獻虎豹皮紅氊分給八貝勒縀布獺皮等物悉犒軍士七月丁酉朔命塔布囊達雅齊率官八兵八十齎與張家口各官書曰兩國既誓天地敦和好凡事皆當敬承天意善保始終我豈樂于戰爭惟以大義之故専意修好謂兩國相安則各受其福所以倡率議和期于必成逺出邊隅至于此地頃獲爾哨卒二人旋即送還我兵私入爾邊為盗即于爾界斬一人餘二人各鞭一百貫耳復還所盗之物以我國崇尚禮義如此爾國反不還我逃人是何謂耶試思此逋逃數人果損于我而有益于爾耶爾等宜以信義為尚勿效遼人偏助葉赫厚察哈爾而外我也我專意和好敬天保終爾等亦不相負則兩國皆善矣議和時爾等原謂在寧逺錦州等處之遼東人並與同議但遼東人從來志大言謬難與議和須爾處遣人徃議為善我亦俟爾處人來議若爾處來議之人日久不至我即乘暇來此與爾等議之是日太宗統師還行三日明邊境守臣齎獻和好禮物命郤其黄金五十兩琥珀數珠二盤倭縀十疋以所納蟒縀三百二十疋縀一百三十疋錦縀十六疋布二千五百疋綠皮五十六張茶一千七百包分賜諸貝勒明日外藩䝉古貝勒等辭歸各賜縀有差壬寅以大軍克㨗刲牛八祭纛告天丙午過興安嶺己未渡遼河庚申還瀋陽八月丙寅朔撫慰大凌河降衆時大凌河降人有逃去者太宗命額駙佟養性與文館諸臣宣諭大凌河歸降各官曰爾等被圍三月天以與我不忍棄之俱攜至此給衣食配妻室厚加撫恤何異孩提時父母鞠養之恩今爾等所統屬不過四五十人或二三十人有何繁多不各加訓飭竟任其逃亡殆因朕出征宣府議和而還爾等不得歸家故如此不知和議果成則財幣有資邊市無阻國家富强長享安樂豈非美事若和議不成專圖進取彼察哈爾已遁萬里之外旁無窺伺我軍分道征明無難一舉成事不是之思而背叛竄遁負朕鞠養之恩是負天也可各曉諭所屬令三復思之九月癸卯修築盖州城先是葢州之地未設兵防守至是修築其城移民以實之命副將石國柱遊擊雅什塔備禦齊爾格申等率兵六百徃駐防又命掌户部貝勒徳格類掌兵部貝勒岳託經理疆土自耀州舊界開拓至葢州迤南冬十月甲戍趣明寧逺守臣早決和議先是大軍自明宣府凱旋瀋陽之後七日召文館儒生沈文奎孫應時江雲三人並由明諸生來歸者賜饌内廷諭曰此番出兵與明國議和爾三人之意云何沈文奎奏明人諱言和區區邊塞小臣其盟誓無足據孫應時奏明人以議和延緩我師即實心願和其嵗饋必不能如我所定額數江雲奏和議不成十居其七皇上姑遣使徃明以和議試之彼若不從則我兵入境攻取更為有名至是命偉徴囊蘇喇嘛赴明寧逺與駐守各官書曰我使者還聞爾等云議和之禮須送還大凌河官一二員並少退尺寸之地以此為名方可轉逹朝廷夫和事果成我又何吝此一二人且普天之下盡為爾朝廷所屬豈僅尺寸之地乎爾不忘已失之土地人民時藉以為口實我之二祖無故被害我能一日忘耶我惟願見太平未動爾邊疆寸草尺土乃邊臣陵逼致成七恨漸啓兵戈迄今未息今我仍願太平屢議和好爾等乃以是為言過矣况自克撫順以來我兩國强弱豈有不知既已知之曷為徒飾利口貽誤主上流禍生民從來兩國議和必彼此使命往來則和事易于就緒今我一心願和天鑒在上實無欺偽乃以至誠遣使而爾卒不信不一遣使相報向者袁廵撫與我議和時我方遣使通問彼即繕修城池非惟拒守又復相逼是以計愚我也我用是決意起兵然于兩三月前令杜明忠齎書以告然後興師未嘗詭計掩襲杜明忠現在爾處可詢也我如是求和爾堅執不從且不必逺徵徃古即自我兩國搆兵以來厯年戰爭之苦昭然可鑒爾不樂太平惟尋師旅國家生靈視昔更苦咎將誰歸今春往征察哈爾知爾一年之内與彼銀百萬有餘與其以有用之金錢費于無用之察哈爾何如遣一曉事人來早決和事俾兩國共享太平也我之心事直告無隱爾諸大臣果能身任和議以成美事豈特兩國息爭人民安業且使無限生靈免于鋒鏑造福甚大其福亦歸于任事之人矣又命附與寧逺守臣轉逹崇禎帝書曰滿洲國皇帝奏書明國皇帝我國稱兵非不知足而冀圖大位也因邊吏欺侮之恨不得上達致起兵端於茲數載矣我思戰爭不息則彼此俱被其禍和好一成則彼此均受其福所以前于徃征察哈爾時過宣府議和刑白馬烏牛誓告天地我意既盟之後永相和好故執我國越境之人戮示於爾邊臣之前所獲財物悉令送還數月以來未嘗少犯爾邊我之篤守盟誓可謂至矣嘗觀往事下情上達天下無不治下情上壅天下無不亂我兩國搆兵亦因下情阻蔽不得上達所致皇帝如欲洞悉我之恨端當遣信使來問我將悉告之若謂業已議和又何必語及夙怨則亦惟皇帝之命惟和好既成獲邀嵗幣優游田獵共享太平是所願也後一月偉徵囊蘇喇嘛還述寧逺各官言來書封固我等未奉主露封上命不敢擅開可回奏爾于是送來我等閲過即便奏聞命偉徵囊蘇喇嘛露封再齎往寜逺仍不報十一月丁未整飭朝㑹班次集分掌六部貝勒諭曰國家初設六部承政參政等官即定有班次近見朝會之時坐立無序尊卑紊越將何以肅體統耶爾等宜傳令滿漢蒙古諸臣按次就班各加整飭十二月乙丑申定服式甲子朔布令國中以是月二十日為始黒狐㡌五爪龍明黄杏黄金黄等服非上賜不得用閒散侍衛䕶軍及諸貝勒下䕶衛以上許服縀衣餘衆俱用布又諭曰國家服式之制所以辨等威定民志俾朝野各有遵守我國風俗素敦淳樸近者奢靡僭越之風往往而有不可不定為法制昭示國中且一縀之直可當十布與其以一縀成一衣何如十布可得十衣所以令衆用布者非為縀疋專供上用實有便於貧民也凡婦人所服縀布各隨其夫辛己申嚴行獵禁令先是十月庚午駕由開原行獵至斐德里山有侍衛詹土謝圖前行以射麅矢射中虎為虎迎撲墜馬欲噬之太宗大呼躍馬獨前虎遂郤詹土謝圖未至大傷衆侍衛乃射殪是虎甲戌諭貝勒大臣曰凡出兵行獵時有為盗者論罪大小或殺或鞭久著為令乃此番行獵仍有盗鞍轡䩞屉等物者是法令不彰而人不遵守也夫蒐苖獵狩原以講習武事必紀律嚴明然後人不敢犯今行獵兵少尚多犯法若師行動衆將何以約束之乎爾諸貝勒大臣其徧行親察嚴加懲治于是械送所緝獲九人至瀋陽各鞭八十二庚寅駕至葉赫地行獵諭諸貝勒曰爾等慎勿以獵人所射之獸冐為已之所射而競取之在獵人畏懼爾貝勒誰敢不讓而爾貝勒豈可强奪其物乎倘再有厮卒等盗取馬絆䩞屉等物者罪及其主決不姑宥十二月癸酉駕出獵撫順有獵卒八人分取民間積薪各鞭二十七因諭從臣自後擅取莊屯積薪及斫伐山木者嚴懲毋貸庚辰獵於額葉地親發矢中一虎侍衛巴圖魯噶爾珠持刀追斫虎嚙其馬足既殪乃旋誡之曰爾之勇宜施于戰陣何輕事搏虎為辛巳以從獵者亂行諭諸貝勒曰自後行獵毎旗令大臣一人專司統轄有不隨隊行走逗遛失次者皆執治之皇清開國方略卷十六
