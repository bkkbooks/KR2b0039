body:
  text: 臣等敬謹編輯皇清開國方略三十二卷書成進呈乙覽皇上恭製序文弁列簡首臣等伏而誦之仰見御極以来無時不以祖宗之心為心無事不以祖宗之政為政凝命勅幾五十一年如一日是書之輯用以闡揚我太祖太宗躬甲胄冒鋒刄創業垂統若斯之難皇上監於成憲思峻命之不易用弼億萬禩丕丕基而首揭夫三代以下治亂循環統一天下之大勢盖商周之興也以藩侯唐宋之興也以重臣漢與明雖崛起草莱而食毛踐土之義則未有以易也故以得統之正歸諸元代與我大清聖人大中至正之論義例綦嚴矣我太祖髙皇帝之龍興也以春秋復讐之義而成詩書救民伐暴之功自尼堪外蘭伏誅諸部長望風慴伏奔走恐後薩爾滸一戰天討申矣王業成矣太宗文皇帝嗣位以後版輿日拓民庶日蕃松山杏山之師武功與薩爾滸相埒然當夫申諭邊臣予書明主惓惓於武不可黷民不可殘成敗利鈍之不可不計如天好生之心兩聖人先後同揆暨世祖章皇帝掃除流寇光宅中原而天下本非明之所有矣於此見造邦啟宇比諸即邰遷豳而人心天命之歸遲之久而自應三五之盛蔑以加焉且夫得統之正自元而外莫與我朝為比而我朝繼繼承承之治尤豈元代所可並隆哉史稱元太祖有深沉之略太宗有寛宏之量世祖統壹六合立綱陳紀貽謀深逺然傳至成宗寖以陵替矣我國家列聖重光徳威逺播垓埏所極訖乎無外西陲之役皇上睿謀制勝掃穴犁庭於以繼聖祖仁皇帝親征絶漠之勲於以成世宗憲皇帝永靖邊隅之策且金川底定𨽻我版圖一若天地祖宗特留此不世之豐功以待我皇上之仔肩嗣受蕆績奏成而逈非班書之錄西域唐籍之紀北庭徒事曼詞揚詡已也然則我太祖太宗以俄朶里城十三甲之遺東至海西至遼北自科爾沁之嫩江南及朝鮮國境凡使犬使鹿之邦黒貂黒狐之地莫不稱臣納貢因以奄有中原我皇上仁育羣生義征不譓踰雪嶺越沙蹟取荒裔若庭户縛醜虜如圏牢北斗以北西濛以西籍租税者二萬里太學之碑格登之銘西師之詩開惑之論聖謨洋洋與大烈耿光並垂久逺要皆順天而動未嘗少侈戎威而一本於慎守神器紹聞衣徳之至意猗歟偉哉册府傳信之鉅觀於是焉在書稱思艱圖易懼其艱之弗勝而艱者亦易矣詩陳舊邦新命纉其舊以弗改而新者日新矣臣等恭繹皇上大中至正之論以仰窺太祖太宗累仁積徳之原思欲繪天賦海末由形似萬一竊附於大雅之美依京三頌之歌清廟斯則歡忻舞蹈之忱所不能自已者爾臣阿桂臣梁國治臣和珅拜手稽首恭跋
