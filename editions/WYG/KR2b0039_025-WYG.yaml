body:
  text: 欽定四庫全書皇清開國方略卷二十五太宗文皇帝崇徳三年戊寅正月至七月崇徳三年春正月甲午世祖章皇帝生世祖章皇帝太宗第九子也母孝莊文皇后時為永福宮莊妃娠十有一月二月丁酉親征喀爾喀先是正月庚辰駐守歸化城土黙特左翼部長古祿格遣扎幹等三人奏言臣等偵知歸化城北有喀爾喀部扎薩克圗汗巴延達喇長子賚瑚爾率兵及家口周圍駐營似欲侵犯我城乞速發大兵以備之太宗御篤恭殿諭諸王大臣曰喀爾喀侵犯歸化城爾等其令軍士早夜秣馬預備糗糧朕將親統大軍討之二月丁酉太宗率豫親王多鐸武英郡王阿濟格郡王阿達禮貝勒岳託貝子大臣及䕶軍等於午刻出撫近門謁堂子唘行命禮親王代善鄭親王濟爾哈朗睿親王多爾衮安平貝勒杜度饒餘貝勒阿巴泰等留守是日車駕出沙嶺舊邊駐營己亥遣拜賽偕十六人往探扎薩克圗汗踪跡丁未駐軍喀勒占外藩科爾沁部長土謝圖親王巴達哩扎薩克圗郡王布達齊卓哩克圗親王武克善巴圗魯郡王滿珠什哩喇嘛什希穆齋占巴拉塞爾固楞等扎賚特部長達爾漢和碩齊䝉衮等奈曼部長達爾漢郡王衮楚克等敖漢部長額駙班第等扎嚕特部長内齊尚嘉布内齊子桑圖桑古爾扎木素桑阿爾色本子巴雅爾圖青巴圖魯即瑪尼茂竒塔特瑪尼子額騰多爾濟等阿嚕科爾沁部長穆彰達賚海色固嚕等四子部長達爾漢卓哩克圖鄂木佈伊爾扎木索諾木等茂明安部長巴特瑪瑚稜等巴林部長滿珠什哩阿玉什等翁牛特部長達爾漢岱青薩揚達拉海巴木布班第噶爾瑪即喀喇車哩克部長等各率所部兵来㑹獻駝馬俱却之遂行至錫喇穆掄喀喇穆掄兩河交界處駐營戊申大軍至哈納哈達壬子過興安嶺行獵是日駐營達勒諾爾東癸丑拜賽自歸化城還奏言喀爾喀扎薩克圖汗驚聞大軍將至已於正月三十日倉皇遁去太宗疑其或逐好水草處藏匿復遣莽奈都爾率八人往探於是行獵至達勒諾爾西壬戍遣前鋒將領勞薩梅勒章京錫特庫等自多原齎書諭明宣府各官曰壬申之夏朕率大軍往征察哈爾察哈爾汗聞風逺遁歸化城及各寨部衆咸歸於朕彼時曾謂宣府執事人等曰爾宣大之人無怨於朕惟遼東邊吏欺詐特甚朕故征之今爾等與朕脩好互市凡嵗幣之與察哈爾者應悉與我爾云察哈爾汗雖遁其身尚在倘復来索嵗幣奈何故雖與而不盡如例但與我講和通市因對天地盟誓大軍遂不入境而還嗣後朕踐此盟言静俟一載兩次遣人致書爾竟背盟未答一語朕是以有甲戌之役今天下䝉古入我版圖朝鮮為我藩服察哈爾汗畏威逺竄身死國亡妻子臣民我悉綏定曩時推諉之辭謂察哈爾汗尚在也今更將何辭以對乎彼北邊䝉古喀爾喀者非與爾有盟誓之好也乃與之嵗幣開市而結盟之國反不與嵗幣開市者何哉朕今親統大軍駐布顔阿海遊牧之地以待爾如能悔過無棄盟言則不入爾宣大之地止征遼東夫逆則征伐和則貿易古亦有之爾若不審天時而逆朕命朕當令朝鮮䝉古諸大軍分路縱略廢爾農時恐後悔無及也朕以實告爾爾其速圖而裁答焉並面諭勞薩等曰爾等若遇喀爾喀部人衆多力不能勝即還報能勝則取之拒者殺之三月甲子朔自多原至博碩堆遣牛录章京法談等賫勅諭留守諸王曰喀爾喀為漢人所恐云大清兵已至矣彼遂驚懼未敢犯我歸化城亦並未與漢人交市扵正月三十日倉皇而去但恐彼去未逺已遣人徃探若果未逺朕必前徃其糧米須待此䖏人到輸運不然朕亦竟従此班師行糧已足不必更運矣越二日丙寅知扎薩克圗汗果率兵逺遁扵是命王貝勒以下梅勒章京以上各出銀赴歸化城貿易尋遣大學士剛林齎信符赴盛京令速發駐防前鋒兵以迎之甲戌駐軍宜喜里勞薩等還奏路遇䝉古碩雷使者徃明國交易獲其馬百四十駝四十其䝉古四十人給以羊隻為行糧遣之去獲二漢人還太宗曰何為輕釋䝉古耶復令勞薩等率毎旗章京一員甲十五人於夜分往追之以所獲駝馬賜一等公以下牛录章京以上各官後法司議勞薩等違命縦敵之罪得㫖従寛罰懲辛酉宴新附烏珠穆沁部車臣濟農等烏珠穆沁部車臣濟農即多爾濟聞太宗惠養國人恩意周至率竒塔特台吉偉徴塔布囊索諾木塔布囊博倫塔布囊達拉海納穆琿津等三十人舉部來附賜宴清寧宫事在崇徳二年十一月至是車駕至多原車臣濟農等率其長子塞稜次子桑阿爾齋三子垂僧格四子徳音楚克及同部噶喇木扎布蘇格岱青錫達索諾木都斯噶爾和多和沁伊勒扎爾山津武克索木伊勒畢斯徳勒格爾塔布囊衮桑班第岱阿哈土謝圗等來㑹師進獻駝馬甲胄等物令車臣濟農朝見設黄幄列儀仗王貝勒以下羣臣依次立帳外太宗於已刻出行幄率車臣濟農等拜天畢御黄幄車臣濟農率其所部貝勒及臣屬朝見具筵宴進上同來㑹師之阿巴噶部噶喇木扎布蘇尼特部武善伊勒登塞稜達爾瑪等浩齊特部博羅特推囉阿納特塔布囊雅達固什等亦於是日朝見各獻駝馬鞍轡均酌納之賜大宴命較射角觝賜甲胄雕鞍弓矢銀幣有差尋遣還夏四月甲午朔征卦勒察諸將奏捷先是太宗率諸王貝勒等西獵於大草灘卓索圗爾格尼等處事在崇徳二年十二月命葉克舒為右翼大臣星訥為左翼大臣與其下阿福尼赫葉訥瑪喇希喀木齊哈喀爾喀瑪鄂謨克圗薩哈納穆成額叟塞阿林巴雅爾圖塞赫哈喇勒岱訥爾特穆圗希福等率兵六百往征卦勒察葉克舒星訥等師至薩哈勒察俘獲男子六百四十名家口一千七百二十名馬一百五十六匹牛一百有四頭至是盛京留守諸王遣兵部唘心郎占巴等賫疏以聞遣禮部承政庫魯克達爾漢阿頼祝世昌姜新等迎宴之尋以所獲薩哈勒察等衣服賜兩翼大臣并賞従征將士銀兩有差庚子改都爾弼城為屏城先是崇徳二年八月太宗以將築都爾弼城命睿親王多爾衮相度基址饒餘貝勒阿巴泰率八旗每甲喇章京一員每牛录甲士二十二人夫役十人前徃興工又遣甲喇章京伊爾徳訥爾特敦拜錫翰等率䕶軍四十人防衛築城夫役本年二月命留守王貝勒等監築都爾弼城及遼陽城三月太宗扵博碩堆行營遣牛录章京法談等賫敕諭留守諸王等曰朕曽有㫖命仿都爾弼城規模築遼陽城今觀都爾弼城甚小大軍出征之後遼陽乃駐防重地士馬繁多何以能容若城基未築可毎面再廣十丈朕籌畫再三故有是命至是次鄂岳博洛令每三丁出夫一名協濟築城夫役工竣改名為屏城賜門額曰安邊門廣邊門乙巳車駕還盛京太宗扵三月庚辰自登努蘇特班師大軍次克依綳之次日賜外藩科爾沁奈曼敖漢扎嚕特四子翁牛特巴林茂明安等部諸王貝勒等貂裘鞍馬衣服等物並賜宴遣歸以翁牛特部達爾漢岱青下塞内琿津正黄旗阿爾哈車臣毎遇㑹議聴斷勤勞平允特賜車臣號扎爾固齊賜塞内琿津豹裘縀布辛夘度興安嶺至温泉壬辰至烏蘭哈達癸巳至錫爾哈夏四月乙未至遼河己亥至察木哈越二日户部承政英固爾岱瑪福塔㩦御用馬匹來迎並奏言臣等往鳯凰城等處開擴邊境自鳯凰城至鹻場自蘭磐至鳯凰城較舊界各擴出五十里此二百里所需釘樁繩索恐鳳凰城應用不敷令沿邊四城協力均濟又自盖州至熊熊岳耀耀州較舊界擴出四十八里其釘樁繩索令四城均辦壬寅太宗至遼河閱視新築城垣乙巳至盛京自外攘門入還宮丁未定户部年終考核例先是都察院承政祖可法張存仁等疏劾户部承政韓大勲侵盗庫中金銀鞫實擬辟太宗命革職貫其死至是祖可法張存仁等再疏請誅韓大勲又疏言户部職司錢穀其任匪輕現無舊管新收開除實在四柱冊檔年終又無考核之例則收放既無定額同官又無責成此韓大勲窺之已熟所以敢扵侵盜也請嗣後勅户部速立四柱清冊於年終核實稽察以杜弊端則官吏可以肅清而倉庫無由侵尅矣又劾吏部刑部復用贓吏陳七違㫖壞法太宗皆嘉納之五月癸酉脩治道路太宗命睿親王多爾衮饒餘貝勒阿巴泰等董理修治道路之役自盛京至遼河大路兩傍濬壕中間增土髙三尺廣十丈令八家及八旗毎牛录甲兵六十及恭順王孔有徳等屬下甲兵皆赴工給羊六百犒之六月庚申設理藩院更定䝉古衙門為理藩院専治䝉古諸部事是日授土黙特部章京古禄格等二十二人世職各按品級分别授之尋鑄給理藩院印信秋七月壬戌朔諭誡諸王大臣遵行定制太宗命内宏文院大學士希福内國史院大學士剛林等傳諭諸王大臣曰凡親王郡王貝勒貝子公主額駙名號等級均有定制今竟不遵行違棄成憲皆由禮部不嚴加稽察以致茍且陵替如制度有不可行於創行之初即當奏請改正乃方創制時皆稱曰是及裁酌已定又蔑棄之此何心也昔金太祖太宗兄弟一心克成大業今朕創業伊始爾等不能同心體國恪守典常朕復何頼焉諸王等奏曰恭承聖諭罪在臣等若臣等躬行正道誰敢有不奉行者嗣後當各修其身勉力遵行若仍怙惡不悛自當罪及其身矣丁夘諭遣喀爾喀扎薩克圗汗使臣喀爾喀部扎薩克圗汗下使臣達爾漢囊蘇喇嘛等扵三月庚午來朝進獻駝馬綵縀等物至是遣還太宗諭之曰朕以兵討有罪以徳撫無罪惟行正義故上天垂佑將䝉古諸部悉以畀朕今䝉古主察哈爾汗之子現在朕加意撫養爾喀爾喀部當念爾主既在我國即應歸順以安其生反興兵搆怨來侵我歸化城甚非爾分所當為也朕欲平定區宇理應加兵於爾爾亦當以加兵是懼想爾以為奔徃征討所不到之處便可偷安旦夕但爾所能至我師豈有不能至者乎昔金遼元三國之主西伐額訥特珂克東抵朝鮮北及黒龍江南至于海朕今日正與相等爾知罪而來則已否則必不爾宥又諭曰我國行事悉循大義雖興師征討従不加戮使臣頃所言者爾主之咎於爾何尤命賜之食囊蘇喇嘛不勝欣幸更無一語回奏良久曰仰承聖諭當往導吾主愚䝉爾壬申召見新附總兵官沈志祥先是二年九月太宗命内宏文院學士瑚球禮部叅政蔡永年等往石城島對岸予書明守將沈志祥曰朕聞將軍脱皮島之難復集潰卒殺明國黃監軍白副將奪陳洪範兵朕意將軍必率衆來歸専待久矣乃仍猶豫未决耶今將軍欲歸明國則明國皇帝屢有㫖命救朝鮮而將軍違命不救又擅殺監軍及奪陳洪範兵此罪决不爾赦若不速來歸附朕既蕩平皮島豈容爾久據石城朕敕朝鮮收集各處兵船與我軍合力進取事在旦夕彼時歸朕無功歸明無路悔之晚矣曩曽以此意招沈世魁世魁不従今安在哉沈世魁遼東人明總兵官志祥従父我軍征皮島世魁戰死志祥遂收潰衆至石城島索世魁敕印不得乃自稱總兵官朕言非誇為爾等開導爾將軍其熟思之本年二月志祥遣部將吳朝佐金光裕賫疏至盛京投誠旋率領副將八員叅將八員逰擊十六員都司二十員守備三十員千總四十員兵丁及家屬四千餘人自石城島起行至黄古島候㫖太宗遣内宏文院學士瑚球户部承政瑪福塔等勞之扵安山城命重加撫慰設大宴宴之鐵嶺撫順二處任其自擇居住志祥聞命欣感奏言願駐撫順遂發車騎俾移衆安輯其官屬兵民俱給以房屋及一切器物尋以其兵民等屢有逃亡復遣内國史院學士羅碩等傳諭志祥及其部衆曰方爾等來歸時朕駐軍在外是以未及加恩爾等何以遽懷去志現在各邊防兵哨卒周圍駐守去將安之倘被擒戮朕心殊為不忍自今以後勿再逃亡朕當加意愛養爾等也志祥奏曰主上厚恩諄切開示凡逃亡者皆昏庸不知法度之人若良民安肯逃哉是月庚午遣禮部官召志祥至先命承政滿達爾漢姜新等扵五里外迎宴之是日太宗御崇政殿志祥率所部官朝見獻蟒縀布疋等物俱不納賜志祥蟒衣凉帽玲瓏鞓帶貂皮猞猁猻狐皮豹皮裘弓矢櫜鞬雕鞍甲胄駝馬仍賜宴禮部越六日召志祥扵内廷宴之命七家以次更宴及還鎮遣官餞送如初丁丑諭禮部申明禁令太宗諭禮部曰國家創立制度所以辨等威昭法守也若不嚴行懲儆無以垂久逺自後王貝勒貝子犯者議罰官員犯者幽繫三日議罰庶民犯者枷號八日責治而釋之凡出入起坐有違誤者坐以應得之罪一切官階名號已經更定而仍有錯誤者嚴行戒飭之若有效他國衣冠及婦女裝束違制者是身在本國而心在他國也犯者俱従重治罪著為令又諭都察院承政張存仁祖可法等曰爾等果盡忠為國凡有見聞即應據實陳奏則委任庶為有益若禮部承政祝世昌奏請禁止陣獲良人婦女賣充樂户一疏祝世昌豈不知樂户一事朕已經禁革不過徇庇漢人借此立言要譽耳朕扵滿洲䝉古漢人視同一體爾等同心輔國譬諸五味調劑貴得其宜若滿洲徇庇滿洲䝉古徇庇䝉古漢人徇庇漢人是猶鹹苦酸辛之不得其和也爾等回䕶世昌而不劾奏咎在爾等曽子曰吾日三省吾身爾等能如曽子之省察其身則何過之有又諭親王郡王貝勒貝子等曰爾等為朕股肱耳目見朕所行有未當處即當直言進諌朕亦樂扵聞過以便改圗今國家䝉天眷佑爾等亦坐享豐盈其在下之人或有困窮而衣食不足者或有無故寃抑者與其在外嗟怨退有後言何不令困窮之人自言困窮寃抑之人自言寃抑且爾等茍知之亦應入告扵朕若朕知其困窮而不加恩養知其寃抑而不為昭雪是朕之過也至扵舉錯好惡尤當協扵大公若衆人所舉而反惡之衆人所錯而反好之必至變易是非倒置功罪一經敗露即爾等亦身被黜辱所偏好之人尚得在爾左右否古人云越山易越法難爾等豈能自越扵立法之外耶又諭大學士希福剛林學士羅碩等曰朕従來不喜以空言文飾要取虛譽昔漢文帝欲建一臺計費百金以為百金乃中人十家之産遂止而弗建朕謂此亦空言要譽殊不足取朕䝉天眷佑各國臣服財用饒裕當此之際我國新舊人等有困窮無告者若不急加恩飬更扵何時養之人君宵旰勤勞以修治道理財裕國亦為民而已今財物牲畜何者不有若吝惜而不以養人留之何用耶希福等奏曰皇上此言誠萬民之福也前代之君積聚財物未有厯久長存見稱扵後世者惟散財養人乃為聖朝盛事耳又諭侍臣等曰我國家景運方興爾等職在大臣正當為國憂勤以功名自建朕與王貝勒等所行何無一人指陳得失者爾等従前或臨陣不能治兵或所行貪黷經朕加罪者有之亦有因直言進諌而加之罪者乎爾等平日見賢不能舉見不善不能退既不能退矣迨其獲罪又羣起而非議之若扵已無與也夫見賢不能舉則賢者何由而勸見不善不能退則不肖者何由而懲公忠為國之人見其人之賢雖讐猶將舉之見其人之不善雖親猶將黜之今爾大臣中有因戰功而令管旗務及六部承政者亦有雖無戰功因辦事公正令管旗務及六部承政者豈一朝富貴遂忘公正耶名為大臣上不能為國下不能為民國家亦安用此緘口藏身之輩為也又遍諭新舊滿洲䝉古漢人曰爾等有家貧不能娶妻及披甲不能買馬者許陳訴於本管章京本管章京申訴於管旗大臣管旗大臣啟知本管王貝勒等核實給與如王貝勒等力不能給即以奏聞隱匿者罪坐本管官仍許赴户兵二部陳訴䝉古之人赴理藩院陳訴其已給而誑稱未給者追奪所給之物不復加罪朕明降諭㫖若爾等畏威不言是自坐困窮朕無由而知也丙戌更定部院官制先是六部都察院理藩院滿洲䝉古漢人承政毎衙門各三四員其餘皆為􅄁政官止二等至是范文程希福剛林等奏請每衙門止宜設滿洲承政一員以下酌設左右叅政理事副理事啟心郎主事等官凡五等太宗可其奏扵是命睿親王多爾衮更定八衙門官制以阿拜為吏部承政色勒祖澤洪為左㕘政薩璧翰滿珠什哩鮑承先為右叅政理事官四員副理事官六員啓心郎三員滿洲一員漢人二員以下各衙門俱同主事二員以英固爾岱為户部承政瑪福塔吳守進為左叅政塞稜車臣鄧長春徳穆圗為右㕘政理事官十員副理事官十五員啓心郎三員主事二員以滿達爾漢為禮部承政巴延超哈爾為左􅄁政阿頼庫魯克達爾漢陳邦選鄂謨克圗為右叅政理事官四員副理事官七員啓心郎三員主事二員以伊遜為兵部承政祖澤潤穆成額為左㕘政古爾布什葉克舒佟圗賚為右㕘政理事官十員副理事官十六員啓心郎三員主事二員以郎球為刑部承政武達海孟喬芳為左􅄁政布當李雲星訥為右叅政理事官六員副理事官八員啓心郎三員主事二員以薩木什喀為工部承政徹爾格裴國珍為左􅄁政囊努克武善楊文魁為右㕘政理事官八員副理事官十員啓心郎三員主事二員以阿什達爾漢為都察院承政索海多爾濟達爾漢諾顔為左㕘政祖可法張存仁為右叅政理事官六員滿洲䝉古漢人各二員以貝子博洛為理藩院承政塞稜為左叅政尼堪為右叅政副理事官八員啓心郎一員四年正月吏部奏請増設理藩院每旗章京一員従之皇清開國方略卷二十五
