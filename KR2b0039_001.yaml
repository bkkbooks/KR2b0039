body:
  text: 欽定四庫全書皇清開國方略卷一太祖髙皇帝癸未年至丙戍年癸未年夏五月征尼堪外蘭克圖倫城初蘇克素護河部圖倫城有尼堪外蘭者隂搆明寧逺伯李成梁引兵攻古哷城主阿太章京及沙濟城主阿亥章京成梁授尼堪外蘭兵符率遼陽廣寧兵二路進成梁圍古哷城遼陽副將圍沙濟城城中見兵至逃者半被圍者半遼陽副將遂克沙濟城殺阿亥章京復與成梁合兵攻古哷城阿太章京之妻乃景祖長子禮敦之女景祖聞古哷城兵警恐女孫被陷偕顯祖往救既至古哷城見成梁兵方接戰令顯祖俟于城外獨入城欲攜女孫歸阿太章京不從顯祖俟良久亦入城探之成梁攻古哷城其城據山依險阿太章京守禦甚堅數親出繞城衝殺成梁兵死者甚衆不能克因責尼堪外蘭起釁敗軍之罪欲縛之尼堪外蘭懼請身往招撫即至城大呼紿之曰大兵既來豈遂舍汝而去爾等危在旦夕主將有命凡士卒能殺阿太章京來降者即令為此城之主城中人信其言遂殺阿太章京以降成梁誘城中人出而屠之尼堪外蘭復搆明兵併害景祖顯祖我太祖聞之大慟旋勃然震怒詰明邊吏曰我祖父何故被害汝等乃我不共戴天之讐矣明遣使謝曰非有意也誤耳乃歸二祖喪與敕三十道馬三十匹復給都督敕書太祖謂使臣曰害我祖父者尼堪外蘭所搆也必執以與我乃已明使臣曰前因誤害故與敕書馬匹又給都督敕書事已畢今復過求我當助尼堪外蘭築城于嘉班令為爾滿洲國主矣于是國人信之皆懼尼堪外蘭寧古塔諸貝勒子孫至堂子立誓亦欲害太祖以媚尼堪外蘭尼堪外蘭又迫太祖往附太祖曰爾吾父部下人也搆明兵害我祖父恨不能手刃汝豈反從汝偷生人能百嵗不死乎自是恨益深適蘇克素護河部薩爾滸城主諾密納之兄卦喇為尼堪外蘭所譖明撫順所守吏責治之諾密納與同部嘉穆瑚寨主噶哈善哈斯瑚沾河寨主常書及弟揚書俱忿恚相議曰與其倚賴此等人何如投附聰睿貝勒也議定遂來通𣢾太祖椎牛祭天與之盟遣還太祖日夜思復祖父之讐以顯祖遺甲十三副謀伐尼堪外蘭嵗癸末明萬歷十一年也太祖年二十有五夏五月起兵征尼堪外蘭期諾密納以兵自薩爾滸城來會和洛噶善城索長阿之第四子龍敦私語諾密納之弟鼐喀達曰明助尼堪外蘭築城嘉班令為滿洲國主哈達國萬汗又助之爾何附聰睿貝勒耶鼐喀達以告諾密納諾密納遂背盟不以兵來會太祖待諾密納不至仍自率兵往攻尼堪外蘭于圖倫城尼堪外蘭豫知之棄軍民攜妻子遁于嘉班太祖攻克圖倫城而歸秋八月誅薩爾滸城諾密納鼐喀達尼堪外蘭既遁居嘉班越兩月太祖復率兵征之諾密納鼐喀達先遣人往告尼堪外蘭遂棄嘉班奔撫順所迤東河口臺我軍躡其後明邊吏不容尼堪外蘭入邊以兵擊逐太祖望見疑明兵助尼堪外蘭來戰遂收兵駐營是夜尼堪外蘭乘間遁其部下有一人來投曰不戰何也明兵乃擊逐尼堪外蘭不容入邊耳太祖既旋師聞薩爾滸城曾通使嘉班諭侍臣曰若非諾密納鼐喀達往告之尼堪外蘭早成擒矣會諾密納鼐喀達遣人來告曰渾河部之杭嘉及扎庫穆二路勿往侵棟嘉及巴爾達二城我讐也可取其地畀我否則不容爾兵由我邊界行也太祖聞其言怒噶哈善哈斯瑚與常書揚書亦忿甚曰不先破薩爾滸城吾等皆附諾密納矣太祖遂定計佯與諾密納約合兵往攻巴爾達城諭令率兵先戰諾密納不從太祖曰爾以兵仗與我我即先戰諾密納因以兵仗授我軍太祖既得兵仗遂執諾密納鼐喀達斬之其兵衆多逃散有來歸者太祖命悉還其妻孥仍居薩爾滸城其人尋復修築其城以叛甲申年春正月克兆嘉城獲理岱時諸國紛亂滿洲國之蘇克素護河部渾河部完顔部棟鄂部哲陳部長白山之訥殷部鴨緑江部東海之窩集部瓦爾喀部庫爾喀部呼倫國之烏拉部哈達部葉赫部輝發部爭為雄長各主其地互相攻戰甚者兄弟自殘強陵弱衆暴寡爭奪無已癸未年六月覺爾察城阿哈和洛城和洛噶善城章嘉城諸族人忌太祖英武誓于堂子同謀加害夜將半潛至城欲登太祖心動起被棉甲持刀攜弓矢登城望之已樹梯攀援而上見太祖至皆急下遁去逾月章嘉城寶實之長子康嘉借兵哈達萬汗以渾河部兆嘉城長理岱為嚮導劫我瑚濟寨而去分所獲于中途太祖部將安費揚古後賜號碩翁科囉巴圖魯為一等大臣率十二人追及之奮勇衝入殺四十餘人盡獲所掠而還未幾賊乘夜隂晦至上所居欲拔柵潛入有犬名瑭烏哈四顧驚吠太祖持刀叱曰外至者誰也既至何不入爾不入我即出矣爾能攖我鋒耶因以刀柄擊窗􅎉復奮足撼窗為由窗而出之狀既而仍由户出賊乃遁有近侍帕海宿窗下被賊刺死至是太祖率兵征兆嘉城途遇大雪至噶哈嶺路險峻難登諸叔暨諸兄弟勸勿進兵太祖曰理岱我同姓兄弟乃自相戕害反為哈達嚮導豈可恕耶遂鑿山為磴軍士鱗次立以繩束馬曳之踰嶺至兆嘉城下龍敦即前征圖倫城時私阻薩爾滸城會兵者豫使人潛告理岱理岱聞之鳴角集兵登城以待衆復請曰彼有備未易攻姑旋師太祖曰吾固知其有備而來何遽還耶遂督衆圍城攻克之獲理岱宥其死而贍養之夏六月攻克瑪爾墩寨初太祖以同母妹妻噶哈善哈斯瑚及攻克兆嘉城龍敦搆族衆邀噶哈善哈斯瑚于路殺之太祖欲集衆收其骸骨諸族昆弟皆與龍敦同謀無一人往太祖率近侍數人行尼瑪蘭城寶朗阿之次子楞敦止之曰諸族皆讐汝否則汝妹夫何以見殺宜勿往恐有害汝者太祖不聽披甲躍馬登城南橫岡引弓疾馳復回向城下大呼曰有害我者速出聞者皆惴懼無敢出遂收其骸骨以上自御冠履衣服斂而葬之太祖警悟軼倫臨機應變倉猝合度嘗夜寢聞户外有聲披衣起令匿諸子女佩刀持弓矢潛出户伏煙突旁伺之時隂晦無所見少頃賊將逼煙突旁忽有電光照見遂以刀背擊之仆呼近侍洛翰縛之洛翰曰何必縛也宜殺之太祖曰若殺此賊其主必顯與我為難倘加兵于我我衆寡不敵乃佯詢曰爾非盜牛來耶賊以盜牛應洛翰又曰誑言也實欲害吾主殺之便太祖曰果盜牛也遂縱之去又一夕將就寢忽心動遂起衷短甲外襲常服佯如厠值昏黑中莫能辨熟視院門旁籬落缺處隱然有人如探伺者乃控弦以待俄而賊逼太祖射之賊郤身避中其衣驚遁追及之又射貫兩足踣地擊其首昏眩縳而撻之詢其名為伊素諸弟及近侍曰殺之固宜何撻焉太祖曰此非汝所知殺之適以啓釁若其主以兵攻我劫我儲蓄我糧匱則部下叛部下叛則我等孤立何以禦敵且我又何肯以殺人為他人藉口耶遂釋之蓋御物深沉有大度類如此至是親率兵四百征納木占薩木占納申完濟翰以復噶哈善哈斯瑚之讐攻瑪爾墩寨其寨居山之巔勢險峻乃設大牌三蔽矢石並列而進至隘路分其一前行其二繼之近寨丈許路愈隘分三牌相次而攻敵寨飛石檑木齊下前牌被摧軍退次牌下次牌又摧復退于三牌下戰士並集牌不能蔽難仰攻太祖立寨下相去十餘步有斷木長二尺許隱其足發一矢中寨主納申面貫耳復射四人踣之敵兵遂卻太祖引兵遙圍其寨絶彼汲道攻至四日其夜令軍士跣足緣崖而上遂取瑪爾墩寨納申完濟翰奔界藩秋九月攻克棟鄂部翁鄂洛城初章嘉城寶實之次子阿哈納往聘薩克逹路長巴斯翰之妹為妻巴斯翰謂阿哈納家貧不許旋以妻棟鄂部長克徹巴延之子額勒吉後額勒吉往巴斯翰所還至阿布達哩岡為額圖阿嚕部下九賊所殺賊有與阿哈納同名者羣賊相呼聞者傳語克徹巴延克徹巴延曰往者寧古塔阿哈納欲聘之女吾子娶之故被殺也哈達萬汗遣人告克徹巴延曰爾子乃額圖阿嚕部下九賊殺之我擒以與爾復爾讐爾歸附我克徹巴延曰此必寧古塔人誑言耳何不以金帛饋哈達執九賊與我我必倍償其金帛和洛噶善城索長阿聞其語潛遣人紿之曰爾子乃我部下額勒綳額與額克青額所殺爾以金帛與我我當殺此兩人克徹巴延曰哈達萬汗言額圖阿嚕部下九賊殺吾子今云爾部下人殺吾子皆爾寧古塔人誑我也遂成讐怨引兵侵掠寧古塔貝勒所屬東南二路諸貝勒幾不能支與景祖議曰我等同祖所生分居十二處勢渙散當聚族而居共相保守既定議索長阿次子武泰不從曰一處何可居也將不為孳息畜産計乎今不必聚居借兵于哈逹萬汗便哈逹萬汗武泰婦翁也于是借兵攻棟鄂部者再獲其數寨我國本與哈達萬汗互為婚媾聲勢相埒自借兵後乃示弱焉及癸未年哈達兵劫我瑚濟寨我兵擊敗之棟鄂部長曰昔寧古塔貝勒借哈逹兵攻我取我數寨今彼與哈逹國相讐吾等宜乘機攻之用蟒毒淬箭為攻具適其部內亂太祖聞之與衆計曰棟鄂部內亂宜往攻衆諌曰兵未可輕入其境幸而勝誠善倘有失奈何太祖曰俟彼加兵于我何如乘機先發衆乃曰善遂親率兵五百征之其部長阿海巴延聚兵四百于所居齊吉達城閉城以待我兵圍之城垂陷會大雪罷攻命衆先還留十二人以從伏濃煙中城內謂兵已退引衆出太祖邀擊之斬四人獲甲二副會完顔部之遜扎沁廣衮來請曰翁鄂洛吾讐也曽為所縛乞以一旅助我破之太祖念既興兵至此宜乘此戡定一方遂率兵夜馳赴之遜扎沁廣衮有兄子岱度墨爾根密使人通于翁鄂洛城故豫知我軍至收其兵衆入城我軍縱火焚城樓及村中廬舍太祖乘屋巔射城中城中鄂爾果尼潛射太祖傷首貫胄太祖拔箭見敵趨過即以所拔箭從煙突隙處迎射之貫其股應弦而踣太祖被創流血至足猶鏖戰不已敵復有洛科者乘煙焰中潛逼突發一矢射太祖砉然有聲穿鎖子甲護項太祖拔之鏃卷如鉤血肉迸落衆競趨而前欲登屋扶掖太祖恐為敵窺諭止之時項下血湧如注以一手捫創一手拄弓而下二人掖而行忽迷仆諸臣皆大驚相怨咎少蘇裹創迷而復蘇者數四蘇輒飲水凡一晝夜血猶不止裹創厚寸餘乃棄垂下之城而還太祖創愈復率兵攻克翁鄂洛城獲鄂爾果尼及洛科諸臣請誅之太祖曰兩敵交鋒志在取勝彼為其主乃射我今為我用不又將為我射敵耶如此勇敢之人若臨陳死于鋒鏑猶將惜之奈何以射我故而殺之乎遂授鄂爾果尼洛科各一牛録𨽻三百人諸臣皆頌上大度云乙酉年春二月征界藩誅納申巴穆尼初納申自瑪爾墩寨戰敗奔依界藩寨長巴穆尼至是太祖率甲士二十五步兵五十略界藩寨寨內人豫為備無所獲而還薩爾滸棟嘉巴爾逹三城與界藩合兵四百追襲至界藩南太蘭岡之野納申巴穆尼衝突入我步兵中疾馳而前太祖見之單騎還擊納申納申刃已先及斷太祖所執鞭太祖揮刀斷其臂墜馬死復射巴穆尼斃之敵衆逡巡卻立我甲壬曰馬疲甚奈何太祖曰爾等下馬步行佯以弓弰拂雪為拾矢狀徐引馬過嶺飲以鹽水飼以炒麵休息之豫留此為緩敵計也于是我軍先行太祖駐馬納申尸旁其衆呼曰殺其人豈尚欲食其肉耶何不去聽我等收其骸骨太祖乃行顧其衆曰納申與我為難今得殺之即食其肉亦宜太祖念我軍行未逺率七人為伏悉露其胄而立納申部衆見之呼曰汝有伏我已知之矣且呼且卻太祖引兵徐還不遺一騎夏四月敗哲陳部諸路兵于界藩南山太祖率步騎五百征哲陳部值大水命衆還留被棉甲者五十被鐵甲者三十共八十人略地而前有嘉哈地之蘇庫賚呼潛往告知托摩和章嘉巴爾逹薩爾滸界藩五城遂合兵以禦我巡哨官能古德偵諸路兵集疾馳以告由他道突過弗遇太祖率兵遄行遙見敵兵八百餘陳界藩之渾河抵南山尼瑪蘭城寶朗阿之孫扎親桑古哩兩人見敵衆大懼解其甲與人太祖怒曰汝等平日自雄于兄弟鄉黨間今臨陳何懼敵衆反解甲與人耶乃親執纛先進近敵陳下馬驅馬回率弟穆爾哈齊及近侍延布祿烏凌阿直前衝擊奮勇射卻敵衆斬二十餘人敵敗潰爭渡渾河而遁太祖熱甚卸胄不及解甲以手斷其扣坐而休焉後隊兵將乃至皆曰宜乘勝追擊之太祖怒其遲至不應憩未移時復胄率兵渡河登岸與穆爾哈齊等躡敵後斬四十五級復追至吉林崖見敵兵十五人由旁徑來太祖去胄上纓隱身以待射先至者一人貫其脊而殪穆爾哈齊又射殪一人餘悉墜崖死太祖諭延布祿等曰今日之戰以四人而敗八百人之衆此天助我也丙戌年秋七月攻克鄂勒琿城尼堪外蘭伏誅初尼堪外蘭自嘉班奔明撫順所為明兵擊逐不容入邊其族屬及我國素與黨附之人相謂曰尼堪外蘭前為聰睿貝勒追兵所迫幾至喪身往奔明明尚不容且擊逐之豈肯築城嘉班令為滿洲國主乎遂皆背之尼堪外蘭懼攜其子及近屬兄弟數人逃于鄂勒琿地築城居之太祖欲往征以所過諸部皆讐敵慮為梗阻先征蘇克素護河部之安圖瓜爾佳寨破之斬其寨主諾謨琿嗣攻克渾河部之貝琿寨又攻哲陳部之托摩和城遇雷雨震死二卒旋師越數日太祖復率兵往招撫之其衆乞降遂越相鄰讐敵諸部徑攻鄂勒琿城時尼堪外蘭已他往城外有四十餘人欲避兵挾弓矢走前行一人戴氊笠被青棉甲太祖望見疑即尼堪外蘭奮身往追為四十人所環逼衆矢交發太祖身中三十餘創貫胸及肩猶鏖戰不退射殪八人斬一人餘皆竄遁遂攻克鄂勒琿城索尼堪外蘭弗獲斬城中漢人十九擒矢傷者六人深入其矢使傳諭明之邊吏執送尼堪外蘭否則興兵征明乃旋師明邊吏遣人復曰尼堪外蘭既歸我未便執送爾自來殺之可也太祖曰爾等叵測將誑我耶使者又言無事親往秖遣少兵來即執以去于是命齋薩率四十人往尼堪外蘭聞我兵至欲登臺避匿明人不容登臺去其梯齋薩遂斬尼堪外蘭取其首來獻明自此嵗輸銀八百兩蟒緞十五匹通和好焉臣等謹案崇德元年十一月太祖髙皇帝實録告成以滿洲蒙古漢字三體編繕藏盛京翔鳯樓上今內廷尊藏開國實録是也臣等幸嘗伏誦竊見我列祖天誕神靈造邦啓宇積仁纍功發祥之所自我太祖天錫智勇戡亂攻昧柔逺能邇締構之艱難不待鋪張潤色而規模宏逺固已超越千古至其文直事核務尚體要于軼事或有未詳而鴻聲茂實昭布逺近者異邦之人間亦編録雖參以忮心讐吻終莫能誣如明臣黃道周博物典彚記明神宗時事甚詳其建州考一篇有云建州即金别部元代置軍民萬户府國朝分為三曰建州曰海西曰野人而建州居中雄長地最要害永樂元年野人部長來朝已而建州海西悉境歸附設建州等衛所二百餘置都司一以統之官其長自都督至鎮撫有差惟野人以絶逺貢無常期其建州海西定以每嵗十月驗放入貢是時建州衛指揮及子皆以有功賜姓名其弟亦以內附領摩琳衛纍都督同知此建州之始大也正統初建州衛都督為七姓野人所害其弟及長子避之朝鮮失其印次子嗣為建州衛指揮後長子歸建州朝廷剖建州左衛置右衛與二印令分領值額森入冦案額森舊作也先今依通鑑輯覽改正煽誘諸衛殺掠遼東吏民無算景泰中巡撫王翺遣使招諭稍歸所掠復欵關然七姓之亂子孫失其賜敕不得襲官以舍人入貢賚賜大減益失望遂與海西諸部並掠邊境無虛月成化二年遣都督武忠害建州左衛指揮于廣寧以武靖伯趙輔都御史李秉等督師入建州境襲殺過當築撫順清河靉陽諸堡乃請通欵貢朝廷亦欲休息俾建州都督後皆得襲諸從者視先世遞貶一官雖復入貢然時時以報讐為詞往來患苦塞上會大璫汪直用事方幸功巡撫陳鉞揣其意疏言建州結連海西名雖屏蔽實懷他志宜大發兵創之乃以撫寧侯朱永為帥汪直監其軍襲破之建州大忿怨深入甚于往時開原廣寧之間騷然繁動矣居久之其長貢馬請入謝許之復奉貢請襲如故迄正嘉間塞上得息嘉靖二十一年建州糾衆入邊巡撫孫繪禦之失亡頗多無何巡撫於敖減賞致譁復詐殺譁者由此挾忿數入邊遼之東西幾困已復稍輯蓋道周記建州之原起如此其稱官稱長不著主名難可追考又按明臣鄭曉今言載沿邊諸鎮惟遼東最易治優以官賞交市且地饒魚米鹽馬近年撫臣於敖減賜物又設計搆釁因失望嘉靖丁未撫臣胡宗明又殺百八十人遂大恨戊申春結衆深入遼西殺略人畜萬計宗明及總兵戴亷皆罷任其言於敖減賜事與道周所記略同而道周不載宗明諸人所記先後入邊亦互異然其稱易治稱地饒明言當日畫疆分守邊境原未興戎至其稱大恨稱深入尤深斥當日撫臣之慿陵肆虐自啓釁端為罪不容誅也至道周謂我顯祖宣皇帝有膽略值建州都指揮王杲誘殺明清河守將裴承祖等屢為邊患總兵李成梁不能制乃乞宣皇帝率兵討杲往返八日擒之李成梁相宣皇帝狀貌不類常人詭請臨視火攻隂設反機致宣皇帝遇害時太祖髙皇帝方四嵗李成梁不能掩宣皇帝之功哭之盡哀迎太祖髙皇帝及髙皇帝弟厚致餼養髙皇帝稍長讀書有謀略十六嵗始出之建地故兵端動以復祖父讐為辭日與弟厲兵秣馬設險擺塘自萬厯三十四年貢後以邊關勒索無厭遂不復貢屢擁衆慿陵開原邊臣噤悸莫可誰何此道周記明政之不綱邊臣之召禍與實録可互證也又謂我太祖與一弟皆以驍勇雄部中兄弟始登壠而議既則建臺䇿定而下無一人聞者蓋未嘗一日忘父讐也此又道周記我太祖髙皇帝仗義復讐厥初定䇿之大略也綜前後觀之雖其間或傳聞異辭時地不無訛舛然其敘述明臣陳鉞朱永於敖輩之幸冒詐欺李成梁之懷姧肆毒情事厯厯雖庸夫婦豎能辨其非至其云有功云忿怨云不能掩其功云兵端以復讐為辭云未嘗一日忘讐則是我聖朝大有造于明而彼顧狡謀思逞以怨報德固其臣民之衆見衆聞莫能自諱者矣然自尼堪外蘭伏誅以後我太祖猶以罪人既得許明通好冀其悔悟遲之三十又二年而明政無改然後我太祖赫然一怒昭告穹蒼天戈一麾丕基用建于以仰見聖人初無利天下之心而時至義起沛然莫禦夫豈前代創業之主所可規擬者哉皇清開國方略卷一
