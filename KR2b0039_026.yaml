body:
  text: 欽定四庫全書皇清開國方略卷二十六太宗文皇帝崇德三年戊寅八月至四年己卯三月德三年八月丙申前鋒將領武拜等擊敗明兵于紅山口先是四月己未武拜率前鋒八十人往寧逺躡蹤遇哨卒十人生擒三人獲馬十匹而還至是復與沙爾琥達率前鋒兵四十名蒙古兵四十名至紅山口遇明千總二員兵百人擊斬兩千總獲馬二又敗羅文峪兵五百騎獲馬四十一大纛二又敗密雲步兵一百二十人並八隊邏卒盡殱之戊申授舉人生員官階並優免丁役賜中式舉人羅碩常鼐瑚球阿際格弼里克圖王文奎蘇宏祖楊方興曹京張大任于變龍等十名朝衣各一領授牛録章京品級各免四丁一等生員鄂謨克圖滿闢等十五名二等生員鏗特碩岱等二十八名三等生員費齊溫泰等十八名各賜紬布授護軍校品級已入部者免二丁未入部者免一丁癸丑命睿親王多爾衮貝勒嶽託統左右翼軍分道征明太宗命睿親王多爾衮為奉命大將軍統左翼軍以貝勒豪格饒餘貝勒阿巴泰副之貝勒嶽託為揚武大將軍統右翼軍以安平貝勒杜度副之分兩路征明召集出征諸王貝勒大臣等宣示軍律曰爾等臨陳若七旗敗走一旗拒戰者七旗所屬人員俱給拒戰之一旗一旗敗走而七旗拒戰者以敗走一旗所屬人員分給七旗如一旗內拒戰者半敗走者半即以敗走者所屬人員給本旗拒戰者屯駐他所者免罪若七旗未及整伍而一旗拒戰得功者按其功次大小俘獲多寡賞之野戰時本旗大臣率兵下馬立王貝勒等率護軍乘馬立于後當進止以時如有越隊輕敵妄自衝突者奪所乘馬及俘獲人口兩軍相對必整齊隊伍各按汛地從容前進若擅離本隊隨别隊而行擅離本泛由他汛而入及衆軍已進而獨却立觀望者或處死或籍沒或鞭責或黜革或罰銀分别治罪如敵人不戰而遁我軍追之當用驍騎合力馳擊護軍統領止宜領纛整伍分隊以躡其後毋得前進倘追兵遇伏或另有敵兵旁出護軍統領乃親擊之凡大軍起營時務須整肅戎行若有離隊往來尋索遺物及酗酒者俱貫耳喧譁者責懲下營時凡採薪汲水務集衆同行失律者斬軍裝器械俱書姓名馬匹繫牌印烙隱匿他人之箭者罰之盜鞍轡者罪之馬上行裝應整理者本旗人俱立以待之整畢乃行兵入敵境若有一二人私掠被殺者妻子入官仍治本管章京之罪其以妄取糧草被殺者罪與私掠同大軍所至勿毁寺廟勿殺平人抗者戮之順者養之俘獲之人勿褫其衣服勿離其夫婦有不遵者依律治罪宣畢太宗又諭曰征伐非朕所樂聞也朕常欲和而明不從是以興師耳其不抗拒我兵者慎勿殺之不便攜歸者勿加擾害前武英郡王於丙子嵗克明昌平州時所領官兵如漁人入水捕魚擒之以手挾之以脅又復銜之以口其時以貪取獲罪者甚多朕豈欲爾等犯法樂于加罪耶懲其既往正欲警其將來耳常閲古史云夏禹道遇罪人而泣侍臣曰此犯法有罪之人王何為而泣也禹曰堯舜時政教德澤宣布于民故人無犯法令我之泣非為囚也我之政教德澤不如堯舜致有罪人故泣耳朕見爾等有罪亦甚為惻然爾等宜互相勉勵恪遵軍令以行毋或怠玩從事今蒙古漢人朝鮮諸國俱已歸附軍容壯盛爾等勿徒自逞勇力以威懾人蓋爾等為衆所觀瞻若能自處以禮濟之以和則歸附各國見我國強而有德勇而有禮益加悅服矣凡為主帥者臨陳時當念國家付託之重使徒為一已立功而不念兵之死傷軍之敗衄及國之聲名有損非主帥也至軍中議事遇有意見乖謬者即宜面為勸諭毋得緘默不言亦不得於當時故出微辭而事後托辭自解果明言於衆而衆不從始可於還時申理其説也越四日丁巳揚武大將軍貝勒嶽託率右翼軍啓行太宗親送之辰刻出撫近門謁堂子拜纛行禮畢至演武場賜嶽託敕印嶽託率衆行禮畢復召至御前親授方略賜茶畢送里許由懷逺門還宫九月癸亥奉命大將軍睿親王多爾衮率左翼軍啓行上親送之如前儀己未授伊蘇特部降人博琫等世職博琫錫訥布庫和尼齊阿巴泰巴圖魯巴特瑪塞稜托克托輝自伊蘇特部來歸授博琫錫訥布庫和尼齊俱為三等梅勒章京阿巴泰巴圖魯巴特瑪塞稜托克托輝俱為三等甲喇章京九月丁丑定優免人丁例無世職管旗大臣承政準免十丁梅勒章京內大臣參政準免八丁甲喇章京一等侍衛理事官準免五丁牛録章京二等侍衛副理事官準免四丁三等侍衛準免三丁貝勒屬下三等護衛準免二丁冬十月丁酉貝勒嶽託等奏報右翼軍入牆子嶺揚武大將軍貝勒嶽託等遣前鋒將領阿爾布尼等賫疏奏報右翼軍於九月二十二日從明密雲縣東北牆子嶺口拆毁邊牆前進明總督吳阿衡率兵六千來援見我兵已入邊遂率數百人退入堡內分步騎為三隊負嶺立寨俱為我軍所敗時明副將一員率兵二千迎戰談泰旗下德特碩爾兊杜類旗下魯克都瑚里布夾攻之獲馬百駝二十又明守備一員率兵千餘迎戰貝勒杜度督漢軍侍衛李國翰王延祚及恭順王孔有德懷順王耿仲明所屬曹得賢賈世魁常得芳等擊敗之獲馬三十九又喀喇沁部萬丹索諾木擊敗明兵一隊獲馬十三前鋒將領勞薩錫特庫等追擊潰兵獲馬八十大小炮位二十五擒哨卒問之知牆子嶺堅不易拔惟嶺東西兩旁髙處可以越入於是分我軍為四路令護軍統領圖賴率右翼每牛録護軍一名及喀喇沁部下每旗護軍甲喇章京一員從嶺之右側步越髙峯恐圖賴兵少復令貝子芬古及葉臣兩旗護軍騎兵助之未至而圖賴兵已先入攻克十一臺令阿岱恩格圖兩旗固穆郭爾羅斯部長一旗俱離嶺五里自髙山入而恩格圖兵先之談泰都雷兩旗護軍騎兵令距阿岱等十五里於髙峰無邊牆處齊入令巴特瑪率本旗兵會同喀喇沁巴林敖漢奈曼烏喇特阿嚕科爾沁諸部兵漢軍並孔有德耿仲明屬下兵俱從邊城東小門平坦處舉火炮竪雲梯攻之時明兵俱于邊界平坦處拒守巴林阿玉什部下索爾古先登諸軍遂相繼攻入又軍中獲海龍城邏卒一名訊係明守備遣來議貿易價值者縱之使歸且令傳諭海龍守備曰前聞爾邊城云有邏卒十八名為我軍所殺又殺爾關上貿易良民此豈我軍識其人而殺之耶且長城邊內屬爾明國邊外乃我大清國之地因入我地而殺之耳前緣爾等貿易相好故進邊時不加擾害直入昌平今又避爾地從牆子嶺入豈以爾關險阻而不入耶以此思之相好如初乃爾之幸倘爾等稍懷變志禍難釋矣戊戌睿親王多爾衮等奏報左翼軍入青山關奉命大將軍睿親王多爾衮等奏報左翼軍於九月二十八日自董家口東二十里青山關西二里許步登山岡由邊牆缺處率兵前進青山關嶺峻牆堅問之土人云關內有明兵二百防守聞我右翼軍至已于二十五日往援我軍乘其無備毁牆而入莫敢攖鋒青山關董家口青山營三處人民棄城逃走執其人問之云青山關東二十里榆木嶺口有步兵二百與董家口兵亦以我右翼軍至同往救援是以缺兵防守又問流賊消息云在河南等處肆掠今年大水禾稼半收祖大夀及其兵馬已調往西去又明人自山海關遣哨卒五名馬八匹來探我右翼軍蹤迹回至蘇布地杜稜城為我軍所獲問其人云山海關九門今嵗被水衝壞止餘一門我軍出征的信彼于十九日由山海關報至三屯營陳總兵遣八人往喀喇托果迎探與我前鋒兵夜遇于蘇布地杜稜城生擒六人獲馬七匹問知我右翼軍于二十四五等日進邊山海關髙太監已調入關內矣是日朝鮮國王李倧以違悮軍期遣陪臣領議政崔鳴吉賫咨赴部請罪部臣以聞太宗遣承政英固爾岱滿逹爾漢傳諭曰朝鮮國王向來傾心歸服朕既以非常之恩禮待王王亦應以非常之忠順報朕不意負恩至此試思爾國兵即不來曷嘗沮朕征明之役但自古以來如爾歸降之人違誤軍期或問重罪革王爵者有之或從輕罰鍰者有之朕既格外施恩必不降爾王爵姑俟征明之諸王貝勒回時降旨議罪此時罪之輕重尚未可預定也己酉太宗親統大軍征明分三路繼進先是九月壬申太宗諭諸王大臣等曰明人聞我二路進兵則山海關以東寧逺錦州兵必往西援朕將率鄭親王濟爾哈朗及貝子大臣等親統大軍前進山海關一帶牽制其援兵豫親王多鐸亦令同行其前罪姑俟班師時議之前以送左翼軍啓行不至禁之不得出府門至四年五月降為貝勒並降敕徴恭順王孔有德懷順王耿仲明智順王尚可喜兵令各攜紅衣炮及一切火器戰車齎兩月糧至盛京啓行丁亥太宗出懷逺門至演武場閲視漢軍大臣石廷柱馬光逺兩旗兵令試炮較射角抵畢賜宴冬十月丁酉命石廷柱馬光逺運炮位火器等具先行己亥太宗率鄭親王濟爾哈朗豫親王多鐸等統大軍向山海關進發辛丑次彰武臺口諭從征王貝子及諸大臣等曰凡我大軍全師征討駐營時每旗一營立五門若兵半出則立三門其往來牧馬運取薪水之人俱由營門出入不許擅入軍帳任意穿走恐有逃亡盜竊不軌之人難以稽察又領旗王貝勒以下及一切人等或係奉召而來或至御營奏事進外營則從南門入進內營則從東西門入如從他門及無門處擅入者從重治罪甲辰大軍至渾河科爾沁部土謝圖親王巴達哩卓哩克圗親王武克善扎薩克圖郡王布塔齊巴圖魯郡王滿珠什哩等率十旗兵來會喀喇沁部落古嚕斯希布杜稜率四旗兵來會各獻駝馬酌納之丙午駐軍哈喇蘇遣前鋒將領沙爾琥逹等率前鋒五十人往明義州一帶捉生生擒八人還己酉車駕至托衮博倫行獵命鄭親王濟爾哈朗貝子碩託各率本旗護軍及喀喇沁兵從前屯衛寧逺中間進發豫親王多鐸貝子博洛各率本旗護軍及土默特兵從寧逺錦州中間進發太宗親統大軍從義州一路進發辛丑次敖穆掄命索海率每旗甲喇章京一員兵二十名及前鋒全軍往圍大凌河兩岸十四屯堡捉生壬子入明邊駐軍義州是夕集衆諭令軍中馬匹刈草於營內飼之不許放馬營外夜間鳴金巡警毋或稍怠癸丑渡大凌河至戚家堡命孔有德耿仲明尚可喜及石廷柱馬光逺等以神威將軍炮攻克五臺乙卯大軍至錦州南遣使諭屏城藩城開城守臣曰爾等三城每城止留官一員兵二十名駐守其餘將士俱至遼陽沃赫渡口會師欲將俘獲人口牲畜交與爾等攜回丙辰豫親王多鐸等自軍中遣扎塔奏報臣等未入邊時先遣鄂羅塞臣往邊外擊明哨卒殺三人生擒一人本日又遣扎珠古往擊哨卒生擒二人又遣翁克喀爾塔喇往截道路生擒六人聞邊外有駐牧蒙古是夜遣扎珠古往探竟無蹤迹遇車五輛獲人一名牛五頭夜入邊時先遣塞赫嶽多惠前行于邊外遇燒炭人訊之云桑阿爾齋舊居之大興堡為移營蒙古所據毫無防備於是往收其堡外牲畜次竪梯攻入有守備一員男子二百俱戮之獲婦女幼丁共七十馬十二牛四百驢二十九羊三百六十七是日明總兵祖大夀遣二人執令箭赴錦州豫親王多鐸生擒之並其甲胄櫜鞬來獻丁巳孔有德等以炮攻戚家堡石家堡克之俘獲人口三百一十七牲畜百四十有竒次日命孔有德等俟大軍移營後以炮攻錦州城西臺方欲進攻臺內炮藥自發臺壞克之十一月庚午自中後所班師大軍至錦州南之次日太宗以鄭親王濟爾哈朗兵力寡命豫親王多鐸率本部兵往中後所助之十一月癸未朔多鐸軍將過中後所會明總兵祖大夀往援北京以兵來襲多鐸軍後土默特部鄂木布楚琥爾及甲喇章京翁克等率衆先退前鋒將領哈寧阿等不能敵且戰且退貝子博洛向前迎擊始却之多鐸收軍不戰夜至濟爾哈朗營濟爾哈朗聞之怒次日同多鐸率兵至中後所大夀兵懼不敢出乃還營是日石廷柱馬光逺等攻克李雲屯柏士屯郭家屯開州井家堡俘獲人口七百有二馬騾四十有六牛二百有十驢百三十有七羊百十有六孔有德等招降大福堡又攻克一臺獲蒙古漢人男婦三百七十有九牲畜稱是即以賜孔有德等辛酉大軍入山海關壬戍至連山丁卯太宗統兵至中後所見祖大壽收兵入城遣人賫敕諭之曰自大凌河别後今已數載朕不憚辛苦而來甚思將軍出城一見至于去留終不相強若曩則釋之今乃誘而致之何以示信于天下乎將軍與我角勝為將之道應爾朕決不以此介意將軍亦勿以此自疑也豫親王多鐸遣阿爾津穆福扎塔奏言距中後所四十里山岡與祖大夀兵遇兩相誘戰殺敵三十名次日再遣人諭大夀皆不答己巳鄭親王濟爾哈朗奏克模龍關及五里堡屯臺俘其人口牲畜庚午自中後所班師出明邊至六洲河庚辰至圖爾根河遣外藩蒙古各歸部漢軍由平路行太宗行獵至竒爾哈納丙戍車駕自撫近門還宫十二月己丑朔賜朝貢諸外藩宴時厄魯特部尹扎胡圖克圖下額爾格布什格隆宰桑等十七人土默特部武巴什巴彥蒙庫等四十七人蘇尼特部騰機思下巴克察爾塔布囊等十五人鄂爾多斯部濟農下武巴什等十二人烏珠穆沁部多爾濟濟農下竒塔特塔布囊等三人均以貢駝馬朝見次日黑龍江薩哈連額駙巴爾巴齊之弟瑚爾布爾屯費揚古沃哷屯武第堪烏魯蘇屯莽古珠等五十一人索倫部博木博果爾透特等九人呼什哈禮氏納木達哩等十人巴雅喇氏滿第特喀下二人布克圖禮等五人賴達庫等四人均以貢貂朝見太宗御崇政殿賜宴命七家以次宴之賜綵縀銀兩衣服鞍馬等物有差癸丑編新降漢人户口先是恭順王孔有德等以炮攻五里河臺壞其兩角臺上人懼守備李計友李惟觀率衆降皆編為民户至是復賜陳獲守備藺某百總韓自明貉裘帽鞾等物其攜來漢人編入户口共為五十一屯各賜布匹等物崇德四年春正月己卯封沈志祥為續順公庚午太宗御崇政殿賜新附總兵官沈志祥宴越十日封志祥為續順公給與誥命及印賜紅寶石嵌兩東珠金頂貂帽金鑲圓片玉帶鞍馬等物後敘其屬下有功官員沈永忠許天寵等二十八人各授世職見十月癸丑壬寅太宗親征明松山丁酉命武英郡王阿濟格輔國公碩託等率將士征明先期遣漢軍大臣石廷柱馬光逺率兩旗兵預運炮位前行越四日太宗親統大軍出懷逺門西發丙午武英郡王阿濟格等遣納海奏報前至大凌河東四里屯張剛屯寶林寺旺民屯于家屯成化峪道爾彰等七屯揚言用紅衣炮攻擊臺上人畏懼俱已歸順并籍俘獲人口牲畜銀兩數目以聞太宗命調屏城藩城開城守臣率本處兵護送俘獲人口還是日奈曼部逹爾漢郡王衮楚克巴圖魯烏喇特部圖巴鄂班巴克巴海扎嚕特部桑噶爾內齊穆彰四子部伊爾扎穆巴林部滿珠什哩翁牛特部達爾漢岱青宰桑武巴什等率十三旗來會於翁啓爾琿庚戌大軍至松山命恭順王孔有德等以紅衣炮擊松山城東隅山臺臺上藥發守臺辨兵俱被焚其路旁二臺俱招降之漢軍左翼石廷柱以駮擊松山南樓臺毁其堞臺兵不能禦守臺官王昌功率四十五人降右翼馬光逺以炮攻松山西南角臺守臺官楊文顯率十一人降壬子太宗登松山南岡相度城垣形勢指示孔有德等曰城南門中間以孔有德兵右面以耿仲明兵左面以尚可喜兵俱用神威將軍炮攻之左右兩處馬光逺石廷柱各以紅衣炮協攻又兩旗漢軍各移紅衣炮二位攻取城西南隅臺破臺後仍移回各分汛地二十五日四鼓移炮前進五鼓攻擊俟城堞已壞滿洲兵可竪梯登城癸丑孔有德等各遵旨於四鼓移炮前進五鼓攻擊松山兵出城迎戰為我軍射退入城於是用炮攻至未時城堞盡毁城垣猶存明副將金國鳯死守用草木填其頺處以為捍蔽命諸將竪梯攻城諸將俱踴躍爭先禮親王代善以日暮請俟明日再攻太宗從其言召諸將還諸將及孔有德等皆謂宜急攻取而是夜松山城中於城南攻毁處潛以繩繫木覆之以土比明堵築已固我軍竪梯將登其城堞毁處捍蔽甚堅不能入親軍真特先登陷于陳太宗集諸將復議攻城之䇿皆謂必能攻克但炮子火藥已用大半宜遣人速取於是遣官八員率兵回盛京運取炮子火藥命武英郡王阿濟格貝子尼堪洛託等率四旗護軍還守塔山連山孔有德等奏請穴地攻松山城從之三月庚辰敗明援兵於錦州釋松山圍是月戊午朔明太監髙起潛總兵祖大夀自寧逺遣官三員率兵九百名船十隻由水路來援杏山我前鋒兵遇其後隊擊殺五十人獲船一甲四十乙丑復命納海瑚密色索琿等馳略杏山獲牛羊四百石廷柱馬光逺等以炮攻觀民山臺降其男婦十八人丁卯敕諭杏山松山官民曰爾等審時度勢危亡之禍豈不知之所冀幸者我師之不久即退耳若不速來歸命大軍久駐誤爾農時絶爾糧運縱今嵗或可茍延明嵗決無生理彼時外援不至城中食盡雖悔無益也己巳移營松山岡一里許駐軍再以敕諭松山城中官員壬申盛京運炮子火藥至以紅衣炮移近松山城攻之丁丑太宗召大學士范文程希福剛林等諭之曰朕夜夢皇考聖顔不懌向遇此等夢兆攻取城邑皆不能得今雖攻松山亦必難得爾等試驗之己卯鰲拜丹岱等率獲軍沿錦州城馳略殺二十人獲牲畜百八十有竒還時布延塔布囊率每旗親軍護軍十人阿爾薩蘭率滿洲兵四十名敖漢奈曼扎嚕特等部兵一百二十名先後駐守錦州西北界邊外烏欣口髙起潛祖大夀於丁丑日揀選蒙古漢兵各三百名令松山副將楊震祖克勇錦州副將徐昌永杏山遊擊李得維領之從邊外趨錦州庚辰黎明經烏欣口阿爾薩蘭等擊敗之生擒楊震及二人殺八十四人獲馬一百五十遣人奏捷太宗親率四旗護軍馳往錦州縱兵攻其山寨敗之沿山搜剿復分兵剿殺兩夜其逃入臺者以紅衣炮攻之陳斬徐昌永生擒祖克勇及守備一員共殱明兵三百十一名獲馬四百有竒以所獲馬匹分賞四旗護軍並賜將領以下馬各一我兵時分三路穴松山城有錦州蒙古兵三百來援乘夜入城我軍不能復攻遂罷攻城之議令孔有德石廷柱等各率所部兵還盛京車駕自松山還至錦州西北駐營仍遣四旗騎兵往助武英郡王阿濟格駐守塔山阿濟格尋率滿洲四旗及蒙古四旗往略連山獲人口馬匹共千計還至義州南山岡會於御營皇清開國方略卷二十六
