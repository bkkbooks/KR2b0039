body:
  text: 欽定四庫全書皇清開國方略卷二十一太宗文皇帝天聰九年乙亥十月至十年丙子四月天聰九年冬十月己卯以書諭明守邊諸臣先是都司陳錦諸生張文衡先後奏言方今朝鮮賔服漢土嚮風逺方投誠者接踵於道兵力日增國威日振皇上宜應天順人進取中原速成大業二月戊子太宗諭刑部承政髙鴻中文館覺羅龍什等曰凡進言者宜從國事起見或朕所行悖道政治有失或多殺無辜當隨時直諫此等真心為國之人朕當識之不忘近見漢官及諸生等不揣事勢紛紛以興師征明為言不知降衆未及撫綏人心未及收輯城郭未及修治雖勞師動衆無益也大兵一舉如何攻取攻取之後如何安輯爾等酌議疏奏以聞次日沈佩瑞奏請屯田廣寧閭陽造舟挽粟為萬全之計太宗是之八月貝勒多爾衮等自察哈爾旋師道經沙河堡因以上命諭明沙河堡參將曰我皇上征察哈爾時因爾不匿察哈爾財物盡數獻出是以當時進兵宣大軍威震叠獨留爾堡此畨師行過此皇上又命勿犯爾堡恩莫大焉今爾可以貨物互市沙河堡參將喜曰我視爾主與我主無異今蒙兩次不害我沙河堡之恩無以為報謹獻五爪龍縀備御屏之用因各出財物互市至是太宗命納海鄂謨克圖巴雅超哈爾喀濟海錫瑭阿彰屯鄂里喀率每牛録下護軍各一名往明邊界喜峯口潘家口董家口等處齎書曰滿洲國皇帝致書於明國執事大臣向日用兵原非朕之本意邊外葉赫無端啓釁爾朝廷乃力助之與我國遂多仇隙雖然朕見百姓之流離死亡心甚惻焉比年以來遣人致書議和不啻數次而爾朝廷竟無一言相報是爾國人民之流離死亡非朕之咎乃爾君臣實階之厲夫朕欲和之心不過為百姓故耳今後凡我大軍所至有敢抗拒戎行者殺之逃匿山林者俘之若安居不動輸誠款附者其室廬田産秋亳無犯此畨進兵斷不似從前輕返也比致書還擊敗明沿邊哨卒斬百餘人生擒一人獲馬三匹十一月丁未朔授土默特部來歸頭目世職特穆祿幹岱俱土默特人後屬察哈爾居殺虎口大軍至即來歸附授特穆祿三等甲喇章京幹岱牛録章京並各加襲三次癸亥申定從獵禁令太宗率大貝勒代善貝勒阿巴泰多鐸阿濟格領兵三千出撫近門往獵長嶺次日至福爾堅地有從卒六人擅奪屯民柴草各鞭三十丙寅諭從獵者曰凡遇野豕及熊勿射但向圍內驅逐若遇虎一面奏聞一面躡其踪朕與諸貝勒已射之獸從人尾追勿因此獸脫走而奪他人所射之獸違者官為察驗該管各汛章京務宜申明約束行獵長嶺三日末雅湖三日䝉古莫太宗射洛科一日鳩緑二日哈逹二日八乃還殪虎四鹿􅝤野豕共百二十有是月賜恤征明寧逺陳亡將士蘇逹喇蘇爾德布延阿爾布尼沙爾琥逹昻古鼐鄂碩錫特庫卦爾察尼堪拜山等互錦州生擒十一人獲馬牛騾驢共二十五先還布哈逹布囊阿濟拜哈坦巴圖魯訥們阿爾薩蘭武納漢臾塞等征寧逺生擒七人獲馬四十牛一百一十二當我軍旋自寧逺次日出邊六十里明兵千人躡追布哈塔布囊率軍校圖勒蓀巴鍾莽塞岱等殿後力戰沒于陳至是並賚所俘獲又賜恤銀四百兩二百兩一百五十兩有差十二月丁酉祭告太祖山陵太宗諭貝勒大臣等曰自古帝王凡國有吉慶諸事俱有祭告之典今䝉古諸國盡歸一統又獲傳國符璽當祗遵典禮用昭告於皇考在天之靈於是率貝勒大臣等躬詣太祖陵焚香獻爵畢祝冊成禮而還甲辰內外諸貝勒合辭勸進請上尊號太宗不允先是九月辛酉都元帥孔有德總兵官耿仲明同日奏言臣觀自古受命之主必有受命之符厯代玉璽傳自漢代距今二千餘年今因聖武布昭天畀我國是天賜九五之尊而享天下之福無疑也伏願順時合天早集大勛以慰臣民之望冬十月戊寅朔管漢軍大臣石廷柱率漢官等奉表稱賀云皇上興順天應人之師獲鎮國傳家之寶禎祥已見圖籙應歸臣等久沐洪恩欣逢盛事謹拜手而揚言更齊心而入告伏願奉若蓍蔡頒示臣民符節逺合於百王詔誥通行乎萬國懸之象魏一人開有道之基傳示雲礽千載鞏無疆之業臣等謹奉表稱賀以聞太宗覽奏曰諸臣所言誠是朕亦知上天眷佑示以上瑞但慮才德涼薄恐不能撫民圖治以祗承天寵耳至是諸貝勒大臣令文館儒臣希福剛林羅碩禮部啓心郎祈充格奏言上功德隆懋克當天心四方慕義之衆延頸企踵喁喁嚮風前者臣等廣集衆謀合詞陳奏請上進稱尊號上謙德彌隆辭以未知天意不允衆請必待上天垂佑式廓疆圉大業克成之時然後郊禋踐阼躬受鴻名臣等伏思衆望不可以久虛大命不可以終讓今察哈爾舉國來歸又得厯代玉璽天心默佑大可見矣宜早正尊號以承大統太宗曰今雖諸國來附兼得璽瑞然大業尚未底定也大業未定預建大號非所以仰答天貺譬如諸臣經朕擢用不待朕命輒自尊大亦朕所不許也固辭不允是晚滿漢䝉古諸大臣畢集諸貝勒復遣希福等再三陳請太宗仍不允天聰十年二月辛丑閲漢軍太宗出閲石廷柱所管漢軍分騎兵為一隊步兵為一隊御演武場騎兵鳴炮一俱下馬分為八隊列旗纛陳軍容步軍不動鳴炮二諸將詣上前行禮賜茶並賚將士銀兩有差三月辛亥更定內三院初文館職司翻譯經史記注政事分為兩直天聰九年十二月太宗諭記注儒臣曰凡外國文移及管䝉古諸貝勒往來迎送獻酬贈答俱宜詳慎記載毋有闕遺至是改文館為內三院一名內國史院記注上起居詔令收藏御製文字凡用兵行政六部所辦事宜外國所上章奏俱令編為史冊並纂修厯代祖宗實録撰擬郊天告廟祝文功臣誥命諸貝勒冊文一名內祕書院撰與外國書及上賜敕書並諭祭文録各衙門奏疏及詞狀一名內宏文院注釋古今政事得失進講御前侍講皇子並教諸親王頒行制度乙卯築噶海城遣貝勒阿濟格阿巴泰管旗八大臣率官兵往噶海築城尋命大臣拜音圖談泰額駙達爾漢宗室芬古等往閲之並令築臺軍士器械有損壞者換給之時內院諸臣倣明制擬新築開城門名曰揚威昭德永定興化定逺太宗曰凡事當顧名思義無取矜誇興之揚之定之在天不在人也更其名曰鞏固門靖逺門鎮西門庚申征瓦爾喀諸將奏捷先是九年六月武巴海荆古爾岱征瓦爾喀師還後十月癸未復發兵征之每旗派官二員每牛録兵五名漢軍二名分八旗為四路兩旗合進一路兩黃旗武巴海為帥以昻金謨默里叟塞鄂屯伊里布蒙格副之率兵二百九十七名由額赫庫掄額勒約索二處進取其地壯丁七百五十人兩紅旗多濟里為帥以方金布爾薩海雅爾堪聶努克瑚什副之率兵三百五名由雅蘭錫琳呼葉三處進取其地壯丁七百五十七人兩藍旗扎福尼為帥以特穆祿諾穆齊多蘭託密善塞格副之率兵二百九十八名由阿庫里尼滿二處進取其地壯丁四百八十人兩白旗武什塔為帥以瑭糾和勒多拜斯哈爾瑚新泰滿岱宜爾海副之率兵三百三十七名由諾囉阿萬二處進取其地壯丁一千一十四人仍各攜鄉導人以往出征主帥各授軍律一道其應取壯丁及鄉導人姓名俱載四主帥軍律中武巴海武什塔軍律內增一款云烏扎拉部即天聰六年武巴海征服者百壯丁家勿得侵擾並往招伊兄弟塞亨布克沙等之現居寧古塔者啓行之日兵部承政徹爾格伊遜率出兵大臣進見太宗諭曰此畨馬匹較前肥壯自京城以至出邊須令緩行休息既久即可兼程以進四路兵或有脫逃者回時當記其數爾多濟里所住之地島嶼甚多有可取者造船取之如不可取當識之以為後圖至其中有從我國逃去者可遣人往招之諭以昔時爾等逃亡因年嵗不登之故今諸䝉古俱傾心內附爾等宜速來歸如此開諭自當輸誠恐後也諭畢遂行至是武什塔等奏言八旗將士共俘獲壯丁一千一百六十名婦女一百四十口馬三百三十七牛百八十所獲貂狐猞猁猻等皮及人參無算比還命禮部官迎宴於五里外論功擢武巴海鄂屯等世職並賜諸將士人口馬匹貂皮布匹有差夏四月庚辰考察邊將太宗召駐守邊疆年滿各官至盛京察其逃人船隻曽否捕獲城垣器械曽否修整分别功罪海州河口守將伊勒慎莽鼐丹達禮獲逃人一百九十二名船三十隻蘭磐守將喀爾喀瑪清善寧固塔薩哈連獲逃人一百六十八名船四隻蓋州守將雅什塔扎努齊薩格木布祿棟阿密瑚什察罕碩塔齊爾格申圖里海塞等獲逃人二百六十名此三城俱稱職賞馬一匹鹻場守將彰什巴獲逃人一百三十二名岫巖守將嘉木蘇獲逃人百名船三隻海州守將富岱獲逃人一百四十八名船八隻牛莊守將哈爾薩獲逃人三十九名船二隻東京守將哈囊阿武爾噶納等獲逃人二百九十名此五城俱循分供職無賞罰耀州守將英格訥曹光弼興京守將瑚什塔豐阿鄂尼喇王元忠通逺堡守將珍楚肯王可代鞍山守將瑚鈕瑪福等坐器械不修各圈禁二日擢伊勒慎世職一等乙酉太宗文皇帝受尊號建國號曰大清改元崇德時外藩䝉古十六部四十九貝勒都元帥孔有德等並以請上受尊號來朝四月己卯大貝勒代善貝勒濟爾哈朗多爾衮多鐸嶽託豪格阿巴泰阿濟格杜度額駙揚古利八旗大臣談泰宗室拜音圖葉克舒葉臣阿山伊爾登達爾漢宗室芬古蒙古八旗大臣六部大臣都元帥孔有德總兵官耿仲明尚可喜石廷柱馬光逺外藩䝉古貝勒察哈爾部額爾克孔果爾額哲本年正月尚公主為固倫額駙圖巴濟農天聰八年來歸科爾沁部土謝圖濟農巴達哩奧巴之子卓哩克圖台吉武克善追封忠親王宰桑之長子秉圖貝勒洪果爾納穆長子賽扎薩克圖杜稜布達齊奧巴之弟達爾漢巴圖魯滿珠什哩武克善之弟喇嘛什希奧巴從凡圖美之子穆齊天聰三年偕喇嘛什希來朝伊勒都齊棟果爾明安之子扎賚特部達爾漢和碩齊䝉衮奧巴之叔昻安伊勒都齊來朝年月無考杜爾伯特部達爾漢台吉塞稜奧已從弟郭爾羅斯部哈坦巴圖魯固穆奧巴近屬伊爾登布木巴奧巴從弟敖漢部額駙班第塞臣之子索諾木杜稜塞臣之兄奈曼部衮楚克巴圖魯額森偉徵諾顔之子巴林部滿珠什哩台吉色特爾兄子阿玉石台吉天聰二年隨色特爾來歸土默特部鄂木布楚琥爾格根汗之孫墨勒根台吉索諾木天聰三年來朝古英塔布囊賡格爾天聰九年與善巴同領喀喇沁旗務塔布囊善巴諾木圖之子扎嚕特部達爾漢巴圖魯色本都喇勒諾顔之子內齊忠圖汗之子瑚弼爾圖忠圖汗之弟喀巴海偉徵天聰二年陳斬察哈爾台吉噶爾圖俘七百人來獻賜號偉徵岱青瑚弼爾圖之子天聰三年隨父來朝際爾哈朗色本族弟青巴圖魯瑪尼色本之弟四子部達爾漢卓哩克圖鄂木布諾顔秦第三子墨勒根台吉伊爾扎穆諾顔泰第四子阿魯科爾沁部達賚楚琥爾昆杜崙岱青子穆彰台吉違賚之子翁牛特部遜杜稜杜稜汗長子額爾德尼棟岱青杜稜汗第三子班第偉徵杜稜汗第四子達拉海宰桑杜稜汗第五子喀喇齊哩克部噶爾瑪台吉遜杜稜族弟阿喇納諾木齊噶爾瑪之弟喀喇沁部古魯思希布蘇布地之子塞稜左翼部長隨蘇布地來歸塞臣來朝年月無考萬丹偉徵蘇布地之弟圖里瑚馬齊蘇布地之叔天聰二年來朝烏喇特部圖們達爾漢鄂木布元太祖弟哈薩爾裔賴哈之孫伊勒登和碩齊塞稜元太祖弟哈薩爾裔巴喇賽之孫額爾赫圖巴亦巴喇賽之孫三人俱于天聰七年來歸等恭請上稱尊號貝勒多爾衮捧滿字表文一道土謝圖濟農巴達哩捧蒙古字表文一道都元帥孔有德捧漢字表文一道率諸貝勒大臣文武各官跪進太宗曰爾貝勒大臣等以朕安內攘外大業洊臻宜受尊號兩年以來合辭勸進至再至三朕惟恐上無以當天心下無以孚民志故未俞允今重違爾等意堅辭不獲勉從衆議朕思既受尊號當益加乾惕憂國勤民有所不逮惟天佑助之諸貝勒大臣皆歡忭成禮而退庚辰禮臣以上尊號禮儀具奏擇吉於四月十一日壬午太宗齊戒三日乙酉黎明親率諸貝勒大臣祭告天地乃受寬溫仁聖皇帝尊號建國號曰大清改元為崇德元年先築壇于天壇之東備大駕鹵簿太宗由中階升壇御金椅諸貝勒大臣左右序列行三跪九叩頭禮左班貝勒多爾衮科爾沁部土謝圖濟農巴達哩捧寶一貝勒多鐸豪格捧寶一右班貝勒嶽託察哈爾部額駙額爾克孔果爾額哲捧寶一貝勒杜度都元帥孔有德捧寶一各以次跪獻上受寶于是貝勒大臣捧三體表文立于壇東宣示于衆又于盛京城東營建太廟遣額駙揚古利內院官希福等祭告太祖山陵丙戌追尊始祖為澤王髙祖為慶王曽祖為昌王祖為福王追封伯祖禮敦巴圖魯為武功郡王恭上太祖尊諡曰承天廣運聖德神功肇紀立極仁孝武皇帝太后尊諡曰孝慈昭憲純德真順成天育聖武皇后廟號太祖陵曰福陵太廟前殿安奉太祖太后神位後殿正中安奉始祖神位左安奉髙祖神位右安奉曽祖神位左末安奉祖神位皆南面右末東向安奉伯祖禮敦巴圖魯神位設黑色太牢少牢一切祭物太宗率諸貝勒大臣詣神位前祭告行禮又追封功臣費英東為直義公額亦都為宏毅公配享太廟定宫殿名大門為大清門東為東翊門西為西翊門大殿為篤恭殿正殿為崇政殿中宫為清寧宫東為關雎宫西為麟趾宫次東為衍慶宫次西為永福宫臺東樓為翔鳯樓臺西樓為飛龍閣丁亥頒詔大赦羣臣上表稱賀內院官宣諭曰寬溫仁聖皇帝敕諭朕以涼德懼弗克纘承丕緒是用戰兢今祇告天地祖宗之靈膺受尊號爾內外諸臣當體天工人代之義同心輔政以翊贊朕躬現在立綱陳紀次第舉行諸臣果能各奏爾功朕當隆以爵賞尤在正已率屬撫衆恤民庶幾上合天心下定民志如此則君臣一德庶績咸熙我國家無疆惟休天益佑助之矣布告中外咸使聞知諸貝勒大臣奏曰聖諭及此天下萬世之福也是日內院官奏御用儀仗數目太宗曰儀仗止以肅觀瞻非有益于國有利於民也其酌量裁定以聞己丑諭朝鮮國王以伐罪師期先是九年十月朝鮮國王李倧遣侍郎朴魯來朝太宗召至內殿出所獲察哈爾玉璽示之魯驚駭稱賀曰真天賜之寶也賜鞍馬銀幣遣還十年二月太宗諭禮部備禮儀遣户部承政瑪福塔往弔王妃喪並令承政英固爾岱齎書同往備言一切事宜又八貝勒外藩四十九貝勒俱以請上尊號致書朝鮮王八貝勒書曰滿洲國大貝勒等書奉朝鮮國王我貝勒文武大臣議欲應天順時頌揚號前年具奏上德勸進尊上以謙德拒而弗納今嵗春正䝉古各部貝勒俱來朝賀復合詞勸進上曰爾等皆吾子弟朝鮮國王亦吾弟也宜令知之我等仰體上拳拳友邦之誼故遣使相告以我等度之王亦念上恩德浹于人心兵威臨于絶城大勳克集嘉况肇臻即親來慶賀禮亦宜之今敵使至即速遣親近子弟前來勸進王其以為何如䝉古諸貝勒書曰滿洲國外藩諸貝勒奉書朝鮮國王我等受明國厚忍二百餘載祇因明國官吏貪黷貨財䝉蔽君皇帝仁上以致將懦兵弱覆地喪師今我滿洲國我等各智兼全恩威並濟照臨在上如日方升念恩德咸部散亂無統是用誕敷寧我土宇我等各部貝勒與招徠撫育我羣黎奠上恩各暨軍民人等感激驅使即蹈白刃赴湯火亦所不思捐軀報劾如有天眷攸辭現在朝賀來京稔知歸勸上進稱尊號以國用遣使告聞我等順上篤于兄弟之天意合人心衆志既定王之從違請自度之可耳英固爾岱等至朝鮮其國王不接見八貝勒及外藩貝勒書亦不納詭令英固爾岱等至議政府議事又設兵晝夜防守英固爾岱等率諸使者於朝鮮城中奪馬乘之突門而出至途朝鮮國王遣人持報書追付英固爾岱又以書三封諭其邊臣固守邊疆英固爾岱併奪之及還以書獻太宗覽書知朝鮮決意斷絶召諸貝勒大臣共閲之衆皆怒欲興師殱滅朝鮮太宗曰先遣人持書往諭以利害令以諸子大臣為質彼許諾則已否則再議征伐是役也英固爾岱等遇明皮島兵于路盡擊敗之命賞外藩貝勒部下將士之有功者英固爾岱等既還其國王李倧遣參議羅德憲參判李廓獻春季貢物四月太宗既受尊號羣臣行三跪九叩禮德憲廓獨不拜太宗諭曰朝鮮使臣無禮處難以枚舉是皆其國王有意搆怨欲朕先戮其使臣加朕以背棄盟誓之名耳朕從不逞一時小忿即兩國相讐爭戰之際以事遣人亦無戮其來使之理况朝㑹乎其勿問厚其賞賚而遣之豫書數李倧罪曰我使臣歸知爾國變易成例令我所遣大臣赴爾宰臣衙門議事且將貝勒等所致書置之不答此雖出諸貝勒之意亦曽奏聞遣使若云諸貝勒原無通問之例則曩者兵臨爾境王遁島中不嘗書使往來對天盟誓乎吾兩國本無讐怨爾無故發兵助明加害我國幸䝉天鑑爾之將士盡為我擒我不忘舊好故不忍加誅仍以客禮優養天以遼東賜我爾復容留明人於爾地助給糧餉誘納叛亡我是以有聲罪之討比及班師爾以同姓之人詭稱親弟遣質我國先年我將陳獲之將遣還爾國爾反戮之其所遣隨從漢人盡執以付明國爾見我國逃附明國之人必引而致之明國歸附我國之人必追而執之我嚴戢邊民不許越境侵犯爾縱國人漁獵採參常擾我地我是以始令增納所進嵗額今又聽書生不達時務之言背棄十年盟誓之好一旦戎馬臨郊將令書生搦管前驅乎抑令軍士荷戈以戰乎爾國所恃者島與舟耳昔魏武侯浮西河而下中流顧謂吳起曰美哉山河之固此魏國之寶也吳起對曰在德不在險昔三苗氏左洞庭右彭蠡德義不修禹滅之夏桀之居左河濟右泰華伊闕在其南羊腸在其北修德不仁湯放之殷紂之國左孟門右太行常山在其北大河經其南修政不德武王伐之由此觀之在德不在險君若不修德舟中之人皆敵國也今爾國不修德義徒恃海島之險舟楫之利背盟搆怨自取滅亡恐兩國兵交王之民臣皆王之敵國矣我國興師順者撫之逆者誅之無知之民逃匿山谷此非豫戕賊之乃王自戕賊之也此畨使臣其無禮更難悉數爾之意欲我殺爾使臣以為盟好之敗自我啓之不知我國所行從無此猥瑣之事兵刃既接當以一戰決强弱焉有斬一二往來使臣而謂之强者乎又特頒明㫖諭之曰爾王若自知悔罪即送子弟為質不然即于某月某日舉大軍以臨爾境爾時雖悔何及乎內院承政希福等曰我國理直彼之罪可以明責之至興師之期豈可明告若明告以期彼益固守其邊圉矣太宗曰此非爾等所知日後自收其益於是以興師日期明示朝鮮使臣及商人等而遣之癸巳却銅嘴雀有弋人獲銅嘴雀來獻太宗曰此鳥雖有好音可以悅耳然玩物喪志昔賢垂誡不宜近也遂却之丁酉敘功敘諸貝勒功冊封大貝勒代善為和碩禮親王貝勒濟爾哈朗為和碩鄭親王墨勒根岱青貝勒多爾衮為和碩睿親王額爾克楚琥爾貝勒多鐸為和碩豫親王貝勒豪格為和碩肅親王貝勒嶽託為和碩成親王貝勒阿濟格為多羅武英郡王貝勒杜度為多羅安平貝勒貝勒阿巴泰為多羅饒餘貝勒各賜銀兩有差敘外藩䝉古諸貝勒功封巴達哩為和碩土謝圖親王武克善為和碩卓哩克圖親王固倫額駙額爾克孔果爾額哲為和碩親王布達齊為多羅扎薩克圖郡王滿珠什哩為多羅巴圖魯郡王衮楚克巴圖魯為多羅達爾漢郡王遜杜稜為多羅杜稜郡王固倫額駙班第為多羅郡王洪果爾為秉圖王棟為多羅達爾漢岱青鄂木布為多羅達爾漢卓哩克圖古魯思希布為多羅杜稜善巴為達爾漢賡格爾為多羅貝勒各賜雕鞍甲胄金銀器皿及文綺有差又敘都元帥孔有德總兵官耿仲明尚可喜功封孔有德為恭順王耿仲明為懷順王尚可喜為智順王賜宴崇政殿并賜銀兩有差其部下官員亦論功升賞皇清開國方略卷二十一
