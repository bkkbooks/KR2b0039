body:
  text: 欽定四庫全書皇清開國方略卷六太祖髙皇帝天命四年己未天命四年春正月丙戍征葉赫太祖命大貝勒代善率大臣十六人兵五千往守扎喀關以防明兵親統軍征葉赫辛卯深入其界自克依特城尼雅罕寨距葉赫城東十里克大小屯寨二十餘其逃奔入城者盡追擒之又取葉赫所屬蒙古遊牧畜産整兵而還離葉赫城六十里駐營翼日班師初葉赫貝勒錦台什布揚古聞我兵往征遣使向明開原總兵馬林告急馬林率兵助葉赫合兵出葉赫城四十里見我兵勢甚壯不敢戰而退二月己巳築界藩城先是三年九月太祖諭貝勒大臣曰今與明為難由我國西向行師其迤東軍士道逺馬力困乏須牧馬于沿邊之地近明國築城界藩居之遂營基址運木石值天寒暫止至是令夫役萬五千人赴界藩運石興築以騎兵四百衛之三月甲申朔大破明兵于薩爾滸山明帝欲逞志于我時萬厯四十七年令遼東經略楊鎬集兵瀋陽分四路來攻左翼中路以杜松山海關總兵王宣保定總兵趙夢麟原任總兵張銓監軍廣寧道督兵六萬由渾河出撫順關右翼中路以李如柏遼東總兵賀世賢遼陽副將閻鳴泰監軍遼陽道督兵六萬由清河出鴉鶻關左翼北路以馬林開原總兵麻巖大同副將潘宗顔監軍開原道督兵四萬由開原合葉赫兵出三岔口右翼南路以劉綎遼陽總兵康應乾監軍海蓋道督兵四萬合朝鮮兵出寬甸口期並趨我都城即興京楊鎬遣我國逃卒齎書以軍期來告號稱兵四十七萬于三月十五日乘月明時進發其齎書人以二月二十四日至而二十九日杜松等所率兵六萬已乘夜列炬出撫順關三月朔我西路偵卒遙見火光馳告甫至而南路偵卒又以二十九日未刻明兵進棟鄂路告諸貝勒大臣入奏太祖曰明兵之來信矣我南路駐防之兵有五百其南路兵來即以此拒之明使我先見南路有兵者誘我兵而南也其由撫順關來者必重兵急宜拒戰破此則他路兵不足患矣即于辰刻親率貝勒大臣統城中兵出而命大貝勒代善前行時偵卒又以明兵出清河路來告大貝勒代善曰清河之界道途逼仄﨑嶇敵兵未能驟至我兵惟先往撫順以逆敵兵遂過扎喀關與大臣扈爾漢等集兵以待上之至時四貝勒以祀事後至謂大貝勒代善曰界藩山上我築城夫役在焉山雖險倘明之將帥不惜士卒奮力攻之陷夫役奈何我兵宜急進以安夫役之心大貝勒等善是言下令軍士盡擐甲日過午至太蘭岡大貝勒及扈爾漢欲駐兵隱僻地以待敵四貝勒艴然曰正宜耀兵列陳明示敵人壯我夫役士卒之膽俾并力以戰何故令兵立隱僻地耶大臣額亦都曰貝勒之言是也我兵當堂堂正正以向敵人遂督兵赴界藩對明兵營列陳而待初衆貝勒兵未至我兵之防衛築城夫役者僅四百人伏薩爾滸谷口伺明總兵杜松王宣趙夢麟之兵過谷口將半尾擊之追至界藩渡口與築城夫役合據界藩山之吉林崖杜松結營薩爾滸山而自引兵圍吉林崖仰攻我兵我兵四百人率衆夫役下擊之一戰而斬明兵百人及大貝勒四貝勒至見明兵攻吉林崖者約二萬人又一軍列薩爾滸山巔遙為聲勢乃與二貝勒阿敏三貝勒莽古爾泰及諸將議曰吉林崖巔防衛夫役之兵僅四百人急增千人助之俾登山馳下衝擊而以右翼四旗兵夾攻之其薩爾滸山之兵則以左翼四旗兵當之遂遣兵千人往吉林崖太祖至問貝勒等破敵䇿具以前議告太祖曰日暮矣且從汝等今分右翼四旗之二與左翼四旗兵合先破薩爾滸山所駐兵此兵破則界藩之衆自喪膽矣再令右翼二旗兵遙望界藩明軍俟我兵由吉林崖馳下衝擊時并力一戰是時我兵之近都城乘善馬者先至乘駑馬者後至其數十里外者尚未至于是合六旗兵進攻薩爾滸山明兵出營列陳發鎗炮我兵仰而射之奮力衝擊不移時破其營壘死者相枕藉而所遣助吉林崖之兵自山馳下衝擊右翼二旗兵渡河直前夾擊明兵之在界藩山麓者短刃相接我兵縱橫馳突無不一以當百遂大破其衆明總兵杜松王宣趙夢麟等皆沒于陳橫尸亙山野血流成渠其旗幟器械及士卒死者蔽渾河而下如流澌焉追奔逐北二十餘里至舒欽山時已昏軍士沿途搜𠞰者又無數乙酉大破明兵于尚間崖及斐芬山我軍敗明兵于薩爾滸山之夜明總兵馬林率兵營于尚間崖濬壕嚴斥堠鳴金鼓自衛我兵見之乘夜馳告于大貝勒代善翼旦大貝勒以三百餘騎馳往馬林兵方拔營行見大貝勒兵至回兵結方營環營濬壕三匝列火器俾習火器者立壕外繼列騎兵以俟又潘宗顔一軍距西三里外營斐芬山大貝勒見之使人馳告于上是時逺路之兵亦陸續至與大貝勒兵合明左翼中路後營遊擊龔念遂李希泌統步騎萬人駕大車持堅楯營于斡琿鄂謨地環營濬壕外列火器太祖見之與四貝勒率兵不滿千人分其半下馬步戰明兵發火器拒敵四貝勒引騎兵奮勇衝入步兵繼進遂斫其車破其楯明兵大敗龔念遂李希泌皆陳汲焉太祖方佇立眺望會大貝勒代善使人至知明兵已營尚間崖太祖不待四貝勒兵急引侍從四五人往日中至其地見明兵四萬人布陳成列太祖趣令我軍先據山巔向下搏擊衆兵方欲登山而馬林營內之兵與壕外兵合太祖曰是將與我戰也我兵且勿登山宜下馬步戰命大貝勒代善往諭時左翼二旗兵下馬者方四五十人明兵已自西突至大貝勒代善言于上曰敵兵已進矣即怒馬迎戰直入其陳二貝勒阿敏三貝勒莽古爾泰與衆台吉等各鼓勇奮進兩軍搏戰遂敗明兵斬捕過當方戰時我六旗兵見之不及布列行陳人自為戰前後弗相待縱馬飛馳直逼明營明兵發鳥鎗巨炮我兵衝突縱擊飛矢利刃所向無前明兵不能支又大敗遁走我兵乘勝追擊明副將麻巖及大小將士皆陳沒總兵馬林僅以身免滅迹掃塵案角隴種尚間崖下河水為之盡赤太祖復集軍士馳往斐芬山攻開原道潘宗顔兵令我兵之半下馬仰山而攻宗顔兵約萬人以楯遮蔽連發火器我兵突入摧其楯遂破之宗顔全軍盡沒時葉赫貝勒錦台什布揚古欲助明與潘宗顔合其兵甫至開原中固城聞明兵敗大驚而遁丁亥大破明兵于棟鄂路我軍敗明兵于尚間崖及斐芬山之後太祖收全軍至固勒班地駐營明總兵劉綎李如柏等由棟鄂呼蘭兩路進兵已近逼都城我偵卒馳告太祖命大臣扈爾漢先率兵千人往禦劉綎翼旦命二貝勒阿敏率兵二千繼之親率諸貝勒大臣還軍至界藩行凱旋禮刲八牛祭纛告天大貝勒代善請曰吾先歸從二十騎微行探信祀畢上徐來太祖許諾三貝勒莽古爾泰亦相繼行四貝勒馳至上前請與俱往太祖曰汝兄微行往探汝隨吾後行四貝勒曰兄獨往吾留此未安也遂亦行日暮大貝勒回至都城詣內庭慰告曰撫順開原二路敵兵已斬戮盡南來兵已遣將往禦我待父皇命當即往破之于是大貝勒復出城十五里迎太祖于大屯之野太祖自界藩申刻起行五更還都城平明命大貝勒三貝勒四貝勒統軍士禦劉綎而留兵四千于都城待李如柏賀世賢等之兵初劉綎兵出寬甸進棟鄂路我居民避匿深山茂林中劉綎悉焚柵寨殺其孱弱不能行者迤邐而進我駐防官托保額爾訥額赫率兵五百迎敵劉綎兵圍之數重額爾訥額赫死之并傷我卒五十人托保引餘兵與扈爾漢軍合扈爾漢伏兵山隘以待已刻大貝勒三貝勒四貝勒引兵甫出瓦爾喀什窩集時劉綎所率精鋭二萬先遣萬人前掠將趨登阿布達哩岡列陳大貝勒欲引兵先登馳下擊之四貝勒曰兄統大兵留此相機為援吾先督兵登岡自上下擊之大貝勒曰善吾引左翼兵出其西汝引右翼兵登山俾將士下擊汝立後督視勿違吾言輒輕身入也四貝勒遂率右翼兵往先引精騎三十人超出衆軍前自山馳下奮擊之兵刃交接戰甚酣後軍隨至衝突而入大貝勒又率左翼兵自山之西至夾攻之明兵大潰四貝勒乘勝追擊與劉綎後隊兩營兵遇綎倉卒不及陳四貝勒縱兵奮擊殲其兩營兵萬人劉綎戰死是時明海蓋道康應乾步兵合朝鮮兵營于富察之野其兵執筤筅長槍被藤甲皮甲朝鮮被紙甲其胄以栁條為之火器層疊列待四貝勒既破劉綎兵方駐軍衆貝勒皆至遂復督兵攻康應乾所率明兵及朝鮮兵敵競發火器忽大風驟作走石揚沙煙塵反撲敵營昏冥晝晦我軍乘之飛矢雨發又大破之其兵二萬人殲焉應乾遁去先是二貝勒阿敏偕扈爾漢前行遇明遊擊喬一琦兵擊敗之一琦收殘卒奔朝鮮都元帥薑功烈營時功烈據固拉庫崖衆貝勒復整兵逐一琦遂攻朝鮮營功烈知明兵敗大驚遂按兵偃旗幟遣通事執旗來告曰此來非吾願也昔倭侵我國據我城郭奪我疆土急難之時賴明助我獲退倭兵今以報德之故奉調至此爾撫我我當歸附且我兵之在明行間者已被爾殺此營中皆髙麗兵也明兵逃匿于我者止遊擊一人及所從軍士而已當執之以獻大貝勒二貝勒三貝勒與四貝勒定議乃曰爾等降先命主將來否則必戰功烈復遣使來告曰吾若今夕即往恐軍亂逃竄其令副元帥先往宿貝勒營以示信詰朝吾率衆降遂盡執明兵擲于山下付我明遊擊喬一琦自縊死于是朝鮮副元帥先詣我軍降翼日薑功烈率兵五千下山降諸貝勒宴勞之送功烈及所部將士先詣都城太祖御殿朝鮮都元帥薑功烈及副元帥等匍匐謁見太祖優以賔禮數賜宴厚遇之士卒悉留贍養焉大軍既殲南路明兵四萬人駐三日籍其俘獲人馬輜重鎧仗而還是役也明以傾國之兵雲集遼瀋又招合朝鮮葉赫分路來侵五日之間悉被我軍誅滅其宿將猛士暴骸骨于外士卒死者不啻十餘萬我軍以少擊衆無不摧堅挫鋭迅奏膚功䇿勳按籍我士卒僅損二百人時明經略楊鎬駐瀋陽聞三路兵敗大驚急檄總兵李如柏副將賀世賢等回兵如柏等自呼蘭路遁歸我哨兵二十人見之據山上鳴螺繫帽弓弰揮之作招集大兵狀已而呼噪下擊殺四十人獲馬五十匹明兵奪路而逃相蹂踐死者復千餘人庚寅大軍還至都城太祖顧貝勒大臣曰明以二十萬衆號四十七萬分四路并力來戰今我不踰時破之遂獲全勝各國聞之若謂我分兵拒敵則稱我兵衆若謂我往來𠞰殺則服我兵強傳聞四方孰不懾我軍威者哉甲辰遣使齎書朝鮮太祖書讐明七大恨事遣使臣二人偕朝鮮降帥薑功烈之部曲張應京及官屬三通事一齎付朝鮮國王李琿更書其後曰昔者金元之主曽服三四與國歸于一統然亦未得長久保守此吾所素知者今非樂動干戈也實因陵逼已甚若向來有意與明結怨天必鑒之天何以獨眷我國天無私是者是非者非故佑我而厭明爾朝鮮以兵助明吾知非爾本心因明曾救爾倭難故報其恩而來耳昔金大定時爾朝鮮之臣有趙維忠者以四十城叛附大定帝曰朕征宋徽欽二帝時爾朝鮮王不助宋亦不助朕乃持公之國也遂不納由此以論爾原與我國無隙今擒爾統兵官屬十人以念王之故特留之今何以竟其事耶王其圖之夫普天之下不一其國豈有令大國獨存小國盡亡者乎明大國也意必奉若天道乃反變亂天紀恣意橫逆虐苦與國王豈不知之我聞明主之意欲令其諸子主我滿洲及爾朝鮮辱我二國實甚今王之意將謂我二國素無怨釁遂與我合謀以讐明耶抑既已助明不願背負耶其詳告我後兩月朝鮮遣使一人從十三人齎書隨我使臣至言願各守疆圉復修前好夏四月丙辰令牧馬邊境太祖諭諸臣曰今戰馬羸瘠須牧以青草沿邊之地宜設兵以衛農人時界藩城甫築基址駕西行視之即令設兵守禦擇曠土以牧馬是月壬戍選騎兵略明鐵嶺俘獲千人六月己未賚收降呼爾哈路長先是正月庚戌太祖遣大臣穆哈連率兵千人征東海呼爾哈路至是收其丁壯二千以還駕出城撫之椎牛二十列筵二百來降路長分二等賜賚上等者男婦十馬牛各十衣五襲次等者男婦五馬牛各五衣三襲其田廬器物具備焉丁卯克明開原城明開原衛城在瀋陽城東北二百十五里即今開原縣城明總兵馬林自尚間崖敗還仍守開原六月辛酉太祖率兵四萬征明開原城行三日大雨河漲諭貝勒大臣曰將回兵耶抑進兵耶道濘渡口水溢軍行非便若留一二日待水涸土燥恐逃者泄機于明知我欲取開原宜進兵瀋陽以疑之遂發兵百人向瀋陽殺三十餘人擒二十人而還使人偵視開原無雨道不濘河水可濟太祖乃率大軍進丁卯平旦薄城下馬林偕副將于化龍權開原道事推官鄭之範參將髙貞遊擊于守志守備何懋官等嬰城守城上列少兵餘皆陳四門外我兵設楯梯進攻而以偏師掩擊東門外所陳兵敗之明兵爭入城填擁于門我兵奪門搏戰而攻城之兵雲梯未布即踰城入城上兵四面皆潰城外三面兵見城破驚竄我兵據門堵禦壕不得渡盡殲之鄭之範先遁得脫馬林于化龍髙貞于守志何懋官皆陳沒太祖登開原城坐南樓偵者以鐵嶺衛有兵三千來援馳告諸貝勒率兵迎戰明兵望見即奔我兵二十人追及之斬四十餘人而還太祖駐兵開原三日籍所俘獲舉之不盡論功行賞乃班師諭貝勒大臣曰我等勿回都城就界藩城治屋廬以居牧馬邊境勿渡渾河何如貝勒大臣議曰不如還都近水草息馬浴之飼之且俾士卒歸家繕治兵仗太祖曰非計也今六月盛暑行兵已二十日矣若還都二三日乃至軍士由都城至各路屯寨又須三四日炎蒸之時復經逺涉馬何由壯耶吾居界藩牧馬于此至八月又可興師矣命軍士盡牧馬于邊建宫室于界藩城中諸貝勒大臣及兵民房舍皆成遂駐蹕界藩大宴行慶賀禮先是有蒙古阿布圖者受明守備職居開原我軍克城獲其妻子阿布圖率二百餘人來降即以其妻子家産盡給之至是明原任開原城千總王一屏戴集賔金玉和白竒䇿守堡百總戴一位等率二十餘人來降太祖諭貝勒大臣曰彼知天意佑我又聞我國愛養人民故相繼而歸耳賜阿布圖人百牛馬羊各百駝五銀百兩緞二十布二百其千總六人各賜人五十牛馬羊各五十駝二銀五十兩緞十布百守堡百總等官各賜人四十牛馬羊各四十駝一銀四十兩緞八布八十從者量給妻奴牛馬田廬器用秋七月丙午克明鐵嶺城明鐵嶺衛城在開原南六十里即今鐵嶺縣城我軍克開原之後四旬太祖率諸貝勒統兵圍鐵嶺城城外各堡兵奔入城其不得入者悉奔竄我軍樹雲梯攻城之北明遊擊喻成名史鳯鳴李克泰督軍拒守鎗炮矢石交下我軍即登梯毁陴摧鋒突入城上兵驚潰陳斬喻成名史鳯鳴李克泰盡殲其衆太祖遂入城駐蹕丁未擊敗喀爾喀諸部兵我軍克鐵嶺城之夜蒙古喀爾喀部貝勒齋賽扎嚕特部貝勒巴克台吉色本等共引兵萬餘乘夜至􅐕田以伺翼旦我兵十餘人出城牧馬齋賽兵見而擊射我兵在城中者知為蒙古兵即出城欲戰因未奉上命駐立以待而牧馬兵皆被殺傷太祖親出城諭諸貝勒曰不戰何也急擊勿失大貝勒代善曰若戰恐後悔太祖曰此齋賽兵也吾恨齋賽有五今又先殺吾人何悔焉諸貝勒大臣遂率兵奮擊敗其兵追至遼河溺水死及陳斬者甚衆擒齋賽及其二子色特希勒克什克圖與扎嚕特部巴克色本科爾沁部台吉桑噶爾寨齋賽妹壻岱噶爾及其部將十餘人兵五百餘人繫城樓內初我軍未征鐵嶺時太祖夜寢夢天鵝白鶴及衆鳥翺翔上下羅之得白鶴一呼曰得齋賽矣遂覺以夢告妃妃曰齋賽為人如鳥飛揚上從何處羅之翼日復告諸貝勒皆對曰此吉兆也天將畀我以非常才望人為我國助耳至是既擒齋賽諸貝勒大臣抃舞曰果符吉夢得齋賽矣翼日大宴奏樂令齋賽等匍匐進謁齋賽從人名烏瑚齊者問曰上與衆貝勒大臣俱無恙耶四貝勒侍太祖側應曰我軍中止牧馬兵十數人被傷餘俱無恙汝等鞍馬俱完善耶蒙古皆大慚垂首無以應于是駐軍鐵嶺城三日論功行賞以所俘獲分給之先釋齋賽從者博囉齊等十一人使歸寄語諸部長述蒙古兵大敗齋賽及衆台吉并兵五百餘人悉為我國所擒乃班師太祖諭貝勒大臣曰我畜齋賽于此而殄其兵彼所屬軍民畜産恐為他部攘而取之不如縱所擒兵五百餘人還國為便遂遣之還八月壬申滅葉赫國時葉赫貝勒錦台什居東城布揚古居西城太祖與貝勒大臣定攻取策以諸貝勒率兵圍西城親統八旗將士圍東城遂星夜進兵葉赫偵者馳告布揚古曰滿洲兵至矣葉赫人民聞之皆驚擾所屬屯寨居民近者避入城逺者匿山谷壬申我軍馳向西城布揚古偕其弟布爾杭古率兵出城西門陟岡鳴角鼓噪望見我軍旌旗劒戟如林隊伍整肅前後絡繹自度弗能禦倉皇入城諸貝勒遂督兵圍之太祖統軍圍東城先破其郛軍士薄城布列梯楯呼錦台什出降錦台什不從答曰我非明兵比等丈夫也我肯束手歸乎與其降汝寧戰而死耳太祖遂督兵攻城兩軍拒戰矢如雨雹我兵擁楯登山傍城下掘地欲墮其城城上發火器擲巨石滚木我軍冒矢石穴其城城墮遂入城城上敵衆復迎戰又敗之四面兵皆潰太祖遣人執幟禁約軍士毋得妄殺又使人持上黃蓋傳諭城中降者免死于是城中兵民俱降錦台什擕妻及幼子登所居髙臺我兵圍之呼曰汝降速下否則進攻錦台什曰我戰不能勝城破困于家縱再戰豈能勝乎汝皇子四貝勒我妹所生也得相見聞其盟言我乃下時四貝勒攻西城太祖召之至命曰爾舅有言待汝至乃下汝往彼下則已不下以兵毁其臺四貝勒既往錦台什曰我與甥未識面真偽烏能辨大臣費英東額駙達爾漢曰汝視常人中有如我四貝勒魁梧竒偉者乎汝國使者必嘗語汝何難識别耶若仍不信曩者我國議和之時曽以媪往媪乳汝子德勒格爾今尚在盍令視之錦台什曰何用媪為也觀此辭色似未承父命善遇我也特誘我下臺而見殺耳我石城鐵門既失困守此臺縱戰不能勝但我祖父世居斯土我生于斯長于斯則死于斯而已四貝勒曰天設此險俾汝築城疲勞百姓至于數年所築重城今皆摧破獨據此臺欲何為也汝欲誘人至此與汝并命孰肯如汝之意耶汝如何曰得我活汝盟言汝方下也豈戰不能擒汝而與汝盟歟我已在此汝下引汝往見父皇生殺惟父皇命且汝當日之意將欲翦滅親戚我國屢欲和好遣二三十人至汝國汝輕視我國謂懼而求和殺我使臣或羈留焉致有今日傾覆之禍若父皇念汝惡則戮汝倘不念汝惡以我之故貸汝汝生矣凡勸諭者再三錦台什仍執前言不下四貝勒曰舅言我來即下我乃來若下速下引見父皇否則我往矣錦台什曰姑勿往我先令親臣阿爾塔什往見上察言觀色而回我乃下遂令阿爾塔什來見太祖諭責之曰離間諸舅與我為難致明人舉兵四十萬來非汝也耶念此宜誅汝事既往不汝咎耳汝還語貝勒與偕來阿爾塔什還勸錦台什不從曰聞吾子德勒格爾被創在家召之來吾與相見乃下四貝勒召德勒格爾至與之見德勒格爾謂其父曰我等戰既不勝城又破今居此臺欲何為盍下臺生死聽之勸諫再四錦台什終不從四貝勒欲縳德勒格爾德勒格爾曰我年三十六乃于今日死耶殺之可也何縳焉四貝勒以其言奏太祖曰子勸父降而不從父之罪也父當誅勿殺其子遂引德勒格爾見太祖以所食賜四貝勒與同食諭曰此爾之兄也善遇之錦台什妻因其夫不下攜幼子趨下錦台什引弓從者復擐甲待我兵持斧斤毁其臺錦台什縱火焚屋宇盡燬我諸將謂錦台什已死令毁臺之兵退還火燎錦台什身自下為我兵所執縊殺之時諸貝勒圍西城招之降不從會東城已破布揚古布爾杭古大懼使人來告願降以懷疑不敢出大貝勒曰始令汝降汝不從大兵至此豈舍汝去乎我以汝為外兄弟愛而欲生之故令汝降若戰則汝等盡死于我之小卒手降則生矣果願降恐兄弟偕來或被殺盍令汝母先來汝母我外姑也豈執婦人而殺之乎布揚古布爾杭古復使人來曰我等降汝盍留盟言與我等約汝歸我仍居此城大貝勒怒曰何復為此言也既破東城豈力不能拔西城聽汝等居此而去乎速降則已否則父皇至必攻克爾城克城之後汝等駢首戮矣布揚古布爾杭古乃令其母來大貝勒以禮接見其母曰汝無盟言故我二子懷疑而懼耳大貝勒乃以刀劃酒誓曰若汝等降而我殺之殃及我若我既誓而汝仍不降殃及汝等汝等不降破汝城必殺無赦乃執酒飲其半分其半送布揚古布爾杭古飲之遂開門降大貝勒引布揚古見上布揚古復勒馬立大貝勒挽其轡曰爾殆非丈夫耶言既定又立此躊躇何為也乃來見布揚古跪不恭僅屈一膝不拜而起太祖親以金巵賜之酒不恭如初屈一膝偏向酒不竟飲沾唇而已又不拜而起太祖諭大貝勒曰引爾婦兄去回彼西城是日太祖深念久之謂吾既不念舊惡欲留而豢養之貸其死豫以生全未見有喜色仍讐怨且拜跪亦不少屈此人可豢養耶是夜命縊殺之其弟布爾杭古以大貝勒故宥其死助葉赫防守之明遊擊馬時楠及兵一千盡殺之葉赫所屬各城俱降其官員及軍民皆弗罪父子兄弟夫婦親戚不令離散財物毫無所取徙其人而還悉豫廪給並田廬器用無馬者千人並給以馬初葉赫之先蒙古國人姓土默特滅呼倫國所居璋地之納喇部遂據其地因姓納喇後遷于葉赫河岸建國故號葉赫國其始祖星根達爾漢生錫爾克明安圖錫爾克明安圖生齊爾噶尼齊爾噶尼生楚孔格楚孔格生台楚台楚生二子長青嘉努次揚吉努兄弟綏服葉赫諸部各居一城哈達國人多歸之青嘉努揚吉努遂皆稱貝勒歲甲申明寧逺伯李成梁受哈達國所賂金及黑狐紫貂聽讒搆以賜敕賞賚為名誘青嘉努揚吉努兩貝勒至開原并從兵三百皆殺之青嘉努子布齋揚吉努子納林布祿各繼其父為貝勒李成梁率兵取其杜喀尼雅罕二寨戊子年又率兵圍攻納林布祿所居東城大傷兵卒不克而歸乃與和好焉納林布祿弟錦台什布齋子布揚古嗣為貝勒分居東西城至是葉赫遂滅冬十一月庚辰朔遣使與喀爾喀部長會盟時太祖開疆拓土東自海西至明遼東界北自蒙古科爾沁之嫩江南暨朝鮮國境凡語音相同之國俱征討徠服而統一之蒙古喀爾喀衆貝勒遣使來齎書曰齋賽屢啓釁端見前七月丁未條誠有罪惟上所命但明敵國也如往征之必同心合謀直抵山海關負此言者天神鑒之倘與和好亦必會同定議若明輸財物厚汝國薄我汝國勿受厚我薄汝國我亦不受能踐此言名聞逺邇不亦善乎于是太祖命大臣額克星額綽護爾雅希禪庫爾禪希福五人偕來使赴期會之地刑白馬烏牛設酒一器肉一器血骨及土各一器昭告天地誓曰今滿洲十旗執政貝勒與喀爾喀執政貝勒蒙天地眷佑俾合謀并力與明修怨如其與明釋舊恨結和好亦必合謀然後許之若滿洲渝盟不偕喀爾喀貝勒合謀先與明和好皇天后土其降之罰若明國欲與喀爾喀貝勒和好密遣離間貝勒等不以其言告我滿洲英明皇帝者皇天后土亦降之罰我二國同踐盟言天地佑之其飲是酒食是肉二國執政貝勒尚克永命子孫百世及于萬年二國如一共享太平是月巴約特部台吉索寧下一人及扎嚕特部宰桑扣肯下一人來歸太祖曰來歸之情誠為可矜但盟誓之言尤不可背遂不納各還其主臣等謹案明臣黃道周博物典彚云己未冬薊人咸云建人苦飢一日啜粥二碗識者曰實者虛之此未可信乃薊人咸以其乏食為喜逮劉總戎破其寨五榖滿園囷其深計大率類此又附録史氏曰建州彈丸地嚮資清撫之糴曽無廣屯原儲清撫既下不為守知非有逺志我徴兵漸集宜葺殘壘時以輕騎擾彼耕牧計可坐制乃鋭語出塞自取輿尸且兵莫神于間莫巧于顛倒飢飽勞逸以為用而我早漏師期深入重險棄輜重以資之敵勢始張奪我三軍之膽膽破而智勇並困宜遼瀋之為開鐵續也原海西密邇開鐵為我屬國與建州及西部牙錯勢能離其合近歲拯北關以藩遼稱制勝上䇿而竟翦焉胥覆為開鐵續誰職厲階一蹶不振耶此道周追述明人深咎楊鎬之分兵四路侵我興京所稱清撫謂清河撫順也所稱開鐵謂開原鐵嶺也所稱海西北關謂葉赫也所稱西部謂喀爾喀及察哈爾與喀喇沁也所稱劉總戎即劉綎其侵我棟鄂路焚柵寨深入戰死在己未三月則所云己未冬當是戊午冬之訛實録載天命四年二月興役萬五千人運石築界藩城衛以騎兵四百不言以工代賑亦不言寓兵于工固未嘗苦飢也工方始而楊鎬集兵瀋陽刻期深入時開原三岔寬甸猶屬明若撫順清河我既克之逾數月矣弗以兵駐守退而就舊有之界藩築城宜明人視為非有逺志歟乃未戰薩爾滸之先敗明兵二萬于吉林崖築城衆役自崖下擊有功不惟足食而且足兵亦實者虛之之一證前此乙卯年六月貝勒大臣請征明太祖髙皇帝諭以儲積未充惟及是時撫輯吾國固疆圉修邊備重農積榖為先務越三年將征撫順諭將士治甲胄修軍器以繕治馬廄為名遣七百人伐木備攻具聖心之密籌周慮固慎于用兵之常道至弗守撫順清河而興役界藩正聖諭所云撫輯吾國固疆圉修邊備而又為料敵制勝之神謀遂殱敵十餘萬惟由清河至呼蘭一路兵及甫至開原之葉赫兵拔營而遁其在尚間崖脫免之總兵馬林仍守開原故越兩月我軍破其城時有鐵嶺兵三千赴援擊之始退故亦攻取其城復移師滅葉赫而西部之喀爾喀旋服罪乞盟宜明人之自咎夫鋭語出塞深入重險一蹶不振且揣測我朝致此之由謂兵莫神于間莫巧于顛倒飢飽勞逸以為用亦叩槃捫燭之見耳又按明臣熊廷弼奏疏云遼左為京師肩背河東為遼鎮腹心開原為河東根本敵未破開原時北關朝鮮猶足為腹背患今開原破而北關不敢不服朝鮮不敢不從以此交攻遼瀋何可守也自我軍三路敗沒而敵始出入無常自我兵坐守四城而敵始交合西部徑取開原是前日不復清撫以失開原之覆車即後來不復開原以棄遼鎮之榜樣也其言正與道周所云遼瀋之為開鐵續相合又言此時即精兵良將甲馬芻糧一時齊備猶恐敵鋭難當敵交難斷況事事俱無臣又如之何哉方是時廷弼初代楊鎬為經略倡議恢復進戰固守三策而于我國家天命人心之歸己見幾于受事之始又言我兵五足當敵兵一即他日人經訓練器經整頓猶須三而當一今敵已有衆十萬即我兵十有八萬尚費支吾實亦震懾於我太祖髙皇帝用兵如神天戈所指無不一以當百而是時大軍實未滿數萬也至稱我朝但分開原餘財十數萬以與鄰近各部落使之東攻遼瀋西攻廣寧各部落所得春夏兩賞於我明者幾何又何樂而不從此乃廷弼狹小之見借以聳動其君不知聖朝聲教所訖逺近各部畏威懷德翕然景從並非誘之以利況止此十數萬為利於各部者又幾何乎且如薩爾滸之戰神武昭宣我軍以少擊衆如拉枯朽未嘗徵調逺近各部一兵一將此尤大彰明較著者也臣等伏讀乾隆四十一年御製文因實録尊藏人弗易見特書薩爾滸山大破明兵事示子孫臣庶無忘開創之艱難訓以國之將興必有禎祥然禎祥之賜由乎天而致天之賜由乎人又訓曰爾時草創開基篳路藍縷地之里未盈數千兵之衆弗滿數萬惟是父子君臣同心合力師直為壯荷天之龍用能破明二十萬之衆此我皇上以數言而括史臣之千萬言一若髙皇帝自言之而明臣所謂奪其三軍之膽膽破而智勇俱困者亦足以見神謨妙算所向無敵莫可端倪不待瀋陽遼陽𨽻我昄章而已聲靈赫濯云皇清開國方略卷六
