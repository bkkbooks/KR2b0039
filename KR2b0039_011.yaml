body:
  text: 欽定四庫全書皇清開國方略卷十一太宗文皇帝天聰元年丁卯七月至二年戊辰十二月天聰元年秋七月己巳敖漢部奈曼部來歸先是正月有喀爾喀蒙古逃至言察哈爾林丹汗興兵攻掠喀爾喀服從者收之拒敵者被殺扎嚕特部奔依科爾沁部二月太宗與奈曼部長衮楚克巴圖魯元太祖裔額森偉徵諾顔第三子書曰聞爾曽與烏木薩特綽爾濟喇嘛言欲與我國和好果爾可與敖漢部貝勒定議遣一曉事人來以便計議我素秉直道而行善者不欺惡者不懼向之征討各國非好戰也因陵轢過甚故昭告於天用彰天討耳我屢欲與明修好而彼不從偏助葉赫遣兵防衛又侵我沿邊居民擾耕穫毁廬舍驅之離散明如是其陵轢我也我是以有征明之師我國與喀爾喀素相和好自齊賽侵我烏扎拉城殺我使臣又巴哈達爾漢娶我已聘之女配與其子遂啓釁端及我既擒齊賽喀爾喀諸貝勒來與我議和誓告天地如往征明國則合兵而往與之和則共約而和若有惑于明之巧言厚賂而私與之和者殃必及之乃喀爾喀毁棄盟言聽讒嗜利左袒明人殺我臺軍獻首于明又屢行劫掠我念前好置之不問去歲我由寧逺旋師喀爾喀妄料我軍盡沒專意助明移兵相逼我遣往科爾沁之使臣復屢被截劫是喀爾喀之背盟肆惡也我是以有征喀爾喀之役朝鮮向與我通好無故與明合謀聯兵侵我䝉天眷佑我師克捷猶曲宥其愆俘獲士卒不加誅戮縱之使歸彼仍棄絶我好背我而歸明附我讐怨納我逋逃是朝鮮之負恩怙惡也我是以有征朝鮮之舉然則我之興師動衆豈得已而為之哉蓋兵非美事實欲與諸國共安太平耳爾等誠欲和好同除强暴各保疆圉正在此時彼察哈爾汗攻掠喀爾喀以異姓之臣把握事權居其貝勒之上矣又離析諸貝勒之妻强取諸貝勒之女以配微賤之人矣爾等豈無見聞乎若以吾言為然可將此書與兩克什克騰諸貝勒觀之四月衮楚克巴圖魯同敖漢部長索諾木杜稜與袞楚克巴國魯同祖塞臣卓哩克圖索諾木杜稜之弟及察哈爾國濟農台吉遣使通欵太宗復與以書曰汝等遣使致書欲為察哈爾汗與我國講和須察哈爾汗特遣使臣來來時務以誠信之言教之若詞多支蔓便啓爭端一言不善遂敗乃事我惟據來使所言遣使相報耳我兩國非若明人夙為讐敵豈以征戰為善而以太平為不美乎凡人用姧謀詭計而能成事者鮮矣惟能誠信往來克成厥好斯可以永久弗替耳若講和好我必不背科爾沁以科爾沁曽以和好之事推我主盟也六月辛亥敖漢部奈曼部使人俱至言其貝勒率衆來歸太宗遣每旗官一員迎之又命大臣迎烏木薩特綽爾濟喇嘛庚申親率諸貝勒統兵千五百人出迎翼日駐蹕都爾弼山岡敖漢部奈曼部使人復至奏言明朝曽遣人兩次致書言何故往投滿洲當投我國今以其書呈覽秋七月戊辰駕自都爾弼山岡渡遼河十里外駐蹕己巳衮楚克巴圖魯等至太宗出營迎之率以拜天乃升御座衮楚克巴圖魯等入御營奏曰吾等因察哈爾汗不道來求聖主福庇太宗曰諸貝勒逺來歸附跋涉勞苦可弗拜但互相抱見可也衮楚克巴圖魯等奏曰異國之人逺來歸命䝉皇上鴻慈容納即係編氓焉敢不拜于是趨前叩拜畢命近前抱見次與諸貝勒序齒互相抱見乃出所攜酒肴以進命衮楚克巴圖魯坐于右索諾木杜稜塞臣卓哩克圖坐于左台吉土謝圖岱青達爾漢桑阿爾齊鄂齊爾都爾巴分坐于旁賜部長三人雕鞍良馬各一台吉五人鞍馬各一是日太宗率之告天曰察哈爾汗敗棄典常罔恤兄弟致敖漢奈曼部諸貝勒與之交惡來歸于我我若不加軫念視如編氓勒遷內地者上天鑒譴若加之愛養仍令各安疆土而諸貝勒聽察哈爾離間之言背我而懷二心者天亦鑒譴惟無相違棄天佑我等福祚延長子孫繁盛千秋萬世永享安樂辛未衮楚克巴圖魯等宰牛二十馬二羊四百恭進筵宴甲戍駕還瀋陽八月乙卯擊敗明兵于遼河先是牛莊守臣奏報明國兵船十泊遼河銜尾排列我軍乘船將進敵人按兵不動今集三旗兵往攻之太宗遣貝勒嶽託率各旗官一員兵三百人往覘至是嶽託奏言敵船俱泊遼河止有小船三大船一從小河而入我守邊官棟世祿法都岱達喀爾達塔爾弼希等率兵兩岸夾擊四船並獲殪其守備一千總二百總二兵二百九月丙子勞鎮守朝鮮義州撤還諸將初大軍征朝鮮凱旋以國王李倧弟李覺至越數日將遣還御殿設餞頒賜李倧駝馬雕鞍鋄金櫜鞬腰刀鋄金鞓帶貂裘貂皮賜李覺鞍馬鋄金櫜鞬腰刀鋄金鞓帶貂裘貂皮蟒衣同來侍郎鞍馬蟒衣猞狸猻裘其餘官員鞍馬及緞衣等物有差巴克什達海庫爾禪等令李覺及侍郎服蟒衣謝恩固辭不從謂蟒衣乃國王之服官員無服此衣之制副將劉興祚曰以恩賜之衣而不肯服爾殆畏明國而不願歸也姑拘繫于此何如于是各服衣裘行朝鮮國禮謝恩太宗遣參將英固爾岱同劉興祚送歸與李倧書曰天下諸國皆天之所命而建立之者明國之主獨以己為天子視各國之主皆在其下種種欺陵實不能堪故昭告于天興兵征討惟天至公不視國之大小而視事之是非以我為是以明為非是以我師克捷奄有東土因爾以兵助明來侵又納我逃民故我命將往征王能識天意克自悔過于我國領兵貝勒前以禮納欵復遣王弟來覲既智且賢故能佐成和好國家受福我國從來與和好之國不起釁端其不願交好心懷異志者我亦不懼王以禮遣王弟來恐日久繫懷故速送歸自此以後但以式好為念勿似明之相欺也至每年往來之禮王自知之自後若有爾國人民逃歸我國我即緝以還汝我國之滿洲漢人及陳獲朝鮮之人逃至爾國爾即緝以歸我毋或隱匿致敗兩國和好也七月李倧遣副將沈正笏朴蘭英齎方物報謝其書言不忍縳送被俘後逃歸之人又請撤義州鎮兵太宗遣大臣阿什達爾漢巴竒蘭同沈正笏朴蘭英往又與書曰我二國本相和協止以明國之故遂啓釁端今天令親睦復歸于好若既和而欲敗之天有不譴責者乎我之留兵義州初非疑爾誠恐明人敗我和好不得不為防守計耳今若拒絶明人勿使入境王當即遣士卒來守義州我兵自當撤還若爾國之兵未至吾兵遽撤恐明人伺隙前來竊據也至言爾國之民被俘之後思其父母逃歸若復縛送心有不忍前者爾兵入我棟鄂瓦爾喀什窩集肆行屠戮又容匿毛文龍納我遼東逃民以是往征爾國當攻城陷陳之時我師豈獨無死傷者乎今以血戰所獲之俘脫逃而去爾乃收而庇之謂不忍再視其離散爾試思昔日來侵我國屠戮我民其父子兄弟豈無離散者乎遼東之民久經分給將士誼關主僕一旦僕棄其主竄歸爾國豈得不謂之離散乎倘我國將士忿其叛逃率衆而往執之自此啓釁敗盟又未可定也我所以欲爾歸我逃人者非貪得正欲永踐盟好耳如有貪得之念前剃髮降我之民如許之多一經盟誓遂爾遣歸我何嘗靳之也今王若愛戀其民必以彼父母兄弟完聚為詞可將逃人一一察出與其原主期約一處伊主許贖各從其便如此庶為允協王其圖之頒賜李倧猞狸猻貂皮李覺貂狐皮及銀姜功烈銀吳希楠朴桂英馬匹衣服姜功烈朴蘭英之子衣服鞍馬賜沈正笏朴蘭英猞狸猻裘蟒衣鞍馬從者四十七人衣服銀兩有差既遣行遂命撤回鎮守義州將士以義州復歸朝鮮九月丙子阿什達爾漢巴竒蘭歸以李倧書至言即遣官至義州更代矣是日鎮守義州諸將亦還太宗親賜酒勞之冬十一月庚午察哈爾貝勒率衆來歸先是察哈爾林丹汗所屬之安班和碩齊古英和碩齊扣肯巴圖魯遣十五人來奏言我察哈爾汗蔑棄兄弟敗壞倫理我等聞上威德遐敷仁恩普被因相率來歸應居何所惟上裁之太宗諭曰爾等來歸我國我國可居之地任爾居之事在六月至是察哈爾貝勒昻坤杜稜攜妻子率衆來歸命迎宴撫輯之是月薩哈爾察部六十人來朝以貂狐猞猁猻皮入貢十二月甲午朔宴來歸阿拉克綽特部長阿拉克綽特部舊屬察哈爾國先是有貝勒巴爾巴圖魯諾們達賚吹爾扎木蘇率所屬户口乘馬四十五匹來歸宴之賜莊田户口牛羊金銀衣裘器用俱備事在八月至是貝勒多爾濟伊勒登攜妻子率衆來歸御殿受朝設宴是月長白山迤東濱海呼爾哈部三人來朝以黑貂皮入貢天聰二年春正月甲子釋陳獲明人還寧逺先是明寧逺總兵祖大夀部下人銀住為我軍擒獲至是釋之歸與祖大夀書曰彼此互為大言徒滋支蔓何所底止夫搆兵則均受戰爭之禍息兵則共享太平之福此理之易曉者也我欲通兩國之好共圖太平擬遣使致祭爾先帝並賀新君即位及閲爾來書有弔喪者為誰講和者為誰之語是以停止遣使但令銀住同來使致詢如謂以禮往來為善則我即遣使往矣時為明崇禎元年是月東方格依克哩部四頭目率四十人來朝宴之賜衣各一襲二月庚子征多羅特部多羅特部察哈爾所屬也我遣往喀喇沁之使臣兩次為所截殺太宗統師征之諭貝勒大臣曰此行皆選精鋭以往兵不甚多當出奇制勝爾等誡諭軍士務紀律嚴明勿得輕進行五日諭諸貝勒曰爾等率精鋭前行若遇敵人當以計擒之訊其消息朕即率諸軍繼進于是諸貝勒前行生擒敵人訊知多羅特部青巴圖魯塞稜並其部衆俱在敖穆掄地遂駐兵待太宗至進征敖穆掄合擊多羅特部衆其多爾濟哈坦巴圖魯中傷遁走盡獲其妻子殺其台吉固嚕俘獲萬一千二百人以䝉古漢人千四百名編為民户餘俱為奴復選精騎從故道往收察哈爾部衆獲馬一百三十牛七十又躡追其逃人俘獲二百户賜從征將士及被傷士卒俘獲人口有差刲牛八祭纛告天乃班師將至瀋陽宴諸貝勒大臣諭曰䝉天眷佑初次令兩幼弟隨征逺國克著勤勞刻期奏凱宜錫美號以示褒嘉貝勒多爾衮號為墨爾根岱青貝勒多鐸號為額爾克楚琥爾甲午朝鮮遣使運送米穀先是元年秋撤兵義州以其地仍歸朝鮮諭令市糴米穀既而國王李倧遣使貢方物謝恩言創殘之餘未有米穀市糴太宗與書曰我國糧米若止供本國民人原自充裕邇因䝉古諸貝勒攜部衆來降者不絶概加贍養所以米粟不敷爾與毛文龍糧餉已經七年我豈似彼無故索取惟今嵗市糴一年以濟窘乏爾能開糴助我方見敦睦之誼爾云平安黃海二道俱經殘破然所餘尚多且六道仍如故也若願以糧相濟則從鴨緑江運亦可海運亦可至於我國逃人當兩國盟誓時原議自盟之後爾國即行送還爾並未踐約後爾弟歸國復約以過江日為始送還逃民亦未見送還爾云駐兵義州縱有逃民無由得知若撤義州兵回各守封疆有逃來者便易稽察今我撤兵之後逃往人數已察出甚多矣從前相約凡遇間諜之人彼此必執而歸之近乃有定州外郎金惟同潛來窺伺經旬方返若不加禁絶恐致生亂階特此相告命大臣同來使齎往事在元十二月年至是李倧遣官齎書申辨金惟同非其所遣貢春季方物並米二千石更以一千石在江中平價市糴嗣復以奉諭詰問納我叛逃事遣使齎書來報其書曰日者邊臣傳致來書閲之不覺駭貴訝敝邦既與容受叛亡于義不可故曽有逃來人國誓天約和口輒即縳送既得來示即令邊臣廣加察訪報稱正月十一日晚有不辨滿漢二十餘人乘白馬由鎮江後山無人處橫過向海邊去似往投毛文龍營者當時既失踪跡無由得其實狀姑此具復幸貴國諒之三月戊子發帑金資民婚娶詔曰國家疆域日開首重生聚國中有貧乏無妻室者可給資令其婚娶于是發帑金分賜無妻室之人夏四月戊戌犒牛莊築城夫役先是明兵屢由遼河來犯見天命十年六月天聰元年八月故修築牛莊城至是太宗念築城夫役勞苦以牛四十犒之丙辰宴來歸巴林部長先是喀爾喀巴林部為察哈爾林丹汗所殘破舉部往投科爾沁復為科爾沁擾害至是貝勒色特爾元太祖裔巴噶巴圖爾諾顔第三子台吉塞稜色特爾兄和托果爾昻哈之子滿珠什哩色特爾兄額布格岱洪巴圖魯之子阿玉什等率巴林部衆來歸太宗率諸貝勒出城五里宴之五月乙酉勞征明錦州凱旋軍先是聞明人棄錦州退守寧逺貝勒阿巴泰嶽託碩託奉命同八旗大臣率兵三千往征太宗躬謁堂子送出征諸貝勒于十里外授以方略又與明國諸臣書曰爾國如大厦將傾乃文武諸臣執迷不悟専事修葺城郭亦何益耶比聞察哈爾汗罷棄耕種欲就爾食窺伺邊境加兵于爾事在旦晚間耳我亦將率各路外藩䝉古兵築城逼居以俟秋成取爾禾稼爾等將挺身出戰耶抑閉城伏匿耶如欲出戰則以何兵禦我又以何兵敵察哈爾耶我軍往來甚便耕種樵採無所不可爾之軍民雖欲出而耕種樵採豈可得乎我本欲罷兵修好共享太平故屢次遺書開誠相示爾其思之如以我言為然可即遣使來報毋貽後悔也越十二日諸貝勒遣官奏捷言我軍至錦州松山獲人口及馬牛騾共八百墮錦州杏山髙橋三城並毁十三站以東墩臺二十一處殺守臺者三十人引軍還太宗遣官往迎賜諸貝勒馬各一駕出城五里御行幄凱旋諸貝勒大臣各至上前以次跪行抱見禮俘獲諸物分賜將士有差是月長白山迤東濱海呼爾哈部頭目禮佛塔布克善喀秀克依克拉來朝各賜鞍馬縀衣并弓矢櫜鞬六月甲午勞出征阿拉克綽特凱旋軍先是貝勒阿巴泰嶽託征明錦州至中途聞察哈爾固特塔布囊率部衆移踞阿拉克綽特部舊地遇歸降我國者輒行截殺遣人往覘之得實因遣使馳告太宗遣貝勒濟爾哈朗豪格率兵六百往征親出城簡閲士卒送之行事在五月辛未濟爾哈朗等擒戮固特塔布囊盡收其部衆俘人口獲駝馬牛羊以萬計至是師還太宗率諸貝勒出迎貝勒等隨上拜天乃朝見祭纛論功以所俘獲分賜將士秋七月戊寅喀喇沁部長乞盟䝉古喀喇沁部塔布囊蘇布地元太祖大臣扎爾楚泰之後裔世管喀喇沁六千户附于明為朵顔三衛都督都指揮偕其弟萬丹偉徴等以書來奏曰察哈爾汗不道傷殘骨肉我喀喇沁部落被其欺陵奪去户口牧産我汗與布延台吉博碩克圖汗鄂爾多斯濟農同雍謝布及阿蘇特阿巴噶喀爾喀諸部落合兵至土默特部落格根汗趙城地方殺察哈爾所駐兵四萬人我汗與布延台吉率兵十萬回時復值察哈爾兵三千人赴明張家口請賞未得而回又盡殺之今左翼阿巴噶及喀爾喀部落遣使來約欲與合力興師且有與天聰皇帝同舉兵之語是察哈爾汗根本搖動可乘此機秣馬肥壯及草青時同阿巴噶喀喇沁土默特興師取之大國如欲往征即宜秣馬厲兵至期進發太宗遣使齎書諭之曰爾等以察哈爾汗不道欲與我國和好合兵討之可各遣人來議事在二月七月喀喇沁部以喇嘛四人率五百三十人來乞盟命貝勒阿濟格碩託薩哈璘迎宴既至復賜宴與盟誓自此喀喇沁拉斯喀布汗烏勒赫貝勒等舉部來附先是元年秋奈曼部長衮楚克巴圖魯來歸之後其侄鄂齊爾率衆循徼截殺察哈爾兵百人獲馬牛二百餘來獻太宗嘉之賞甲一副賜號和碩齊是年冬召衮楚克巴圖魯同敖漢部長索諾木杜稜塞臣卓哩克圖至駕出城迎之御殿設宴備陳樂舞賚金珠皮帛甲胄鞍轡等物甚厚賜塞臣卓哩克圖號曰都喇爾巴圖魯索諾木杜稜號曰濟農二年五月大軍𠞰察哈爾固特塔布囊于阿拉克綽特地衮楚克巴圖魯隨征同扎嚕特部台吉喀巴海率衆奮擊斬察哈爾台吉噶爾圖獲七百人八月來獻俘賜衮楚克巴圖魯號達爾漢喀巴海號偉徴九月己卯賚從征察哈爾將士九月癸亥太宗親統師征察哈爾前期分遣巴克什希福等傳令西北歸順外藩䝉古部長率兵來㑹乙丑敖漢部索諾木杜稜奈曼部衮楚克巴圖魯㑹于都爾弼地丙寅喀爾喀部諸貝勒㑹于遼陽庚午扎嚕特部台吉喀巴海㑹于綽囉郭勒地大軍駐營七日喀喇沁部蘇布地萬丹偉徴與拉斯喀布汗弼喇什台吉等先後率兵至並賜宴郤所獻財幣駝馬初來㑹師者皆賜甲胄丙子大軍進發乘夜馳至錫爾哈錫伯圖英湯圖諸處擊敗察哈爾部衆選精騎追勦戊寅至興安嶺俘獲無算抗拒者殺之其降者編户攜歸己卯論功行賞以俘獲人口分賜將士凡宗室之從征及居守者各牛一先是巴克什希福往約科爾沁部㑹師綽囉郭勒土謝圖汗奧巴等言先自掠察哈爾然後來㑹太宗復遣希福率勇士八人往邀因駐營待之奧巴掠畢遽歸惟台吉滿珠什哩貝勒莽古斯之孫及貝勒洪果爾之子巴敦以所俘獲來㑹賜滿珠什哩號達爾漢巴圖魯巴敦號達爾漢卓哩克圖又各優賚財幣駝馬牛羊冬十月丙申嚴禁擅殺降人初大軍進征察哈爾時以疲馬留于敖漢濟農城中令每旗官一員守之有達敏者因病亦留居適察哈爾國嘛哈噶喇率衆來降達敏率從者掠其財物盡殺其男婦太宗聞之誅達敏其隨掠者各鞭八十貫耳鼻以徇至是師旋渾河諭敖漢奈曼巴林扎嚕特諸貝勒曰聞各處來降者爾等每邀而殺之甚非我撫恤流離同仁一視之意今後來降之人見殺若諸貝勒知之罰人十户貝勒不知而屬下人妄行劫殺者抵死妻子為奴舉首之人留養內地爾諸國可于各邊界遍置哨卒違者罰牛五哨卒有不聽遣者罰牛一十二月丁亥朔扎嚕特右翼來歸先是扎嚕特右翼貝勒色本元太祖裔即天命四年陳擒五年釋歸者因察哈爾林丹汗侵掠之奔依科爾沁科爾沁弗能贍養至是偕其弟瑪尼來奏聞上撫字懷柔不遺遐邇願率部衆歸依樂土太宗率諸貝勒出迎一里外還御殿受朝大宴之又瑚弼爾圖色本伯父巴彥達爾伊爾登之子之子根都爾珠徹果勒圖之子桑古勒桑阿爾齊來奏臣等前因察哈爾兵至離散往附科爾沁果勒圖已故瑚弼爾圖等以科爾沁侵擾難堪願依聖主盡率所部來歸已至開原之北遣臣等進馬駝朝見太宗即遣官各指與駐牧之地時東方巴雅喇部頭目伊爾滮圖爾哈布韜伊圖喀率衆來朝以貂狐皮入貢戊子定獵射質驗令前此行獵令諸貝勒約誓從人勿爭奪至是太宗率貝勒出獵于東北四百里外三窪地諭諸貝勒傳令射中之獸有爭論者付審理官質對不問貝勒及凡人但驗射中傷痕相符即付之是行也太宗親殪五虎從臣皆驚服神勇皇清開國方略卷十一
