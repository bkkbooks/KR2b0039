body:
  text: 欽定四庫全書皇清開國方略卷二十二太宇文皇帝崇德元年丙子五月至十一月崇德元年五月丙午定內院官制時議叙內院官員以剛林為內國史院大學士范文程鮑承先為內祕書院大學士希福為內宏文院大學士其頂帶服飾及隨從人役俱視梅勒章京羅碩羅繡錦為內國史院學士占巴為內祕書院學士瑚球王文奎為內宏文院學士其頂𢃄服飾及隨從人役俱視甲喇章京內祕書院舉人恩國泰仍同九人內院辦事癸丑行太廟薦新禮時初獻櫻桃太宗命內祕書院大學士范文程薦于太廟仍令嗣後凡新進果品五榖先薦太廟然後進御著為令丁巳設都察院官太宗諭新授都察院諸臣曰爾等身任憲臣職司諌諍朕躬有過或耽遊畋邇聲色信任奸佞廢棄忠良黜有功陟有罪俱當直言進諌至于諸王貝勒大臣如有曠廢職業黷貨偷安及朝㑹不敬冠服違式部臣容隱者爾等即據實參奏或六部聽斷不公及事未審結誑奏已結者亦惟爾等察究凡人在部控告該部未經審結又赴告于爾衙門者爾等察其虗實應奏者奏不應奏者懲禁之明國陋規爾衙門亦通行賄賂之所爾等當互相防檢若以私讐誣劾經朕察出定加以罪其餘章奏所言是朕即從之所言非朕亦不加罪必不令被劾者與爾面質至于無職之人小節過犯當加寬宥我國初興禮制多未嫻習爾等教誡而釋之可也己巳以大凌河降將張存仁為都察院承政同時以祖澤洪為吏部承政韓大勛為户部承政姜新為禮部承政祖澤潤為兵部承政李雲為刑部承政裴國珍為工部承政張存仁疏言臣自歸國以來人之賢否事之利弊細心揆度籌之已熟今蒙皇上推誠委任俾司言職切思皇上創立此衙門臣即為創立之官臣而忠直後之人其忠直必有過於臣者臣而邪佞後之人其邪佞亦必有甚於臣者所慮用臣之心行臣之事他人不敢彈劾而臣彈劾之他人不敢更張而臣更張之舉國之人必共加攻擊使臣上無以報主恩下無以伸已志獲罪滋甚臣雖至愚豈不知隨衆然諾其事甚易發奸摘伏其勢甚難誠見夫不如是不足以盡職業用敢于受任之始瀝誠奏聞如臣假公濟私貽誤國事乞治臣以欺罔之罪若臣所言為國衆口交誣伏祈皇上睿斷太宗覽奏曰此必知有其人而為是言但朕素不聽讒毁惟親見者始信之且朕志定于上而諸臣䝉澤于下縱有奸邪豈能售其術哉癸酉征明庚午命武英郡王阿濟格饒餘貝勒阿巴泰額駙揚古利大臣宗室拜音圖談泰葉克舒葉臣阿山圖爾格宗室芬古額駙達爾漢率師征明太宗御翔鳯樓召睿親王多爾衮豫親王多鐸肅親王豪格成親王嶽託及出征王貝勒大臣等分列左右諭之曰行師之道在慎終如始庶無疏虞爾等遇殘破城池及前所攻克之良鄉固安等城事見天聰三年十二月可取與否當各抒所見先事計議不可退有後言意有不合聽武英郡王剖斷毋得違背俘獲人口牲畜諸將毋得互相爭競軍士亦不得以所獲私媚本主先征大同時察哈爾部圖巴濟農率所部全駐于彼比命武英郡王往取而師行甚緩此次慎勿效尤至彼處之人出城野戰破之甚易往者䝉古鄂齊爾桑扎嚕特部貝勒巴圖魯詹阿嚕科爾沁部人額駙多爾濟厄魯特部貝勒三人皆上所親信任用之人曽率數人敗宣府兵五百朕以此告爾等者蓋欲爾等知其大略也癸酉太宗出撫近門列大駕鹵簿詣堂子行禮又列八纛拜天畢親至演武場誡諭出師王貝勒大臣等遣之行武英郡王等師行後五日命前鋒將領勞薩蘇達喇努山鄂碩卦爾察鑲白旗錫特庫鑲藍旗錫特庫等率甲士一百十八名往明國沿邊躡踪成親王嶽託率諸將進見諭之曰明國聞我兵至必來邊外哨探爾等從察罕諾爾大草灘敖漢城南赴蘇布地杜稜城可令卦爾察錫特庫等率兵往察罕城偵探若得其向外踪跡視其多寡遣人從後尾追或得或不得務定一期㑹之地凡遇敵敵雖分路竄走我兵不可驟回必視敵所向星夜窮追截其必經之路自必就擒矣師還之日可由去路北邊而回爾等往返晝行不難防禦特恐秣馬憩息之時夜分弛備之候敵人猝至不可不加之意爾爾成親王其以朕言書付將士令其識之勿忘比勞薩等偵探至冷口遇明哨卒十四人斬三人生擒一人獲馬十五匹以還即以馬匹賞出征將士六月戊子以忠直朂都察院諸臣太宗御清寧宫都察院承政阿什達爾漢奏言有奴訐主讞實應離主諭曰爾等大臣不但此等小事應奏嗣後即朕有過失及親王郡王以下各官有怠政壞法民人之左道惑衆者俱當不時奏聞若舍其大而敷陳細故非忠直之道也阿什達爾漢奏曰臣等荷蒙皇上委任不先正直以修其身何以責人有所見聞豈敢隱匿不奏祖可法奏曰臣等惟皇上是懼爾他復何懼張存仁奏曰祖可法所言非也忠直為國之臣雖格君心之非亦所不懼何論他人太宗曰然人若正直雖天地鬼神不能動搖人主何得而奪之乎秋七月丙辰諭大學士等以恩服外藩䝉古之效太宗諭大學士希福剛林范文程曰昔科爾沁部土謝圖額駙有名馬曰杭愛朕曽以甲十副往易之彼不與察哈爾汗强索之止豫一胄從此科爾沁諸貝勒與之解體察哈爾汗又以一胄遺阿嚕濟農索馬千匹阿嚕濟農曰豈有一胄而易馬千匹者乎此直欲搆釁而來侵犯耳與之馬五百從此阿嚕諸貝勒亦為解體科爾沁卓哩克圖親王有一鷹能橫捕飛鳥察哈爾汗又遣人往索卓哩克圖親王欲不與土謝圖額駙勸令與之既取其鷹一無所償並送鷹之人亦不令見如此人心何從而服今各處蒙古每次來朝皆厚加恩禮因此俱傾心相附雖去猶戀戀而䝉古各國亦從此富足安閒由此揆之以力服人不如令人中心悅服之為貴也希福等奏曰治之以德則化治之以刑則敗此之謂也八月丁卯諭諸王大臣等勤飭子弟太宗諭曰爾諸王大臣等敬聽朕言昔太祖時八旗子弟無論長幼一聞行師出獵率皆踊躍爭先秣馬厲兵自㸑而食國勢之隆皆由勞瘁所致今子弟等每有調遣或托言妻子有疾或以家事為辭國勢何由而振乎諸王大臣奏曰誠如聖諭嗣後臣等當加意訓飭不敢怠忘甲戌申禁部臣勞民營造都察院奏言皇上盛德招徠遠近聞風歸附新附之人加意撫綏給以房屋仁之至也聞工部撥房與居復造新房給還原主往往違例擴充耗費民力上以所奏示諸王諸王曰似此勞民踰制當懲以法太宗曰部臣多未諳練若事事加罪反增茫昧可集該部諸臣嚴飭之後有違者罪之是日蓋州守臣以揭取匿名帖入奏帖云副將蔡永年與明國合謀每月申文明國請修築旅順口並令各島修築完固一聞發兵即移知沈總兵㑹同祖總兵一齊恢復海蓋遼潘四城意欲坑陷官兵動搖中外人心也且兩國既已安寧爾永年每月送信佯附于此暗通于彼中懷二心殆欲以計敗兩國也夫受一朝之爵又希恩兩國喪失綱常幸圖官職情重罪大爾其慎之太宗覽畢曰此必仇人欲誣陷蔡永年者可以此帖示永年九月庚申遣兵往援鹻場先是鹻場守將正古特瑭珠率兵三十人躡踪遇明兵不戰而還又前哨阿山管下薩賴為敵所傷正古特等棄之而歸後薩賴復蘇下法司鞫實論正古特瑭珠罪命免死罰鍰是月戊申戶部承政英固爾岱瑪福塔等齎人參至朝鮮路遇明哨卒詢知明逰擊四員率兵二千入鹻場即率百人往躡其後隨以奏聞太宗命武善吉思哈率每旗官二員兵五百名星夜往援鹻場庚申守將伊勒慎列列琿齊薩托克屯珠薩爾布等八月乙亥海州河口守將伊勒慎托克屯珠傅岱牛莊守將瑚魯喀耀州守將英格訥聞明國有捕魚船至率甲士一百五十人乘小舟自遼河而下遇三船獲三十三人並縀匹等物賞同往以獻即以所獲民將士編其人為奏言臣等五人追敵至娘娘宫渡口望見兩岸敵船百餘橫截遼河臣等船小兵寡欲進擊恐難驟返臣烈烈琿步兵在海州河口立營臣齊薩在河岸立營靠桑阿地方臺軍家口俱行撤回令其男子執火炮器械夾道防護髙柳樹路口則有伊勒慎步兵在彼立營恐敵誘我兵侵犯他處遣薩爾布遷移鹻場居人其近邊居人亦令遷移又恐敵船逆流而上復駕小舟潛伏海州河口防之因解所獲明人一名命伊遜率每旗官一員兵一百四十名往援伊勒慎等軍次日復命安平貝勒杜度統護軍五十名往援後伊遜等以明兵船已退自娘娘宫渡口班師己巳勞征明凱旋軍先是七月辛酉出征明國武英郡王阿濟格饒餘貝勒阿巴泰等遣內國史院學士羅碩奏言臣等于六月二十七日入邊兩黃旗自巴顔德木入兩白旗正藍旗自坤都入兩紅旗鑲藍旗自大巴顔入入邊之第八日相㑹于延慶州明人知我出師之期遍諭居民有藏匿山谷者罪之皆收集入城又我兵所過地方已經殘破俘獲無多欲先遣兵送恐兵少則途中可虞多遣又分兵勢是以未果至訊所獲明人並所得塘報有令固守城池俟滿洲兵至務出竒計或擊其中或擊其後等語臣等於未入長城之先攻克鵰鶚長安嶺二城敗敵七次俘獲人口牲畜共萬五千二百三十擬於七月初七日進兵入長城九月己酉阿濟格復遣哈木圖恩國泰奏言仰賴皇上德威我師所向明人震讋莫敢逆拒遂直入長城過保定府至安州克十二城凡五十六戰皆捷生擒總兵巢丕昌等俘獲人口牲畜十八萬太宗命梅勒章京金礪甲喇章京金維城等齎糧往濟昻古鼐海賴率護軍四十名衛其後癸丑命喀木圖恩國泰齎敕慰諭出征王貝勒大臣等賜武英郡王阿濟格鞍馬一馬三饒餘貝勒阿巴泰馬二額駙揚古利及八旗大臣馬各一令侍衛五員同往迎之壬戌武英郡王阿濟格等遣尼堪奏言臣等還軍時令阿山談泰武賴恩格圖率每牛録甲士四人埋伏軍後有明遵化三屯營守備一員率兵來探談泰恩格圖集兵圍之殱焉獲馬六十六匹及我軍出邊又有山海關千總一員百總四員率馬步兵二百躡我軍後遇阿山盡殺之獲馬八十匹生擒百總一員於是太宗預遣瑪福塔等率每旗章京往遼河岸備船以濟又諭武英郡王阿濟格饒餘貝勒阿巴泰曰爾等凱還朕將出城十里相迎王貝勒可率梅勒章京以上及陳獲官員先至前途相見己巳太宗出地載門十里往迎之因率凱旋王貝勒大臣等列八纛拜天畢太宗御黃幄阿濟格率衆跪捧獻捷表文內國史院大學士剛林內祕書院大學士范文程等接表文至御前宣讀畢太宗命剛林諭勞阿濟格等曰王暨諸大臣仰體天心同謀協力故能迅奏膚功今征途勞瘁可進前行抱見禮阿濟格出班近前行一拜禮抱見太宗見其體貌癯瘦惻然淚下次貝勒大臣等如前行禮畢次陳獲總兵巢丕昌等行跪拜禮太宗命阿濟格阿巴泰揚古利近御座右側坐諸貝勒大臣及出征將士俱依次坐右側設大宴以金巵酌酒親賜阿濟格阿巴泰揚古利及大臣等各一巵率凱旋王貝勒等謁堂子行禮自撫近門入申刻還宫越日辛未大學士范文程剛林等傳諭凱旋王貝勒大臣等曰朕聞軍士後隊方至舊遼河沃赫渡口爾等抵家已二日矣可速往迎之夫君享安寧臣膺尊顯俱兵民是賴即爾等勳名亦藉士卒之力乃不思疆場效命之士而各圖家室之安耶衆大臣對曰誠如聖諭臣等願親自往迎太宗曰管旗大臣等免其親往其梅勒章京以下選能事者往迎之冬十月丁丑禁以金飾鞍轡太宗御篤恭殿集羣臣諭之曰國家崇尚節儉母事侈華凡鞍轡等物不許以金為飾有金之家或造盤盂等物匱乏時尚可毁為他用若以之塗飾則耗費必多著永行禁止至軍行所獲之帛亦當節儉用之勿以取之易而遂忘紡績之勞也丙戌授錦州降人胡有升等世職先是八月癸未太宗諭諸王貝勒大臣曰武英郡王阿濟格統師征明今將出邊宜别遣大臣往山海關進發明國知我兵至恐山海關有失必來救援武英郡王庶得乘隙從容出邊議定命睿親王多爾衮率右翼兵由中後所入豫親王多鐸率左翼兵由錦州入太宗親送至演武場授方略先後啓行丙申豫親王多鐸遣啓心郎祈充格馳報軍務戊戌命宗室鞏阿岱率每旗護軍章京一員每牛録護軍一名往濟師並令祈充格穆成格同往睿親王多爾衮豫親王多鐸至錦州駐營城內有道人崔應時與其黨五十人為書數千言言明國當滅我朝當興宜速進兵攻取山海關遣胡有升特獻多鐸軍前約為內應多鐸許之定計二十二日進攻為城中人所覺執應時置獄中有升率同謀之張紹禎門世文門世科秦永福來歸冬十月癸酉睿親王多爾衮等班師太宗出福勝門五里迎勞之至是凱旋諸王貝勒大臣等率胡有升等朝見諭之曰爾等雖未成事而意在歸順殊屬可嘉于是各授世職以胡有升為三等梅勒章京張紹禎門世文為三等甲喇章京秦永福門世科為牛録章京並賜妻室冠服弓矢鞍馬銀帛奴僕房屋及一切器物庚子禁屯積米榖並令及時耕種太宗命户部承政英固爾岱瑪福塔傳諭曰朕惟榖甚賤傷農甚貴傷民有糧之家輒自居奇必待市價騰貴方肯出糶此何意耶今當各計爾等家口足用外有餘即以糶賣毋得仍前壅積致有榖貴之虞先令八家各出糧一百石交市糶賣以充民食至樹藝所宜各因地利卑濕者可種稗稻髙粱髙阜可種雜糧勤力培壅乘地滋潤及時耕種則秋成刈穫户慶充盈如失時不耕糧從何得耶十一月丙午清查察哈爾喀爾喀科爾沁諸部户口先是十月丁亥命內宏文院大學士希福䝉古衙門承政尼堪塔布囊達雅齊偕都察院承政阿什達爾漢往察哈爾喀爾喀科爾沁諸部稽户口編牛録讞庶獄頒法律禁奸宄並諭來㑹之親王郡王貝勒貝子等曰今俟河冰凍合即當起兵欲朝賀者暫停止之至是還奏以五十家編為一牛録具載牛録姓名及甲士清冊以獻己酉喀爾喀部遣使來貢先是天聰九年五月喀爾喀部以書一函付察哈爾部索諾木台吉謂倘遇滿洲國天聰皇帝之人即付之又以書招察哈爾汗子孔果爾額哲貝勒多爾衮等征服察哈爾并得其書以獻書曰瑪哈撒嘛諦車臣汗土謝圖汗車臣濟農率大臣諸貝勒奏書于滿洲國天聰皇帝人君撫有大寶以宣揚美名于諸國當興起教化輯寧遠人我等雖不能奮興然誼屬同宗倘念舊業尚存互相通好信使不絶則我等當共享太平之福尊為有道之主也遺察哈爾書曰瑪哈撒嘛諦車臣汗諭林丹汗子孔果爾額哲在先執琿貝勒送還彼此締盟後因國亂遂不相往來自爾汗棄世聞舉國全來附我秋來即令哨卒偵探實耗我等與爾汗原係同宗滿洲豈爾等之主耶即宜來歸勿再遲延比還師貝勒嶽託以疾駐歸化城有土默特人密告言博碩克圖土默特部長格根汗四世孫子俄木布遣人往喀爾喀處必有與之同來者嶽託因遣阿爾津武巴海喀木齊哈尼堪四人侯于途喀爾喀百人及明使者四人果與博碩克圖子所遣人同至時博碩克圖子乳母之夫毛罕密遣人告喀爾喀人云滿洲兵在此汝等當回喀爾喀人聞信遂還阿爾津武巴海等兵追及之擒毛罕所遣之十人及明使四人獲駝五十馬四十六貂皮四百有竒又得烏珠穆沁部貿易人四十六名駝三十七馬一百有八貂皮二百二十初毛罕稱博碩克圖之子俄木布為西土根汗自稱為烏爾隆額齊克達爾漢貝勒又殺害來歸我國之察哈爾什􅀈竒塔特武班扎爾固齊竒塔特台吉又與明沙河堡參將通謀稱明國為一路喀爾喀為一路土默特為一路因遣人往喀爾喀為土默特人密告事覺斬毛罕併其黨羽以阿嚕部民與喀爾喀人同謀藏匿駝馬遣上默特人往勦之分土默特壯丁三千三百七十名為十隊每隊以官二員主之授以條約又授鄂爾多斯條約凱旋後賜土默特部託博克姓博爾噶古祿格姓納喇二人俱𨽻察哈爾部天聰六年內附鄂爾多斯部濟農即額璘臣毋之使臣綽爾濟喇嘛濟農使臣卓哩克圖固嚕台吉額璘臣從弟之使臣囊素喇嘛及其從人鞍馬器物十二月喀爾喀部瑪哈撒嘛諦車臣汗碩壘左翼部長摩囉貝勒之子及烏珠穆沁部車臣濟農多爾濟元太祖裔翁衮都喇爾貝勒之子蘇尼特部素塞巴圖魯濟農元太祖裔綽爾衮諾顔之子浩齊特部䇿凌伊爾登土謝圖元太祖裔德格類額爾德尼之子阿巴噶部都思噶爾扎薩克圖濟農元太祖弟布格博勒格圖裔布達什哩之子等大小貝子遣偉徴喇嘛弼徹齊達爾漢武巴什達爾漢塔布囊托博兊冰圖四頭目率一百三十二人齎書來朝貢駝馬貂皮等物書曰成吉思汗後裔瑪哈撒嘛諦車臣汗等書天聰皇奏伏惟帝皇帝躬膺厚祉起居康泰向者察哈爾胡圖克圖汗居必不可敗之勢自取滅亡切思欲圖太平之道皇帝自有睿裁但撫有大寶必聲名洋溢為天下法使政令昭煥如日方升庶幾當時利賴萬世揚休倘䝉睿鑒以此言為然願往來通問不絶共守盟約以享太平太宗以其初通朝貢厚賚之十年二月命偉宰桑巴賴山津伯布格齎敕往諭曰爾謂朕欲圖太平之道自有睿裁此言誠是朕凡征伐人國未有出無名之師而以貪得為事者向因明國與我夙讐以兵征之察哈爾貪明國財幣助之以兵朕是以聲罪致討䝉天眷佑以察哈爾全部與朕今爾又以馬鬻于明人貪其財物非助明而何爾行事如此乖悖朕亦不以介懷其講和事宜専俟爾等音耗也至是偉宰桑等偕其進貢使臣偉徴喇嘛弼徹齊武巴什托博兊冰圖烏珠穆沁部納木琿津等六人及從者一百五十六人至越二日偉徴喇嘛等朝見陳所進貢物跪獻其主奏疏曰私鬻馬匹我等正欲禁止因見喀爾喀七旗及厄魯特四部落皆與明國貿易故效而行之耳使臣行三跪九叩禮賜之宴歸國時太宗遣察罕喇嘛率六十四人偕往賜瑪哈撒嘛諦汗及衆台吉大臣雕鞍鞓帶弓刀撒袋金銀器皿珊瑚素珠貂鑲朝衣蟒縀白金布匹等物並賜貢使偉徴喇嘛等衣物縀布等有差辛亥徴兵外藩時將征朝鮮遣官齎敕調兵于外藩䝉古諸貝勒敕曰凡應出兵諸貝勒等可將各旗派定兵丁所乘駝馬俱烙印繫牌以為標識甲胄器械亦各為記號備二旬糗糧約本月三十日俱㑹集盛京科爾沁由卓索口入喀爾喀察哈爾阿巴噶由十方寺入入邊以後宜嚴飭士卒勿探親戚勿入城堡有任意妄行紊亂法度者諸將其嚴行約束之癸丑訓諸王貝勒等遵舊制習騎射太宗御翔鳯樓集諸親王郡王貝勒管旗大臣及都察院官命內宏文院大臣讀大金世宗本紀諭衆曰爾等審聽之世宗者蒙古漢人諸國聲名顯著之賢君也故當時後世咸稱為小堯舜朕披覽此書悉其梗槩殊覺心往神馳耳目倍加明快不勝歎賞朕思金太祖太宗法度詳明可垂久逺至熙宗合喇及完顔亮之世盡廢之耽于酒色盤樂無度效漢人之陋習世宗即位奮圖法祖勤求治理惟恐子孫仍效漢俗預為禁約屢以無忘祖宗為訓衣服語言悉遵舊制時時練習騎射以備武功雖垂訓如此後世之君漸至懈廢忘其騎射至于哀宗社稷傾危國遂滅亡乃知凡為君者耽于酒色未有不亡者也先時儒臣巴什達海庫爾禪等屢勸朕改滿洲衣冠效漢人服飾制度朕不從輒以為朕不納諫朕試設為比喻如我等于此聚集寬衣大袖左佩矢右挾弓忽遇碩翁科羅巴圖魯勞薩挺身突入我等能禦之乎若廢騎射寬衣大袖待他人割肉而後食與尚左手之人何以異耶朕發此言實為子孫萬世之計也在朕身豈有變更之理恐日後子孫忘舊制廢騎射以效漢俗故常切此慮耳我國士卒初有幾何因嫻于騎射所以野戰則克攻城則取天下人稱我兵曰立則不動搖進則不回顧威名震懾莫與爭鋒此番征燕京出邊我之軍威竟為爾大臣所纍矣故諭爾等其謹識朕言皇清開國方略卷二十二
