body:
  text: 欽定四庫全書皇清開國方略卷三十二世祖章皇帝初即位未改元崇德八年癸未八月至順治元年甲申十月崇德八年八月丁亥世祖章皇帝嗣位世祖章皇帝太宗文皇帝第九子也天縱徇齊昌符協應崇德八年八月庚午太宗文皇帝龍馭上賔禮親王代善集諸王貝勒貝子公及文武羣臣定議奉世祖章皇帝纘承大位王等共立誓書祭告郊廟並議以鄭親王濟爾哈朗睿親王多爾衮輔理國政丁亥世祖章皇帝即皇帝位以明年為順治元年頌詔大赦九月丙午以太宗文皇帝遺詔頒示朝鮮減額貢方物朝鮮國王李倧以擒獲明國偵探兵船一隻殺八人生擒九人于是月甲午遣使來獻賜其使臣葉祿等銀兩貂皮視舊例倍之以敕奬諭國王令將獲船將士量加升賞仍嚴飭邊吏益加防禦又諭曰我皇考恩德崇隆洞悉爾朝鮮疾苦以嵗貢方物較多兼之奉命使臣沿襲漢人定例受餽過厚遺纍民人因念民皆吾民恐致疲困曽將嵗貢方物及使臣受餽數目酌定裁減俟秋頒行朕今仰體皇考軫恤之仁遵奉遺詔頒示爾國永為定例并將罪在不赦之崔鳴吉及金聲黑尼等從寬槩行釋放回籍是月海州河口守將伊勒慎擒獲明國兵船二隻殺十人生擒四人解送來京冬十月丁丑征明寧逺師還先是九月壬寅鄭親王濟爾哈朗武英郡王阿濟格統領大軍載紅衣炮及諸火器往征明寧逺瀕行親王郡王貝勒貝子及八旗大臣等俱詣堂子行禮復列八纛拜天畢鳴炮西發甲寅大軍抵中後所乙卯薄暮移軍城北填平壕塹以雲梯挨牌及紅衣炮急攻之壬辰城頺敵奔潰遂拔之陳斬遊擊吳良弼都司王國安等二十餘員及馬步兵四千五百人俘四千餘人獲駝馬牛羊金銀等物無算復分兵往略前屯衛中後所等處俘四百人庚申我軍自寧逺進發抵前屯衛周視戰壘立營柵運挨牌雲梯紅衣炮於城西攻之冬十月辛酉朔午刻拔其城斬明總兵李輔明袁尚仁及副將參將三十餘員兵四千餘級俘獲二千餘人駝馬火器無算護軍將領阿濟格尼堪布善率軍士至中前所明總兵黃色聞前屯衛陷棄城遁官兵追襲黃色敗走遂拔中前所俘獲千餘人并駝馬火器等物至是師還命貝勒阿巴泰率文武各官出迎詣堂子行禮謁陵奠茶酒入城以所俘獲賜出征諸王貝勒貝子公大臣及八旗官員有差十一月庚子鑄紅衣炮於錦州令管旗大臣劉之源吳守進金維城曹光弼率將士赴錦州督鑄紅衣炮是月明把總劉自強自石城島來歸令户部安插蒙古納哈楚賴自寧逺來歸令理藩院安插十二月壬戍明守備孫友白自寧逺來降令給與房屋奴僕器物順治元年春正月庚寅朔世祖章皇帝御殿受朝世祖章皇帝詣堂子行禮還御殿受朝賀停筵宴免上表併年例進獻命禮親王代善勿拜行禮時世祖顧見喀爾喀部使臣跪拜參差問侍臣曰此何國人乃行禮若是奏曰此北方投誠喀爾喀使臣也嵗貢駝馬未嘗有缺因尚未入我版圖是以未嫺禮節耳衆於是服上之睿照云朝鮮國王李倧遣陪臣景良弼等表賀元旦貢方物又於嵗貢外獻所獲倭刀等物並附餽攝政睿親王多爾衮禮物王謂攝政鄭親王濟爾哈朗及諸大臣曰朝鮮國王因豫取江華島時全其妻子不忍負恩故常以禮物來餽較諸王獨厚向嘗以此奏聞先帝先帝命受則受之今我等輔理國事義無私交且於外國有餽者受則滋擾不止一朝鮮也此等餽遺永行禁止如何諸王貝勒及議政大臣咸以為然遂定議嗣後凡外國餽送諸王貝勒禮物永行禁止著為令睿親王仍致書朝鮮曉以不受之故夏四月乙丑賜攝政睿親王大將軍敇印統軍伐明先是七年九月攝政鄭親王濟爾哈朗攻克中後所前屯衛山海關附近中前所人皆棄城走本年三月明寧逺沙河所二城人亦棄城走山海關外地盡為我有隨下令整軍器儲糧秣馬俟大軍進討大學士范文程上攝政王啓曰乃者有明流氛煽於西土水陸諸冦環於南服兵民搆亂於北陲我師變伐其東鄙四面受敵其君若臣安能相保耶顧雖天數使然良由我先皇帝憂勤肇造諸王大臣祇承先帝成業夾輔沖主忠孝格于蒼穹欲攝政諸王建功立業之會也竊惟上帝潛為啓佑此正成丕業以垂休萬祀者此時失機會而貽悔將來者亦此時何以言之中原百姓蹇罹喪亂茶苦已極黔首無依思擇令主以圖樂業雖問有一二嬰城負固者不過為身家計非為君效死也是則明之受病已不可治河北一帶定屬他人其土地人民不患不得患得而不為我有耳蓋明之徑敵惟在我國而流冦復蹂躪中原正如秦失其鹿楚漢逐之我國雖與明爭天下實掃除流冦也為今日計我當任賢以撫衆使近悅逺來蠢茲流孽亦將進而臣屬于我彼明之君知我規模非復往昔言歸于好亦來可知儻不此之務是徒勞我國之力反為流冦驅民也夫舉已成之局而置之後乃與流冦爭非長策矣曩者棄遵化屠永平兩經深入而返彼地官民必以我為無大志縱來歸附未必撫恤因懷攜二今當中嚴紀律秋毫勿犯復宣諭以昔日不守內地之由及今進取中原之意而官仍其職民復其業録其賢能恤其無告自翕然向順矣夫如是則大河以北可傳檄而定也河北一定可令各城官吏移其妻子避患于我軍因以為質又拔其德譽素著者置之班行俾各朝夕獻納以資輔翼王於衆論中擇善酌行則聞見可廣而政事有時措之宜矣此行或直趨燕京或相機攻取要當于入邊之後山海長城以西擇一堅城頓兵而守以為門户我師往來斯為甚便惟攝政諸王察之夏四月甲子以出師祭告太祖髙皇帝太宗文皇帝乙丑世祖章皇帝御篤恭殿賜攝政睿親王多爾衮大將軍印統軍伐明敇曰我皇祖肇造丕基皇考底定宏業重大之任付于藐躬今蒙古朝鮮俱已歸服漢人城郭土地雖漸攻克猶多抗拒當此創業垂統之時征討之舉所關甚重朕年沖幼未能親履戎行特命爾攝政睿親王多爾衮代統大軍往定中原用加殊禮錫以御用纛蓋等物特授奉命大將軍印一切賞罰便宜從事至攻取方略爾王欽承皇考聖訓諒已素諳其諸王貝勒貝子公大臣等當同心協力以圖進取庶祖考英靈為之欣慰欽哉王受敇印行三跪九叩頭禮賜王黃蓋一纛二黑狐帽貂袍貂褂貂坐褥涼帽蟒袍蟒褂蟒坐褥仍賜從征諸王貝勒貝子公等衣服鞍馬有差次日睿親王同豫郡王多鐸武英郡王阿濟格貝勒羅洛宏貝子尼堪博洛輔國公滿達海屯齊喀博和託和託恭順王孔有德懷順王耿仲明智順王尚可喜續順公沈志祥朝鮮世子李􅓭暨八旗大臣詣堂子奏樂行禮又陳列八纛向天行禮畢統領滿洲蒙古兵三之二漢軍及孔有德等兵聲炮啓行壬申大軍次翁後明平西伯吳三桂遣使來乞師時明流冦李自成已陷燕京崇禎帝后俱自經自成僭稱帝庚午攝政睿親王師次翁後賊首李自成遣人招吳三桂降三桂不從隨自永平返據山海關遣副將楊珅遊擊郭雲龍來致書書云三桂初蒙我先帝拔擢以蚊負之身荷遼東總兵重任王乏威望素所深慕但春秋之義交不越境是以未敢通名今我國以寧逺右偏孤立之故令三桂棄寧逺而鎮山海思欲堅守東陲而鞏固京師也不意流賊逆天犯闕以彼狗偷烏合之衆何能成事奈京城人心不固姧黨開門納欵先帝不幸九廟灰燼今賊首僭稱尊號據掠婦女財帛罪惡已極誠赤眉緑林黃巢祿山之流天人共憤其敗可立而待也我國積德纍仁謳思未泯各省藩鎮悉起義兵三桂身受國恩拒守邊境欲興師問罪以快人心奈京東貴地小兵力未集故特泣血求助竊思我國與朝通好二百餘年今遭此大變貴朝應惻然念之而亂臣賊子亦非拯危扶顛大義貴朝所宜容也夫除暴剪惡大順也也出民水火大仁也興滅繼絶大名也取威定霸大功也王以蓋世英雄值此摧枯拉朽之會誠難再得之時也乞念亡國孤臣忠義之害速選精兵直入中協西協三桂自率所部合兵以抵都門滅流賊于宫廷示大義于中國則我國之報稱豈有盡耶本應上疏于皇帝貴朝悉體制不敢輕瀆但未聖聰乞王轉奏王得書即遣學士占巴來衮往錦州諭漢軍齎紅衣炮向山海關進發癸酉睿親王師次錫喇塔拉報吳三桂書曰向欲與明修好屢行致書明國君臣不計國家喪亂軍民死亡曽無一言相答是以我國三次進兵攻略蓋示意於明國官吏軍民欲明國之君熟籌而通好也若今日則不復出此惟有底定國家與民休息而已豫聞流冦攻陷京師明主慘亡不勝髮指用是率仁義之師況舟破釜誓不返旌期必滅賊出民水火及伯遣使致書深為嘉悅遂統兵前進夫伯思報主恩與流賊不共戴天誠忠臣之義也伯雖向守遼東與我為敵今亦勿因前故尚復懷疑昔管仲射桓公中鈎後桓公用之為相以成霸業今伯若率衆來歸必封以故土晉為藩王一則國仇得報一則身家可保世世子孫長享富貴如河山之永矣己卯大軍入山海關吳三桂迎降賊首李自成敗走丁丑攝政睿親王軍次連山吳三桂復遣郭雲龍孫文煥來致書書云接王來書知大軍已至寧逺救民伐暴扶弱除強義聲震天地其所以相助者實為我先帝而三桂之感戴猶其小也三桂承王諭即發精鋭于山海以西要處誘賊速來今賊親率黨羽議聚永平一帶此乃自投陷阱而天意可知矣三桂已悉簡精鋭以圖相機𠞰滅幸王速振虎旅直入山海首尾夾攻逆賊可擒京東西可傳檄而定也再仁義之師首重安民所發檄文最宜嚴切更祈令大軍秋毫無犯則民心服而財土亦得何事不成哉王得書即星夜進發踰寧逺次於沙河戊寅師距山海關十里外賊首李自成率馬步兵二十餘萬挾崇禎帝太子第三子定王第四子及宗室晉王秦王漢王郡王等并吳三桂父襄與俱來復遣人招三桂降三桂不從賊遂圍山海關吳三桂哨騎來報賊已出邊立營睿親王隨命諸王等各率精兵迎擊遇賊唐通馬兵數百人于一片石我前鋒兵擊敗之生擒二人還己卯師至山海關吳三桂率衆出迎王大喜設儀仗吹螺同三桂向天行禮畢三桂率所屬各官謁王王謂三桂曰爾回可令爾兵各以白布繫肩為號不然同係漢人以何為辨恐致誤殺語畢令之先行遂入關時李自成率賊衆自北山橫亘至海列陳以待是日大風揚塵咫尺莫辨我軍對賊布陳不能橫列及海睿親王集諸王貝勒貝子公及諸大臣等謂曰爾等毋得越伍躁進此兵不可輕擊須各努力破此則大業成矣我兵可向海對賊陳尾鱗次布列吳三桂兵分列右翼之末號令畢諸軍齊列及進兵令軍士呼噪者再風遂止各對障奮擊大敗賊衆追殺至四十里賊首尾不相顧遁走燕京陳獲晉王朱審烜獲駝馬縀幣無算俱給賞隨征將士是日進吳三桂爵為平西王賜玉帶蟒袍貂裘鞍馬玲瓏櫜鞬弓矢等物令山海城內軍人剃髮以馬步兵一萬𨽻平西王隨睿親王直趨燕京追殺流賊時有明密雲巡撫王則堯降于李自成偽授兵政府尚書自成遣其招降吳三桂三桂羈留弗遣至是送於睿親王誅之五月己丑大兵定燕京攝政睿親王自山海關擊敗流冦隨與諸將誓約並諭衆曰此次出師所以除暴救民滅流冦以安天下也今入關西征勿殺無辜勿掠財物勿焚廬舍不如約者罪之仍曉諭官民示以取殘不殺共享太平之意諭下凡百姓逃竄山谷者莫不大悅各還鄉里剃髮迎降壬午師次撫寧縣知縣侯益光等率民出迎賜袍服仍令供職發倉粟賑民癸未師次昌黎縣知縣徐可大率民出迎賜袍服戒諭之仍令供職甲申師次灤州學正孫維寧率民迎降遂擢為知州戒諭之令發倉粟賑民沿邊各官來降以行人李丕著為永平道副將張邦謨遊擊唐志道等俱令照舊供職各賜袍服乙酉師次開平衛指揮陳任重李培元等率衆來降各賜袍服丙戌師次玉田縣經厯張彥主簿王家春守備盧文宇等率衆迎降以家春為豐潤知縣各賜袍服丁亥師次公羅店薊州監軍道李永昌豐潤縣副將趙國祚遵化間住總兵唐鈺副將尤可望守備陳良謨黃家順卜大式千總文三元等率衆降先是移檄沿邊及山陜等處李賊敗衄勢必西遁當於各處截殺毋令入城至是李自成焚燬宫闕盡括金銀幣帛載往長安材官常義吳有才唐有功自通州來降具言賊已西遁睿親王令諸王貝勒貝子公等率兵急追之五月戊子朔睿親王師至通州知州率百姓迎降己丑師至燕京故明文武官員出迎五里外睿親王進朝陽門老幼焚香跪迎內監以故明鹵簿御輦陳皇城外跪迎路左啓王乘輦王曰子法周公輔沖主不當乘輦衆叩頭曰周公曽負扆攝國事今宜乘輦王曰豫來定天下不可不從衆意令將鹵簿向宫門陳設王儀仗前列奏樂拜天行三跪九叩頭禮復望闕行三跪九叩頭禮畢乘輦入武英殿升座故明衆官俱拜伏王下令諸將士乘城概不許入民舍百姓安堵秋毫無犯庚寅睿親王諭兵部曰今本朝撫定燕京天下罹難軍民皆吾赤子出之水火而安全之各處城堡著遣人持檄招撫檄文到日剃髮歸順者地方官各升一級軍民免其遷徙其為首文武官員即親齎錢糧册籍兵馬數目來京朝見有雖稱歸順而不剃髮者是有狐疑觀望之意宜核地方逺近定為限期屆期至京酌量加恩如過期不至顯屬抗拒定行問罪發兵征勦至朱姓各王歸順者亦不奪其王爵仍加恩養又諭故明內外官民人等曰各衙門官員俱照舊録用可速將職名開報如虛飾假冒者罪之其避賊回籍隱居山林者亦具以聞仍以原官録用兵丁願從軍或願歸農者許該管官送至兵部分别留遣凡投誠官吏軍民皆著剃髮衣冠悉遵本朝制度各官宜痛改故明陋習共砥忠廉母朘民自利我朝臣工不納賄不徇私不修怨違者必置重典凡新服官民人等如蹈此等罪犯治以國法不貸辛卯睿親王諭故明言員耆老兵民曰流賊李自成原係故明百姓糾集醜類逼陷京城括取諸王公主駙馬官民財貨酷刑肆虐誠天人共憤法不容誅者我深用憫傷今令官民人等為崇禎帝服喪三日以展輿情著禮部太常寺備帝禮具葬除服後官民俱著遵制剃髮諭下官民大悅皆頌我朝仁義聲施萬代云壬寅宣捷告天頒示朝鮮蒙古是月己亥睿親王底定燕京捷音奏至壬寅世祖章皇帝率攝政鄭親王濟爾哈朗暨諸王貝勒羣臣拜天行禮畢御殿諸王貝勒羣臣上表慶賀以捷音宣示朝鮮及外藩蒙古乙巳命學士占巴侍衛巴泰齎敕諭大將軍攝政睿親王多爾衮曰朕聞王招降山海關總兵吳三桂大敗流賊自山海關至燕京沿途城堡歸順及燕京官民迎降捷音深用嘉悅此皆王運籌有方諸臣協心戮力之所致也兹遣官往勞王其益殫忠誠統率臣工佐成大業焉時征黑龍江呼爾哈部之梅勒章京鄂羅塞臣巴都禮甲喇章京沙爾琥達凱旋鄂羅塞臣巴都哩出師係上年十二月沙爾琥達出師係本年正月詔參政明安達禮往迎宴勞之以所獲人口分𨽻八旗其餘賞給出征將士九月甲辰世祖章皇帝至燕京睿親王與諸王貝勒大臣議遷都燕京遣輔國公屯齊喀博和託管旗大臣和洛會等齎奏迎駕奏言仰荷天眷皇上洪福已克燕京臣再三思維燕京勢踞形勝自古興王之地今既蒙天畀遷都於此以定天下則宅中圖治宇內朝宗無不通達可以慰天下仰望之心可以錫四方和恆之福伏祈皇上熟慮俯納焉七月癸巳上將遷都燕京遣官祭告上帝文曰荷天眷命錫我以故明疆土兹惟俯徇衆請定鼎作京用紹皇天之休永錫蒸民之慶告太祖髙皇帝太宗文皇帝文曰流冦李自成陷明北京崇禎自經隨命睿親王多爾衮為奉命大將軍統師西征吳三桂迎降整旅入關自成抗我顔行一戰敗之大兵追躡撫諭所過州縣直抵北京自成焚明宫闕竄走大軍追擊至慶都真定兩敗之賊勢益不支鳥獸駭散河北山東山西郡縣人民聞風歸降接踵恐後皆我皇祖皇考之素志也兹特虔告用慰在天之靈至燕地為厯代帝王都會諸王朝臣請都其地欲順衆志遷都于燕以撫天畀之民以建億萬年不拔之業八月丁巳命正黃旗內大臣和洛會為盛京總管左翼以鑲黃旗梅勒章京阿哈尼堪統之右翼以正紅旗梅勒章京碩詹統之每旗滿洲協領一員章京四員蒙古漢軍章京各一員駐防盛京又以傅喀納為熊嶽城城守官梭木拜為錦州城守官額蒙格為寧逺城守官拜楮喀為鳯凰城城守官烏什塔為興京城守官愛湯阿為義州城守官丹達禮為新城城守官伊勒慎為牛莊城守官青善為岫巖城城守官東京耀州蓋州海州鞍山廣城俱各設滿洲漢軍章京率兵駐防乙亥車駕發盛京九月甲辰至燕京世祖章皇帝自正陽門入宫冬十月乙卯朔世祖章皇帝定鼎京師頒詔中外大赦世祖既至燕京攝政睿親王多爾衮故明大學士馮銓等以入定中原萬方歸化宜登大寶用慰臣民聫章勸進允之先期詔禮官具典禮定郊廟之樂章曰平奉太祖髙皇帝孝慈髙皇后太宗文皇帝神主入太廟至期世祖章皇帝親詣圜丘告祭天地祝册曰皇天后土垂鑒無私我皇祖寵膺天命肇造東土建立丕基皇考開國承家恢宏大業臣以藐躬纘有鴻緒值明祚將終盜賊蜂起生靈塗炭中國無主欽承祖功宗德倚任親賢爰整六師救民水火內外同心徯望來蘇臣工衆庶僉曰景命不可違輿情不可負宜建一統表正萬邦敢不敬承天眷俯順民心定鼎燕京以綏中國禮畢御座諸王文武百官行禮大學士剛林奉寶跪進禮成上升輦鹵簿前導奏樂進大清門御皇極門諸王文武百官奏表行禮頒正朔於中外越曰告祭太廟社稷詔曰我國家受天眷祐締造東土皇祖肇興鴻業皇考式廓前猷遂舉舊邦誕膺新命逮朕嗣服越在沖齡敬念紹庭永綏厥位頃緣賊氛洊熾流禍中原爰是重屬親賢救民塗炭方馳金鼓旋奏澄清用解倒懸非富天下而王公列辟文武羣臣暨軍民耆老同心擁戴懇請再三用是祗告天地宗廟社稷定鼎京師緬維峻命不易創業尤艱況當改革之初更屬變通之會爰乃準今酌古嘉惠臣民勳賢懿親從優封賞悉除故明加派諸弊政民間逋賦概行豁免故明建言罷謫諸臣及山林隱逸懷才抱德者所在以聞民年七十以上給之粟帛吏民人等從前一切罪犯咸赦除之宏敷大賚式沛新恩惟爾萬方與朕一德皇清開國方略卷三十二
