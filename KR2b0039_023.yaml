body:
  text: 欽定四庫全書皇清開國方略卷二十三太宗文皇帝崇德元年丙子十二月至二年丁丑二月崇德元年十二月壬申征朝鮮先是十一月乙丑冬至祀天于圜丘太宗以朝鮮敗盟逆命將統大軍征之即于是日祭告天地宗廟並先期御篤恭殿命管兵部貝勒嶽託八月與肅親王豪格同降為貝勒集衆傳諭每牛録各選騎兵十五人步兵十人護軍七人共甲三十二副大臣石廷柱所統漢軍每甲士一人備箭十五甲士二人備長鎗一牛録二人備雲梯挨牌各一斧鑽錛鐝俱全馬匹軍械各令標記攜半月行糧于十一月二十九日㑹集城中己巳頒行軍律令曰今者往征朝鮮非朕樂于興戎特以朝鮮敗盟納我逃人獻之明國孔耿二王來降于我彼興兵截殺我師既至彼仍抗拒且遇我使臣不以舊禮齎去書詞拒而不視又遺書平安道洪觀察使云丁卯權許講和今已永絶當謹備關隘激勵勇士其書為英固爾岱等所奪見三月是彼之毁棄盟好包藏禍心將未有已不得已興師伐之若嗜殺殃民朕心有所不忍今與爾等約大軍所過勿毁寺廟逆者誅之順者撫之以城降者勿擾其城以堡歸者勿掠其堡凡陳擒官兵彼既拒戰當殺無赦逃亡來歸者恩養之所獲民人勿離其夫婦勿奪其衣服即老羸廢疾不堪攜歸者務令安居勿棄于道路婦女毋得淫亂違者軍法從事又傳諭曰軍士有不遵諭㫖擅離部伍殺降劫物者治以軍法又前次攻戰時往往有託詞捉生規避不進者今除前鋒哨軍外槩不許捉生犯者罪之十二月辛未朔外藩䝉古諸王貝勒各率兵來㑹太宗命鄭親王濟爾哈朗留守盛京武英郡王阿濟格駐牛莊備邊饒餘貝勒阿巴泰駐噶海收集邊民防禦壬申親統大軍征朝鮮命禮親王代善睿親王多爾衮豫親王多鐸貝勒嶽託豪格安平貝勒杜度等隨征管旗大臣分左右翼率諸軍卯刻出城右翼兵由往東京大路至渾河岸排列左翼兵由往撫順大路排列已刻太宗設鹵簿出撫近門謁堂子列八纛拜天畢遂啓行是日車駕次沙河堡東岡丙戍駐軍安州之南岡大軍啓行之次日科爾沁部巴圖魯郡王即滿珠什哩扎薩克圖郡王即布達齊引兵迎謁上酌納其所獻貂皮馬匹己卯大軍距鎮江三十里駐營庚辰渡鎮江駐驆義州城南壬午次郭山城內有駐防定州遊擊來援懼我軍威知不能敵遂自刎其城守各官俱遁城中軍民稽首乞降太宗諭之曰爾等既降勿逃匿山谷各在家保全妻子我軍于降民從不妄取一物也翼日至定州定州亦降諭如前甲申遣侍衛昂古賴率二十人往安州捉生獲二十八人馬五匹來獻並命外藩䝉古諸貝勒大臣等各率兵沿海略地㑹于安州乙酉車駕至安州命左右翼兵分兩路出略正黃旗䝉古巴雅爾率兵十五人伏于安州城東遇寧邊城總兵哨兵五十騎擊敗之殺二十餘人生擒一人獲馬十五匹來獻丙戍敕諭安州守臣曰爾國王近臣處弱小之邦不慮國家之傾危不念軍民之塗炭背棄盟誓永絶舊好是用布告天地徴發大兵深入朝鮮平定八道爾勿坐守孤城望朕兵之遂退也爾等能乘機順時舉城歸降可全身家保宗族樹功名且俾全城軍民俱免禍患否則悔無及矣駐軍二日遂行庚子車駕渡漢江駐軍南漢山城西先是癸酉太宗命户部承政瑪福塔前鋒將領勞薩等率兵三百為賈人裝星夜往圍朝鮮國王所都王京又遣豫親王多鐸貝子碩託尼堪率護軍千人繼之越六日命管兵部貝勒嶽託額駙揚古利率每旗官一員兵三千往濟豫親王多鐸軍甲申貝勒嶽託遣巴朗奏報師至平壤時平壤巡撫偵知大軍將至已棄城逺遁遂留羸瘦馬匹于平壤喂養己丑豫親王多鐸等遣武爾噶納奏言瑪福塔勞薩武拜等于十四日至朝鮮王京李倧遣副將二人遊擊四人備禦六人率精兵六十餘人迎戰為瑪福塔等所敗盡殺之進抵王京朝鮮尚書崔某侍即李某迎于城門外問曰爾等之來為何瑪福塔曰我等奉皇上命與爾國王有事相議尚書等曰既為議事而來俟啓王以禮相迎遂設宴迎待以為緩兵計李倧潛遁往南漢山城瑪福塔等聞之追四十餘里圍南漢山城臣與貝勒嶽託皆續至合兵環圍之奏入即于是夜遣户部承政英固爾岱往多鐸嶽託軍偵朝鮮王踪跡來報乙未豫親王多鐸等遣英固爾岱齎疏還報言獲其土人皆云朝鮮國王于十三日送妃及二子入島內王與長子尚未及去聞我軍至琶渠遣兵守渡口遂進山城十四日聞我軍至其京城復出山城逃竄因墮馬受創而返其城內糧餉薪水甚少每兵二人日給一人糧惟四處有水命人守而汲之其守兵雖未得實數凡垜口平坦處以三人防守稍險處二人極險處止用一人其軍器亦未全攜入城二十一日我軍遇瓦爾喀之在朝鮮居住者名葉辰麻福塔二人率二百餘户來歸引至詢之云聞朝鮮四道將合兵來援遂選八旗每二牛録護軍一人每兩旗官一員以阿爾津統之又選騎兵每牛録甲士一人每旗官一員以色勒統之截其來路並令洪科率護軍五十人往視海島渡口而彼城內兵每出城沿山侵擾疏入太宗遣兩黃旗兩紅旗鑲藍旗五旗各官一員率每牛録甲士三人又遣護軍統領鞏阿岱巴布賴巴都禮率每牛録護軍一人並往濟豫親王多鐸軍丁酉太宗至臨津江渡口先是天氣晴暖臨津江兩岸氷泮雖徒步亦不可行二十四日天雨驟寒氷堅甚是日大軍俱安驅而渡從官軍士無不驚異戊戌己亥兩日豫親王多鐸等先後奏報我軍圍南漢山城其巡撫一員率兵萬八千人來援隨遣貝子碩託尼堪博和託洛託大臣阿什達爾漢等率兵迎敵悉斬之又副將一員率兵五千來援仍為碩託等所擊敗色勒阿爾津堵截要隘復遇其副將一人率兵五百來亦擊敗之又有援兵將入南漢城遇勞薩武拜截殺二百人南漢城中有兵四百餘出城迎戰勞薩復擊敗之現在各路聲援俱絶己亥太宗命大臣談泰阿岱拜音圖武賴杜雷恩格圖葉臣固穆宗室芬古巴特瑪等率騎兵入朝鮮王京城搜𠞰並留外藩䝉古與俱親統大軍由城外徑渡漢江直抵南漢城西駐營次日談泰等于卯刻𥪡雲梯登朝鮮王京城城中兵不敢抵禦盡收其財物牲畜豫親王多鐸貝勒嶽託額駙揚古利以所獲旗纛刀槍弓矢馬匹按旗陳列進獻命即分賜克敵之王貝勒貝子大臣等有差其餘悉賞將士是日賜歸降之瓦爾喀人葉辰麻福塔縀袍貂帽各一尋賜號巴圖魯並給其部下一百五十三户奴僕牲畜房舍器皿俱全崇德二年春正月庚戍睿親王多爾衮安平貝勒杜度先後至南漢山城先是太宗于沙河堡東岡命睿親王多爾衮貝勒豪格分統左翼滿洲三旗䝉古三旗及外藩䝉古左翼兵從寬甸路入長山口進發師行至鎮江復命安平貝勒杜度恭順王孔有德懷順王耿仲明智順王尚可喜大臣石廷柱馬光逺等率每旗梅勒章京一員每牛録甲士三人及石廷柱旗下漢軍在後護送紅衣炮將軍炮及一切軍械輜重等物尋遣八人齎敕諭之曰爾等簡選精騎往皮島雲從島大花島鐡山一帶凡朝鮮國人所居與明國相鄰者略之其居住大路傍者勿略以伊等皆我之子民也如載炮牛隻不敷可酌取大路兩傍之牛運之此外不許妄取一物當嚴飭軍士毋違朕命丙申大軍分隊立營環攻南漢山城復遣筆帖式武達禮率四人往諭安平貝勒杜度等曰爾等速送紅衣大將軍炮及一切火器前來其騾馬可運者令石廷柱擇漢軍官員齎送在三王下者令三王攜之同行其紅衣大炮非騾馬可運爾安平貝勒與石廷柱在後督運炮軍而來三王下炮車亦令其部下才能官員一同運送漢軍及三王士馬可酌量簡閲以强壯者居前羸弱者居後過黃州時可先遣二百人搜剿黃山嶺伏兵仍留兵殿後待我軍全過然後前行其留平壤喂養馬匹之兵丁及內外閒散䝉古爾安平貝勒可詳加查檢攜之而來過黃州嶺時仍遣兵二百搜𠞰伏兵加意收集後隊恐遺一二人為敵所傷也所遣去四人先令二人同三王來留二人與爾同行黃州嶺有朝鮮埋伏之處彼能知之可令指導正月辛丑朔太宗出營環視朝鮮國王李倧所居南漢山城形勢申刻還營次日朝鮮全羅道沈總兵李總兵聞南漢山城為我軍所困率兵來援貝勒嶽託迎擊敗之甲辰大軍北渡漢江營于江岸距朝鮮王京二十里許孔有德耿仲明尚可喜及漢軍甲喇章京金玉和攜大炮至丁未朝鮮全羅忠清兩道巡撫總兵來援命豫親王多鐸額駙揚古利率兵相機迎戰時天雪隂晦不見敵營遂縱兵進擊敗其山下列陳兵追至山頂敵營多鐸鳴角集兵招揚古利登山督戰揚古利方往㑹適有朝鮮敗卒伏於石崖間暗以鳥鎗擊中揚古利創重而卒詰旦多鐸率軍進擊朝鮮兵已棄馬夜遁營中虛無人獲馬千一百有四十以揚古利尸還太宗親臨哭奠賜御用冠服殯之是年十一月追封揚古利為武勳王立碑墓道以其子塔瞻仍襲超品公爵庚戌睿親王多爾衮貝勒豪格等率左翼兵來㑹奏稱我軍由長山口至昌城城中軍民知不能禦皆棄城奔山立寨我左翼三旗護軍騎兵攻克之墮崖死者甚衆至寧邊有朝鮮義州總兵黃州元帥率兵五百出寧邊城隨擊敗之于城下又敗其安州兵二百寧邊城副元帥李某及參將三員遊擊四員備禦十五員率馬兵七百步兵三百來援為䝉古大臣額駙蘇納梅勒章京武塔齊等所敗生擒其副元帥李某時我軍五十人至宣屯村獲諜者問知彼黃州元帥聞國王為大軍所圍已率兵一萬五千往援去三日矣是夜即選精騎行一晝夜至日出追及之乘其未覺擊敗之是日安平貝勒杜度等護送炮車火器亦至奏言初六日遣人往視臨津江氷已盡解心甚憂之及將至渡口之前一夜雨雪交作氷既泮復凝遂得坦然徑渡太宗曰禎祥洊至皆天意也已未朝鮮國王李倧遣使奉書至御營請成先是大軍既抵南漢山城於正月二日壬寅遣户部承政英固爾岱瑪福塔齎敕至南漢城付朝鮮閣臣洪某侍郎李某責其君臣陽為和順隂圖報復之罪次日洪某李某齎書至御營謝罪英固爾岱瑪福塔取以奏聞置而不答越十日癸丑李倧復上書自陳勢窮情迫惟有延頸企踵日俟德音之至太宗降敕切責之曰今爾有衆欲生耶亟宜出城歸命欲戰耶亦宜速出一戰毋徒以信口美言飾非文過為也己未李倧遣其閣臣洪某等奉書請成書曰伏奉明㫖屢賜申諭秋霜凛烈中隱寓春生之意捧讀惶悚措身無地仰惟皇帝威德逺播諸藩合詞共進尊號天人所歸而小邦以十年兄弟之國顧反獲戾于興運之景命方新初反求諸心有噬臍莫及之悔今之所願但有改心易慮一洗舊過舉國承命得比諸藩而已誠䝉曲察微悃許以自新則奉書禮儀自有常式至于出城之命實仁覆至意然重圍未解亦死是以瞻望帝怒方盛恐嬰城亦死出城龍旌引分自決情亦感矣古人有城上拜天子者蓋以禮不可缺而堅城不出實緣兵威大可懼也皇帝方以天地生物為心則小邦亦當與于全活優養之中伏惟帝德如天必加矜恕敢吐實情恭候恩㫖庚申太宗遣英固爾岱瑪福塔齎敕往諭朝鮮國王李倧曰爾違天背盟自速罪戾是以朕統師來征意在不赦今爾困守孤城見朕屢詔切責方知悔罪再三上書求免朕開宏度許爾親盟非力不能攻取勢不能久圍而招汝來歸也此城攻固可得即因爾芻糧駐軍秣馬令爾自困亦可以得似此蕞爾小城且不能取將何以下幽燕哉今命爾出城見朕者一則見爾誠心恱服二則欲加恩于爾令永主爾國旋師以後示仁信于天下耳若以計誘爾何以示信天下朕方承天眷佑撫定四方正欲赦爾前愆以風示南朝若以詭計取爾天下之大能盡譎詐取之乎是絶人歸順之路也爾若猶豫不出則地方蹂躪芻糧罄竭生民濵于死亡禍變日增誠不容刻緩者也爾首謀敗盟之臣朕原欲盡誅方已今爾果出城歸命可先縳送首謀三四臣當正國法以警後人蓋陷爾舉國帖危誤朕西征大計咸此人之罪也若不縛送首謀俟爾歸順之後始行索取朕不為也爾若不出縱諄諄祈請朕不聽矣癸亥睿親王多爾衮率兵攻克江華島先是丙辰太宗命勞薩武拜等率前鋒軍回盛京諭留守鄭親王濟爾哈朗武英郡王阿濟格饒餘貝勒阿巴泰等曰朝鮮國王與長子及羣臣俱在南漢其餘妻子在江華島意欲造船先攻此島若得其妻子則城內之人自然歸順若猶不順然後攻城計亦未晚觀此島似亦易取使到之日即揀選謹慎能事官二員帶領每甲喇驍騎校一員每牛録甲士一名採取木植人一名及八家各首領一名造船工匠各五名前來靉陽河邊依佟克申武巴海征瓦爾喀佟克申造船九隻取海上六島收服察哈爾時先後造船二十四隻全軍至黃河不勞而濟式樣造船十隻依朝鮮式樣造馬船十隻再查有從前曽與佟克申造船及知造朝鮮馬船之匠人遣之前來其監造官應于靉陽河邊擇地之可達義州江者駐彼營造其所需鐡工亦按數撥發仍分派哨卒防守毋致疏虞限二月十五日以內竣工布延蘇爾德到盛京五日仍令護送造船人來右翼前鋒到京五日可令往噶海駐防左翼前鋒于遼河氷解後令往開城駐防氷若未解可令往牛莊駐防俟氷解後併將駐防牛莊之護軍調往開城一同駐守勞薩等既行太宗復令八旗造小船八十隻命睿親王多爾衮等分兵取江華島城我軍用車輪駕所造小船由陸地曳行是月壬戌至江華島渡口乘船渡江朝鮮有兵船百餘分為兩翼我舟師從中衝入發紅衣炮攻擊朝鮮兵船東西潰竄我軍登岸進攻江華島有鳥槍手千人距岸迎戰悉為我軍擊殺遂圍江華島城克之島內獲朝鮮王妃一王子二閣臣一侍郎一及羣臣妻子家口甚衆睿親王多爾衮令一無所擾使朝鮮國王二子及閣臣侍郎善護王妃并保聚其羣臣眷屬先後遣納敏岱音楚興格訥必揚古穆成格善都喀布賴雅布蘭等馳奏行在軍營庚午朝鮮國王李倧詣軍前請降甲子太宗敕諭朝鮮國王李倧曰朕進兵時曽命大臣瑪福塔等至爾國諭王王若引罪自責第令世子羣臣來迎請罪大軍亦不深入爾不聽命遁入南漢山城此大失也本月十六日又遣大臣英固爾岱等諭爾果出城歸命一切勿論爾又不從朕始有速攻江華島之命王若早聽朕言豈至于此今朕之成命已明示于庚申日詔內朕護爾家室諭爾前來若再遲延是自棄其家屬也李倧于是日及丁卯日兩次上書自陳省躬畏罪未敢出城歸命之由戊辰太宗降敕諭之曰朕覽來奏知爾欲保全宗社朕詔已出寧肯食言將盡釋前罪永定規則以為子子孫孫君臣世守之信義爾若悔過自新不忘恩德則當去明國之年號奉大清之正朔以長子並再令一子為質諸大臣亦以子弟為質爾有不諱則朕立爾質子嗣位一切禮儀毋違明國舊例朕若征明國調爾步騎舟師不得誤期會朕今移師攻取皮島爾可發鳥槍弓箭手及兵船五十來助爾與內外諸臣當締結婚媾以固和好新舊城垣毋許擅築所有與爾國照常貿易之瓦爾喀人當導其使者來朝其東邊瓦爾喀人之私自逃竄者不得復與貿易當執送前來爾以既死之身朕豫生存保全宗社復還家室當念朕再造之恩後日子孫無違信義則邦國永存矣是日又遣江華島所俘太監一人朝鮮宗室一人入南漢城往告其主云江華島已失王之國妃諸子及羣臣妻子俱安置别室毫無所犯今付我國官員太監如常護送前來矣庚午朝鮮國王李倧以漢口濵海之地及江華島既失妻子羣臣盡被俘獲身困重圍旦夕且陷八道援兵俱絶屢奉太宗敕諭赦過宥罪許其歸降于是棄兵械服朝服獻上明國所給敕印自南漢城來朝見禮臣于漢江東岸三田渡地方築壇設黃幄太宗於辰刻出營旗纛森列奏樂渡漢江登壇御黃幄設鹵簿如常儀將士皆擐甲列隊李倧率其文武羣臣離南漢山五里許步行來朝太宗命户部承政英固爾岱瑪福塔等迎于一里外指示禮儀引至儀仗下立太宗離座率李倧及其諸子文武羣臣拜天行三跪九叩禮畢太宗還座李倧率羣臣伏地請罪求我國諸臣代奏曰皇上天心赦臣萬罪生已死之身存已亡之國俾臣重立社稷緣臣罪戾多端故加之罰今臣服罪來謁皇上自兹以後改過自新世世子孫不忘厚澤代奏訖太宗諭曰朝鮮國王既知罪來降朕豈有念舊惡苛責之理今後一心盡忠不忘恩德可也前事毋再言及李倧及諸陪臣復奏曰皇上恩德小邦不勝頂戴于是贊禮官引李倧及其諸子羣臣行三跪九叩禮畢禮部官引至儀仗下奏請李倧班次太宗曰以威懾之不如以德懷之朝鮮雖迫于兵勢來降亦一國之主也命李倧近前坐于左側其長子李􅓭坐于左班親王郡王貝勒之末次子李淏三子李㴭坐于右班親王郡王貝勒之末坐定大宴畢引江華島所獲李倧王妃子婦及羣臣妻子俱行三跪九叩禮命盡還李倧王妃子婦及羣臣家屬賜李倧黑貂袍褂雕鞍馬匹賜王妃及王子黑貂裘其大臣金􅣌等各賜貂裘李倧率衆謝恩行禮畢命李倧及其羣臣各與妻子相見皆相抱痛哭曰今日幸䝉皇上寬恩得豫完聚稍緩數日我等皆為灰燼矣太宗命英固爾岱瑪福塔等送李倧妃及其第三子李㴭並眷屬七十六人羣臣妻子眷屬百六十六人入王城惟留長子􅓭次子淏為質太宗于申刻還營二月壬申自朝鮮班師辛未朔以江華島所獲人口牲畜財帛分賜諸將畢次日太宗率諸王貝勒大臣自朝鮮班師李倧率其羣臣出王京十里外跪送太宗下馬升座李倧率羣臣行禮畢命坐于御座左側賜茶李倧仍退至左側逺坐太宗諭之曰爾山城中人民家口已盡付還矣李倧起謝畢命英固爾岱瑪福塔送李倧還王京先是李倧被圍山城時諭以每年應行貢獻之禮并及所進方物數目是日李倧奏曰小邦積弱以來所在懸磬詔諭土貢或非地産或力有不逮必須量力禀承垂為定式伏乞聖慈鑑小邦事大之誠恢天朝薄來之度不勝幸甚太宗覽奏遣范文程額爾克圖傳諭李倧曰爾被圍山城時已有成議至于爾國窮苦朕已知之丁丑戊寅兩年准免貢物己卯年秋季為始照例入貢此後朕自有裁奪今非爾言時也辛卯車駕還盛京太宗自南漢山城班師日命睿親王多爾衮安平貝勒杜度率滿洲䝉古漢軍官兵以所俘獲在後行乙酉遣蘇爾德齎敕諭睿親王多爾衮及左翼諸大臣又遣理藩院承政達雅齊齎敕諭䝉古王貝勒等曰朕觀統兵諸將皆有懈心今朝鮮雖平軍行宜照常嚴加約束所有國王二子恐其脫逃須加意防守攜帶以行沿途經過之城邑村堡官民有迎送者均應禁止若城邑村堡之人有立于道傍與我軍俘獲之人接談欵叙者亦當禁止勿令近前恐其引誘潛逃也至我兵經過有民人之城邑村堡須遴派官員兵丁護行俟後隊過畢一并齊集還京毋違朕命丁亥留守盛京鄭親王濟爾哈朗駐守西邊牛莊武英郡王阿濟格駐防北邊噶海饒餘貝勒阿巴泰等因太宗遣占巴齎敕宣布捷音隨遣恩國泰阿布達禮奏言皇上親統六師南討朝鮮德威逺布所向無敵中外臣庶歡忭無已隨遣英固爾岱偕恩國泰等還盛京令諸王大臣于二十里外來迎車駕所經朝鮮境內涑州安州寧邊泰州德州嘉山宣川龍川義州等處總兵副將遊擊各官咸率軍民跪送道傍或獻牛隻米糧以供軍食太宗嘉納之分給士卒命將所假朝鮮義州馬匹三百悉行發還各給其本主收領尋諭義州官員曰方春和時不可廢棄農業現在大軍凱旋可收集爾人民妻子暫令回避止留丁男于路哨探兼勤耕種如大軍至并種地人等亦令回避今朕先歸而漢人䝉古兵馬紛集恐軍士等執爾耕種之人冒稱俘獲亦未可知可俟大軍過後依舊勤習農務其宣示爾所屬百姓知之戊子太宗還入邊界庚寅渡太子河鄭親王濟爾哈朗遣禮部𠫭政尼堪哈爾松阿工部參政星訥等于盛京南二十里塔北石橋後除道設帷幄武英郡王阿濟格郡王阿逹禮率貝子文武羣臣及土默特鄂爾多斯呼爾哈等部貢使頭目元年十二月乙酉土默特部山津巴克什等二十九人鄂爾多斯部頭目四人同至貢馬匹蟒縀素縀等物本月丁亥呼爾哈部託科羅氏克依克勒氏耨葉勒氏頭目率六十人來朝貢貂狐皮張等物出城二十里祇候辛卯卯刻太宗入行幄升御座武英郡王阿濟格捧賀表跪進內國史院大學士剛林接表宣讀訖阿濟格率衆行三跪九叩禮次土默特鄂爾多斯呼爾哈等部貢使頭目行三跪九叩禮設大宴畢啓行至盛京謁堂子遂自懷逺門入未刻還清寧宫癸丑更代駐防噶海官兵並令各屯堡及時劭農太宗諭鎮守噶海饒餘貝勒阿巴泰曰噶海四旗護軍駐防日久爾可率之還京更遣兵往代其鎮守噶海前鋒與鎮守開城前鋒合為一隊去都爾弼一二十里相其有水草處駐營爾自噶海還時可遣護軍將領以前鋒兵數造冊備查其應更代之前鋒俟休息馬匹然後更代至現在鎮守噶海等官當令勤飭農民勿因天寒致緩耕作有荒農務也又諭户部曰昨嵗春寒耕種失時以致穀貴今嵗雖復春寒然農時不可違也宜早勤播種而加耘治焉夫耕耘及時則稼無災傷可望有秋否則或被蟲災或逢水潦穀何由登乎凡播種必相其土之燥濕而布其利該管屯堡各員有不勤加董率致廢農務者罪之是月黑龍江地方額蘇里屯內鄂倫扎爾固齊克訥布魯達爾漢率九人至奏言額蘇里屯東約計六日程有從未通我國者三十九屯今欲來貢不知進貢禮儀特遣人來求我等同皇上使臣一人至彼即備方物隨使入貢并籍其所貢貂狐等皮數目以聞皇清開國方略卷二十三
