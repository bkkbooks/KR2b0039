body:
  text: 欽定四庫全書皇清開國方略卷三十一太宗文皇帝崇德七年壬午秋七月至八年癸未八月崇德七年秋七月己巳朔編錦州松山杏山新降兵民太宗命以錦州松山杏山新降官屬兵丁分給八旗之缺額者其餘男婦幼稚共二千有竒編發蓋州為民又蒙古男婦幼稚共四百一十有五漢人八名分賜恭順王孔有德男子十名婦女幼稚十六口懷順王耿仲明男子十名婦女幼稚十二口智順王尚可喜男子十名漢人一名婦女幼稚十二口續順公沈志祥男子五名婦女十六口察漢喇嘛男子三名婦女幼稚三口其餘分賜公以下梅勒章京以上養之庚午諭諸王貝勒勤修政事太宗召諸王貝勒貝子公管旗大臣議政大臣等入清寧宫諭曰朕觀爾等於國家政事皆不肯身任因循推託専委之朕似此不勤政事之人上天豈佑之乎朕訓戒爾等者正恐爾等失為臣之道而召天譴也從前有怠於政事而失臣道上天降罰爾等皆曽見之矣其勤於政事而盡臣道上天垂佑政舉身榮者獨未之聞乎今征戰之事朕不具論但思爾等每率所屬將士出兵於外其人之賢否必已熟悉何以不據實奏聞若不奏聞朕何由知之皇考太祖時蘇完扎爾固齊費英東見人之不善必先斥責而後劾之見人之善必先奬勵而後舉之故被劾者無怨言被舉者亦無驕色朕今並未見爾等以善惡實奏似斯人之公直也諸王貝勒大臣等皆叩頭謝罪曰皇上所責誠是臣等嗣後當仰遵訓諭盡心國事無敢怠忽辛未召宴錦州新附各官先是五月癸酉太宗御崇政殿命陳獲總督洪承疇及總兵祖大壽祖大樂祖大弼副將夏承德髙勛祖澤逺等朝見行禮畢召入殿內賜茶太宗問洪承疇曰朕觀明主宗室被擒置若罔聞至將帥率兵死戰或陳前被擒或勢窮降服必誅其妻子否則沒入為奴此舊規乎抑新制乎洪承疇奏曰昔無此例今因文臣衆多各陳所見遂至於此太宗曰今日之文臣固多昔日之文臣豈少耶特因君暗臣蔽故多枉殺似此戮力效死之臣即其身在敵國猶思以財帛贖之況可罪及妻子乎其無辜亦甚矣洪承疇叩首流涕曰皇上此諭誠至仁之言也諭畢賜宴崇政殿復命八家各宴一次至是太宗幸牧馬所召祖大壽以下各官宴之命與內大臣等較射賜祖大壽駝三祖大樂駝一翼日賜祖大壽御服朝衣嵌東珠紅寶石頂朝帽並祖大弼髙勛朝服孔雀翎鞾襪等物丙子敘諸王克捷功太宗御篤恭殿諸王貝勒大臣率百官朝賀賜大宴敘諸王功晉睿郡王多爾衮肅郡王豪格仍為親王貝勒多鐸為郡王賜鄭親王濟爾哈朗及王貝勒大臣等鞍馬蟒緞有差尋命輔國公博和託屯齊喀扎哈納及大臣葉臣和洛會準塔巴特瑪等率將士往代貝勒阿巴泰等駐防錦州八月己卯鑄炮於錦州太宗命梅勒章京馬光輝孟喬芳率劉之源旗下揚名髙祖澤潤旗下李茂佟圖賴旗下佟圖蔭石廷柱旗下金玉和吳守進旗下孫德盛金礪旗下柯永盛巴延旗下髙拱極侍衛李國翰旗下揚文魁及鑄炮牛録章京金世昌王天相等往錦州鑄神威大將軍炮癸丑禁逃人發還本主恭順王孔有德部下人閔有祿於攻松山之役逃入錦州及攻克外城時閔有祿自呼其名辱詈其主太宗諭曰朕以閔有祿原為恭順王孔有德攜至之人故令仍歸其部下今總兵官祖大壽奏言不惟此一人即各官家下多係本國逃人若仍歸原主恐十分中所存不過二三其言甚然嗣後凡有人在錦州松山杏山官民家下者俱令與本主斷絶不必發還九月癸酉諭諸王貝勒恩養所屬太宗諭諸王貝勒貝子公等曰朕觀爾等養育新附滿州蒙古漢人當朕申飭時尚稍知加意過此即便遺忘如是則新附之人何以為生乎嗣後當各盡心力恩養所屬誠能恩養即為勤勞國政之人朕心實嘉慰焉毋止圖一家富足已也冬十月辛亥征明先是領漢軍大臣佟圖賴祖澤潤祖可法張存仁等奏請因天時順人事大軍直取北京控斷山海關太宗諭曰取北京如伐大樹先從兩旁斫削則大樹自仆朕不取關外四城豈能即克山海關今明國精兵已盡我軍四圍縱略彼國勢日衰我兵力日強嗣後北京可得矣至是命貝勒阿巴泰為奉命大將軍與內大臣圖爾格統將士征明諭之曰朕非好窮兵黷武也因不忍生靈罹害屢欲與明修好而彼國君臣執迷不悟是以命爾等往征爾等入明境毋任意妄殺毋奪人衣服毋離人妻子毋焚燬財物毋暴殄米榖曩者兵臨山東有因索財物而嚴刑拷逼者非我國仁義之師也爾等宜傳諭各旗引以為戒至於錦州新附蒙古索倫等令其從軍役使伊等如有俘獲勿得搜取令其攜歸其力不能攜者仍助之倘爾等令其空返或以貧苦來訴朕必將爾等所有與之壬子上親送至郊諭曰爾等勿以我軍強盛自弛防範古云驕敵者敗其敬慎戒備以行我國領兵大臣於行間勇士多不肯以其所長上聞如此則勇戰之士何以激勸我軍至明彼或遣使求和爾等即應之曰我等奉命來征惟君命是聽他無可言爾如有言其向我君言之必吾君諭令班師方可退兵如遇流寇宜云爾等見明政紊亂激而成變我國來征亦正在此以善言撫諭之申戒士卒勿悮殺彼一二人致與交惡諭畢以奉命大將軍印授阿巴泰阿巴泰跪受行三跪九叩禮舉炮三大軍遂行是日遣前鋒將領羅碩侍衛瑚沙隨征明左翼軍前鋒將領錫特庫瑚禮布隨右翼軍約入長城後即先還報消息比還羅碩瑚沙奏言左翼軍前進地濶路平便於行兵兩旗並行沿途擒殺敵哨卒七十三人獲馬三十三匹十一月辛未從界嶺口毁邊牆而入有明大同兵二千五百人往守山海關我軍將入長城即來拒戰我護軍及騎兵兩路擊敗之獲馬四百三十三匹錫特庫瑚禮布奏言右翼軍前進地隘路險俱單騎而行未入長城時擒明偵卒問之言距黃崖口四十里有石城關甚隘木柵三層兩層用石圍砌內有大炮四位步兵五十人三處伏藏地雷又距二十里有雁門關用石築砌內有大炮四位步兵一百人兩處伏藏地雷遂遣前鋒兵同漢軍每旗兵五名護軍四十名乘夜毁關取其地雷守關敵兵不及施炮俱為我軍所戮甲戌至黃崖口將入長城時輔國公芬古管旗大臣談泰葉克舒等定議兩路夾攻邊口遂遣滿洲蒙古每旗護軍二十名每牛録騎兵二名外藩科爾沁敖漢奈曼烏喇特阿嚕科爾沁巴林喀喇沁等部兵三百五十名令蒙古管旗大臣瑪喇希署梅勒章京事卦喇率領從右山路而登奪其邊口追擊山城敵兵至山下進克其城左翼令梅勒章京和托率護軍四十名先往登城署章京阿爾海棄梯不用率本旗數人於護軍未至之前先至城下次第畢登兩翼軍既克長城斬守備一員城內兵俱潰走乙亥聞薊州各鄉民俱竄入山中遣兵往取糧米牲畜執其人問之言鎮守薊州總兵白騰蛟聞左翼兵入邊遂率馬兵三百步兵七百前往桃林關去薊州城內止有參將三員招募新兵二千俱不堪戰遂於丙子日我軍自黃崖口向薊州進發途次精選將士令前鋒居前次護軍次騎兵分為三隊前往薊州城東圍之仍告以總兵白騰蛟已率兵奔往桃林今聞我軍從此路入必復回薊州若相遇即迎擊之是曰我軍將抵薊州總兵白騰蛟率本部馬兵在前馬蘭峪總兵白廣恩率馬兵三千步兵三千在後果奔回薊州與我軍遇擊敗之生擒參將一員陳斬遊擊三員獲馬六百三十六匹丙辰誅明間諜蕭大漢智順王尚可喜屬下崔國泰擒獲姧細蕭大漢大學士希福范文程鞫之稱明監軍道周法祖遣來勸恭順王孔有德懷順王耿仲明並懷順王長子耿繼茂及周法祖子慶兒四人潛遁歸明各有書一函懷順王屬下逃人張國柱亦有書四函與懷順王及其弟張國樓等太宗命以書付恭順王懷順王觀之蕭大漢伏誅崔國泰給賞如例丁巳大赦凡重辟及械繫人犯令集大清門外悉豫寬釋命啓心郎索尼宣諭曰爾等衆犯有罪應死者亦有應責應罰者朕今俱釋爾罪自兹以後其各改過自新毋再干國典已未命豫郡王多鐸等赴寧逺邊界制明援兵太宗以奉命大將軍阿巴泰等將士將入明邊命豫郡王多鐸郡王阿達禮率兵赴寧逺邊外立營制明援兵且令捉生諭曰爾等至錦州駐防處擇我軍之馬匹肥壯者盡數攜帶於寧逺迤西山僻處設伏選精兵有肥壯馬匹者百餘騎由大路夜行至寧逺北設伏黎明即向寧逺迤西大路捉生或得或否即令歸大營倘敵人窺我捉生兵少來襲爾等可力拒之若敵兵知有伏不肯出戰爾等即令軍士往寧逺西山縱略牲畜爾等自打草灘大路而去自廣寧迤北而還諭畢並齎敕諭明寧逺總兵吳三桂及祖大壽與三桂書往太宗於十一月甲戍獵於勒克多鐸等遣人自軍營連次奏報臣等遵上指示汛地我軍從寧逺西大路而入因途次曠逺未遇敵人後於寧逺北三路駐劄遣人往略斬四人生擒百有二人獲牲畜百六十餘又明寧逺總兵吳三桂率馬步兵出戰我軍擊敗其騎卒獲馬七十二甲胄弓刀等百二十餘又蒙古星南察漢阿哈泰三台吉自明前屯衛率男婦幼稚二百八十九人馬一百四十二牛四頭來降甲子命親王郡王等會議部務都察院參政祖可法張存仁理事官雷興奏言皇上天縱神武德被遐方以仁心愛萬民以仁政治宇內凡養兵恤民無不周摯舉國臣民不勝歡忭近見政務紛繁動勞睿慮各旗六部諸大臣虛設何禆凡心勞則氣動更願皇上清心定志一切細務付部臣分理至軍國大事方許奏聞況大業垂成外國來歸正聖心慰悅之時亦可稍輟憂勞以上答天心下慰衆望疏入太宗曰朕親理萬幾非好勞也因部臣不能分理是用躬自裁斷今後可令鄭親王睿親王肅親王武英郡王會議完結於是遣范文程等宣諭諸王諸王奏曰皇上命臣等斷理諸務敢不欽承但何項事應行奏請伏候聖裁酌定則諸務庶可辦理太宗曰未來之事何能預定各部事務須盡心料理有不能決斷者會同諸王貝勒議結如會議仍不能結方許奏聞諸王每日黎明齊集有事則奏無事回各衙門辦事倘有當議事務候旨齊集是月喀爾喀部碩雷下巴特瑪率男婦幼稚攜馬五十匹來降閏十一月己未定圍獵誤射處分凡諸王貝勒貝子公等若誤射王等罰銀三千兩豫被射之王誤射貝勒等罰銀二千兩子被射之貝勒誤射貝子與公等罰銀千兩豫被射之貝子公誤射者仍拘禁三日如誤射之箭離獸太逺及不應射而射者另行議罪其以下之人若誤向王貝勒發矢或中王貝勒之身或因射獸已中而誤中王貝勒之身不論受傷與否均論死若誤射王貝勒所乘馬匹鞭一百貫耳鼻仍罰贖若誤射貝子公而傷重者論死輕者鞭一百貫耳鼻籍其家若射中獸復中貝子公之身未至於傷者鞭一百貫耳鼻罰贖誤中所乘馬匹鞭一百監禁三日又誤向王貝勒發矢矢落於五丈之內者鞭五十如王貝勒貝子公等誤射以下之人拘禁三日視被射之人受傷輕重照陳傷減一等給銀若被射至死者除償身價外仍罰銀二百兩給死者之家傷未至死者除照常傷給銀外仍罰銀一百兩給被傷之人若中其身而無傷痕者罰銀五十兩給被射之人如王貝勒貝子公等誤射以下之人所乘馬匹馬未死坐以應得之罪至死除償馬外仍坐以應得之罪十二月丁卯獵于葉赫太宗率親王郡王貝子公文武諸臣出懷逺門獵于葉赫丙子車駕至章泥口獵畢還營召諸王貝子公等賜宴自親王以下內大臣以上各賜馬一匹丁丑行獵至開庫爾聖躬違和諸王貝子大臣奏請罷獵還京太宗諭曰朕躬偶爾違和豈可使如許從獵軍士一無所獲而返耶爾諸王貝子大臣等率之行獵可也于是仍獵于呼昆布克灘地及還獵于噶哈嶺時皇九子甫五嵗射中一麅衆皆稱異是月喀爾喀部達喇吳巴三察下和碩泰攜其妻子二十二人馬四十四匹來降崇德八年春正月辛亥征松阿里江之呼爾哈部師還先是崇德七年九月太宗命沙爾琥達珠瑪喇率將士往征松阿里江之呼爾哈部閏十一月沙爾琥達等遣人還奏喀爾喀木遮克特庫塔圖庫福提希鄂爾琿斡齊竒庫巴察拉額提竒薩里尼葉爾伯十屯人民俱已招降于月之初十日自松阿里江旋師至是還命禮部官迎宴入城計獲男婦幼稚一千六百十九人牲畜六百三十有竒命給新獲男婦衣服房屋及所用器皿分補各旗人丁缺額者敘功賜沙爾琥達珠瑪喇等各緞布有差二月丙寅增設禮部蒙古理事官以禮部未設蒙古章京命每旗增設禮部蒙古理事官副理事官各一員是日喀爾喀部達喇吳巴三察下托克推達魯噶率男子九人及其婦女幼稚三十四口攜駝馬九十餘來歸三月丙申遣官往諭朝鮮太宗遣户部啓心郎布丹內院學士楊方興等齎敇諭朝鮮國王李倧及其臣民曰朕自三田渡招服爾等王及臣民皆保全身家得受恩養非為一時之計也一則欲爾等感戴朕恩奕世不忘一則欲垂功德於萬世耳後爾等違旨出邊盜採人參肆行射獵潛與漢人貿易又遣僧多克坡往來明國傳書餽送間諜紛紛不止遇明人船至故縱不行捕獲前約發舟師遲延日月違期不至汛地種種背盟負恩皆因主弱臣強所致王果執法而行孰敢如此倡亂王若行法而姧臣容有作亂者朕豈置而不問乎且爾朝鮮先曾事遼及金強遂轉而事金後復事元至明強爾祖又轉而事明後倭侵爾境明曾發兵退之爾謂明之有恩者以此朕亦知之然皆已往之事當己未嵗明將杜松劉綎四路分兵侵我爾國遂助兵來戰彼時我國豈有怨於爾使爾能勝肯如朕之保全恩養容留至今耶爾之報明於此盡矣朕之再舉伐爾者乃問爾助明之罪豈似爾興無名之師乎朕不念舊惡復加寬宥今爾國王以及臣民復得安居樂業皆朕之恩也當思共甘苦同休戚更宜戮力疆場以圖報稱豈可頓忘朕恩耶此蓋爾不識天時以明為必不亡故不肯與絶耳以朕度之明有必亡之兆何以言之彼流冦內訌土賊蜂起或百萬或三四十萬攻城掠地莫可止遏明所恃者惟祖大壽之兵并錦州松山之兵及洪承疇所領各省援兵耳今皆敗亡已盡即有新兵亦僅可充數安能助戰明之將卒豈但不能抵禦我師反自行剽掠自殘人民行賄朝臣詐為己功朝臣専尚姧讒蔽主耳目私納賄賂罰及無罪賞及無功以此觀之明之必亡昭然矣朕惠養爾等實欲悉豫保全不使一人失業乃爾等不自圖安屢起亂端夫見亂而不以法正之恐愈滋亂而長罪也故爾國大臣崔鳴吉與明通謀金聲黑尼誤國助惡則執而囚之至於髙調文舍木嵗等八人入明之登州寧逺等地往來交通又入島貿易今已斬首其餘交通明國貿易餽送之罪咸與赦除自諭之後再有與明貿易私通往來漢人船至不擒獲者必治以法不貸並諭布丹等曰爾等前去親視繕寫傳示彼國八道官民歸時於所經過地方仍以朕旨宣諭居民五月庚子往明界嶺口捉生將士還先是遣前鋒統領努山等率將士往明寧逺迤南自中後所捉生比還獲男子四十八名婦女幼稚三十三口牲畜四十餘尋復遣努山率前鋒將領及侍衛四員兵九十名往明界嶺口探征明大軍出邊信息兼令捉生努山等至界嶺口斬明守備一員兵三百餘人獲人口三十四馬一百五十八驢牛共六十又獲我軍逃逸厮役二十四人生擒明千總一員把總三員以歸以所俘獲分賜從征將士有差六月癸酉征明大軍凱旋大軍自崇德七年十月征明是年五月癸卯奉命大將軍貝勒阿巴泰內大臣圖爾格遣學士額色赫等自軍營奏報臣等率大軍直抵明境至兖州府莫能拒守殱其親王一郡王五及宗室等千人計攻克三府十八州六十七縣共八十八城歸順者六城擊敗敵兵三十九處所獲黃金萬有二千二百五十兩白金二百二十萬五千二百七十兩珍珠四千四百四十兩緞五萬二千二百三十匹緞衣三萬三千七百二十領皮衣一百一十領貂狐豹等皮五百有竒角千一百六十副俘獲人民三十六萬九千名口駝馬騾牛驢羊共五十五萬一千三百有竒外有發窖所得銀兩剖為三分以一分給賞將士其衆兵私獲財物無算時太宗遣大臣庫魯克達爾漢阿賴鄂謨克圖等率將士往迎至圖爾根地與額色赫等遇遂以所載行糧留于索諾木杜稜城中止用每牛録騎兵各一名往迎己酉復遣梅勒章京阿哈尼堪覺善等率將士迎之至是阿巴泰圖爾格等班師還至盛京命鄭親王濟爾哈朗睿親王多爾衮武英郡王阿濟格郊迎三十里太宗設鹵簿率親王以下各官詣堂子行禮還御篤恭殿凱旋各官朝見賜茶甲戍賜貝勒阿巴泰銀萬兩輔國公博和託及屯齊喀各二千兩內大臣圖爾格一千五百兩敘隨征左翼滿洲蒙古漢軍十二旗功各賜銀兩緞匹有差以右翼十二旗大臣不候衆軍先出邊口停其賞賚己卯諭飭出征諸王俘獲不均太宗諭諸王貝勒貝子公等曰此次出征各旗王貝勒貝子公等家人獲財物甚多而各旗將士所獲甚少想大臣等各讓其本旗王貝勒貝子公等多取以致將士少獲開報歸公之物反行減少耳前武英郡王帥師往燕京並睿親王過燕京往山東時歸公財物朕皆賜出征之王貝勒及各官等即少有所留不過欲給新附之人及窮乏之人以為國家經費之計故皆寄之外帑未嘗多取以私為己有也朕躬行節儉內帑有餘豈慮不敷所用所以詢爾等者非為物之多寡而言乃為理之順逆而言耳爾該管各王貝勒及各旗官員當出兵之日不知如何曉諭家人而不均若此也正紅鑲紅二旗官員開報甚少此二旗前隨睿親王武英郡王出征時所進甚少今復如此且前諭爾等將各屬新舊人等加意恩養乃聞爾等於近侍護衛頻賜以食至旗下官員守門護軍及新附之人竟不得沾恩養此甚非是試思養官而不養民養賢而不養不肖官雖賢豈能獨立乎以上下相維之理言之必為在下之人所托命而後可為在上之人如無在下之人則統轄者誰役使者誰也朕幸承天眷以我兵之半往征明國遂能破其關隘克其城池皆因撫綏各國俾傾心歸順勢大力強之所致若止恃舊曰之兵豈能致此乎嗣後爾諸王貝勒貝子公於新舊人等孰愛養有方孰漫不撫恤朕必加詳察其管旗大臣護軍統領及近侍護衛等各宜啓迪其主如新舊人有因不沾恩養自行陳訴者所告果實該管王貝勒皆坐罪若原告係騎兵將管旗大臣一例治罪若係護軍將護軍統領一例治罪乙酉究重役困民罪太宗幸御馬厰見部臣役遣民夫修治道路不分髙下皆增土培髙又前因盛京居民稠密敇工部區别散處以弭火災至是諭諸臣曰國有差徭民力疲敝皆由工部所致如修治道途不過培下就髙取其平坦而已乃不論髙下概行培築重困民力甚為擾纍至於民房稠密之處不即量行拆毁布置均勻乃止揭取數椽而置之小民何以安居爾等其究治之於是諸臣勘奏命坐工部承政薩木什喀參政裴國珍啓心郎喀木圖以應得之罪尋以都察院承政公滿達海等奏言時屆秋禾成熟改造廬舍恐妨收穫且貧民力薄勢難兼管懇暫停工作俟禾稼登場農功既畢來嵗春和再行修造得旨所奏是時方收穫改建房屋著即停止其有力之家自能修蓋者聽無力者不必催督俟來春農隙再行修造己五諭兵部定軍律太宗命大學士希福剛林學士占巴武達禮傳諭兵部曰凡行軍之際克城多而我兵不損者為上克城多而我兵損者為中至克城少而我兵大損者為下宜罪之庚寅諭户兵二部清察各旗丁口太宗諭戶兵二部曰各旗所有伊蘇特喀喇車里克部之間散蒙古毋得令其隱漏户部宜清察人丁編入牛録兵部再加察核俱令披甲其現在滿洲旗下察哈爾喀爾喀等部蒙古亦當察其壯丁增減勿令混匿至於諸王貝勒貝子公等家下間散蒙古亦編為小旗設護軍校管轄之秋七月戊戌征黑龍江呼爾哈部師還先是三月庚戍命護軍統領阿爾津哈寧阿等率將士往征黑龍江之呼爾哈部所向克捷攻克博和哩諾爾噶勒都里三處又招降小噶爾達蘇大噶爾達蘇綽庫禪能吉勒四處並籍俘獲户口數目自軍中奏報至是還命將歸順男子一千四十九人按丁披甲編補各旗缺額者其餘俘獲分賜出征將領賜阿爾津哈寧阿等貂皮銀兩其從行軍士厮卒及陳亡被傷者分别賞給銀兩有差壬寅定王貝勒等失悮朝會處分命吏部定諸王貝勒貝子公等凡常朝之期有一次不到者親王罰大牛一郡王罰中牛一貝勒罰中次牛一貝子罰小牛一公等罰大羊一如奉上命傳集不至者坐以應得之罪若借稱有事怠悮朝會者送法司從重治罪丙辰定內外王貝勒等相見禮命禮部定外藩諸王貝勒貝子公等來朝與在內諸王貝勒貝子公等相見禮儀己未改理藩院衙門為內三院都察院參政祖可法張存仁等奏言皇上膺圖御宇撫馭臣民凡禮樂制度昭垂萬世前奉旨設內三院及臣等衙門相鄰不逺立朝侍班咨商政事皆聖心之所裁定也近聞將內三院衙門移於理藩院之外蓋三院係朝廷近臣豈可逺居合仍將理藩院外移疏入太宗是之命郭臣改理藩院衙門為內三院另建理藩院近禮部衙門八月丁卯賜來朝外藩大宴先是太宗以征明克捷於中元節遣官祭告太廟福陵並頒敇宣示朝鮮至是科爾沁部土謝圖親王巴達哩卓哩克圖親王武克善巴圖魯郡王滿珠什哩額駙竒塔特畢爾塔噶爾巴雅斯呼朗及棟果爾塞稜郭爾羅斯部桑噶爾等率衆來朝上表稱賀大宴之賜巴達哩武克善等銀兩有差皇清開國方略卷三十一
