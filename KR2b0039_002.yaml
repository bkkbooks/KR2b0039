body:
  text: 欽定四庫全書皇清開國方略巻二太祖髙皇帝丁亥年至戊戍年丁亥年春正月築城呼蘭哈達南岡尼堪外蘭既伏誅見丙戌年太祖乃于呼蘭哈達之南嘉哈河碩里口兩界中平岡築城三層建宫室立法制以禁欺詐防盗賊夏六月攻克哲陳部哲陳部長阿爾泰據山結寨太祖率兵征克其寨擒寨主阿爾泰斬之秋八月攻克巴爾達城及洞城巴爾達城舊附哲陳部與我搆兵見乙酉年太祖命巴圖魯額亦都後為一等大臣世襲果毅公率兵征之至渾河河漲不能涉以繩聨軍士魚貫而渡率精鋭數人乘夜攻之梯城而上城中人迎拒額亦都跨城堞而戰身中五十創猶死戰不退城中人皆潰遂克其城太祖復自率兵攻洞城克之降其城主扎海以還戊子年秋九月取完顔城初葉赫貝勒揚吉努識太祖為非常人言我有㓜女俟其長當奉侍太祖曰汝欲結姻盟盍以年已長者妻我揚吉努曰我非惜長女不予恐未足稱嘉耦㓜女儀容端重舉止不凡堪為聰睿貝勒配耳太祖因聘焉事在乙酉年前是為孝慈髙皇后誕生太宗文皇帝哈達萬汗之子貝勒瑚爾罕以其女送太祖為妃事即在戊子年四月太祖出迎時憩洞城之野有乘馬佩弓矢過者太祖問左右曰誰也左右曰此棟鄂部人善射部中無出其右所稱善射紐翁錦是也太祖召之至指百步外柳命之射紐翁錦發五矢中其三上下相錯太祖發五矢皆中衆視之五矢所集僅五寸許鑿落塊木而五矢始出共歎為神技云時蘇完部長索爾果率部衆來歸太祖以其子費英東佐理政務後為一等大臣世襲信勇公棟鄂部長克徹巴延之孫何和哩率部衆來歸太祖以長女妻之後為一等大臣世襲勇勤公雅爾古寨長扈拉瑚率衆來歸太祖以其子扈爾漢為養子賜姓覺羅任侍衛後為一等大臣世襲子爵至是親率兵征完顔部夜過東星阿地天隕一星大如斗有光衆馬皆驚太祖知為克敵之象也遂進兵至完顔城攻克之斬其城主岱度墨爾根而還己丑年春正月取兆嘉城先是克兆嘉城獲理岱見甲申年寜古親代為城長擁兵負固有年至是太祖率兵征之伏兵城下城内兵百人出我伏兵不即擊引弓射之敵兵突衝上前四面環繞太祖獨立百人中手刃九人餘衆悉潰走圍城四日將破之我兵遂弛備分取所俘獲聚而譁太祖解甲授侍臣鼐䕶被之諭曰我兵喧譁必相爭奪爾往禁止鼐䕶既往喧益甚太祖又以棉甲授侍臣巴爾泰被之諭曰敵將遁速取我甲巴爾泰往因喧譁未息不即來忽城内十人突出和洛噶善城索長阿之孫旺善武泰第三子為敵兵撲仆地踞其身欲刺太祖未及甲奮身直前發矢中敵兵額應弦而踣援旺善起衆兵乃至攻克其城斬寜古親而還辛卯年春正月收服鴨緑江路時環境諸國有抗逆者皆已削平境内所産東珠人葠紫貂黒狐猞猁猻諸珍異之物足備服用明亦遣使通好嵗以金幣聘問于撫順清河寛甸靉陽四關口互市以通商賈國勢日盛太祖乃遣兵招撫長白山之鴨緑江路盡收其衆癸巳年夏六月敗哈達兵于富勒佳齊先是辛卯年葉赫貝勒納林布禄貝勒揚吉努之子遣使伊爾當阿拜斯翰來告曰烏拉哈達葉赫輝發滿洲言語相通勢同一國豈有五主分建之理今所有國土爾多我寡盍將額勒敏扎庫穆二地以一與我太祖叱之歸諭曰我乃滿洲爾乃呼倫爾國雖大我豈肯取我國即廣爾豈得分且土地非牛馬比豈可割裂分給爾等皆執政之臣不能各諫爾主奈何靦顔來告耶既而葉赫哈達輝發三國貝勒復各遣使來太祖宴之葉赫使人圖爾徳起請曰我主有言欲相告恐觸怒見責奈何太祖曰爾不過述爾主之言耳所言善吾聽之如出惡言吾亦遣人以惡言報之吾豈爾責乎圖爾徳曰我主云欲分爾地爾不與欲令爾歸附爾又不從儻兩國興兵我能入爾境爾安能蹈我地耶太祖聞言大怒引佩刀斷案諭曰爾主弟兄何嘗親臨陣前馬首相交破胄裂甲經一大戰耶昔哈達國䝉格布禄岱善如二童擲骨為戲以致鬬爭叔姪自相擾亂故爾等得掩襲之何視我若彼之易也爾地豈盡設關隘吾視蹈爾地如入無人境晝即不來夜亦可至爾其奈我何昔吾以先人之故問罪于明明歸我喪遺我敕書馬匹尋又授我左都督敕書已而又齎龍虎將軍敕書嵗輸金幣汝父見殺于明事在甲申年詳後天命四年曽未得收其骸骨徒肆大言于我何為也遂作書遣巴克什阿林察持往諭之曰爾持此書至葉赫兩貝勒前誦之若懼而不誦即居彼勿復來見我阿林察遂行葉赫貝勒布齋聞之使人迎至家索視書阿林察出書誦之布齋曰我既見書不必令吾弟納林布禄見也阿林察曰我主有命此書不令俱見勿復回布齋曰吾弟言辭不遜汝主怒之良是但吾弟見書又恐有傷于汝耳阿林察乃還未幾長白山所屬珠舍哩訥殷二路同引葉赫兵刦我東界洞寨時太祖御樓羣臣入告太祖曰任彼刦之可也此不過我同國之人逺附葉赫刦掠我寨耳水豈能越山而流火豈能踰河而燃乎葢水必下流火必上燃珠舍哩訥殷二路終當為我有也至是葉赫貝勒布齋納林布禄糾哈達貝勒䝉格布禄烏拉貝勒滿泰輝發貝勒拜音達哩四國合兵刦我瑚布察寨太祖率兵追之設伏于途少引兵亦略哈達國富勒佳齊寨哈達兵來戰太祖欲引敵至伏兵處令我兵前行躬獨殿後俄而敵兵三人聨騎揮刀追逼又一人揮刀迎擊于前太祖念兵刃自後至猶可避自前至恐傷面目及手遂引弓射前至者又其人在右發矢未便太祖因回身從馬項上射之中馬腹遂逸去其三人乘發矢時掩至太祖乘馬驚躍幾墜賴右足據鞍得復乘遂射䝉格布禄馬踣地其從者泰木布禄以所乘馬與其主乘之遁歸太祖率騎兵三人步卒二十人追擊斬十二人獲甲六副馬十八匹乃還秋九月擊敗葉赫哈達等九部兵于古哷山葉赫哈達烏拉輝發科爾沁錫伯卦勒察珠舍哩訥殷九部合兵分三路來侵太祖遣武理堪後為前鋒將世管佐領往偵由東路行百里許度嶺羣鴉競噪若阻其行者欲還鴉乃散再行鴉復噪飛鳴撲面幾不能前武理堪異之馳歸以告太祖命由扎喀路向渾河部偵之武理堪復馳往見敵兵營渾河北岸方夜㸑火密如星欲俟飯畢乘夜渡沙濟嶺而來武理堪偵實馳告時夜已過半太祖曰日者聞葉赫兵來今果然我軍昏夜出恐驚國人傳語諸將期旦日啟行遂就寢甚酣妃富察氏呼上覺謂曰九國兵來攻何反酣寢耶豈方寸亂耶懼之耶太祖曰人有所懼雖寢不成寐我果懼安能酣寢前聞葉赫兵三路來侵因無期時以為念既至吾心安矣吾若有負于葉赫天必厭之安得不懼今我順天命安疆土彼不我悦糾九國之兵以戕害無咎之人天必不佑也安寢如故及旦太祖既早膳率諸貝勒大臣詣堂子拜復再拜祝曰皇天后土上下神祇某與葉赫本無釁端守境安居彼來搆怨糾合兵衆侵陵無辜天其鑒之又拜祝曰願敵人垂首我軍奮揚人不遺鞭馬無顛躓惟祈黙佑助我戎行遂親領兵至托克索地立渡處誡軍士曰盡解爾蔽手去爾䕶項或項臂傷亦惟天命不然身先拘縶難以奮擊我兵輕便破敵必矣衆皆如上命行至扎喀之野扎喀城守將鼐䕶三坦二人來告曰敵兵辰時已至攻城不克退攻赫濟格城敵兵甚多奈何衆聞之色變扎喀城有朗塔哩者後至呼曰貝勒安在我兵幾何言訖遂登山望之還告曰若以敵兵為多我兵亦豈少耶昔我國與明交戰明兵漫山蔽野我兵僅二三百尚敗其衆我國之人驍勇敢戰必破敵兵如不勝吾甘軍法衆聞言心始安太祖復遣人偵探諭曰敵若還軍乘夜擊之否則旦日接戰時敵兵運糧芻立營壘偵者得實具告太祖遂駐軍是夕葉赫營有一人來降者言葉赫貝勒布齋納林布禄兵萬人哈達貝勒蒙格布禄烏拉貝勒滿泰輝發貝勒拜音達哩兵萬人䝉古科爾沁貝勒翁阿岱莽古斯明安及錫伯部卦勒察部兵萬人共合兵三萬我兵聞之復色變太祖曰爾等無憂吾必不疲爾力俾爾苦戰惟壁于險隘誘之使來若來我兵迎擊之否則四面列陣以步軍徐進彼部長甚多兵皆烏合勢將觀望不前其爭先督戰者必其貝勒我以逸待勞傷其貝勒一二人彼衆自潰我兵雖少奮力一戰固可必勝耳遂于旦日進兵初葉赫兵攻赫濟格城未下是日又攻太祖至古哷山對赫濟格城據險結陣命額亦都率百人挑戰葉赫兵見之罷攻城引兵來戰我軍迎擊敗之斬九人敵稍卻葉赫貝勒布齋錦台什及科爾沁貝勒翁阿岱莽古斯明安復并力合戰布齋先衆突前所乘馬觸木而踣我兵名武談者趨而前踞其身刺殺之敵兵遂亂錦台什與納林布禄見布齋被殺皆慟哭哈達貝勒䝉格布禄輝發貝勒拜音達哩等並膽落潰奔科爾沁貝勒明安馬被陷遂棄鞍裸身乘驏馬走太祖縱兵掩擊積屍滿溝壑追奔至哈達國柴河寨之南時已暮結繩截路邀殺敗兵甚衆明日我兵擒一人至告曰吾獲此人將殺之彼大呼勿殺願自贖因縛之來跽上前太祖問曰爾何人對曰烏拉貝勒滿泰之弟布占泰也恐見殺未敢明言生死惟上命言訖叩首不已太祖曰汝等九部㑹兵侵害無辜天厭汝等昨已擒斬布齋彼時獲爾亦必殺矣今既見汝何忍殺語曰生人之名勝于殺人與人之名勝于取人遂解其縛賜猞猁猻裘贍養之是役也斬級四千獲馬三千匹鎧胄千副以整以暇而破九部三萬之衆自此軍威大震逺邇懾服矣冬十月取珠舍哩部珠舍哩部長裕楞額曽引葉赫諸部兵來侵太祖遣兵征克珠舍哩路獲裕楞額寛釋其罪遷以歸贍養之閏十一月取訥殷部訥殷部藪穏色克什前此亦引葉赫諸部兵来侵至是聚七寨人據佛多和山寨而居太祖命額亦都安費揚古噶蓋率兵千人攻圍佛多和山寨三月乃下斬藪穩色克什甲午年春正月蒙古部長始通好科爾沁貝勒明安喀爾喀貝勒老薩各遣使來通好自是䝉古諸部長通使不絶乙未年夏六月攻克輝發部多壁城輝發貝勒拜音達哩前與葉赫諸部一再來侵太祖率兵攻克其所屬之多壁城斬城守克充額蘇䝉額二人而還丙申年秋七月遣還烏拉布占泰先是陣獲布占泰養之四年至是太祖命大臣圖爾坤煌占博爾寛斐揚占送之還未至其兄貝勒滿泰與其子往所屬蘇斡延錫蘭地修築邊壕父子淫村中二婦其夫夜入皆殺之及布占泰至滿泰之叔興尼雅爭立欲殺布占泰因䕶送二大臣嚴為防䕶不能害興尼雅奔葉赫圖爾坤煌占等立布占泰為烏拉國主丁酉年春正月葉赫哈達等部遣使乞盟葉赫哈達烏拉輝發同遣使來告曰吾等不道兵敗名辱自今以後願復締前好重以婚媾葉赫貝勒布揚古願以妹歸太祖貝勒錦台什願以女妻太祖次子代善太祖許焉具鞍馬鎧胄為聘更椎牛刑白馬祀天設巵酒塊土及肉血骨各一器四國相繼誓曰既盟以後若棄婚姻背盟好其如此土如此骨如此血永墜厥命若始終不渝飲此酒食此肉福禄永昌誓畢太祖亦誓曰爾等踐盟則已有渝盟者待三年不悛吾乃征之戊戌年春正月招降安楚拉庫路安楚拉庫路舊屬瓦爾喀部太祖命長子褚英㓜弟巴雅喇與費英東噶蓋統兵一千征之星馳而往取屯寨二十餘招降萬餘人而還于是褚英賜號洪巴圖魯巴雅喇賜號卓哩克圖臣等謹案明臣黄道周博物典彚曰建州二面臨河一面阻山以磚石包砌重城内城隨住者三百餘家皆親黨心腹外城約近萬餘家皆是挑選精壯者環城逺近散處有數十萬户其地界南鄰朝鮮義州西鄰長甸永甸大甸寛甸新甸靉陽孤山一堵牆瑪哈丹撫安柴河清河撫順北有白石江混同江黒龍江另置千餘家屯種九邊地俱不毛惟建州産珠及葠與貂最下赤松子鴨緑江珠所出也其魚最肥又東北走數千里另有部落中國徒知其幅員三千里不知東北數千里也東多茂松貂巢其上張弓焚巢則貂墮于羅取山澤魚鹽之産易我中國之財故日富此道周熟聞我朝之疆宇廣大既庶且富而約略其詞與辛卯年實録所云産珍異之物足備服用互市以通商賈國勢日盛可相證合然聖朝創造鴻模初不在是自丙戌秋太祖髙皇帝討誅尼堪外蘭後十餘年間以兵攻取者惟隣近之哲陳部巴爾達城洞城完顔城兆嘉城即前此尼堪外蘭在鄂勒琿城時太祖欲往征慮為梗阻之讐敵也珠舍哩訥殷二部則逺附葉赫引兵來掠自取誅滅者也若葉赫哈達烏拉輝發合兵來犯敗衂而去悔罪乞盟猶諭以待三年不悛乃征之是則師不輕出義問宣昭人心悦服䝉古部長亦遣使通好先後招降鴨緑江部及安楚拉庫路幅員漸闢財用益饒迥非席已成之勢享自然之利道周乃謂取山澤之産易中國之財故日富者豈不知有人有土有財之本于有徳今古同符者乎皇清開國方略巻二
