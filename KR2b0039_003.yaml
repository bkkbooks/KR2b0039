body:
  text: 欽定四庫全書皇清開國方略卷三太祖髙皇帝己亥年至辛亥年己亥年春正月呼爾哈路長來朝東海窩集部之呼爾哈路長旺格彰格率百人來朝獻黑白紅三色狐皮黑白二色貂皮自是呼爾哈部朝貢時至其長博濟哩乞婚太祖嘉其率先歸附因以大臣女六配其六長二月創制國書時國中文移往來皆習蒙古字譯蒙古語太祖命巴克什額爾德尼噶蓋以蒙古字改制國書二臣辭曰蒙古字臣等習而知之相傳久矣未能改制也太祖曰漢人讀漢文凡習漢字與未習漢字者皆知之蒙古人讀蒙古文雖未習蒙古字者亦皆知之今我國之語必譯為蒙古語讀之則未習蒙古語者不能知也如何以我國之語制字為難反以習他國之語為易耶二臣對曰以我國語制字最善但臣等未明其法故難耳太祖曰無難也但以蒙古字合我國之語音聮綴成句即可因文見義矣吾籌此已悉何為不可太祖遂以蒙古字合之國語創立滿文頒行國中滿文傳布自此始秋九月平哈達國哈達貝勒蒙格布祿與葉赫貝勒納林布祿搆兵力不能敵以三子來質乞援太祖命費英東噶蓋率兵二千助哈達駐防其地納林布祿聞之搆明開原通事代為齎書誘蒙格布祿曰爾若執滿洲來援二將贖所質三子盡殱其兵二千人我妻汝以所求之女修前好焉蒙格布祿惑其言約于開原城令其妻二人往議我駐防大臣得其情以告秋九月丁未朔太祖統兵征哈達貝勒舒爾哈齊請為先鋒自試太祖許焉命領兵一千為前隊既抵哈達哈達兵出舒爾哈齊按兵不戰告曰彼兵出矣太祖曰豈謂此城無兵而來耶遂親督兵進擊時舒爾哈齊兵填擁于前太祖麾之使開路塞不能入乃沿城而行城上發矢石軍士多被傷者太祖督兵攻其城癸丑克之大將揚古利生擒蒙格布祿馳告太祖命勿殺召之至匍匐進謁賜以所御貂帽及豹裘盡招服哈達所屬城器械財物無所取室家子女完聚如故悉編入户籍遷蒙格布祿贍養之後謀逆事泄伏誅太祖以女妻蒙格布祿之子武爾古岱事在辛丑年春明遣使來言曰爾何故伐哈達而取其國耶其復武爾古岱國太祖從其言命武爾古岱往哈達統率人民既而葉赫貝勒納林布祿糾蒙古兵數侵掠哈達太祖遣使告于明曰吾令武爾古岱還國今葉赫屢侵之奈何以吾所得之國為葉赫所據耶明人置弗答時哈達飢國人乏食至明開原城乞糧不與各鬻妻子奴僕馬牛易粟食之太祖惻然曰此吾所撫之赤子也何忍聽彼流離遂仍收哈達國人贍養之武爾古岱同公主來歸賜田宅人户服物器用備具哈達之先本呼倫國姓納喇其始祖名納齊布祿生尚延多爾和齊尚延多爾和齊生嘉瑪喀碩珠古嘉瑪喀碩珠古生綏屯綏屯生都勒喜都勒喜生克什納都督克什納都督生子二長徹徹穆次旺濟外蘭克什納都督為族人巴岱達爾漢所害徹徹穆之子萬奔錫伯部相近之綏哈城旺濟外蘭奔哈逹主其部後遇害其子博勒寬沙津殺其人以報父讐迎兄萬于綏哈城至哈達主其部萬于附近諸部以次攻取逺者又招徠之其勢日強遂稱為汗國號哈達其時葉赫烏拉輝發及滿洲之渾河部俱屬之萬為人殘暴黷貨無厭凡以事赴訴者賂金帛輒以曲為直否則以直為曲羣下效尤每使人諸路皆驕縱無忌索貨賄鷹犬之類下及雞豚悉被擾害又以好惡為毁譽萬不察其實惟羣下言是聽自戕其國以故所創基業即自敗之其民多叛投葉赫并先附諸部亦皆離散萬汗卒子瑚爾罕繼之甫八月卒弟康古嚕繼之康古嚕卒弟蒙格布祿與瑚爾罕之子岱善爭奪久之得主其部戊戍年蒙格布祿所居城北溪中流血越一嵗國亡辛丑年春正月分編牛録時太祖招徠各路歸附益衆乃分編三百人為一牛録每牛録設長一先是我國凡出兵校獵不計人之多寡各隨族黨屯寨而行至圍場每人出箭一枝十人中擇一人領之令毋離隊越次稱為牛録額真至是定為官名乙巳年春三月增築都城癸卯年春太祖自呼蘭哈達南岡移于蘇克素護河嘉哈河之間赫圖阿拉祖居地築城居之以牛羊犒夫役者三乙巳年三月又于城外環築大城以牛羊犒夫役者五是為未定遼陽以前之都興城至天聰八年稱京初國人刨採人參漬之水以待售明人佯不欲市國人恐朽敗急欲售鮮所利益太祖教以製法令熟而乾之可以經久不急售仍許通市于明所濟甚衆民用倍饒是年蒙古喀爾喀巴約特部貝勒達爾漢巴圖魯之子恩格德爾來朝獻馬二十匹太祖曰彼越敵國而來蓋望恩澤于我也優賚遣還明年冬十二月恩格德爾又率喀爾喀五部貝勒之使進駝馬來朝尊上為神武皇帝自此朝貢嵗至丁未年秋九月平輝發國先是葉赫貝勒納林布祿遣使來誓盟見丁酉年未幾背之太祖遣將穆哈連征蒙古獲馬四十匹以還納林布祿邀于路盡奪之并執送穆哈連與蒙古又以其弟錦台什所許我國貝勒代善之女妻蒙古喀爾喀貝勒齋賽癸卯年秋孝慈皇后疾篤思見母太祖遣使至葉赫迎之納林布祿不許止令僕人南泰隨我使來太祖曰汝葉赫諸舅無故掠我瑚布察寨又率九國之兵侵我自悔起兵開釁之罪刑馬歃血祭天盟誓願聮姻通好旋即背盟以既許歸我之女改適蒙古今我國妃病篤欲與母訣又不許是終絶我好也既如此兩國當復相讐我將問罪汝邦築城汝地矣甲辰年春太祖率兵征葉赫攻克璋城及阿竒蘭城取其七寨俘二千餘人而還時輝發貝勒拜音達哩族人多投附葉赫其部衆亦有叛謀拜音達哩恐懼以其臣七人之子來質乞援太祖許焉發兵千人助之納林布祿紿拜音達哩曰爾若歸爾質子吾即反爾叛族拜音達哩信其言乃曰吾其中立于滿洲葉赫二國之間乎遂取回所質七臣之子以己子與納林布祿為質而納林布祿竟不歸其叛族拜音達哩遣其臣來告曰吾前者誤為納林布祿所誑今欲倚賴上恩乞以女賜我為婚太祖允之後拜音達哩背約不娶太祖遣使謂曰汝昔助葉赫二次來侵我宥爾罪復許爾婚今背約不娶何也拜音達哩紿曰俟吾葉赫質子歸乃娶爾女與爾合謀因築城三層以自固後所質葉赫之子既歸太祖復遣使謂曰爾質子歸今將何如拜音達哩以堅城足恃遂負約丁未年八月彗星出西方九月丙申見于東方指輝發國八夜方滅太祖即于是月己亥率兵征之甲辰圍其城克之誅拜音達哩及其子招降其衆乃班師輝發之先本姓伊克得哩黑龍江岸尼瑪察部人有星古禮者自黑龍江載木主遷于扎嚕居焉因呼倫國之噶揚阿圖謨圖二人居于璋地姓納喇欲附其姓殺七牛祭天改姓納喇是為輝發始祖生子備臣備臣生納靈阿納靈阿生拉哈都督拉哈都督生噶哈禪都督噶哈禪都督生齊訥根達爾漢齊訥根達爾漢生旺吉努招服附近諸部築城于輝發河邊呼爾竒山號輝發國是時蒙古察哈爾國扎薩克圖圖們汗自將圍其城不克而還旺吉努卒孫拜音達哩殺其叔七人自為貝勒至是國亡戊申年春三月克烏拉宜罕山城先是陳獲烏拉布占泰釋歸主其國見丙申年感上再生恩尋率三百人來謁乞婚太祖妻以貝勒舒爾哈齊之女賜敕書十道甲胄五十副禮遣之未幾布占泰以其兄滿泰妻都都祜所珍銅錘送葉赫貝勒納林布祿又以我國所屬瓦爾喀部之安楚拉庫路內河路衆所推服之三人送葉赫引其使人招誘安楚拉庫內河二路適有東海瓦爾喀部斐優城長䇿木特赫來朝告曰吾等因地方遙阻久附烏拉國今其國主布占泰遇吾等虐甚乞移家來附丁未年春太祖命弟舒爾哈齊長子褚英次子代善大臣費英東扈爾漢率兵三千至斐優城徙之時夜隂晦軍中大纛之上有光衆以為異捫視無有復樹之光如初舒爾哈齊曰吾自幼從上征討所見多矣未有此異其非吉兆耶欲還兵褚英代善曰或吉或凶兆已定吾等遽還將何以報命耶遂決意前進至斐優城盡收環城屯寨凡五百户令扈爾漢率兵三百護之先行烏拉貝勒布占泰發兵萬人邀諸路扈爾漢見之令五百户結寨山巔以兵百人衛之使人馳告後隊諸貝勒是夕烏拉兵萬人扈爾漢所率兵僅二百人各據山一面結營相持翼日烏拉以萬人來攻我大將揚古利馳至先衆奮擊斬烏拉兵七人我兵止傷一人烏拉兵退渡河登山畏懼不敢前兩軍相向駐營日過午我後隊諸貝勒率兵齊至見烏拉兵甚多褚英代善䇿馬而前諭軍士曰吾父每有征伐無不摧堅陷敵今雖未親行而我等奉命來此爾衆何憂昔布占泰侵我國我國擒而縛之吾父宥其死復豢養之歸主其國為時未久人猶是人曽從吾手而釋非有天幸得脫也今豈不能再縛之耶彼兵雖多我國荷天眷仗天威吾父威名夙著破敵兵必也衆軍士皆曰願效力遂渡河褚英代善各率兵五百分二路緣山奮擊烏拉兵大敗代善追及烏拉統兵貝勒博克多從馬上左手攫其胄而斬之時天氣晴明忽隂晦大雪寒冽被傷敵兵棄甲逃者僵仆甚衆是役也陳斬博克多及其子生擒貝勒常住與貝勒瑚哩布斬三千級獲馬五千匹甲三千副師還太祖賜舒爾哈齊號達爾漢巴圖魯以褚英遇大敵率先擊敗其衆賜號阿爾哈圖圖們以代善陳斬博克多又與兄並進克敵賜號古英巴圖魯初我軍與烏拉接戰時貝勒舒爾哈齊率五百人止山下及貝勒褚英代善破敵追擊始驅兵前進適有大山間之繞山行未能多所斬獲大臣常書侍衛納齊布奉命護從褚英代善兩貝勒不即隨前進反率兵百人與舒爾哈齊同止山下無所斬獲因論死舒爾哈齊請曰誅二臣與我死無異太祖乃宥其死罰常書金奪納齊布所屬之人戊申年三月命褚英同舒爾哈齊之長子阿敏率兵五千征烏拉宜罕山城克之斬千人獲甲三百俘其衆以歸時烏拉貝勒布占泰與蒙古科爾沁貝勒翁阿岱合兵出烏拉城二十里遙望我軍知不可敵遂相約而還布占泰因失宜罕山城大懼始遣使往來復通前好執葉赫貝勒納林布祿屬下五十人送我使臣殺之又遣其臣來請曰吾數背盟誓獲罪君父誠為汗顔若再以親生之女妻我撫我如子吾乃永賴以生矣太祖復以親女妻之遣大臣以禮往送焉己酉年春二月明令朝鮮歸我瓦爾喀人户先是丙申年春明遣官一員同朝鮮官二員從者二百人來太祖令我軍盡甲觀兵于外遇于妙洪科地迎入城優禮答遣之戊申年三月太祖諭羣臣曰語云念人之惡崇朝而作式好無尤厯世難求我欲與明昭告天地同歸于好乃會明遼東副將及撫順所備禦刑白馬祭天誓曰兩國各守邊境敢有竊踰者毋論滿洲漢人見之殺無赦若見而不殺殃及不殺之人明若渝盟其廣寧巡撫總兵遼東道副將開原道參將等官均受其殃滿洲渝盟殃亦及之誓畢遂同勒誓辭于碑建碑于沿邊諸地太祖復遺明書曰鄰朝鮮境而居瓦爾喀部衆皆吾所屬也可諭彼察出與我至是明遣使諭朝鮮歸我千餘户庚戌年冬十一月招降窩集部諸路長先是東海窩集部之赫席赫路鄂謨和蘇嚕路佛訥赫托克索路並附烏拉太祖遣人招之降弗從丁未年五月太祖命貝勒巴雅喇大臣額亦都費英東扈爾漢率兵千人往征遂取三路屯寨俘二千人而還戊申年九月窩集部之呼爾哈路千人侵我寧古塔城我駐防薩齊庫路兵百擊敗之斬百人生擒十二人獲馬四百匹甲百副餘衆悉降既而降人有逃至窩集部之瑚葉路者匿弗以獻己酉年十二月太祖遣扈爾漢率兵千人討之扈爾漢取瑚葉路二千户而還太祖嘉其功賜號達爾漢賚甲胄馬匹時有歸附我國之􅌪集部綏芬路長圖楞為窩集部之雅蘭路人所掠庚戍年十一月太祖遣額亦都率兵千人往窩集部之那木都祿綏芬寧古塔尼瑪察四路招其路長康古哩喀克篤哩昂古明安圖烏魯喀僧額尼喀哩瑭松阿葉克舒等來歸令其挈家口前行額亦都旋師至雅蘭路遂擊取之收萬餘人而還辛亥年春二月發帑金資民婚娶察國中無妻室之人配給婦女千餘其貧苦不能娶者更命發帑金與之令自娶逺邇歡頌上恩有踰慈父母云秋七月取烏爾固辰穆稜二路先是窩集部來歸路長僧額尼喀哩二人見庚戍年以太祖所賜甲四十副置綏芬地為窩集部之烏爾固辰穆稜二路兵掠去太祖遣呼爾哈部長博濟哩即己亥年率衆歸附者往二路宣諭歸還所掠弗從乃命第七子阿巴泰同大臣費英東安費揚古率兵千人征烏爾固辰穆稜二路俘千餘人而還冬十一月攻克扎庫塔城先是東海呼爾哈路扎庫塔人來降太祖賜之甲三十副其人以所賜甲送黑龍江濵之窩集部人被于樹以試射又貪烏拉國布匹受其貝勒布占泰招撫至是太祖遣額亦都何和哩扈爾漢率兵二千往征扎庫塔城諭降弗從圍三日攻克其城斬千人俘二千人並招降環近路長圖勒伸額勒伸令率五百户來歸臣等謹案明臣黃道周博物典彚有曰萬厯二十八年建州襲殺蒙格布祿其勢始盛蒙格布祿者與納林布祿俱海西部落與建州之家俱封龍虎將軍蒙格布祿最忠順他部謀入邊蒙格布祿輒豫報得為備諸部皆心惡之建州尤甚會蒙格布祿與納林布祿相讐殺蒙格布祿力不支請救于邊吏不許願得乘障扞一圉不許遂求援建州建州兵悉起以援為名襲執之時邊臣遣使議救建州乃以女許蒙格布祿長子送次子歸我內地以息講論邊臣亦因循置之自是建州有輕中國之心鴨緑江外十四道灣扈拉瑚故址白石江內舊有輝發拜音達哩等部落八千餘衆又海西南關舊址大黑山地方俱為建州所併屯兵二千餘家邊吏不設備竟棄新疆由海西南關子孫無良自相屠割而建州袖手待其斃甚矣海西之愚建州之智也此道周所記合之太祖髙皇帝己亥以後數年間事倣佛相近若蒙格布祿之作猛骨孛羅納林布祿之作那林孛羅扈拉瑚之作忽刺虎輝發拜音達哩之作灰扒伯答里舊文沿襲類如是今皆改從開國實録所書而事迹並可互證焉明人稱葉赫為海西北關哈達為海西南關蒙格布祿固哈達萬汗之少子繼其兄瑚爾罕及康古嚕為貝勒在戊子己丑年間與瑚爾罕之子岱善爭奪得主其國太祖髙皇帝嘗譬諸二童擲骨為戲者宜道周亦云南關子孫無良自相屠割也其獲罪我朝始則與葉赫納林布祿輝發拜音達哩等同劫我瑚布察寨又攻我赫濟格城繼則因納林布祿搆兵勢已危急乃質子乞援太祖髙皇帝命將出師助之戍守而蒙格布祿顧信納林布祿誑誘欲執我二將贖彼三質子即盡殱我軍其罪浮于納林布祿拜音達哩矣太祖髙皇帝爰整旅徂征躬冒矢石攻克其城生擒蒙格布祿遂平其國是則問罪之師聲靈赫赫而道周云襲執誤矣夫蒙格布祿明既信為忠順乃當納林布祿與讐殺時請救不許請入備邊又不許逮其罪惡既盈身擒國滅而後市惠飾詞向我議救則明之舉措乖違是非倒置路人皆知之太祖髙皇帝不忍赤子流離安輯撫綏咸俾得所仍諭羣臣與明式好無尤斯真覆載為量而仁育義正遐邇同瞻在明人亦安得不震悚乎國勢日盛也哉皇清開國方略卷三
