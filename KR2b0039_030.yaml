body:
  text: 欽定四庫全書皇清開國方略卷三十太宗文皇帝崇德六年辛巳九月至七年壬午六月崇德六年九月丙戌車駕自松山還是月甲戌朔太宗以大軍克敵率內外諸王貝勒貝子大臣拜天行禮畢是夜太宗夢太祖令四人捧一玉璽授太宗太宗受而覺以語大學士范文程希福剛林等諸臣奏曰太祖授皇上以玉璽乃上帝授皇上大統也次日乙亥命滿洲蒙古八旗俱出馬步兵各百人運紅衣炮往攻松山命睿郡王多爾衮肅郡王豪格率每牛録兵十名還守盛京辛巳太宗自松山城西南移至城西北十里駐營壬午鄭親王濟爾哈朗率兵濬濠圍錦州有牛録章京佛洛率從人三名逃往寧逺投明總兵吳三桂部下是日復率前三人及寧逺蒙古十人還乙酉命安平貝勒杜度饒餘貝勒阿巴泰管旗大臣談泰阿山葉克舒準塔和洛會瑪喇希巴特瑪等圍守錦州貝勒多鐸郡王阿逹禮貝勒羅洛宏宗室拜音圗宗室公艾度禮額駙英固爾岱庫魯克逹爾漢阿賴恩格圖伊拜等圍守松山外藩科爾沁部卓哩克圖親王武克善巴圖魯郡王滿珠什哩等圍守杏山髙橋車駕於丙戌啓行還盛京冬十月辛亥諭鄭親王濟爾哈朗等酌留軍營馬匹太宗於回鑾後五日遣內院學士額色赫等齎敕往諭諸王貝勒等曰錦州松山所濬壕塹可周圍巡視其城外薪草令我軍收割若科爾沁部巴圖魯郡王下馬匹疲瘦令擇肥者乘之翼日明松山城內外馬步兵全出犯我鑲黃旗漢軍汛我軍擊敗之斬首千級獲炮位五十七甲胄軍械四百餘冬十月甲辰太宗命鎮國將軍阿拜率滿洲蒙古每旗撥什庫一員每牛録下兵二名俱衣綿甲往錦州南乳峯山駐營丁未命恭順王孔有德智順王尚可喜等率本部將士及懷順王耿仲明續順公沈志祥所屬將士往錦州駐營至是遣筆帖式琿逹和爾琿等齎敕諭鄭親王濟爾哈朗等曰爾等圍困錦州松山需用馬匹可察有力之家每牛録下各留十匹其餘俱令發回十一月戊寅以嵗歉諭行備荒事例時都察院參政祖可法張存仁等奏言今嵗禾穀未收秋霜早隕恐收穫之時米糧未能豐足價漸騰踊市糶日稀奏請預為籌畫一請嚴沽酒之禁本京及大小城堡計造酒米數每日不暇數百石停止一年可省米數十萬石一請杜囤積之弊有糧之家或賣或借賣則從市平糶借則從時起息俾得有無相通不許居竒長價一請疏河渠之路東土以遼瀋為肥饒夾河六屯尤為沃壤年久不濬故河壅而水不流雨澤偶多遂致泛溢沿河一帶良田悉委棄矣及時挑修用力不多為益最大即民間夫役亦所樂從一請開納粟之例或論罪之大小限以糧數納贖或無罪平人有急公輸粟者量加奬録俟秋成豐稔即行停止疏入得旨所奏俱是我國人民當此飢饉之年著停止沽酒待年豐仍許沽賣獲罪之人無銀納贖願輸糧者準以時價折收有餘糧之家願助者許助願賣者許賣又新開河修濬一事該部俟可以興工之時奏聞十二月甲寅睿郡王多爾衮等敗明兵於松山太宗於十一月乙亥命睿郡王多爾衮貝子洛託公屯齊等駐防錦州肅郡王豪格公滿逹海等駐防松山俱授以戰守方略行至是鄭親王濟爾哈朗睿郡王多爾衮肅郡王豪格等自軍中奏報松山城內明總督洪承疇以兵六千夜犯我正黃旗護軍騎兵及正黃旗庫魯克逹爾漢阿賴營我軍各依汛地沿壕射却之陳斬四百二十四人敵兵退入松山城門閉不得入兩日之間收服二千餘人敵之從杏山宵遁者為我伏兵所殺凡五百七十四人太宗尋遣啓心郎布丹齎敕諭駐守諸王貝勒等曰嗣後錦州松山杏山三城人逃出者十五嵗以下準留為奴十六嵗以上者勿赦崇德七年春正月丙子禁與奴僕私貨太宗諭户部凡有糧貸人及無糧求貸者許家長互相稱貸勿得私向奴僕稱貸及私貸與奴僕二月乙未克松山明總督洪承疇等就擒圍守松山肅郡王豪格郡王阿逹禮貝勒多鐸羅洛宏等自軍中遣安泰瑚葉等奏報明松山副將夏承德自城內遣人密約我軍於彼守禦之處乘夜竪梯登城彼為內應且以其子夏舒為質於是定約以左右翼雲梯各一在前八旗雲梯各一隨後登梯軍士一一𣲖定十八日夜竪梯於城南面阿山旗下班布里和洛會旗下羅洛科奮勇先登衆繼之我軍巡邏於城上詰朝夏承德部卒别聚一處搜敵兵殺之生擒明總督洪承疇巡撫邱民仰總兵王廷臣曹變蛟祖大樂遊擊祖大名祖大成總兵白廣恩之子白良弼等殱其兵道一員副將十員遊擊都司守備千總把總等官百餘員兵三千六十三名夏承德部下男婦幼稚共一千八百六十三人又俘獲婦女幼稚共一千二百四十九口甲胄弓刀撒袋共一萬五千有竒大小紅衣炮鳥鎗共三千二百七十三并籍金珠銀兩縀匹衣服皮張等細數以聞太宗諭令將俘獲諸物酌賜將士一應軍器即於松山城內收貯壬戌歸降副將夏承德至命禮部承政滿逹爾漢郊迎十五里宴之癸亥以松山既下凡大淩河各官有兄弟妻子在彼者俱令察出完聚諭將明總督洪承疇總兵祖大夀之弟祖大樂解送盛京誅巡撫邱民仰總兵王廷臣曹變蛟三人縱祖大成還錦州並諭漢軍大臣石廷柱巴延劉之源金礪曰所獲松山一切鎗炮火藥炮子可用者用之不堪用者加意收藏不可散失是日學士羅碩額色赫等奏報明十三站夏百總率所屬男子一百名及婦女幼稚來歸三月癸酉武英郡王阿濟格等敗明總兵吳三桂兵先是二月戊午武英郡王阿濟格自杏山軍營奏報先遣前鋒將領鄂謨克圖巴圖魯鄂碩等往略寧逺因兵少恐為敵兵阻截續遣護衛及親軍四十人往應路遇鄂謨克圖等俘獲牲畜而返遂與俱歸時明寧逺總兵吳三桂王朴白廣恩遣副將二員率兵六百人尾我後我軍誘而敗之獲甲十九馬六十至是武英郡王阿濟格遣喇色奏報寧逺總兵吳三桂白廣恩及祖大夀之子率兵四千欲窺我營駐於塔山令兵一半前至髙橋與我哨兵相遇拒戰時遣兩翼前鋒兵一從大路一從後路緝擒嚮導以探敵兵虛實偵知敵兵不戰而退遂令前鋒兵在前護軍統領二員每旗甲喇章京二員每牛録護軍一名隨後追至連山殺三十人生擒百戶一名獲馬三十匹尋遣兵捉生偵信遇出城採薪者殺三十餘人又明兵五百欲進寧逺我前鋒將領努山擊敗之斬五十二人獲馬二十九匹己卯克錦州明總兵祖大夀降大軍自上年三月掘濠防戍更畨圍困錦州至是年三月明援兵俱絶城內糧盡飢民相食祖大夀戰守計窮又聞松山已失乃率衆官出城至鄭親王濟爾哈朗睿郡王多爾衮軍前叩首乞降先是祖澤逺屢遣人至營言祖澤洪若在欲邀與語王等詰之云祖澤洪與爾言時爾不與言今澤洪已回復與誰語耶越二日其人復來云此言係祖總兵遣來相告者諸王云祖總兵云何曰祖總兵近聞松山已失若得見祖大樂我即歸順寧逺亦可得也諸王與衆大臣議定遂令來人與祖大樂相見次日又遣三人來云祖總兵問諸王可許與盟誓及有用印移文否果爾即歸順矣諸王怒云昨言見祖大樂即降今日何又出此妄言耶我圍困此城旦夕可取有何顧慮乃與爾盟誓乎爾欲降則降不降則已誰強爾也遂羈來使二人遣一人回祖大夀即遣中軍髙勳副將祖澤逺復來云昨乃小人妄言非祖總兵言也王若令今日來即今日至明日來則明日至惟王命是聽次日祖大夀遂率衆官詣軍前叩首降王等遣啓心郎額爾克圖議政大臣雅賴奏報祖大夀降後即日率兵入城駐於城上守護城門諸王議取寧逺之策當乘大夀妻子尚未撤回總兵吳三桂尚未更替之時亟行前往遂定議至錦州城內兵約有七千人與祖大夀同心歸順之官屬兵丁悉留養之其餘或誅與否謹候上裁是夜太宗遣內院學士額色赫等往諭曰祖大夀部下之人悉與留養其他悉誅之凡在錦州蒙古人察出處斬杏山塔山兩處可令祖大夀遣人往説之降并令祖大夀所屬有父母兄弟之人極誠實者前往寧逺俟有回信來奏其武英郡王之軍可於塔山西連山大路嚴行堵截一至海邊一至山下立營松山所獲祖大樂祖大成帶往錦州與伊妻子完聚令與祖大夀同處祖大名先曽有旨誅之若未正法從寬宥釋亦令依於大夀處爾等可速往宣諭恐祖大夀屬下之人有誤被誅戮者壬午太宗復遣筆帖式寧古哩鏗特彰通阿等往諭曰爾等可傳諭祖大夀諸王因爾相持日久不下欲盡加屠戮不留一人朕深加憫念如將錦州民人盡行誅戮後將何以招擕懷逺俾大軍一至各來歸順乎因悉將爾部衆留養其在錦州蒙古兵及山海關之兵縱使生全彼亦不肯為我有也且恐不利於爾故悉誅之至關外寧逺等處官員其妻子雖不在錦州者亦留養之又諭曰原在錦州人民並商賈人等可悉豫保全歸順官兵盡令剃髮其應誅之人可語祖大夀顯正其抗逆之罪然後加誅仍將應誅應留及所俘獲速行開明具奏至巡城守壕將士不可謂錦州已降遂爾怠忽恐偽降官員變貌易服而逃也寧逺之人有言欲見大夀便歸順者不可輕聽其更畨回家兵丁可令暫停俟所獲人口牲畜檢收既畢即令攜來又武英郡王原令駐劄寧逺連山之間朕聞諸王貝勒云在彼處無益宜過寧逺遮截大路屯駐如欲前往時須防敵兵伏有地炮當避路傍山而行若遇敵步兵營不可遽擊必俟彼行動伺便擊之寧逺之人若欲歸順令我軍入城必索城中大員為質命我軍嚴守城門然後可入不然恐墮其計再令圍杏山之官員每旗章京一員每牛録兵二名往助武英郡王軍丙戌鄭親王濟爾哈朗等遣圖賴賽木布博貝光泰等自錦州齎册籍至奏稱所留官員總兵祖大夀革職總兵祖大弼副將髙勳祖澤逺參將祖澤沛祖澤盛劉志友鄧雲李勝郭朝宗遊擊吳汝玠王江張成梁祖雲龍都司金應第劉獻忠張交元唐珍塗世科髙應竒守備王文貴潘永德藺一元崔允升男婦幼稚共三千四百二十八人喇嘛二十六名僧人六十八名又俘獲人四千八百九十四名馬牛金銀等物俱載册內太宗諭大學士希福剛林等曰汝等可帶大淩河官員往錦州令察認伊等妻子奴僕即給豫之將祖大夀官屬兵丁户口及各家妻子奴僕開明具奏其留下人民編入户籍仍令在彼居住凡圍錦州章京俱照職加賞陳亡被傷之人亦分别賞恤其餘均分與軍士一切賞賚之事必與鄭親王睿郡王商酌而行丁亥希福剛林等至錦州將大淩河各官妻子奴僕凡存在錦州者俱察出給與遣寧古哩等還奏錦州民人家財什物遇兵戈之後散棄一空難以居住至祖大夀妻子奴僕及部下官屬兵丁户口共四千五百八十名所有家資本欲令夫役護送但輜重未易移運太宗復遣筆帖式琿逹鄂謨克圖等傳諭曰編為民户者既不能在錦州居住當令一的當官員率領牛莊所屬兵丁從牛莊大路送至蓋州安插若遇運米來接濟之兵其護送人員不可中道輕離俟渡遼河後始可隨意行走朝鮮兵丁回時亦令從此路行其至東京日期當先來報以便遣人迎犒朝鮮運到餘米仍令彼國人看守待庫禮至交收後方可遣回祖大夀等歸順兵丁户口若我國撤回之兵不能攜帶則令彼處種地之滿洲蒙古漢人及喀喇沁每牛録出堅固牛車一輛令本牛録下無馬之兵護之以來如不足則令義州駐防兵量馬多寡運送之如再不足則令撤回之兵馬上均分帶來祖總兵輜重難運之物仍留其家乘暇再取可也伊家口來時遣的當官員護送其至廣寧城日期亦當先報以便遣人往迎各官來時武英郡王阿濟格貝勒多鐸謹慎防護不可踈忽己丑鄭親王濟爾哈朗等遣學士額色赫等奏報臣等曽遣人往寧逺祖大夀之子處因城守官員知大夀已降不令入城在城外與之語未竟始末而回又武英郡王阿濟格過寧逺西離城十里截路下營率本旗護軍同前鋒兵及外藩蒙古兵往視明寧逺城通海運糧之水路遇城內兵出擊敗之殺九十餘人獲馬十三匹乙酉明遣使乞和駐守錦州杏山王貝勒等遣啓心郎占巴奏報明國差總兵一員錦衣衛官一員職方司官一員至王貝勒軍前欲求講和齎到給其尚書陳新甲敇諭一道云諭兵部尚書陳新甲據卿部奏遼瀋有休兵息民之意中朝未輕信者以前督撫各官未曽從實奏明今卿部屢次陳奏我國家開誠懷逺似亦不難聽從以仰體上天好生之仁以復還我祖宗恩義聨絡之舊今特諭卿便宜行事遣官宣布取有確信回奏太宗覽畢敇諭諸王貝勒曰閲爾等所奏明之筆扎多有不實若謂與我國之書何云諭兵部尚書陳新甲既謂諭陳新甲又何用皇帝之寶况扎內並無實欲講和之意乃云我國家開誠懷逺似亦不難聽從以復還我祖宗恩義聨絡之舊等語此皆藐視我國實無講和之真心然彼雖巧詐朕以實情言之向來啓此兵端原非我國之願因明國不辨是非凌辱我國情實難堪故不得已而起兵耳朕從前屢欲講和而明國不從今明國口稱欲和其真偽不得而知然和好固朕之夙願朕豈有所迫而願和歟朕蒙皇天眷顧昔時金國所屬盡為我有元裔朝鮮悉入版圖所獲明國官民不啻數百萬恩威逺播所向無敵如此而猶欲和好者蓋為百萬生靈惜耳若和事果成何必爭內外大小之名但各君其國互相贈遺通商貿易悉安生業則兩國之君臣百姓共享太平之福矣惟是我朝兵強國富尚且諄諄願和奈明國執滯不通自以為天之子鄙視他人口出大言不願和好不知皇天無親有德者受命無德者廢棄從來帝王有一姓相傳永不易位者乎明之君臣慮不及此不願修好致億萬生民死於塗炭者皆明之君臣自殺之耳其罪在彼朕無與焉朕以實意諭爾等爾等其傳示於彼使明知朕意乙未分征明兵為兩班太宗遣內院學士額色赫往錦州杏山諭王貝勒等曰睿郡王多爾衮肅郡王豪格饒餘貝勒阿巴泰輔國公博和託管旗大臣宗室拜尹圖和洛會武賴伊拜駐守杏山鄭親王濟爾哈朗貝子洛託尼堪輔國公屯齊滿逹海特爾祜管旗大臣公艾度禮葉臣庫魯克逹爾漢阿賴恩格圖石廷柱巴延劉之源金礪駐守塔山武英郡王阿濟格郡王阿逹禮貝勒多鐸羅洛宏貝子博洛輔國公芬古扎喀納杜爾祜和托穆爾祜屯齊喀管旗大臣阿山談泰葉克舒準塔巴特瑪瑪喇希鄂謨克圖俱著回京仍將滿洲蒙古各旗護軍騎兵前鋒兵分為兩班一令來京一令駐防其駐防者每牛録護軍四名騎兵十八名此十八名內每牛録派兵四名每旗派賢能章京一員其次章京一員蒙古旗每牛録派兵四名每旗派賢能章京一員撥什庫一名駐於錦州其餘騎軍將士左翼駐於杏山右翼駐於塔山護軍前鋒將士亦駐塔山漢軍將士俱留之候攻取塔山後察其貧窮者先令回京其餘酌量留駐錦州其恭順王孔有德懷順王耿仲明智順王尚可喜及續順公沈志祥官屬兵丁照例更畨候用火炮攻塔山畢分左右翼駐於杏山塔山又令薩木什喀率步兵毁松山城仍收貯火炮等項周圍築垣掘壕量撥人夫防守然後發步兵回京再將隨薩木什喀各章京等派入換班之內其朝鮮兵盡行發回至分撥錦州城內房屋及修理駐蹕之所令人看守王以下公以上房屋令各自修理餘房分給各旗居之不得拆毁其漢軍及恭順王孔有德等所給房舍令彼各遣人居守松山城內房舍母得焚燬亦照旗分定以備修葺房屋之用夏四月丁未敇諭明寧逺總兵吳三桂太宗遣刑部啓心郎額爾格圗齎敇詣王貝勒軍營令傳諭寧逺總兵吳三桂曰朕以大兵圍困松山錦州松山副將夏承德首先納欵故其眷屬及部衆俱加恩留養總督洪承疇亦留養之矣其餘抗命者盡誅惟祖大樂等因係將軍之戚姑留之錦州祖大夀歸命其眷屬部衆俱獲保全此正大將軍趨吉避凶建功立業之秋也將軍果能乘時度勢決意來歸則宏功偉名與迫而後歸之松錦諸臣大相懸絶親屬可以完聚功名可以長保矣否則將軍之全軍已為我所敗印信已為我所奪松錦陷沒坐視而不能救種種罪愆爾主豈肯輕恕耶曩者祖大夀之在錦州也爾主疑之而欲加以罪然終不能者以其族黨勢張且據錦州故耳今將軍以孤立之身負危疑之迹豈能自保無虞况爾國流寇轉熾土宇凋殘傾亡之象將軍已目擊之時勢若此將軍雖勇一人之力其奈之何哉將軍不於此時翻然悔悟決計歸順勞我士馬遲我時日彼時雖降亦不足重矣其詳慮而熟思之並敇總兵白廣恩等令其開導吳三桂同心協謀舉城歸順張存仁祖可法裴國珍吳三鳳胡宏先等又遵旨各遺三桂書白廣恩之子白良弼前在松山被擒並與其父書辛亥塔山奏捷先是錦州既克太宗敇杏山塔山官民曰朕以大兵圍困松錦曠日持久克城之日本應盡誅以正抗拒之罪因松山副將夏承德納欵使我軍得入故獨全其部衆惟不與同謀者殺之錦州祖大夀雖迫而後降亦尚留養其餘未降而死者正復不少爾等毋得效尤迫而後降謂可僥幸全生也若不勞我士馬速來歸命朕當念其歸命之速而優養之倘延遲日久罔識趨避自絶於天城下之日悉罹誅戮悔無及矣至是內院學士額色赫以攻克塔山捷音至奏言鄭親王濟爾哈朗睿郡王多爾衮肅郡王豪格率右翼將士及兩翼護軍漢軍載火器至塔山城列紅衣炮於西初八日進攻至初九日午時城崩二十餘丈我軍悉登遂克其城城內三營官屬兵丁共七千盡殱之嗣鄭親王濟爾哈朗復遣和託鍾古等以俘獲塔山人口及金銀牛馬財貨等物數目奏聞太宗仍命和託鍾古等還諭曰俘獲之物照品賞給陳亡及被傷者效力攻城之章京等官從優加賞人口其餘散給攻城之兵隨從諸王兵及守營兵勿與再令運米於錦州俟人口牲畜米穀等物料理既畢平其城垣大軍退回髙橋一面傍海一面依山橫截大路駐營相時而進乙卯賞恤朝鮮從征將士賜朝鮮總兵副將遊擊守備通事等官及被傷陳亡兵丁銀兩有差時朝鮮總兵官金得幹率副將三員遊擊三員守備十員兵一千從役五百名往杏山助圍又總兵官牛典儀率領官兵自錦州換班俱命迎至東京宴之甲子杏山奏捷先是太宗敕諭杏山守將及軍士等曰松山軍民糧盡副將夏承德勢窮力竭接引大軍入城故將夏承德同謀歸順之衆悉加惠養總督洪承疇亦赦而養之錦州自被圍以來死傷殆盡祖大夀匹馬來歸凡其部衆悉豫保全旋又招撫塔山因其拒命遂以紅衣炮擊而取之夫松錦二城曠日持久勞我士馬雖窮迫投降尚赦而養之今爾杏山受困日淺若不勞士馬敇書到日即舉城投順朕當保撫全城秋毫無犯汝等不特可全身家并當敘爾獻城之功朕命汝等速降者非攻不能取圍不能下也十三萬援兵已敗松山錦州塔山三城已克獨此蕞爾孤城焉有委而棄之之理若朕命速降而不降後或攻或困城下之日悔無及矣又命將此敇諭曉示城內軍民再以善言招撫之來降則已否則聽諸王相機而行至是鄭親王濟爾哈朗等遣侍衛瞻岱等以杏山捷音至奏言臣等遵奉敇諭傳示杏山城內其城內各官不降遂於二十一日黎明移炮於城北攻取近城之臺二十二日於臺前列紅衣炮擊燬城垣約二十五丈餘我軍將欲登城城中危急衆官遂開門至營中叩首云我等先欲歸順畏懼軍威所以未降今或殺或宥惟命是聽臣等令將士入城立於城上并撥兵守門其投降官民及所俘獲俟察明具奏越二日籍投降官民及俘獲男婦幼稚駝馬米穀軍械等數奏報太宗命額色赫瞻岱等往諭鄭親王濟爾哈朗等曰杏山歸順官屬兵丁可俱送來京其餘士民從牛莊路遣發安插蓋州先曾諭撥每牛録騎兵十八名駐防錦州杏山今止撥滿洲蒙古漢軍每牛録兵十名滿洲蒙古領旗大臣各四員隨阿巴泰駐守錦州其餘每牛録八人護送來京户口及往蓋州居住之人量其多寡分撥將士謹慎護送松山塔山二城如拆毁既平可令外藩蒙古兵還又杏山城內兵器諸物運至錦州杏山城亦令拆毁俟料理既畢鄭親王濟爾哈朗睿郡王多爾衮等率護軍還京五月戊寅禁善友邪教太宗諭禮部曰自古僧以供佛為事道以祀神為事近有善友邪教非僧非道一無所歸實左道也且人生而為善則死亦無罪茍無罪戾何用立善友之名既有罪矣雖為善友何益與其積惡而為善友何若行善之為愈乎語云行善者天降以福善原在心非不食肉之謂也今因康養民李國梁等倡善友邪教合羣結黨私造印劄惑世誣民紊亂綱常凡列名於籍者三百餘人法司俱擬死罪朕加寬宥止誅為首十六人自今以後除僧道外凡從善友邪教者爾部永行禁止如有不遵禁約或被人首發或經各衙門察出者殺無赦該管各官及本主不行察究者一例治罪六月辛丑邉明使人還仍報以書先是鄭親王濟爾哈朗奏言明國遣兵部職方司員外馬紹愈主事朱濟之副將周維墉魯宗孔遊擊王應宗都司朱龍守備喬國棟張祚趙榮祖李國登王有功黃有方天寧寺僧性容及從役九十九名在寧逺城欲來見皇上以求和好太宗遣兵部啓心郎占巴內院官葉成額實圖等往迎於五月初三日至塔山城初七日偕之來既至我境占巴葉成額先來奏報十四日當至京城命大臣迎於二十里外設宴來使行一跪三叩頭禮入城宿於館驛復命禮部承政滿達爾漢參政阿哈尼堪內院大學士范文程剛林學士羅碩至館驛宴之如初至是遣還賜馬紹愈等貂皮白金有差太宗命大臣送至十五里外設宴餞之仍以書報明崇禎帝曰向來所以搆兵者蓋因爾明國無故害我二祖我皇考太祖皇帝猶固守邊疆和好如舊乃爾明國反肆憑陵干預境外之事哈達國汗萬竊踞之地我已征服爾逼令復還又遣人於葉赫錦台什布揚古處設兵防守以我國已聘之女嫁於蒙古乙卯年爾明國奪我土地擾我耕穫逐我居民燒燬廬舍仍驅令出境所在勒石是以我皇考太祖皇帝收服附近諸國烏喇布占泰輝發拜音逹哩哈達萬之子蒙格布祿所有之地漸次削平於是昭告天地親征爾國又平定葉赫錦台什布揚古之地其後每欲致書修好而爾國不從事漸滋蔓遂至於今此皆貴國先朝君臣事也事屬既往於皇帝何與然從前曲直亦宜辨之今豫仍欲修好者非有所迫而然也豫纘承皇考太祖皇帝之業嗣位以來蒙天眷祐自東北海濵迄西北海濵其間使犬使鹿之邦及産黑狐黑貂之地不事耕種漁獵為生之俗厄魯特部落以至鄂諾河源逺邇諸國在在臣服蒙古元裔及朝鮮國悉入版圖於是舉朝諸王大臣及外藩諸王等合辭勸進乃昭告天地受號稱尊國號大清改元崇德邇來我軍每入爾境輒克城破陳乘勝長驅若圖進取亦復何難然豫仍欲和好者特為億兆生靈計耳蓋嗜殺者殃好生者祥感應之理昭然不爽若兩國各能審度禍福矜全億兆而誠心和好則自兹以後宿怨盡釋尊卑之分又何必較哉古云情通則明情蔽則暗若爾國使來豫令面見豫國使往爾亦令面見如此則情不壅蔽而和事可久若自視尊大俾使臣不得面見情詞無由通達則和事終敗徒貽家國之憂矣夫豈拒絶使臣進見遂足以示尊耶至兩國有吉凶大事則當遣使交相慶弔每嵗貴國饋黃金萬兩白金百萬兩我國饋人參千斤貂皮千張若我國滿洲蒙古漢人及朝鮮人等有逃叛至貴國者當遣還我國貴國人有逃叛至我國者亦遣還貴國以寧逺雙樹堡中間土嶺為貴國界以塔山為我國界以連山為適中之地兩國俱於此互市自寧逺雙樹堡土嶺界北至寧逺北臺直抵山海關長城一帶若我國人有越入及貴國人有越出者俱加稽察按律處死或兩國人有乘船捕魚海中往來者爾國自寧逺雙樹堡中間土嶺沿海至黃城島以西為界我國自黃城島以東為界若兩國有越界妄行者亦俱察出處死倘願如書中所言以成和好則我兩人或親誓天地或各遣大臣代誓爾速遣使齎和書及誓書以來豫亦遣使齎和書以往若不願和好再弗遣使致書則億兆死亡之孽於豫無與矣於是以書授來使命章京庫爾禪薩蘇喀等率兵四十人過錦州出我軍偵探地送來使至連山而還癸卯禁踐踏田禾太宗諭大學士范文程剛林學士羅碩等曰昔我太祖時凡遇行兵巡幸軍士有踐踏田禾者重則射之輕則鞭之法律嚴明所以重農事也近來諸王貝勒行兵出獵見有踐踏田禾者亦曽察出定罪否朕前往牧馬之所見內大臣塔瞻錫翰博琫錫訥布庫鄂齊爾額克沁丹坦墨爾根袍納木僧格等踐踏田禾已奪取其矢交與兵部究治矣至於出兵有功有罪官員應令在京候定功罪若其餘間散官員即當令其各往本牛録屯莊查勘田土鋤墾與否如有棄而未鋤者可撥工助之五穀係萬民之命何得兀然間坐略不介意也范文程等遵諭集諸王貝勒大臣等於篤恭殿宣示畢王貝勒奏曰臣等遇有踐踏田禾之人應鞭責者鞭責應罰懲者罰懲不敢疏縱也甲辰始編漢軍八旗先是崇德四年分漢軍二旗為四旗至是復編為八旗以祖澤潤劉之源吳守進金礪佟圖賴石廷柱巴延侍衛李國翰八人為管旗大臣祖可法張大猷馬光輝祖澤洪王國光郭朝忠孟喬芳即紹貞裴國珍佟岱何濟格爾金維城祖澤逺劉仲金張存仁曹光弼為梅勒章京尋又設牛録章京命該部王大臣同漢軍管旗大臣梅勒章京等遴選用之皇清開國方略卷三十
