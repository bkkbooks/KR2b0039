body:
  text: 欽定四庫全書皇清開國方略卷九太宗文皇帝初即位未改元天命十一年丙寅九月至十二月天命十一年秋九月辛未集諸貝勒約誓初太祖高皇帝創業興京之壬辰年十月二十五日孝慈高皇后誕生太宗文皇帝天表竒偉面如赤日嚴寒不用暖耳龍行虎步舉止異常天錫睿智恭孝仁惠誠信寬和聖德咸備言辭明敏威儀端重耳目所經一聽不忘一見即識又勇力軼倫步射騎射矢不虛發宏謨逺略動中機宜料敵制勝用兵如神性嗜典籍披覽弗倦自幼頴悟過人太祖甚鍾愛焉甫七嵗委以家政不煩指示即能贊理巨細悉當及長太祖益加器重丙辰年太祖建元天命以次子代善及弟貝勒舒爾哈齊之長子阿敏太祖第五子莽古爾泰第八子太宗並為和碩貝勒國中稱代善為大貝勒阿敏為二貝勒莽古爾泰為三貝勒太宗為四貝勒太祖初未嘗有必成帝業之心亦未嘗定建儲繼立之議太宗隨侍征討運籌帷幄奮武戎行鋤强服叛所向奏功諸貝勒皆不能及又善撫億衆體恤將士無論疏戚一皆開誠布公以待之自國中暨藩服莫不欽仰凡遇徑敵輒躬冒矢石太祖每諭令勿前諸貝勒大臣咸謂聖心默注愛護獨深天命七年三月諭分主八旗諸貝勒曰爾八人同心謀國或一人所言有益于國七人共贊成之庶幾無失當擇一有才德能受諌者嗣朕登大位十一年八月庚戌太祖龍馭上賓大貝勒代善長子嶽託第三子薩哈璘告代善曰國不可一曰無君宜早定大計四貝勒才德冠世深契先帝聖心衆皆悅服當嗣登大位代善曰此吾素志也天人允協其誰不從翼日代善書其議以示二貝勒阿敏三貝勒莽古爾泰及諸貝勒皆曰善遂合詞請上即位太宗辭曰皇考無立我為君之命若舍兄而嗣立既懼弗克善承先志又懼未能上契天心且統率羣臣撫綏萬姓其事綦難辭至再三自卯至申衆堅請不已然後從之九月庚午朔太宗率貝勒大臣行九拜禮告天即位貝勒大臣同各官朝見詔以明年為天聰元年頒赦國中自死罪以下悉原之太宗欲諸貝勒共循禮義行正道交相警戒辛未大貝勒代善二貝勒阿敏三貝勒莽古爾泰太祖第七子阿巴泰第十子德格類第十二子阿濟格第十四子多爾衮第十五子多鐸貝勒舒爾哈齊第六子濟爾哈朗太祖長子褚英之子杜度太宗長子豪格大貝勒代善長子嶽託次子碩託第三子薩哈璘俱集太宗率之誓告天地曰皇天后土既佑相我皇考肇立丕基恢宏大業今皇考龍馭上賓我諸兄暨諸弟姪以家國人民之重推我為君惟當敬紹皇考之業欽承皇考之心我若不敬兄長不愛弟姪不行正道明知非義之事而故為之或因弟姪等微有過愆遽削奪皇考所與户口天地鑒譴若敬兄長愛弟姪行正道天地眷佑諸貝勒誓曰我等兄弟子姪詢謀僉同奉上嗣登大位宗社式憑臣民倚賴如有心懷嫉妬將不利于上者當身被顯戮我代善阿敏莽古爾泰三人若不教養子弟或加誣害必自罹凶孽若我三人好待子弟而子弟不聽父兄之訓有違善道者天地譴責如能守盟誓盡忠良天地眷佑我阿巴泰德格類濟爾哈朗阿濟格多爾衮多鐸杜度嶽託碩託薩哈璘豪格等若背父兄之訓而弗矢忠藎天地譴責若一心為國不懷偏邪天地皆眷佑焉誓畢太宗率諸貝勒嚮代善阿敏莽古爾泰三拜不以臣禮待之各賜雕鞍馬匹丙子定屯莊禁令先是天命十年十月因遼陽廣寧諸處歸順之明紳襟屢煽惑降民潛引叛逃盡察誅之編其户口每十三壯丁為一莊按滿洲各官品級分給為奴至是太宗慮分給日久或受陵虐命按滿洲官品級每一備禦即今佐領止給壯丁八名以供使令其餘分屯别居編為民户擇漢官之清正者轄之禁止貝勒大臣屬下人私索馬匹鷹犬或勒買器物及恣意行遊者凡有告訐實則治罪誣者反坐詔曰治國之要莫先安民我國中漢官漢民從前有私欲潛逃及令姧細往來者事屬已往雖舉首槩置不論嗣後惟已逃被獲者論死其未行者雖首告亦不論又詔曰工築之興有妨農務前因城郭邊牆事關守禦有勞民力良非得已朕深用憫念今修葺已竣嗣後有頽壞者止令修補不復興築用恤民力専勤南畝以重本務其屯莊田土八旗移居已定今後無事再移可使各安其業無荒耕種滿洲漢人毋得異視凡訟獄差徭須畫一均平諸貝勒大臣并在外駐防之人及貝勒下牧馬管屯人有事往屯莊各宜自備行糧若擅取民間牛羊雞豚者罪之田獵採捕須先告知本旗貝勒凡邊內狼狐貉獾雉魚等物各聽其採捕惟不許擊逐麅鹿致疲馬力有妨武事並禁止邊外行獵市稅為國家經費所出應通商貿易若往外國亦當告知諸貝勒私往者均罪丁丑分設八旗大臣初太祖創制八旗每旗設總管大臣舊稱固山額真順治十七年改稱都統各一佐管大臣舊稱梅勒額真亦稱梅勒章京順治十七年改稱副都統各二見乙卯年特設議政五大臣理事十大臣見天命元年後或即以總管一旗佐管一旗者兼之不皆分授又有總兵官副將參將遊擊備禦諸名論功加授見天命五年至是太宗集諸貝勒定議每旗仍各設總管大臣一額駙揚古利前此已授一等總兵官其秩在貝勒之次與額駙李永芳及總管蒙古軍之武訥格俱不預此正黃旗納穆泰揚古利之弟鑲黃旗額駙達爾漢此以正黃鑲黃正紅鑲紅鑲藍正藍鑲白正白為序次與順治元年以後序次鑲黃正黃正白正紅鑲白鑲紅正藍鑲藍不同正紅旗額駙和碩圗何和哩之子鑲紅旗侍衛博爾晉鑲藍旗額駙固三泰正藍旗托博輝和洛噶善城貝勒索長阿第四子龍敦之子鑲白旗徹爾格額亦都第三子前此已授三等總兵官正白旗喀克篤哩初由那木都祿路來歸已授三等總兵官是為總管旗務之八大臣凡議國政與諸貝勒偕坐共議之出獵行師各領本旗兵行一切事務皆聽稽察如前此之固山額真兼議政大臣其佐管大臣每旗各二正黃旗拜音圖篤義貝勒巴雅刺之子楞額哩亦揚古利之弟前此已授三等副將鑲黃旗伊遜費英東弟音達瑚齊之子前此已授逰擊達珠瑚前此已授副將正紅旗布爾吉即天命七年留守遼陽大臣覺羅鐸弼之子葉克舒初由尼瑪察路長來歸已授副將鑲紅旗武善前此已授參將綽和諾那木都祿路長明安圖之子前此已授參將鑲藍旗舒賽前此已授參將康喀賚前此已授備禦正藍旗屯布嚕章嘉城貝勒寶實長子康嘉之子即天命十年守耀州擊敗明兵者薩璧翰前此已授遊擊鑲白旗武拜前此已授遊擊薩木什喀扈爾漠之弟前此已授備禦正白旗蒙阿圖前此已授參將阿山前此已授參將此十六大臣贊理本旗事務審斷詞訟如前此之梅勒額真兼理事大臣不令出兵駐防據是年十月楞額哩阿山率兵入巴林境則惟職任有别非此十六大臣竟不令出征又每旗各設調遣大臣二正黃旗太祖第九子巴布泰前曽駐防鞍山驛即天命十一年五月擊敗明將毛文龍兵者巴竒蘭前此已授遊擊鑲黃旗多諾依前此官職未著揚善費英東弟音達瑚齊之子前此已授備禦正紅旗太祖第四子湯古岱前此官職未著後封鎮國將軍察哈喇沾河寨長常書之子前此已授備禦鑲紅旗哈哈納那木都祿路長明安圖之子前此已授備禦葉臣前此已授遊擊鑲藍旗穆克坦前此已授副將額孟格前比官職未著正藍旗昻阿喇前此官職未著覺羅色勒武功郡王禮敦之三世孫前此已授備禦鑲白旗圖爾格額亦都第八子前此已授參將伊爾登額亦都第十子前此已授遊擊正白旗康古哩初由綏芬路長來歸尚郡主為額駙阿達海阿山之弟前此同授參將此十六大臣出兵駐防以時調遣所屬詞訟仍令審理後為駐防副都統暨前鋒統領護軍統領諸職冬十月甲子討扎嚕特軍奏捷先是正月我軍攻明寧逺城不克而還喀爾喀扎嚕特部貝勒鄂爾齊圖等以兵阻我遣往科爾沁之使臣劫掠財物十月己酉大貝勒代善二貝勒阿敏暨德格類濟爾哈朗阿濟格嶽託碩託薩哈璘豪格諸貝勒率兵萬人征扎嚕特部太宗率三貝勒莽古爾泰暨多爾衮多鐸杜度諸貝勒送至蒲河山岡命聲討扎嚕特背盟之罪先傳示以書曰前者己未年擒貝勒齊賽後曾刑白馬烏牛誓告天地云我滿洲及喀爾喀協力征明欲與和當共議以行若喀爾喀聽明人巧言利其厚賂背棄盟誓而先與私和者天地讉責我滿洲若背棄盟誓譴責亦如之乃爾喀爾喀五部落竟潛通于明聽其巧言利其厚賂以兵助之是爾之先絶我好也又爾卓哩克圖貝勒下有托克推者犯我臺站且擾害我人民掠取我財物至再至三甚至將所殺之人獻首于明疇昔盟言安在哉昔盟誓時爾五部落執政諸貝勒及卓哩克圖貝勒俱預此盟而昻安不從爾等因以昻安委我裁置我是以興師誅昻安見天命八年四月嗣後爾扎嚕特諸貝勒云昻安罪固應誅我部落仍願修舊好不似東四部落或食言敗盟也我故歸桑圖妻子及昻安之子癸亥年復申盟誓云察哈爾我讐也科爾沁我戚也爾慎毋與察哈爾通好或要截我遣往科爾沁之人致起兵端無何爾又背此盟甲子年爾右翼兵襲我使于漢察喇地乙丑年又追我使于遼河畔恣行劫奪是年又要截我使臣固錫刃傷其首盡奪其財物爾扎嚕特何其貪利而背義也然我猶念前好不問爾罪逺征巴林所俘獲爾部下百餘人悉行釋遣後桑圖以誑言而來窺我我已洞悉其奸仍不縶留即遣之歸蓋我之推誠于爾不欲終棄前盟如此今年春爾扎嚕特左翼諸貝勒覘我使臣之出屢次要截道路劫奪財物並行殘害是爾扎嚕特之貪詐不仁妄加于我者終無已時也我之所以興師致討者職是故耳丙辰往征東海卦勒察部大臣達珠瑚等以俘獲人口百餘及馬牛百餘還甲子大貝勒代善等奏捷使人至言扎嚕特貝勒巴克即天命四年陳擒七年釋歸者及其二子并拉什希布等十四貝勒俱已擒獲殺其貝勒鄂爾齊圖盡俘所屬人户丙寅征巴林軍凱旋先是癸丑太宗遣副將楞額哩參將阿山率兵六百征喀爾喀巴林部驅逐哨卒縱火燎原以張聲勢使與扎嚕特部不得相顧楞額哩阿山入巴林境遵上方略又俘人口二百七十餘獲駝三十四馬一千一百一十一牛一千二百一十一羊二千五百八十六至是凱旋太宗率諸貝勒大臣出城十五里勞之命行抱見禮刲八牛祭纛告天時明寧逺巡撫袁崇煥即本年正月我軍往征時之寧逺道至是為遼東巡撫仍守寧逺欲窺我國情形遣李喇嘛同都司傅有爵田成等三十四人來弔太祖喪并賀上即位太宗因令李喇嘛及其官四員隨行觀視既祭纛畢按出征將士品級功績頒賚駝馬牛羊賜李喇嘛駝一馬五羊二十八尚餘駝二十四馬四十牛六百羊一千命散給國中貧户是月科爾沁卓哩克圖貝勒武克善來弔太祖喪土謝圖汗奧巴秉圖貝勒洪果爾元太祖弟哈薩爾之十七世孫博第達喇長子齊齊克生子翁阿岱即土謝圖汗奧巴之父博第達喇次子納穆賽之長子莽古斯生子齊桑即武克善之父納穆賽之第三子即洪果爾岱達爾漢圖美奧巴之從兄扎薩克圖杜稜布達齊翁阿岱之次子青卓哩克圖和爾和岱奧巴之從弟伊爾都齊棟果爾納穆賽次子明安之長子達庫爾哈坦巴圖魯明安次子諾穆齊桑阿爾齊明安第八子卓哩克圖索諾穆齊桑第三子等各遣使來弔十一月癸酉勞征克扎嚕特軍大貝勒代善等奏捷使至之後八日十一月辛未太宗率貝勒大臣出迎次鐵嶺范河界癸酉凱旋軍俱集立八纛拜天畢御黃幄凱旋諸貝勒大臣跪見太宗不欲受大貝勒代善二貝勒阿敏跪拜躬率三貝勒莽古爾泰等答禮命巴克什達海傳旨問兩兄及諸貝勒在行間安否巴克什庫爾襌前跪代奏荷䝉上天福佑皇上威靈此行俱各如願代善阿敏率諸貝勒大臣以次入跪行抱見禮太宗謂追念皇考創業艱難兵威積久始盛今兹諸兄弟勤勞逺征刻期制勝皆由平日凛承皇考謨訓諭未竟愴然淚下代善及諸貝勒大臣無不感泣時明使李喇嘛等亦奉命入見見畢以次列坐行飲至禮翼日按籍論功以所俘獲頒賚將士有差賜陳獲扎嚕特部巴克鄂齊爾桑巴克之子岱青多爾濟拉什希布桑阿爾齊額多倫扎木蘇阿穆克拉卜什希等衣服財物銀器及日用等物又以巴林之捷兵止六百俘獲甚多楞額哩由副將擢總兵官即今三等子阿山由參將擢副將即今三等男駕旋聞察哈爾所屬之阿拉克綽特部貝勒圖爾濟率百餘户來歸諭從臣曰來歸之人誠心向化宜以禮迎之命備禦伊拜納蘭攜食物往迎時喀爾喀貝勒卓哩克圖之子偉徵巴拜攜妻子及男子八人婦女四口乘馬十八匹來歸又貝勒齊賽即天命四年陳獲六年釋歸者感念太祖恩釋還國遣使來弔科爾沁貝勒青巴圖魯桑阿爾齊明安第四子台吉滿珠什哩齊桑第四子各親齎牛羊鞍馬來弔十二月庚子禁私鬻軍器詔曰弓矢矛刃行軍之要器自貝勒以下毋得私與外藩貝勒遣來之人若欲與必先奏聞其外藩貝勒以下雖遇歸順于我之䝉古諸部亦不得以此私鬻違者罪之是月黑龍江二十六人來朝貢犬及黑白紅三色狐皮黑貂猞猁猻水獺青鼠等皮皇清開國方略卷九
