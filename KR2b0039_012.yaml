body:
  text: 欽定四庫全書皇清開國方略卷十二太宗文皇帝天聰三年己巳天聰三年春正月庚申科爾沁部長來朝初科爾沁奧巴來朝太祖髙皇帝賜號王謝圖千以郡主妻之見天命十一年六月天聰二年九月太宗統師征察哈爾奧巴率兵掠察哈爾邊境弗至期㑹之地而還十二月命侍臣索尼阿珠祜往責之與以書曰昔者汝父助葉赫興兵奧巴之父貝勒翁阿岱來侵見癸巳年謀分我地幸天佑我國汝弗獲逞後我兵征烏拉牛山汝父子以兵助烏拉又助葉赫殺我侍衛布揚古罪非一端應即興師致討我皇考寬仁遣使議和盟誓天地相與修好後汝欲親來議和約定㑹所我皇考赴約汝復不至此汝之欺誑也察哈爾興兵伐汝我不辭勞苦率師相救兵至農安塔察哈爾遂棄將克之城而遁彼時若非我兵相援爾尚得有今日耶察哈爾還兵之後汝來修好我皇考復加優遇以女妻汝又厚賜金珠裘幣甲胄器用等物遣汝歸國及我皇考升遐諸國銜哀各遣大臣子弟來弔汝于兩月後方遣一下等屬員來此汝之負恩也向者通好時曽約一切敵國和則同和伐則同伐汝乃敗棄盟言與我讐敵之明國兩次通市汝之反覆無常也汝欲報怨于察哈爾屢遣使來約及我國興師爾竟不赴委我于敵遽爾先回汝行不踐言狡詐實甚今而後汝之心我更何以相信乎太宗既繕書厯數其罪復諭索尼阿珠祜曰汝等往見彼勿加以禮勿食其食厲色待之即作欲歸狀以覘其情形索尼阿珠祜齎書行十日至科爾沁有以牲致饋者麾之去出所㩦餱糧食之奧巴病足居别室索尼阿珠祜詣見郡主進禮物並以事畢即歸諭旨告奧巴聞之扶掖至佯問曰此為誰索尼阿珠祜曰吾儕天聰皇帝使臣也爾有罪義當絶今特以公主故來餽問恐耳奧巴語左右具饌索尼阿珠祜不顧而出奧巴上使至使台吉塞稜等問曰往者爾等見我不拜具饌不向我行禮與之食則食今皇上有食即趨而出豈索尼阿珠祜答曰吾儕非為爾來所譴責于我耶皇上震也何拜為又何為食爾之食耶爾罪多端我怒恐我等不能達意另有諭旨于是以書授之即整轡欲行奧巴得書大驚令衆挽留再三曰伏讀上諭責我罪重心甚惶懼罔知所措既已獲此重罪若聽使者獨返罪滋重矣當令台吉拜斯噶爾及桑阿爾齊同使者往謝罪俟我足愈親往索尼阿珠祜曰吾儕奉上命饋公主禮物事畢即行汝欲辨已罪强留我等偕二人以往我等豈為取此二人而來耶奧巴旋遣人上之怒告曰令子弟去無益適以重力疾就道死無所辭我罪益深不如親往足雖病上怒也終不可以安坐置辨冀釋同汝去亦未令我阻汝索尼阿珠祜答曰未令我汝其自裁之奧巴又遣人告曰今欲親往决矣惟懼上怒難解不我見而逐我耳索尼阿珠祜曰汝果引咎往朝必蒙我皇上寬容弗汝逐也奧巴大喜留索尼阿珠祜十日送之先行囑曰我朝見無遣使報問至尊之理爾既先行幸為我轉奏我以獲罪之故足雖疾當令人扶掖來朝叩頭以謝如䝉上寬容拜覲戾我之願也天顔釋我罪索尼阿珠祜還奏太宗曰果能知罪改過猶可恕矣至是奧巴來朝駕出迎十里還御殿宴之越二日命巴克什庫爾禪希福等復申前書中語致詰奧巴俱服罪其私與明國交市願罰駝十馬百征察哈爾違約遽歸亦願罰駝十馬百又越三日奧巴獻馬一甲一謝罪太宗宥之賜貂裘金鞓帶帽靴及朝鮮所貢皮幣財物及辭歸復賜甲胄縀布猞猁猻裘雕鞍金銀器皿等物親率貝勒大臣出郊餞之越宿而還丁丑議增直月理政貝勒先是天命六年二月太祖命太宗同大貝勒代善二貝勒阿敏三貝勒莽古爾泰佐理國中政事按月分直及太宗即位仍令分月掌理至是傳諭曰向因直月之故一切機務輒煩諸兄經理嗣後可令弟姪輩代之如有疏失咎坐現直者大貝勒等皆曰善遂以諸貝勒代理直月之事二月戊子嚴禁科斂民財先是察訊正黃旗千總科斂民間財物事謂因本管官及筆帖式等至屯供應不敷故斂民間食物以餉之太宗諭貝勒大臣曰出使之人定例各自備餱糧母許科取于民近聞有違法妄行者不可不嚴為懲治諸臣皆受朕恩身居民上衣食亦已豐裕乃攫取貧民辛勤孳養之牲牢以供口腹貧民被此擾纍何所恃以為生乎逃亡背叛職此之由嗣後事發除凡人照常處分外若係管糧官筆帖式及巡臺人虐民妄行定行處死又諭曰正黃旗官員皆攫取民間食物朕已察知爾七旗大臣可各察本旗所屬人有攫取之事即行奏聞母得容隱于是諸大臣各察出本旗事以奏諭曰官員攫取民間食物若被旁人告發斷難寬宥因係朕自行察出姑宥之嗣後各宜省改前愆共矢公忠庚子罰懲殺降將領先是遣總兵官武訥格副將蘇納率滿洲兵八十人及䝉古全軍往征察哈爾降其邊境二千戶因軍中流言降人瞷我兵少謀殺我兵以歸明乃盡戮其男子俘其妻孥止釋兩台吉弗殺攜之還太宗命以所俘獲分賚將士既而諭責武訥格蘇納妄戮降人盡罰所得駝馬牛羊入官是月甲辰巡閲南路邊境城垣乙巳次穆家堡以郛郭有傾圮者命葺之丙午次牛莊命築新城髙二丈二尺有五寸加雉堞除四隅外每面建腰臺四座賜督工諸臣宴翼日至耀州又翼日至海州凡城垣不堅者咸命修築完固三月戊午申定軍令于外藩先是頒敕科爾沁敖漢奈曼喀爾喀喀喇沁諸部令遵行本朝制度事在正月至是命大臣阿什達爾漢等齎敕與䝉古諸貝勒曰爾等既皆歸順凡遇出師期約宜各踴躍爭赴協力同心毋有後期我兵若征察哈爾凡管旗諸貝勒年七十以下十三以上俱從征違者罰馬百駝十遲至約㑹之地三日者罰馬十若往征明國每旗貝勒一台吉二以精兵百人從征違者罰馬千駝百遲至約㑹之地三日者罰馬十我軍入敵境以至出境有不至者罰馬千駝百于相約之地擅行虜掠者罰馬百駝十夏四月丙戌朔定文館職司初太祖製國書因心肇造備列軌範太宗躬秉神聖之資復樂觀古來典籍以厯代帝王之得失為鑑並欲記注國家政事以昭信史命儒臣達海庫爾禪剛林蘇開武巴什扎素喀古爾嘉琿托布齊瑚球占巴十人分為兩直翻譯典籍記注政事時名文館至崇德元年改增為𢎞文祕書國史三院是月扎嚕特部內齊汗元太祖裔忠圖之子科爾沁部貝勒布達齊貝勒翁阿岱子奧巴弟各率其子來朝五月丁未議䝉古部長越界駐牧罪奈曼部衮楚克巴圖魯來歸見元年七月扎嚕特部內齊汗來朝見前瑚弼爾圖色本瑪尼三人來歸並見二年十二月巴雅爾圖色本兄以私越地界駐牧自行議罪請各罰馬百駝十命從寬各罰馬一戊申分𠞰明兵于海島先是明總兵毛文龍據南海皮島招集遼民令富民皆冒毛姓為其子孫民有逃奔者輒殺之揑稱陳獲誑報冒功明之君臣皆信之升為大都督凡島中官民賞罰黜陟生殺許以便宜行事文龍欲與我國通好屢遣使致書太宗因遣官科廓率從者四人齎書答之往來數次文龍乃執科廓等送往燕京尋寧逺巡撫袁崇煥以文龍與我國私通殺之其部衆有踞朝鮮之鐵山者太宗命總兵官楞額哩率兵五百往𠞰斬三百七十級生擒一百四十人獲馬二十一至是分命諸將搜𠞰海島之舊屬毛文龍者石廷柱率兵二百往黃骨島有自石城島來者斬二百人生擒十九人圖嚕什率兵一百往旅順口斬二十五人生擒二人羅璧哲爾德青善雅賴率兵一千往新城一路遇採參船四擊斃六十人毁其船富克察率兵後行遇採參者七十人盡殱之錫爾都塔哈布各率兵五十至鹿島斬十九人生擒三人布爾吉率兵赴雅爾古地斬採參之朝鮮國十人明國三人復同扈什塔躡踪捕緝斬五十二人生擒十人以歸六月丁卯土默特部入貢土默特部長鄂木布元太祖裔格根汗之三世孫遣四十五人貢駝馬綵縀等物奏言願率部衆歸附其同部台吉卓爾畢泰阿渾阿巴當索諾木等來朝亦貢禮物秋七月乙未庫爾喀部入貢庫爾喀部頭目九人來朝以海豹皮入貢是月喀爾喀貝勒巴哈達爾漢之子拜渾岱拉巴泰滿珠什哩三台吉率三十五人來奏前為察哈爾侵掠俱逃入科爾沁今自科爾沁來歸八月庚午定行軍賞罰例凡入八分貝勒等臨陳時如七旗敗走而一旗獨能迎戰保全七旗者即以敗走七旗所屬人員給與若七旗迎戰而一旗敗走者削爵以所屬人員分給七旗如一旗戰者半走者半即以走者之所屬人員給與本旗迎戰貝勒仍核其戰功另行賞賚若七旗未及戰而一旗首先迎戰亦按其功之大小及所獲多寡行賞若兩軍接戰或追擊敵兵不加詳審妄行衝突者罰所乘馬及所獲人口入官九月壬午朔校試儒生前期詔曰自古國家文武並用以武功戡禍亂以文教佐太平朕今欲振興文教于諸儒中考取其文藝明通者優奬之以昭作人之典諸貝勒及滿漢䝉古之家所有儒生俱令考試取中者别以丁償之至是預試者三百餘人命諸臣校别優劣得二百人凡𨽻內府及貝勒大臣家為奴者盡皆拔出免二丁差徭一等者賞縀二匹二等三等者賞布二匹並候録用是月南界守將伊爾登等率兵𠞰舊屬毛文龍之獐子島獲船四沉一百三人于水中生擒二十七人來獻太宗遣大臣揚古利楞額哩阿山雅賴率騎兵一百步兵二百巡緝採參明人至雅爾古斬九十六級生擒千總三員及從役十六人以歸冬十月辛未㑹師至喀喇沁境定議征明先是六月乙丑諭貝勒大臣曰戰爭者生民之危事太平者國家之禎祥前曽與明議和明之君臣若聼朕言克成和好共享太平則我國採參開礦與之交易若彼不願太平而樂于用兵則我國所少者不過縀帛等物耳我國果竭力耕織以裕衣食之源即不得縀帛等物亦何傷哉我屢欲和而彼不從我豈可坐待定當整旅西征令䝉古科爾沁喀爾喀扎嚕特敖漢奈曼諸國合師並舉勿似昔日之專以我兵往夫師徒既衆供億浩繁陸運糗糧恐不能給必用船載至河西西寧堡方無貽誤宜豫採木植廣造舟楫以備用朕之所見如此但一人所見未必悉協于衆詢謀僉同乃克濟事有謀略素裕可禆益軍政者各以所見入告朕將擇而用之越二旬命貝勒濟爾哈朗德格類嶽託阿濟格率兵萬人征明錦州寧遠秣馬田野中凡一月俘獲以三千計焚其積聚乃還九月甲辰召外藩䝉古部長各率兵來㑹十月癸丑太宗親統師啓行以來朝喀喇沁台吉布爾哈圖曾受賞于明熟識路徑用為嚮導丙辰師次陽什穆河賜宴㑹師之奈曼部衮楚克巴圖魯札嚕特部內齊汗色本桑圖喀巴海瑚弼爾圖之子岱青等巴林部色特爾塞稜之馬匹疲瘦衆䝉古貝勒議罰其甲胄馬駝命俟班師再議諭責之曰朕曽諭爾等善養馬匹勿輕馳騁以備征討之用爾等違諭用以畋獵致馬匹羸瘠來兵遂少㑹亦何益耶庚申師次納哩特河察哈爾五千人來降壬戌駐營遼河命總兵官武訥格副將蘇納率兵四百躡追察哈爾部衆之逃奔明國者俘百人獲馬八十駝七十六牛羊各百餘丙寅科爾沁部奧巴偕洪果爾貝勒莽古斯弟圖美奧巴從兄武克善莽古斯孫巴達禮奧巴子諸貝勒台吉各率兵來㑹駕迎之三里許還御行幄宴之是日集諸貝勒大臣暨外藩䝉古貝勒台吉等諭曰明國屢背盟誓䝉古察哈爾國暴虐無道皆當征討今大兵既集所向宜何先爾等其共議之諸貝勒大臣有謂距察哈爾國遼遠人馬勞苦宜退兵者有謂大軍千里而來羣力已合宜征明者太宗以征明之議為是遂統師向明境發越五日至喀喇沁之青城大貝勒代善三貝勒莽古爾泰晚詣御幄止諸貝勒大臣于外而先入密議班師既退貝勒嶽託濟爾哈朗薩哈璘阿巴泰杜度阿濟格豪格入太宗默坐意不懌嶽託奏諸將皆集于外待上諭旨太宗憮然曰可令諸將各歸帳我謀既隳又何待為可勿宣布所發軍令嶽託濟爾哈朗曰臣等未識所以請上明示太宗曰我已定䇿而兩兄不從謂我兵深入敵境勞師襲遠若糧匱馬疲何以為歸計縱得入邊而明人㑹各路兵環攻則衆寡不敵倘從後堵截恐無歸路以此為辭固執不從伊等既見及此初何為緘默不言使朕遠涉至此耶衆志未孚朕是以不懌耳嶽託濟爾哈朗及諸貝勒皆勸上决計進取于是令管旗八大臣往與大貝勒三貝勒議夜半議定乃頒敕諭曰朕仰承天命興師伐明拒戰者不得不誅若歸降者雖雞豚勿侵擾俘獲之人勿離散其父子夫婦毋淫人婦女毋掠人衣服毋拆廬舍祠宇毋毁器皿毋伐果木如違令殺降淫婦女者斬毁廬舍祠宇伐果木掠衣服及離大纛入村落私掠者鞭一百又勿食明人熟食勿酗酒聞山海關內多有鴆毒更宜謹慎馬或羸瘦可量煮豆飼之肥者止宜秣草凡採取柴草須聚集衆人以一人為首有離衆馳往者拏究如有故違軍令者與不行嚴禁之管旗大臣及領隊各官並治罪弗貸戊寅克明洪山口大軍自喀喇沁之青城行四日次老河命貝勒濟爾哈朗嶽託率右翼四旗兵及右翼諸部䝉古兵攻大安口貝勒阿巴泰阿濟格率右翼四旗兵及左翼諸部䝉古兵攻龍井關各授以方略令相機而行太宗統師向洪山口進發丁丑左翼兵攻克龍井關隳其水關而入明副將易愛參將王遵臣聞炮聲自漢兒莊率兵至我兵擊敗敵騎兵三隊步兵二隊斬易愛王遵臣盡殱其衆又斬哨卒之自三屯營至者師薄漢兒莊城其副將標下官李豐率城內民剃髮出降大軍登城駐營秋毫不擾潘家口守備金有光遣中軍旗鼓范民良蔣進喬齎書來降三貝勒莽古爾泰奏授守備為逰擊旗鼓為備禦給劄而遣之戊寅太宗親統師攻克洪山口入駐城內擢降人方遇清為備禦與敕令守洪山口又遁匿山中之千總一員把總一員聞城克率百人擐甲執械來降因擢千總為備禦把總為千總是日貝勒濟爾哈朗嶽託率右翼兵攻克大安口毀其水關明馬蘭營前哨兵馳至大安口將近城我軍擊走之濟爾哈朗率兵一半擊敗兩營敵兵于山上追至馬蘭營盡殱之明騎兵自遵化來援列兩營深林中鳴角擊鼓嶽託亦率兵一半進擊大敗之得脫者僅數人兩貝勒甫拜天畢忽又有一營敵兵至我軍未及成列爭先擊斬自辰迄已共敗敵兵五營馬蘭營馬蘭口大安營三城俱降我軍遂趨石門恐兩旁有敵兵因立營曠野以便瞭望明兵先聞炮聲以為䝉古兵至倉皇赴戰悉就殱後知為我兵懼不復出石門寨驛丞一生員一偕五人齎書來降十一月甲申克遵化城大軍既克洪山口總兵官揚古利率兵先至遵化辛巳太宗親統師距城五里而營三貝勒莽古爾泰率左翼兵自漢兒莊來㑹太宗與遵化城中巡撫王元雅等書曰我國為爾國侮慢侵陵致成七恨乃告天興師幸䝉上天垂鑒以我為直舉遼東廣寧諸地悉以畀我我猶欲罷兵息民屢遣人致書議和爾君臣妄自尊大且不容我書過山海關爰整師旅大舉而至自喜峯口迤西大安口迤東拒敵之兵悉已誅戮歸順人民秋毫無犯今爾等若輸誠來降功名富貴當與共之嘗聞良禽擇木而棲俊傑相時而動爾等可不深念耶至民人皆我赤子來歸之後自當加以恩養爾等可速自審處毋貽後時之悔十一月壬午朔明總兵趙率教以兵四千援遵化我哨兵來告貝勒阿濟格等率左翼四旗及䝉古兵奮擊敗之乘勝躡追太宗率數騎環視遵化城可攻之地遇明敗兵至掩擊之趙率教為阿濟格所斬三貝勒莽古爾泰生擒明中軍臧調元來見太宗曰可收養之養人後必有效遂令剃髮有棄弓歸降者亦收養仍給敕各還原籍羅文峪守備李思禮齎糧冊來降擢為逰擊貝勒濟爾哈朗等率右翼兵來㑹太宗召集貝勒大臣定議攻城授以方略正黃旗攻北面之西鑲黃旗攻北面之東正紅旗攻西面之北鑲紅旗攻西面之南鑲藍旗攻南面之西正藍旗攻南面之東鑲白旗攻東面之南正白旗攻東面之北甲申黎明列陳樹梯城下正白旗兵薩木哈圖先登諸軍繼之遂克其城掩殺其守陴兵四面皆潰巡撫王元雅走入署自經死城中官兵人民等拒命者盡殺之命以棺斂元雅尸傳諭諸將曰我軍年來皆怯于攻城此城較前所攻之城更堅薩木哈圖奮勇先登殊可嘉也乙酉以副將伊遜攻城時炮傷其手創甚親臨視之是日聞羅文峪民為從征䝉古所擾害因以䝉古字漢字傳諭曰朕㑹師征明志在綏定安輯之凡貝勒大臣有掠歸降地方財物者殺無赦擅殺降民者抵罪强取民物者計所取之數倍償其主朕方招徠人民若從征之人橫行擾害是與鬼蜮無異此而不誅將何以懲貝勒大臣等尚其仰體朕心廣宣德意焉己丑論功行賞喀克篤哩造攻具如法且親督本旗兵先登由三等總兵官擢為二等總兵官即今二等子巴篤禮指麾本旗兵攻城有方由三等逰擊擢二等逰擊即今二等輕車都尉和勒多初襲其兄攸德赫參將職後以罪革至是以署參將攻遵化城善射使所屬兵先登令仍襲其兄參將職即今一等輕車都尉綏和多率兵先八旗兵進由備禦擢三等逰擊即今三等輕車都尉薩木哈圖先八旗兵登城授為備禦即今騎都尉世襲罔替有過失俱行赦免家貧即周恤之賜號巴圖魯與喀克篤哩巴篤禮並親酌以金巵賜蟒縀及駝馬扈什布第二登城親酌以銀巵與第三登城之多禮善合授備禦兩人共管一佐領下人戶茂巴禮第四登城並賜縀布馬牛烏嚕特䝉古阿海先登因後兵不繼陳亡授其父阿邦為備禦賜蟒縀一縀十九布二百馬牛各十庚寅諭羣臣曰頃因克遵化各旗大臣至登城士卒俱以次賞賚者非以大臣等身自登城也嘉其督率盡善備具堅固耳嗣後視此為例朕與爾等經厯險遠艱苦至此已䝉天佑克奏膚功諸臣尤宜加意約束所屬人員愛士卒如子弟則所屬士卒亦視爾等如父母平時克遵教令臨陳必竭誠效命不違紀律矣倘各旗大臣不加訓飭以致妄行不誅則紀律廢弛而為惡者益熾誅之則曽經效力之兵而以無知䝉罪又實可憫爾等有管兵之責者當勤加教訓以副朕意壬辰明喜峯口參將遣千總二員把總二員齎降書至給敕諭及令旗禁戒䝉古擾害漢人賜參將縀二十把總各縀一從者各縀袍一癸巳進征燕京以參將英固爾岱逰擊李思忠文館范文程率備禦八兵八百留守遵化太宗統師離遵化城二十五里駐營甲午進軍薊州前哨遇明兵五百與戰生擒十五人獲馬二十乙未次三河縣獲一漢人令持書招降丙申命左翼貝勒率兵三千赴通州相視渡口太宗自三河縣行二十里前哨捕一人送至訊以敵兵消息其人云大同宣府兩鎮兵現在順義縣遂命貝勒阿巴泰嶽託率左翼二旗及䝉古二旗兵往擊之敗明總兵滿桂侯世祿軍獲馬千餘駝百餘順義知縣率衆來降太宗至通州渡河駐營城北傳諭各城曰我國素以忠順守邊爾萬厯皇帝妄預邊外之事曲在葉赫而强為庇護直在我國而强欲戕害屢肆侵陵大恨有七我知其終不相容也昭告于天興師致討天佑我國先賜我河東地我皇考思戢干戈與民休息遣人致書講和而爾國不從既而天又賜我河西地我復屢次遣使講和爾天啓皇帝崇禎皇帝仍加欺陵使去滿洲國皇帝帝號毋自製國寶我亦樂于和好遂欲去帝號稱汗令爾國製印又不從故我復告天興師由捷徑而入破釡沉舟斷不返斾爾明之君臣視用兵為易事漠然不以愛民為念不願和好而樂兵戈今我軍至矣用兵豈易事乎凡爾紳襟軍民有歸順者我必加撫養其違抗不順者不得已而誅之此非豫誅之乃爾君自殺之也若謂我國褊小不宜稱帝古之遼金元俱自小國而成帝業亦曽禁其稱帝耶且爾明太祖昔曽為僧賴天佑之俾成帝業豈有一姓受命永久不移之理乎天運循環無往不復有天子而廢為匹夫者亦有匹夫而起為天子者此皆天意非人之所能為也上天既已佑我爾明國乃使我去帝號天其鍳之矣我以抱恨之故興師恐不知者以為恃强攻戰故此諭知戊戌進軍駐牧馬厰距燕京約二十里厰南五里許有牧馬圉我兵圍之其管馬太監二名及三百餘人出降辛丑太宗統師營于燕京城北土城關之東兩翼兵營于東北偵知明總兵滿桂侯世祿等俱集德勝門太宗率諸貝勒領右翼兵前進哨兵又告瞭見東南隅有寧遠巡撫袁崇煥錦州總兵祖大壽等以兵來援太宗至德勝門外審視虛實諭火器營兵進前發炮俟敵發炮畢䝉古兵及兩紅旗兵由西面徑進正黃旗兵從旁衝擊傳諭左翼貝勒領兵迎擊于是兩路進兵復命御前兵繼後遇敵潰遁者追擊之時袁崇煥祖大壽屯兵二萬于沙窩門外我左翼兵二千分為三隊領纛大臣哈寧阿鄂羅塞臣等先進貝勒阿巴泰阿濟格多爾衮豪格繼之聞敵伏兵右偏甚衆因約我軍入隘口宜趨右偏不趨右偏而由正路入者罪與避敵同比入隘口豪格獨趨右偏敗其伏兵追殺至城壕阿巴泰阿濟格多爾衮不趨右偏由正路入亦擊敗敵兵追殺至城壕阿濟格所乘馬被創死正白旗領纛大臣康古哩未至城濠止于中途貝勒多鐸以年幼與三貝勒莽古爾泰留後遇明兵來犯禦郤之額駙恩格德爾領喀爾喀䝉古軍偕其弟莽果勒岱及領札嚕特兵之巴克多爾濟見敵兵一隊距城稍遠屯樹林內不俟整隊驟進接戰旋潰奔總兵官武訥格札嚕特貝勒色本與其弟瑪尼突入奮戰始擊敗敵兵收軍後諸貝勒大臣㑹議阿巴泰違衆約不從右偏進與同旗豪格相離罪應削爵奪所屬人員給與豪格太宗曰阿巴泰非怯懦者特以顧其二子致離豪格耳朕奈何以子故加罪于兄因宥之以康古哩及參將郎球漢岱等逗留中途削職罰贖奪其俘獲以哈寧阿鄂羅塞臣善戰俱授備禦恩格德爾莽果勒岱自䝉古首先投誠功大免削職仍罰贖奪其俘獲巴克多爾濟等削職罰贖奪其俘獲以所罰之半給武訥格令分賞同時迎戰將士癸卯太宗率諸貝勒環閲燕京城乙巳駐南海子丁未進軍距關廂二里時袁崇煥祖大壽營于城東南隅樹柵木為衛太宗令我軍移與相近列營親率諸貝勒輕騎往視進攻之處諭曰路隘且險若傷我軍士雖勝不足多也諸貝勒屢請攻城太宗諭曰朕仰承天眷攻城必克但所慮者倘失我一二良將即得百城亦不足喜朕視將卒如子嘗聞語云子賢父母雖無積蓄終能成立子不肖雖有積蓄不能守也此時正當善撫我軍蓄飬精鋭耳遂止弗攻先是獲明太監二人以副將髙鴻中參將鮑承先寧完我巴克什達海監守之至是鴻中承先遵上所授密計坐近二太監故作耳語云今日撤兵乃上計也頃見上單騎向敵敵有二人來見上語良久乃去意袁巡撫有密約此事可立就矣時楊太監者佯卧竊聽悉記其言庚戌命縱楊太監歸嗣聞楊太監以竊聽之言奏明崇禎帝遂執袁崇煥下獄祖大夀大驚率所部奔錦州毀山海關而出十二月辛亥朔克良鄉城大軍趨良鄉太宗命諸貝勒殿後行獵海子左翼諸貝勒因逐獐突馳于前太宗見之諭曰朕以爾等殿後是以行獵今爾等皆前來誰在後軍耶諸貝勒俱奏請議罪太宗曰爾等孺子忘殿後而貪射獐故至此姑免議重罪止各罰馬一給右翼諸貝勒遂趨良鄉克其城以駐軍所獲牛馬騾驢均給兵丁庚申祭纛良鄉東山岡頒賚將士銀兩縀衣總兵官武訥格率䝉古兩旗兵攻取固安縣盡殱其衆命巴克什庫爾禪赴固安賞諸將士銀兩緞衣時房山縣有生員三人來降賞而遣之諭曰聞爾房山縣民奉祀金朝皇帝是亦守禮之民也今䝉天佑我軍已至燕京大業若成爾等皆屬我倘不能即成恐貽禍爾等須杜門安坐以俟我業之成也遂命貝勒阿巴泰薩哈璘齎牲帛祭金太祖世宗陵為文以告曰嘗聞二帝功髙德盛豫中心緬懷夢寐景仰兹統師至良鄉知二帝陵寢在焉雖時異世殊而春秋舉祀至今稱頌弗衰誠所謂德愈久而彌光也特備牲牢遣阿巴泰薩哈璘代祭併白豫懷我國介在邊陲世守忠信明萬厯君無故害我二祖彼雖出此我猶尊之為君同遼東副將吳希漢刑白馬烏牛盟誓天地竪碑邊界約曰漢人出邊者殛漢人滿洲入邊者殛滿洲既盟之後直道自守及我與葉赫兩國搆釁彼曲我直明萬厯君不以公道區處反庇理曲之葉赫陳兵邊外代為守禦屢欺我理直之滿洲致成七大恨我見其不能相容必欲見害故告天興師䝉上天垂鑒不計國之大小止論事之曲直遂以我為直畀我以明遼東迤東之地後我復遣人議和彼以為敗我如泰山之壓纍卵藐視我如草芥欺陵不已故復興師天又畀我以河西地後我欲息兵戈享太平開誠布公不作詭計屢遣議和之使明崇禎君更肆欺陵欲索還天畀我之土地去我帝號國寶我以天賜土地不可退還止議去帝號稱汗不另製寶令彼造印與我彼復不從我故發憤興師凡降城居民秋毫無犯惟誅其軍士之抗拒者攻其城堡之不降者我非樂于誅之攻之也皆明國君妄自尊大不允議和不啻彼自誅之自攻之耳夫我深雪讐之志而彼恥城下之盟兵甲相尋積漸至此天實為之于我何預雖然我猶不為己甚復欲與彼議和乃彼恃其國大兵多蔑理違天將我之言置若罔聞若枘鑿之不相入故豫披瀝悃忱祭告惟二帝英靈昭鑒而默佑之丁卯擊敗明兵于永定門南大軍還自良鄉至蘆溝橋遇明副將沈姓率兵六千人來禦太宗遣右翼五旗兵進擊時左右翼各有䝉古一旗故右翼五旗合左翼則為十旗不移時悉殱之生擒官一員擇取甲胄馬匹之善者餘悉棄置進距京城二十里有敵兵一營擊敗之晚至京城西南隅駐營命副將阿山逰擊圖嚕什視環城敵兵擒一人訊之知永定門南二里許有滿桂黑雲龍麻登雲孫祖壽四總兵領步騎四萬結柵木四面列鎗炮十重遂諭諸將士以三鼓進兵列陳及旦十旗兵齊進敗敵毁柵而入陳斬滿桂孫祖壽副將參逰等官凡三十餘人千把總無算生擒總兵黑雲龍麻登雲方我軍進薄敵柵敵軍鎗炮矢石交下如雨太宗憐惜將士惻然隕涕及收軍無一傷者戊辰命以陳獲馬六千擇其善者先賞給八大臣及總兵副將等官諸臣奏曰荷天眷佑皇上威福敗此大敵所獲諸物上與諸貝勒不先擇取臣等如何敢受太宗諭曰我命汝等對敵明兵鎗炮發時朕為爾等心甚憂悔幸邀天佑爾諸臣未被創擊敗敵兵雖加賞賚朕猶以為未足也己巳大軍移駐京城西北庚午移駐德勝門外前哨圖嚕什錫爾納勞薩等兩遇明兵自京城出俱擊敗之斬一百五十人獲馬一百二十有竒巴克什達海愛巴禮奉命齎書與明議和一置德勝門外一置安定門外貝勒阿巴泰濟爾哈朗阿濟格杜度薩哈璘同總兵官揚古利率兵三千徇通州焚毁其船遂攻張家灣克之丙子太宗旋師通州渡河駐營丁丑貝勒嶽託薩哈璘豪格率兵四千前行攻克香河縣時沙河驛有䝉古五百人聞我兵至出奔山海關我兵追及之五百人據山崖立寨我兵步登悉殱之又焚通州河內船約千餘是日太宗與大貝勒代善等率護軍及火器營兵五百名往視薊州情形㑹有山海關步兵五千來援薊州距城二里許與我兵遇敵兵不及入城遂立營環列車盾鎗炮諸貝勒率兵衝擊悉殱之方擊敵步兵時命代善指揮左翼四旗攻其東面太宗親指揮右翼正黃正紅鑲紅三旗攻其西面貝勒杜度傷足逰擊額爾濟格烏爾坤被創卒正紅鑲紅兩旗不進攻所當敵壘總兵官揚古利同內大臣侍衛率正黃旗軍士攻入大敗敵兵命以兩紅旗規避各官贖罪之物盡給揚古利令分賞進攻諸將士戊寅參將英固爾岱自遵化奏云密雲總督薊州道合兵夜至遵化四面夾攻我兵出禦敵兵斬殺甚衆敵遂郤次日敵以馬兵列陳我兵與戰敵旋奔入步兵營止殺其殿後兵五人生擒答應官一員敵兵夜遁翼旦我兵追躡其後斬馬兵百人步兵千餘人太宗遣貝勒杜度統兵往駐遵化以喀喇沁台吉布爾哈圖率兵駐羅文峪大軍向永平進發皇清開國方略卷十二
