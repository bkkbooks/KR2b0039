body:
  text: 欽定四庫全書皇清開國方略卷二十九太宗文皇帝崇德六年帝己年月至八月崇德六年春正月壬辰錫特庫等自索倫部擒獲博木博果爾還先是五年三月博木博果爾敗亡後七月丙午太宗命錫特庫濟什哈率護軍並徵兵外藩往征之命內大臣巴圖魯詹理藩院參政尼堪等諭外藩蒙古曰敖漢奈曼烏喇特阿嚕科爾沁四子等部從征將士俱彚集扎嚕特部內齊地悉令較射選壯勇者二百四十名令錫特庫將之以行以伊爾鞏固圖哈納綽隆為嚮導其從役駝馬甲胄器械糗糧俱細加檢閲毋忽十二月庚申錫特庫等遣歸亨岱青蒙格圖艾達漢邁圖以擒獲博木博果爾報次日太宗遣貝子洛託齎敕往錦州諭鄭親王濟爾哈朗等曰博木博果爾自叛後抗拒我軍彼時朕已定計欲令其北遁以便擒獲故陽言我軍將於黑龍江牧馬必擒博木博果爾彼聞此言果北遁朕已知之未及與爾等共議即命錫特庫濟什哈率外藩蒙古兵從蒙古北邉追躡錫特庫等越兩月十三日至甘地獲其弟及家屬又閲十四日至齊洛台地方遂獲博木博果爾及其家屬男婦幼稚共九百五十六人馬牛八百四十有四特諭知之至是凱旋遣官迎宴于北驛館次日召錫特庫濟什哈及從征之護軍四十人外藩台吉等三十三人賜宴仍命諸王貝勒各宴一次擢錫特庫世職一等賜阿嚕科爾沁部台吉阿玉什扎嚕特部台吉桑古爾烏喇特部台吉布達齊四子部將領博內敖漢部將領色穆奈曼部將領扎丹等蟒緞朝衣貂裘猞猁猻裘狐裘豹裘冠帶甲胄櫜鞬弓矢銀兩緞布等物有差二月己未罷各牛録章京之不職者先是太宗命户部清查滿洲蒙古十六旗牛録各以人口牲畜注册分别貧富具奏部臣覆奏宗室拜音圖下武賴等四十八牛録俱貧太宗集衆于篤恭殿諭之曰此等貧窮各牛録豈行陳時獨禁其俘獲耶豈嘗于衆人之外加𣲖徭役耶抑豈旱潦偏災之獨異於衆人耶皆因該管各章京等嗜酒曠職董率無方爾王貝勒大臣等又不查明更置户口何從而殷富著將貧窮各牛録之該管章京俱解任另選才能者任之同日又諭曰爾等何不親率子弟習射耶子弟中壯者令以角弓羽箭習射幼者令以木弓栁箭習射我國所恃全在乎此爾等當嚴加督率互相激勸有不勤習射藝嬉遊市肆者罪之三月乙未蒙古博爾衮岱等來降先是蒙古博爾衮岱哈喇爾岱巴彥岱等逃入明國既而率男子四百二十一人婦女幼稚共五百口攜馬騾二百一十有一毁大同陽和邉牆來降二月二十日至歸化城土默特章京古祿格遣納木什哩等送至賜博爾衮岱三人鞍馬繡緞朝衣冠帶櫜鞬等物其餘在歸化城者賜銀一千兩又賜納木什哩等銀兩有差丁酉降睿親王多爾衮肅親王豪格並為郡王睿親王多爾衮肅親王豪格安平貝勒杜度饒餘貝勒阿巴泰等于五年十二月庚戌奉命率將士之半往代鄭親王濟爾哈朗等圍困錦州擊敗明錦州松山援兵四百二十人斬二百四十人獲馬十五管旗大臣阿山先襲山城斬八人又克取小山城一座俘獲男子三十九婦女幼稚二十七馬騾五索海永順率兵四百堵截敵人去路及還時遇錦州兵三百人往小淩河畋獵擊斬九十二人其餘脫逃者遇安平貝勒杜度所率兵五百人又擊斬八十二人二月丙寅遣瞻岱奏報嗣因睿親王多爾衮等于集代駐營時私遣每牛録甲士三人還家一次私遣每旗官一員每牛録甲士五人還家一次又移軍過國王碑離錦州約三十里駐營太宗聞之震怒曰原令我軍由逺漸近圍困錦州今離城逺駐敵人必多運糧草入城以此相持致延日月何時能速成大功耶至是值鄭親王濟爾哈朗等更番往代之期因命甲喇章京車爾布等齎敕切責之令將倡議之人指名擬罪具奏並傳諭王等至遼河先遣人來奏伊等俱駐于舍利塔候旨隨遣內大臣圖爾格等往問睿親王等遣兵歸家及離城逺駐之故多爾衮奏曰臣集衆議每旗先遣官一員率每牛録兵五人還家修治軍械牧養馬匹蓋錦州敵人馬匹皆在他處牧養內援之兵皆退回養馬我等兵力有餘何畏錦州松杏三城之兵衆以為然亦無一人勸阻者是倡議者臣也遣歸者亦臣也至離營逺駐因舊駐之處青草已盡特逺移以就芻牧耳但臣識庸慮短背違上命尚復何言及問肅親王與二貝勒對亦如之又遍詢貝子公大臣以下各官皆如多爾衮所對比還奏太宗曰爾等若臨城駐營使糧草不得入錦州而遣兵歸家猶可也今乃云移營就草豈專令爾等往彼牧馬耶如不能圍城亦當以不能之故奏明今乃飾詞自解是貽誤衆人罪在爾等著令自行議罪圖爾格等以所議奏聞得旨降睿親王多爾衮肅親王豪格俱為郡王貝勒阿巴泰以下各分别罰銀有差以阿山初到營時即以駐兵太逺向多爾衮言之免其罰銀之半辛丑令各旗間散人歸本屯居住太宗諭户部曰邇來盜賊充斥俱係貿易漢人糾黨為姦凡貿易必有主令之人自宜於本旗地方或修市㕓或就家貿易今乃有縱家人居别旗地方與别旗合夥者又有令其往來負販者俱按月勒索本息以致此等人無計措辦遂相率為盜嗣後若居别旗貿易及街市往來貿易之人有為盜者著將本主連坐既為貿易之主即有約束之責但令晝則貿易夜則歸家何自而為盜若聽其自便有所獲則利歸於已苟為盜則罪坐本人是直縱盜以為漁利之計耳且此等間散之人容留京師無益有損嗣今八家以下滿洲蒙古漢人官員人等各令家中間散人俱歸本屯居住該管章京及家長各加意約束違者治本管官及家長之罪爾部亦嚴行稽察之乙巳分編錦州蒙古貝勒諾木齊等歸降部衆鄭親王濟爾哈朗武英郡王阿濟格等奉命往代睿郡王多爾衮等圍錦州每面分立八營繞營俱濬深壕壕邉修築垜口兩旗中間復濬長壕近城設邏卒哨探時明援兵前隊已至松山杏山錦州城中蒙古見我軍嚴整呼告邏卒等曰城中積粟可支二三年縱圍困豈可得耶邏卒應之曰無論二三年縱有四年之糧至五年後復何所食蒙古等聞之知我軍圍城志在必得皆驚恐于是城中蒙古貝勒諾木齊武巴什琿津清善山津古英塔布囊楚肯博博克泰昻阿岱蘇巴達爾漢滿濟額森托濟布達習等遂謀來降有一人聞之欲奔告祖大壽武巴什等幽殺之遣二人持降書縋城下潛入我營其書曰我等知王貝勒等至早有歸順之心今貝勒諾木齊台吉武巴什等約誓已定倡率衆蒙古請降至二十七日黎明時可遣兵四面來攻諾木齊守東門武巴什守南門若聖主在不信我等有上天在有如天之納幸賜回書可舉我等願為編氓納職貢若蒙鑒信炮三聲為驗濟爾哈朗覽書又細訊之與諸王貝勒大臣等定議約于二十七日兵必前進遂舉信炮為驗並遣啓心郎額爾克圖持其降書馳奏是日祖大夀探知其事遂整兵以待會日暮至外城門遣副將逰擊各一人率兵欲以計擒之為武巴什等所覺即持兵器以迎外城蒙古等亦爭執兵器既接戰聲聞關外濟爾哈朗阿濟格多鐸等相繼至城下䇿應關內蒙古縋繩城下我軍陸續援繩而上于城上吹角夾攻明兵明兵敗入城內我軍遂乘勝入關將城中蒙古男婦及一切器物盡送義州壬寅鄭親王濟爾哈朗等遣護衛代衮等奏言臣等于三月二十四日薄暮聞錦州關內蒙古兵與明兵接戰兩白旗相去甚近率兵先登左右之兵繼之俱至外城諾木齊等盡率其官屬兵丁以降都司守備把總等官八十六員男婦幼稚共六千二百一十有一人時喀喇沁部古嚕思希布具筵進獻適捷音至太宗大悅命八門擊鼓召衆于篤恭殿宣捷翼日諾木齊武巴什等將至先命多爾濟達爾漢諾顔揚善等至廣城迎宴之甲辰親率諸王貝勒及文武各官出懷逺門迎至演武亭太宗率衆拜天行禮畢升御座諾木齊武巴什等率部衆朝見令諾木齊武巴什等較射又令大臣侍衛等較射選力士角抵賜大宴宴之諾木齊等進獻雕鞍馬匹琥珀念珠金銀器皿蟒衣等物俱却之諭之曰爾等進獻具見悃忱但歸誠伊始朕當加恩賞賚宴畢仍自懷逺門入還宫乙巳以諾木齊武巴什攜來蒙古一千五百七十有三名漢人一百三十有九名婦女幼稚二千六百五十五口編為九牛録每三丁一人披甲諾木齊部下蒙古二百有四人分𨽻正黃旗武巴什部下蒙古七百有二人分𨽻鑲藍旗阿邦伊木圖文都爾瑚滿韜部下蒙古五百五十三人分補各旗之缺額者令諾木齊武巴什秩視梅勒章京阿桑喜滿韜額布根海塞巴布岱額布格爾德琿津秩視甲喇章京巴布岱之弟鄂爾洪安達哈山津多爾津伊木圖文都爾瑚阿邦等秩視牛録章京並達爾瑪古什等以下各賜頂帶朝衣鞍馬弓矢甲胄綵緞布匹銀兩莊田牲畜等物有差七月己亥復賜諾木齊武巴什部下分得撥什庫鍾化額森博波克托席柱等莊田奴僕朝衣冠帶鞍馬甲胄弓矢粧緞布匹銀兩等物有差夏四月甲寅以元史伯延事諭誡睿郡王多爾衮等太宗召內院諸臣入清寧宫命讀元史至世祖遣丞相伯延往征宋國時值炎天恐行軍不利敕俟入秋再舉伯延奏曰宋之據江海如窮獸之負嵎今已受困旋復縱之則逸而逝矣遂起兵南征統一天下乃遣大學士范文程剛林等至篤恭殿傳諭睿郡王多爾衮等曰元世祖恐炎熱敕伯延俟入秋伐宋伯延論奏必舉遂興師滅之今汝等不圍困錦州屯兵逺處任意畋獵急圖歸家視彼為何如也朕非窮究爾等特以伯延勤國之心令爾等知之耳多爾衮等皆慚謝而退甲子定各牛録披甲名數太宗召衆于篤恭殿諭曰八家所屬各牛録舊取辦事人四名銀匠五名今宜各退辦事人二名銀匠二名王貝勒等各令家下漢人學習匠役待三年後再將各牛録匠役停止每牛録滿洲三人中許一人披甲以六十名為常數其中或多或少務于三人中選一人他牛録甲雖有餘不許補不足者有舊披甲人詐稱年老令家奴代披及牛録章京之子徇私不令披甲者各管旗大臣稽察之如稽察不公致被首告者罪之五月丁丑鄭親王濟爾哈朗等敗明總督洪承疇兵于松山先是三月己亥太宗命朝鮮總兵栁林副將刁和良丁天機米塔尼任大尼率兵千人厮卒五百人馬一千五百五十匹往助鄭親王濟爾哈朗圍錦州四月丁未復遣阿哈尼堪索爾果東果羅車克等率每牛録兵五人赴錦州助之是日至己酉鄭親王濟爾哈朗等連次奏報明人援兵自杏山至松山濟爾哈朗阿達禮羅洛宏等率右翼兵伏于錦州南山西岡阿濟格多鐸等率左翼兵伏于山之北嶺令前鋒兵往誘敵兵及敵兵來追我左翼伏兵齊出前鋒兵返擊右翼伏兵又追擊其後大敗之陳斬一百七十人獲馬一百六十匹甲七十六副共俘獲人數四千三百七十有竒明人恐我軍掘壕圍斷髙橋將援兵撤回或云屯駐寧逺或云已過寧逺又蒙古名古什者原與諾木齊武巴什等同謀歸附因衆蒙古降時未能偕出隨越城來降墜傷肱今並攜之以歸庚戍命恭順王孔有德智順王尚可喜各率本部將士往助鄭親王濟爾哈朗軍至是濟爾哈朗復遣刑部啓心郎額爾克圖等奏報明總督洪承疇率總兵六員兵六萬來援錦州屯於松山北岡我軍擊敗之斬首二千級尋命內院大學士希福剛林等往錦州閲視濟爾哈朗等所濬壕塹兼閲屯營形勢己丑迎宴索倫歸降部衆索倫部蒙塞爾瓦岱之子巴爾達齊于是月丁亥率其户下二百四人來降越二日己丑又有索倫部一千四百七十一人來降俱命迎至北驛館宴之壬寅築歸化城外墻太宗遣牛録章京萬塔什筆帖式塞稜等齎敕諭駐防歸化城土默特章京古祿格等曰爾等所居城小壕狹倘敵人來侵難容屯駐人口牲畜有一被掠實損軍威爾等可于城外築墻酌量足容爾部人衆其墻髙三丈五尺寬可駐營墻上遍築垜口四面留門每門俱置甕城爾地産木甚多每門及四角各建樓于其上牆外俱濬深壕修理完備爾等各率將士登之分立汛地敵人若來可立于垣上迎戰遣去章京即令督工事竣方還毋違朕命六月丁未朝鮮國進瑞金却之朝鮮國王李倧進獻瑞金遣陪臣李俒齎咨禮部其略云咸陽郡新溪書院下民人袁年夜見室中有光即其地掘之得瓦甕上書一千年三字發視有黃金二十四片上刻宜春大吉四字考新溪書院係新羅古寺遺址想前有神人刻留吉兆以為異代休徴非天地所祕鬼神所護豈有至今始出之理竊稽前史玉杯銀甕瑞應休明伏惟皇上光膺大業咸烈震于寰宇仁恩洽于遐荒神人交贊天命肇創大朝所嘉祥懋集今千年吉金匆發于庇之藩境其為盛世嘉瑞昭昭無疑謹將原金進獻以表尊事之誠云禮部以聞得旨新羅藏金為朝鮮所得王即進獻足見誠敬其所刻字樣允屬休徴朕當與王共荷嘉祥王其自受即與朕受無異著將原金付李俒齎回是日遣俒等歸國賜貂皮銀兩等物仍賜宴于禮部辛酉睿郡王多爾衮鄭親王濟爾哈朗等合軍敗明援兵于松山初睿郡王多爾衮肅郡王豪格等聞錦州蒙古投降令大學士范文程等代請前往效力贖罪太宗責之曰前者離城逺駐任意畋獵行樂今欲乘人之功掩為已有耶後以范文程等言始令入署視事都察院參政祖可法等復為奏請乃許朝見仍命率將士之半往代鄭親王濟爾哈朗軍至是侍衛岱衮喇世塔錫達禮等自軍營還奏鄭親王濟爾哈朗武英郡王阿濟格等與更代之睿郡王多爾衮肅郡王豪格等兩軍合營偵知明關內援兵出松山城沿海前進我左翼軍向松山之東右翼軍向松山之西追之左翼軍追及掩殺至松山城壕敗之獲馬五十餘匹丙寅遣學士羅碩詣錦州睿郡王多爾衮營并附大凌河歸附官員祖澤潤曹恭誠裴國禎祖澤洪孫定遼陳邦選蕭永祚等與祖大夀書書曰自大凌河分袂十餘年矣兩不能相見皆將軍自誤之也昔日隨將軍棄暗投明同皇帝行赴傾心投順彼時將軍向職等云是我輩營仁聖之真主也及今十年職等蒙軍入錦州過聽妻孥之皇上豢養厚恩始終如一豈料將恩跋扈言背盟負日困守錦州無顔相見是今日之錦州自衛致今即昔日之凌河昔日之負盟直今日之報應料闔城生靈已為釡中之魚在將軍孽由自作而職等家眷之在錦州者尚有五十九人皆非負義忘恩之輩何辜為殘黎充飢之食為此哀懇我皇上俯準職等列名致書將軍請發各家大小人數送出死地揆將軍之意仍慮南朝法令不肯發出耳不知既在圍中南朝法亦難加將軍妄想外兵救援據我國捉回之兵民投降之蒙古言大小將士無不痛恨將軍昔日斷送凌河今日斷送錦州皆云不知將軍有何主見致我等困守受戮則將軍之無可望也明矣敢以明告勿執迷不悟自誤以誤職等之妻子也庚午睿郡王多爾衮等復遣侍衛雅賴吉賽漢褚翰等奏報明關內援兵出松山來戰我滿洲蒙古兩翼會合追擊五里獲馬五百七十還秋七月戊寅賜考取舉人生員等朝衣緞匹有差內三院大學士范文程希福剛林等奏請于滿洲蒙古漢人內考取舉人生員太宗諭曰忠經云在官惟明蒞事惟平立身惟清聽不可以不聰視不可以不明清則無欲平則無曲明能正俗聰則審于事明則辨于理爾等當善體此言從公考核至是賜新中式舉人滿洲鄂謨克圖赫德蒙古都當漢人崔光前卞三元章于天卞為鳯各朝衣一領一等生員滿洲科爾科岱帕帕克禮漢人盧震陽劉漢祚劉可斌魏際升金元祥線縉徐效竒劉遇知楊天祐各緞一布二二等生員滿洲渾達碩瑪額依們蒙古索諾木漢人李惟朴金元禎傅天祥李棲鳯孟繼昌佟鳯彩徐起元金應乾劉靜嶽陳九竒王一品各緞一布一三等生員滿洲葉成格綏和多碩塞莽色蒙古巴朗漢人江名世李貴王世勛劉應錫李茂王畿貴薑念鄭一元楊自得董景秀銀器重董成效董宗聖各布二八月丁巳太宗親統大軍征明錦州先是初六日己酉睿郡王多爾衮等遣瞻岱安泰奏報明國會集各省兵來拒我師我軍擊敗其三營獲馬五百五十匹敵兵來者甚衆太宗即于是日遣學士額色赫往諭睿郡王多爾衮肅郡王豪格曰敵人若來侵犯王等可相機擊之不來各固守汛地切勿輕動甲寅額色赫還自軍中奏言敵兵甚衆乞遣鄭親王率兵一半前往協力拒敵太宗聞奏即檄各路兵馬星夜進京命鄭親王濟爾哈朗留守盛京丁巳辰刻親統大軍出撫近門謁堂子行禮畢啓行赴錦州戊午渡遼河睿郡王多爾衮等奏報明總督洪承疇兵犯我右翼肅郡王豪格率兩紅旗正黃旗鑲藍旗及外藩土謝圖親王兵擊敗之時太宗患鼻衄因行急衄益甚三日方止諸王貝勒大臣奏請聖駕徐行臣等當先往諭曰行軍制勝利在神速朕恐敵人聞朕親至將潛遁耳如不逃破之如縱犬逐獸易于拾取朕此時如有翼可飛即當飛去何可徐行于是晝夜遄程自盛京疾馳而進凡六日抵松山之戚家堡駐蹕遣大學士剛林學士羅碩往諭睿郡王多爾衮等曰朕當即至矣可令前遣之宗室拜音圖額附英固爾岱兵及科爾沁部土謝圖親王兵察哈爾索諾木偉宰桑等兵先在髙橋駐營俟朕至髙橋合圍松山杏山多爾衮豪格等復令剛林羅碩還奏臣等聞聖駕親臨勇氣倍增惟務進攻豈敢畏怯但觀明兵甚衆臣等前率兵圍錦州屢經攻戰微有損傷如再速戰恐力有不及頃皇上諭令屯營髙橋倘敵兵為我所迫約錦州松山兵內外夾攻協力死戰萬一有失為之奈何皇上即欲自髙橋來援亦必待勝負少分之後今如暫駐松山杏山之間則臣等大幸太宗允之先陳師於松山繼于松山杏山之間自烏欣河南山至海橫截大路綿亘駐營諭衆曰如敵來犯近則迎擊之倘敵兵尚逺而先往迎戰致纍于衆即與敗陳無異是時明領兵總督洪承疇巡撫邱民仰兵道張斗姚恭王之楨兵部郎中張若麒大同總兵王朴宣府總兵李輔明密雲總兵唐通薊州總兵白廣恩玉田總兵曹變蛟山海總兵馬科前屯衛總兵王廷臣寧逺總兵吳三桂及副將遊擊二百餘員率馬步兵十三萬于松山城北乳峰山岡結營其步兵于乳峰山松山城之間掘壕立七營其騎兵營于松山東西北三面見太宗親率大軍環松山而營大懼一時文武各官欲戰則力不能支欲守則糧已不繼遂合謀欲遁乙丑太宗破明兵十三萬于松山癸亥黎明明總兵八員率兵犯我前鋒汛我軍擊敗之將奔塔山為前鋒軍及鑲藍旗護軍追擊太宗命武英郡王阿濟格貝子博洛內大臣圖爾格等追至塔山而還獲其筆架山積粟留兵守護遂濬壕斷松山杏山路是夜明諸將皆欲遁撤其步兵七營近松山城而營甲子敵兵犯我鑲紅旗汛我軍擊却之師還敵襲我後相拒百步太宗復令轉戰張黃蓋率數人往來指揮布陳敵望見倉皇遁走遂還營諭諸將曰今夜敵兵必遁護軍統領鰲拜阿濟格尼堪漢岱哈寧阿等可率左翼四旗護軍至右翼汛地排列右翼四旗護軍及騎兵前鋒蒙古等兵俱比翼排列直抵海邉見敵兵遁者有百人則以百人追之千人則以千人追之如敵兵衆多則躡後追擊直抵塔山是夜初更時明總兵吳三桂王朴唐通馬科白廣恩李輔明等率馬步兵由前鋒汛地沿海潛遁我軍相繼追擊命蒙古管旗大臣庫魯克達爾漢阿賴察哈爾茂海等各率所部兵于松山路設伏遮擊不許逺追若無諭旨不得擅還又命睿郡王多爾衮及貝子洛託公屯齊率先至四旗護軍及科爾沁土謝圖親王兵前往錦州至塔山大路橫擊之又命達齊堪辛達哩納林等率鎗炮手往筆架山增兵防護糗糧又命鎮國將軍宗室巴布海護軍將領圖賴往截塔山路又命武英郡王阿濟格亦往塔山截擊之倘敵兵欲越塔山則率巴布海圖賴自寧逺直抵塔山追擊又命貝子博洛率兵往桑噶爾齋堡截擊又聞明兵部郎中張若麒從小凌河口乘舟遁命蒙古梅勒章京賴護及察哈爾部下巴特瑪率兵往追之又命管旗大臣談泰率騎兵四百往小凌河西直抵海濱絶其歸路又命梅勒章京多濟里追擊敗兵又命蒙古管旗大臣伊拜梅勒章京談拜于杏山四面夾擊敵兵之奔入杏山者不許逺追如無諭旨亦不得擅還又命蒙古管旗大臣恩格圖前鋒將領武拜等追擊逃兵又命阿什達爾漢及多爾濟達爾漢諾顔往視庫魯克達爾漢阿賴伊拜等杏山駐營處如其地未善即擇善地移營並察其斬敵多寡太宗又計我軍若于是夜一併遣發恐敵人復有逃竄者于是相敵形勢陸續遣發黎明諸將遵奉上命各赴汛地邀截悉如睿算掩擊窮追明兵竄走彌山遍野死者不可勝計乙丑命睿郡王多爾衮武英郡王阿濟格圍塔山四臺復命漢軍管旗大臣劉之源吳守進侍衛李國翰等攜紅衣炮十位往助攻克之生擒臺內副將王希賢參將崔定國都司楊重鎮斬都司一員守備二員明總兵吳三桂王朴奔入杏山是日太宗移營松山將四面濬壕圍之明總兵曹變蛟撤乳峰山馬步兵棄寨宵遁欲突圍出至鑲黃旗汛地者一至正黃旗汛地者四俱為我軍擊敗一半突入御營我侍衛親軍力禦之曹變蛟中創奔還松山乳峰山所遺大小炮位軍械無算我軍俱獲之丁卯命內大臣錫翰等及四子部都爾拜各率精兵二百五十一伏于髙橋大路一伏于桑噶爾齋堡以杏山逃兵必由此路出也又命甲喇章京綏遜格爾泰等率三旗護軍一百五十往助錫翰等軍是日果有敵兵千人自杏山遁出遇錫翰等伏兵敗之追至塔山多所斬獲比還太宗親率軍至髙橋東命貝勒羅洛宏貝子博洛內大臣圖爾格等每旗精兵二十名及正白旗護軍翁牛特部兵錫翰所領兵俱付貝勒多鐸令設伏以待己巳明總兵吳三桂王朴率兵自杏山出奔寧逺我前鋒軍見之自杏山西截入大路追擊敗奔至髙橋多鐸等伏兵四起阻截前路追兵復躡後盡殱其各路潰竄之兵三桂與朴僅以身免次日搜勦山野獲甲胄軍械馬匹無算太宗又命內大臣塔瞻等率每旗精兵五十往髙橋設伏甫出營遇明步兵千人自杏山潰遁悉斬之比至髙橋復盡殱騎兵八十步兵六百先後通計斬殺敵衆五萬三千七百八十餘獲馬七千四百四十有四駝六十有六甲胄九千三百四十有六明兵自杏山南至塔山赴海死者甚衆所棄馬匹器械以數萬計海中浮尸漂蕩多如鴈鶩太宗神謀勇略制勝出竒破明兵十三萬如摧枯拉朽指顧而定昏夜中我軍誤傷者止八人厮卒二人是時被圍于松山者惟總督洪承疇巡撫邱民仰兵道張斗姚恭王之禎同知張為民嚴繼賢通判袁國樹朱廷榭總兵王廷臣曹變蛟與祖大樂等兵不過萬餘城內糧草已絶我軍復掘外壕困之總兵吳三桂王朴白廣恩馬科李輔明唐通郎中張若麒等各路潰竄未有成隊逸出者于是連遣學士羅碩筆帖式扎布海等至盛京宣布捷音壬申以敕諭松山城守官兵太宗敕論松山城守官兵曰朕率師至此知爾援兵必潰預遣兵圍守松山使不得入自塔山南至于海北至于山及寧逺東之連山一切去路俱截之又分兵各路截守陸路斬殺者積尸遍野投海死者更不可勝數今爾援兵已絶此乃天意佑我也爾等以為止圍松山錦州其餘六城未必受困不知時勢至此不惟六城難保即南北兩京亦豈能復有耶朕非虛言昔征朝鮮時圍彼國王于南漢山諭之曰爾降必生全爾後國王果降朕踐前言仍令主其國後圍大凌河時總兵祖大夀來降亦不復殺仍恩養之諒爾等所素聞也爾等可自思之是日前鋒將領努山等自明董家口喜峰口偵探回擊敗步哨五十一營斬一百四十五人又斬騎哨十一人生擒守備一員兵七人遇我國逃人殺男子二人獲婦女二口皇清開國方略卷二十九
