body:
  text: 欽定四庫全書皇清開國方略卷十七太宗文皇帝天聰七年癸酉天聰七年春正月庚子令劭農講射集八旗備禦官諭曰田疇廬舍民生攸賴勸農講武國之大經方今疆土日闢舊所給田地若有不堪耕種者察明換給沃壤即於附近建造房屋俾遷居之如貧民乏牛具耔種赴有力之家代耕一切徭役專派有力者不得濫及代耕貧戶至善射乃我國制勝之技宜各率所屬長幼努力學習毋得曠時是日命大臣阿山覺羅布爾吉率海州耀州等處兵百往鹿島捉生後二旬還俘獲人口一百七十有三馬牛九十有八乙卯征烏扎拉部師還先是六年冬命大臣武巴海率兵征烏扎拉部武巴海分八旗兵為四路並趨渥赫河斬三百三十八人俘五百餘人獲馬三百七十貂狐猞猁孫獺貉虎狼等皮千餘張裘二十餘領至是凱旋以所俘分賜將士有差二月癸亥朔茂明安部長率衆來歸茂明安部徹根汗元太祖弟哈薩爾之十六世孫固穆巴圖魯徹根汗父布延圖汗之弟達爾瑪岱衮等舉部來歸太宗御殿受朝徹根汗率衆遙拜復同固穆巴圖魯進前再拜抱上膝見獻貂裘貂皮駝馬賜宴及甲胄雕鞍銀器縀布等物三月丁酉犒築城兵役時以疆土日闢沿邊築城分兵戍防貝勒濟爾哈郎監築岫巖城在今蓋平縣東南貝勒阿巴泰監築蘭磐城在岫巖城東貝勒阿濟格監築通逺堡城在蘭磐城東北貝勒杜度監築鹻場城在通逺堡東北太宗念築城兵役勞苦以羊犒之甲寅征明寧逺師還先是二月癸未命大臣圖嚕什勞薩等率兵三百征寧逺迤西一帶並隨處揭榜宣諭明人曰朕去年征察哈爾逼近爾大同宣府一帶邊城絶不侵犯我兵有奪民間之驢者即戮示於爾邊城之前與爾邊臣誓天修好而還朕以爾國自必願和即遣使來乃久之不至朕復遣使三次爾將告天盟誓之言竟置不問不容我使入城是不崇信義而喜動干戈也朕今復告之天率兵攜耕牛農具屯種山海關外八城之地因爾之糧為久住計爾等八城人民逺近田地不耕則可若播種則我必盡刈穫焉爾文臣孰為善謀武臣孰為善戰即當各竭智勇以决勝負毋徒深匿雉堞中也圖嚕什等齎諭分兩翼進隨處揭示至沙河所及寧逺前屯衛之間斬四百人生擒其前哨百總一人獲牲牧二百七十而還夏四月辛未擊敗明兵於遼河先是三月壬子命備禦蘇爾棟安星訥綽爾們等率兵三百攜家口駐守句驪河地句驪河為內遼河外遼河合流處一作栒栁河亦作巨流河至是海州守將列列琿牛莊守將楞額哩海州河口守將伊勒慎率兵十八人巡遼河至娘娘宫渡口遇明兵乘五船接戰因我兵寡止獲其船二斬二人生擒六人來獻辛卯肄演馳騎先是己卯太宗巡視郊原渡遼河駐蹕陽什穆河岸諸貝勒各按左右翼列營時敖漢部長班第遣使貢駝馬牛羊喀喇沁部長古嚕思希布天聰二年來歸部長蘇布地之子科爾沁部長武克善額駙滿珠什哩台吉綽爾濟等並來朝獻駝馬牛羊緞匹貂皮等物御行幄設宴錫賚有差辛卯親率諸貝勒離行在五里演馬令自三十里外各乘馬馳至最先至者賞銀二百兩蟒緞一布二十次至者銀一百八十兩蟒縀一布十八又次銀一百六十兩蟒縀一布十六又次銀一百四十兩蟒緞一布十四又次銀一百二十兩蟒緞一布十二又次銀一百兩蟒緞一布十又次銀八十兩蟒緞一布八又次銀六十兩蟒緞一布六又次銀四十兩蟒緞一布四又次銀二十兩緞一布二凡十等賜宴乃還六月癸酉授來歸明登州舊將官職初大軍圍大凌河城明調山東兵赴援登萊巡撫孫元化遣參將孔有德率兵八百出山海關赴錦州甫至吳橋縣兵乏食遂還掠陵縣臨邑商河齊東德平青城新城攻圍登州城守參將耿仲明為內應城破孔有德自稱都元帥耿仲明自稱總兵官據登州城出戰屢敗明兵破黃縣及平度州攻萊州將陷聞援兵大集乃返登州登州城北有水門通海明兵數萬合圍東西南三面乃由水門乘船泛海三遣其禆將先來通欵太宗敕發內廄馬及貝勒至備禦按世職出馬選其良者賜孔有德耿仲明餘俱付之散給部衆命文館諸臣宣諭曰元帥總兵可令統領舊部駐劄東京號令鼓吹儀從俱仍其舊惟用刑出兵二事當來奏聞所屬人民俱住蓋州鞍山如或不願令住東京鄰近地又詔監築岫巖通逺堡鹻場三城之貝勒濟爾哈朗阿濟格杜度率兵迎之鎮江有德仲明至旅順口明總兵黃龍以水師截擊又合朝鮮兵躡追至鎮江見我兵列營江岸勢强盛不敢近而退有德仲明乃率衆登岸諸貝勒設宴饗之留兵守其船炮輜重於江岸以敕發馬二千餘給與乘赴遼陽太宗復遣官傳諭曰爾等身皆勞頓宜暫休息從容來見又誡羣臣曰嚮者我國將士於遼民多所擾害至今訴告不息今新附之衆乃攻克明地涉險來歸求庇於我者毋得稍有侵擾違者處死必不姑恕六月癸亥駕出德盛門十里至渾河岸中設黃幄左右各設五青幄親率諸貝勒偕孔有德耿仲明及官屬謝天行三跪九叩首禮畢諸貝勒議相見儀注諭令行抱見禮諸貝勒言皇上以禮待之可耳不宜令抱見太宗曰元帥總兵曾取登州攻城略地正當强盛而納欵輸誠遣使者三率其兵民航海衝敵來歸於我功孰大焉當行抱見禮以示優隆之意於是孔有德耿仲明行漢禮朝見畢復進前叩頭抱上膝見次與大貝勒代善及諸貝勒俱行抱見禮設大宴命孔有德耿仲明坐御座側酌金巵親授飲癸酉授孔有德都元帥印耿仲明總兵官印御樓宴之賜敕書一切過犯原宥又諭以同破山東來歸諸將察其功之大小用印給劄孔有德耿仲明其初皆在皮島𨽻明總兵毛文龍部下及據登州人猶以毛氏稱之其泛海來歸也所屬逰擊張文煥都司楊謹千總李政明率男婦百人先至蓋州登岸具述毛氏前據登州明兵攻之五月不下穴地發火器陷城乃駕舟夜遁至旅順口欲攻城不克退屯雙島龍安塘今將前來歸附矣於是蓋州城守副將石國柱遊擊雅什塔以其言入奏詔撫輯之又都司毛有明先來降疑為間諜至是孔有德等言在山東起兵時毛有明之兄亦為大帥其投誠非僞因並優賜人口馬牛緞布丁亥朂羣臣讜直以諸臣有𠞰襲故聞陳奏無益於事者諭曰朕虛懷聽攬樂聞讜言如朕所行未協乎義宜直言無諱政事或有愆忘宜開陳無隱或六部事有不公諸臣姧僞貪邪宜直行糾劾即諸臣或有艱苦之情亦宜據實奏聞各以心所獨得已所創獲入獻嘉謀秋七月辛卯朔令分編漢軍戶口舊隸八旗下漢人分出一千五百八十戶每十丁授棉甲一以總兵官馬光逺統之八月庚辰勞征明旅順口凱旋軍先是六月戊寅偵知明兵自鎮江退入獐子島以船十一載孔有德部下餘衆送入內地己卯管兵部貝勒嶽託管户部貝勒德格類大臣楞額哩葉臣伊爾登昻阿喇率左右翼兵石廷柱率舊漢軍都元帥孔有德總兵官耿仲明率新附兵合步騎萬餘征明旅順口太宗謁堂子送至邊境諭而遣之尋攻克旅順口城明總兵黃龍戰敗自剄死俘獲人口五千三百有奇馬牛騾驢數百金二十二兩銀二萬一千二百兩人參八箱裘服皮張緞匹器具無算七月甲辰捷奏至八月庚申朔傳諭貝勒等曰覽來奏知爾等欲取皮島朕意以為皮島無甚關繫不必疲我兵力聞明國因流賊猖獗選調寧逺錦州兵前往又逃來之人云祖大夀之弟在前屯衛為總兵朕當遣兵征寧逺汝等酌留大臣鎮守旅順口可即班師戊辰貝勒等疏至言臣等奉諭班師留葉臣伊爾登率每旗官三員兵二千五百名遊擊佟圖賚率漢備禦二員舊漢軍百名駐守旅順口其地雖有水為限空曠可虞應設瞭哨迤邐相接令留守官員兵丁攜兩月糧米移駐金州前蒙諭令優待孔元帥耿總兵臣等自思亦極力優待之矣當拔城後其所屬將士俱入城凡官廨市肆富民房屋皆為所占俘獲人口多指稱親戚挈之而去臣等雖微有不平之意未嘗少露遣巴克什等與語云元帥總兵任意攜取我等不為介懷若部下人假稱主將號令大肆搜括則凡我衝鋒陷陳之士卒以何為賞竊慮三軍懷怨後此再遇攻戰無由使其踴躍趨赴也彼口雖佯應而貪得之心已形於色故彼所收取者盡數與之凡以親戚為言者亦任其領去據彼云所得人數七百四十八名以臣等觀之尚不止此荷天之佑臣等俘獲頗多歸期尚難豫定擬留炮車於蓋州所俘人口並留於後惟攜入官之物與臣等偕行不敢稽遲也己巳太宗遣官二員往迎傳諭曰爾等至海州當即先遣人奏報朕迎至渾河岸爾等可與孔元帥耿總兵同來相見炮車留於蓋州付石國柱雅什塔善為守藏將來可由驛遞送現駕炮車之牛各給還本主領去至所奏駐防軍士糧米俟爾等到日再議朕思爾等方攻破旅順口軍威震叠之時明人惟恐我兵前進不能堅守內地豈暇來犯我境乎庚辰駕至渾河岸立八纛拜天御黃幄時孔有德以墜馬傷手與耿仲明並留東京貝勒德格類嶽託率諸將至行禮畢命從臣傳問貝勒大臣行間安否大臣薩木什喀進前奏曰謹遵指授方略攻克旅順口城悉䝉皇上福庇遂設大宴酌金巵親授兩貝勒及大臣楞額哩石廷柱巴奇蘭薩木什喀等各跪飲御前宴畢陳列所獲諸物以獻太宗酌納之餘分給八貝勒家外藩蒙古貝勒有在班行者並各頒賚有差傳諭孔有德曰都元帥逺道從戎所行事宜實獲朕心招撫山民尤大有禆益不謂勞頓之身又遭銜橛之失佇聞痊可用慰朕懷越數日復傳諭孔有德耿仲明曰爾都元帥總兵官久習攻戰軍律素嫻何俟朕諭但恐無知士卒有私賣馬步器械致缺損者宜急為修整卿等攜來紅衣大小炮已運至通逺堡即付卿等與一切軍器令軍士勤於演習勿間斷旗纛俱用皂色馬匹各用印烙繫印牌以滿洲字書本主姓名及本管官銜並多備絆索乃便於野牧凡軍士甲背及盔尾俱以白布號帶書滿洲字綴之師行之日厮卒人等各按部伍毋或紊亂是月赫圖阿拉城守將扈什塔鄂尼喇弼嚕率兵巡哨雅爾古一路遇明人盜參者斬十四人生擒四十九人獲參一百六斤以獻命斬所俘百總一人以十八人賞從行軍士餘三十人發尚陽堡又蘭磐城守將薩哈連寧固達岫巖城守將錫翰暨管哨官海塔往明石城島躡踪獲二十人來獻命以八人分賞餘十二人發尚陽堡又捉生將徹爾格索海率兵二百至明錦州斬七人獲馬十一擒百總一員兵一名來獻訊畢斬之九月庚子征明山海關師還先是六月戊寅太宗以征明及朝鮮察哈爾三者先後緩急機宜命貝勒大臣各抒所見貝勒濟爾哈朗奏言朝鮮不遵我約當返其貢物姑與互市不必往征至明乃吾敵國宜令貝勒大臣率兵深入取其近京數城因糧於敵久駐伺隙以期必勝别屯兵山海關以東錦州以西撓其耕穫使不得休息復攜梯牌炮車分兵之半於山海關外立營其半繞入關內外內夾攻彼必勢窮力絀矣貝勒阿濟格奏言前者我兵圍大凌河四閲月盡獲其良將精兵在國家固有得人之慶然而從征士卒及新附蒙古一無所得皆以為徒勞今嵗不即征明者為耕種故耳耕種初畢可即興師皇上親駐邊外令諸貝勒大臣率兵入邊所到之處張示招降然後相敵形勢酌量緩急以定進取俘獲人口每旗計甲均派帶回可也貝勒多爾衮奏言宜整頓兵馬乘榖熟時入邊圍困燕京截其援兵毁其屯堡為久駐計可坐而待其斃也貝勒多鐸奏言我國之兵非怯於鬭者但止攻山海關外之城有如射覆豈可必得夫攻山海關以外之城與攻燕京通州之城名雖不同勞苦則一臣以為宜直入長城庶可饜士卒之心亦可成久逺之計且相機審時古語有之我兵若耽延旦夕則敵人漸知豫備固其城池根本修治何隙之可乘我國何愛于明秪念士卒勞苦姑與之和若乘時可取原不待再計也至察哈爾且勿加兵已和之朝鮮勿遽與之絶惟先圖其大者如蒙天佑得之則其餘隨我所求而皆至矣貝勒杜度奏言朝鮮已在我掌握宜且勿征察哈爾如與我逼則征之得破察哈爾則天下自然膽裂若尚逺可取大同邊地秣馬即深入明境貝勒嶽託奏言時不可失事宜勇斷宜乘此時於明山海關通州燕京三處先圖其一以立丕基貝勒薩哈璘奏言察哈爾如蟲食穴中勢將自斃不煩急圖至於明則我兵少緩一年彼之守禦益固當於今秋乘彼禾稼方熟因糧於彼為兩次進兵之計初次止簡精鋭務輕便往來襲擊俘獲既多即速出邊第二次令已出痘貝勒率衆軍自一片石奪山海關則寧逺錦州為無用矣不然仍從故道而入謂天聰三年七月破龍井關大安口故道斷燕京四面之路取彼積儲之地堅守勿歸乘機伺便縱兵奮攻二三年中大勳克集矣貝勒豪格奏言錦州寧逺攻之無益何也我國攻城之法彼盡知之況我兵曾攻之而未得若復令攻之必有畏難之意雖得錦州此外七城尚煩攻取若徒得一城其餘皆堅壁不下彌旬曠日恐老我師今宜盡率我衆及新舊蒙古從故道而入為書頒示屯寨及各城告以我願和而彼不肯和則彼處人民雖被瘡痍將自怨其主無尤於我若馬匹疲斃即以所獲之資買馬其餘并以製衣則我兵奮勇靡有退志而邊外蒙古亦得饜所欲矣再用更番之法俟秣馬肥壯益以練習火器漢軍攜巨炮分兵兩路一從寧逺入一從故道入夾攻山海關進攻通州得與不得皆久駐其地遣人往偵流賊情形伺彼分師捍禦時擊之必可圖也至於朝鮮且暫行撫慰俟我與敵勝負既定再為區處貝勒阿巴泰奏言明國情形皇上既悉知之其地利臣等亦熟識之宜選精兵襲其不備則關門可得親統大軍駐關外擇貝勒大臣令入關分路攻取若獲可用之人送至御營委遣往來彼處消息易得錦州無足顧慮也額駙揚古利奏言我之於明暇則一年再征不暇亦一年一征乃為善䇿當令已出痘貝勒將帥率兵深入其境凡兵士所獲不計多寡聽其自取則人人貪得不待驅逼而賈勇爭先矣所得城堡惟貝勒更番駐劄其下兵將勿移易不辭勞苦乃能成功如謂有妨農事則待農竣興師令婦子收穫農事亦無妨也朝鮮察哈爾且置度外山海關外寧逺錦州亦且緩圖但宜深入腹裏腹裏既得朝鮮皆吾手足察哈爾自歸順矣管正黃旗楞額哩奏言宜先直抵燕京任我兵所取而回然後再入山海關扼險屯駐積糧城中以備往來攻伐之用管正紅旗和碩圖奏言宜相度明之邊界乘瑕而入其還師遲速難以豫料必先修固我城堡乃無敵人窺伺之虞也管鑲紅旗葉臣奏言宜先抵大同宣府秣馬休兵偵探察哈爾踪跡近則我兵往征若已逺遁則我即入明邊地焚毀其廬舍進逼燕京晝夜攻圍名為帝都其實易克彼城上多積火藥必自焚且就彼近城一帶伐木製造梯牌多方攻取城即不克亦足耀我軍威如從山海關路入恐軍士俱無所得徒勞苦也管鑲藍旗宗室芬古奏言我軍蓄鋭已久其勢可用宜即入明邊攻取其近京城堡何憂事之不成管鑲白旗伊爾登奏言與其盤桓於山海關之外不若徑入內地審敵之情形備梯牌以為攻具乘機摧陷之管正白旗喀克篤哩奏言我國之人利行師不宜偃息今誠征明則上天之眷佑與人心之豫順適相協應矣八月壬戍太宗遣貝勒阿巴泰阿濟格薩哈璘豪格額駙揚古利管蒙古軍武訥格率兵二千征明山海關一路躬謁堂子郊送五里授以方略并齎諭榜示曰滿洲國皇帝諭明國人民知悉干戈原非朕起實由爾主偏助邊外葉赫釀成禍階朕思上天以好生為德干戈一動則民命傷殘於是常以講和為念孰意爾朝廷不愛國而愛財不為民而為利諸臣又俱各貪位慕祿恐據理直言致遭貶遣是以茍且偷安不將成敗之勢奏達於朝廷以贊成和議使爾等罹兵刃而蹈湯火也爾朝廷大臣既不議和甘陷爾等於死地朕亦無如之何是爾等之被荼毒非朕之故皆由爾朝廷大臣荼毒之也爾等當怨爾朝廷大臣於朕何尤是月師向山海關進發沿途擊敵俱捷俘獲關外人口及馬牛由寧逺大路而還九月庚子太宗迎於郊外三里許樹纛拜天升御座凱旋貝勒大臣等朝見如禮翼日召集諭責曰爾等何不深入內地乃遽速還即欲還亦當設伏截擊明之追兵何止留圖嚕什勞薩等哨兵殿後彼時敵兵數千追至仰荷上天眷佑以寡敗衆萬一有失不知爾等尚能來見朕否圖爾格納穆泰蘇納有罪革職仍用為各部承政今正宜殿後立功乃亦隨衆前行將何時自奮乎皇考時敖堪特翁格伊喇喀努賽四臣每臨陳皆率先力戰巴克什武訥格所在建功今又首先還擊敗卻敵兵人臣為國義當如此爾諸大臣於貝勒欲還時何不諌阻耶貝勒阿濟格奏曰臣欲息馬運糧阿巴泰薩哈璘豪格不從且欲由舊路旋師以臣堅執始從寧逺正路而來太宗曰汝果能堅意不還誰敢棄汝而來朕非欲加罪於爾等但自後行軍爾等當謹識朕言耳是月甲辰命滿洲蒙古漢軍將士俱擐甲赴演武場較射賜宴頒賚舊漢軍將士帑銀二千二百餘兩乙巳敘征明旅順口諸將功巴奇蘭薩木什喀並舟先入奮擊岸上敵兵永順珠瑪喇雅賴正古特竒悠冒矢炮中創相繼登城車齊克墨爾根巴爾巴圖魯登城力戰伊勒慎尚延和洛佟克伸備船濟軍克城分别加授世職陳亡領隊官納海塔納喀嶽洛順額伊們額德千總程國輔等俱贈職以其子襲仍照例恤銀其餘擊敵有功之將領武巴海邦遜巴篤禮等錫賚紀録有差庚戍明登州都司蔡賓率二十四人來歸言登州副將因其籍係遼東恐有異志遣百總姚世忠解送寧逺我等殺之中途遂來歸太宗命付都元帥孔有德諭之曰蔡賓之歸我也亦為元帥故耳朕嘉其來賜以狐裘一馬一銀百兩其或厚加恩養或升以官爵悉聽爾酌量行之冬十月丙寅演兵分八旗護軍為左右翼滿洲步軍為一營舊漢人馬步軍為一營四面環列前設紅衣炮三十位及各種大小炮太宗率諸貝勒擐甲乘馬出閲升御座諸貝勒率護軍列陳傳令衆軍聞炮聲三乃進聞蒙古角聲即退於是呐喊三次如對敵狀次步軍次舊漢人馬步軍及炮軍各依令操演畢復宣諭曰凡臨陳對敵必整齊隊伍各依汛地並馳而前若有不依已之汛地混逐他人隊伍及他人既進而卻立觀望者治罪弗貸至整隊進攻稍有先後勿以我先爾後爭論惟能遇敵弗退并力擊敗為尚如敵人不戰而走則選精騎追擊其衆軍勿離纛但結隊躡後倘追兵或誤入敵伏或四散追逐遇敵兵旁出乃迎擊之是月己巳諭六部啓心郎等曰自設立六部以來惟戶吏兵三部辦事妥協禮刑工三部辦事每有踈誤爾等啓心郎向不令分任部事但坐於各貝勒之後見有缺失則啓其心今聞各部貝勒多在私家理事果爾則設立衙門何為爾等何不開導之六部諸臣內英固爾岱為人執拗朕思人有全德者少彼能盡心部務辦事明决朕實嘉之各部大臣不如彼者甚多隨事啓迪非爾啓心郎之責而誰責乎爾漢啓心郎及生員等輒以航海取山東攻山海關為言夫航海至危之事而我國又不善操舟至於山海關素號險固未易攻取若虧損我兵何以成大業朕為一國之主與諸貝勒共圖軍事自能審度機宜無須紛紛陳說若部務差謬不能整飭爾等豈可默而不言乎又諭文館諸臣曰昔巴克什額爾德尼遵皇考諭編成滿書彼固一代傑出之人能以文見義其後巴克什庫爾禪所增朕恐終有未合朕嗣皇考大位凡皇考用兵行政之道若不垂之史冊則後世子孫無由而知故令一一備載爾諸臣宜詳加訂正若有舛訛之處即酌改之十一月丙申宴賚薩哈勒察部來朝頭目薩哈勒察部頭目費揚古滿岱率四十六人獻貂皮一千七百六十九張青布二千六百三十匹朝見畢宴之賜鞍馬櫜鞬蟒衣帽靴銀器緞布等物有差十二月辛未論罰從獵違令先是十一月辛亥駕出獵於葉赫地諭貝勒大臣等曰凡行獵處有擅入圍中者貝勒罰良馬一領隊官罰銀十五兩旗長罰銀十兩閒散人罰銀九兩離伍退後者與誤入同罪遇榛葦而規避不入者亦罪之見野獸成羣不驅入圍內而向外逐射者亦罪之見猛獸在易射之地則往告貝勒在險地則令原派統領官等入捕之其餘閒散厮卒宜令在後有射中麅鹿帶箭走入圍中者即告於所在貝勒准其追尋不告而私尋者罪之至是駕還以行獵時貝勒多鐸率所部人立後不相聨絡罰馬一又貝勒多爾衮豪格不稽察從獵人在後行走亦各罰馬一皇清開國方略卷十七
